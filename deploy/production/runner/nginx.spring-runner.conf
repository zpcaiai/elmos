worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  server_tokens off;
  # Undeclared routes do not need a request body.  Each authenticated endpoint
  # below overrides this with the exact allocation bound enforced by its Java
  # controller, so an unauthenticated caller cannot amplify a tiny request into
  # multi-megabyte proxy and heap buffers.
  client_max_body_size 1k;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls/tls.crt;
    ssl_certificate_key /run/secrets/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
    proxy_send_timeout 60s;
    proxy_redirect off;
    proxy_intercept_errors off;

    location = /internal/v1/spring-transformations {
      client_max_body_size 128k;
      limit_except POST { deny all; }
      proxy_set_header X-ELMOS-Transformer-Timestamp $http_x_elmos_transformer_timestamp;
      proxy_set_header X-ELMOS-Transformer-Nonce $http_x_elmos_transformer_nonce;
      proxy_set_header X-ELMOS-Transformer-Signature $http_x_elmos_transformer_signature;
      proxy_pass http://spring-runner-broker:8082;
    }

    location = /internal/v1/spring-verifications {
      client_max_body_size 64k;
      limit_except POST { deny all; }
      proxy_set_header X-ELMOS-Verifier-Timestamp $http_x_elmos_verifier_timestamp;
      proxy_set_header X-ELMOS-Verifier-Nonce $http_x_elmos_verifier_nonce;
      proxy_set_header X-ELMOS-Verifier-Signature $http_x_elmos_verifier_signature;
      proxy_pass http://spring-runner-broker:8082;
    }

    location = /internal/v1/spring-runtimes {
      client_max_body_size 64k;
      limit_except POST { deny all; }
      proxy_set_header X-ELMOS-Runtime-Timestamp $http_x_elmos_runtime_timestamp;
      proxy_set_header X-ELMOS-Runtime-Nonce $http_x_elmos_runtime_nonce;
      proxy_set_header X-ELMOS-Runtime-Signature $http_x_elmos_runtime_signature;
      proxy_pass http://spring-runner-broker:8082;
    }

    location / {
      return 404;
    }
  }
}

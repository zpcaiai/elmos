# ELMOS 生产编排（Tier 1 最小可运营集合）
#
# 状态：UNVERIFIED_TEMPLATE。本文件从 deploy/compose/docker-compose.yml 的真实服务
# 定义派生（相同 Dockerfile 路径、相同端口、相同环境变量名），但**尚未在任何环境执行过**。
# RISK-DEPLOY-001 保持 OPEN，直至在 staging 真实起停、升级、回滚并留下证据。
#
# 与开发 compose 的差异（有意为之）：
#   1. 不内置 postgres —— 生产使用托管 PostgreSQL，凭据来自 env_file，不写死在文件里
#   2. 不对宿主暴露端口 —— 只有反向代理接触 web-console，其余服务只在内部网络可达
#   3. 全部服务 cap_drop ALL + no-new-privileges + 资源限额 + 重启策略
#   4. 按 profile 切分：默认只起 /generation 业务线所需服务
#
# 用法：
#   docker compose -f docker-compose.production.yml up -d                    # 仅 /generation
#   docker compose -f docker-compose.production.yml --profile spring up -d   # 追加 Spring 升级
#
# ⚠ 标记 VERIFY-REQUIRED 的项目必须在 staging 逐条验证后才能保留：
#   read_only 与 user 依赖各服务镜像的实际写入路径，本文件的作者未构建过这些镜像。

x-hardening: &hardening
  init: true
  restart: unless-stopped
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-java-service: &java-service
  <<: *hardening
  env_file: [../elmos-commercial.env]
  # VERIFY-REQUIRED: Java 镜像的可写路径未经确认，暂不设 read_only / user
  deploy:
    resources:
      limits: { cpus: "2.0", memory: 2g }
      reservations: { memory: 512m }

networks:
  edge:            # 反向代理 ↔ web-console
    driver: bridge

  # 服务之间的内部网络。
  #
  # ⚠ 这里**不能**用 `internal: true`。Docker 的 internal 网络会切断全部出站流量，
  #   而以下服务必须能出网：
  #     - control-plane / commercial-api / workspace-service → 托管 PostgreSQL（外部）
  #     - commercial-api → 支付宝/微信支付 API 与回调重试
  #     - web-console BFF → Runner Agent（独立主机）
  #   设成 internal 会让这些服务在启动或首次调用时静默失败，
  #   而且症状表现为"连不上数据库"，很难第一时间联想到网络定义。
  #
  #   出网限制应由**宿主防火墙 + egress-proxy 白名单**实现，
  #   而不是靠 compose 的 internal 标志一刀切。
  backend:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # Tier 1 · 产品门面
  # ---------------------------------------------------------------------------
  web-console:
    <<: *hardening
    build: ../../../apps/web-console
    user: "10001:10001"          # 与 deploy/compose 一致，已在开发环境验证
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    env_file: [../elmos-commercial.env]
    environment:
      NODE_ENV: production
      CONTROL_PLANE_BASE_URL: http://control-plane:8080
      ELMOS_CONTROL_PLANE_BASE_URL: http://control-plane:8080
      ELMOS_COMMERCIAL_API_URL: http://commercial-api:8085
      ELMOS_REPOSITORY_WORKSPACE_BASE_URL: http://workspace-service:8082
      # /generation 首发不开放 Spring 代理与整库转换
      ELMOS_SPRING_PROXY_ENABLED: "false"
      # ⚠ 执行面：见 ../runner/RUNNER_PRODUCTION_BASELINE.md
      #   当前令牌模型为单租户绑定，多租户上线前必须改造
      ELMOS_LOCAL_RUNNER_ENABLED: "true"
      ELMOS_LOCAL_RUNNER_EXECUTOR: "ROOTLESS_CONTAINER"
    networks: [edge, backend]
    expose: ["3000"]
    depends_on:
      control-plane: { condition: service_started }
      commercial-api: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null",
             "http://127.0.0.1:3000/api/health?probe=readiness"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }

  # ---------------------------------------------------------------------------
  # Tier 1 · 控制面
  # ---------------------------------------------------------------------------
  control-plane:
    <<: *java-service
    build: { context: ../../.., dockerfile: apps/control-plane/Dockerfile }
    environment:
      # 来自 env_file：ELMOS_DATABASE_URL / _USER / _PASSWORD（托管 PostgreSQL）
      ELMOS_SHUTDOWN_TIMEOUT: "30s"
    networks: [backend]
    expose: ["8080"]

  # ---------------------------------------------------------------------------
  # Tier 1 · 计费
  # ---------------------------------------------------------------------------
  commercial-api:
    <<: *java-service
    build: { context: ../../.., dockerfile: apps/commercial-api/Dockerfile }
    environment:
      ELMOS_COMMERCIAL_API_PORT: "8085"
      ELMOS_SHUTDOWN_TIMEOUT: "30s"
      # 计费数据库适配器只在 ELMOS_COMMERCIAL_DATABASE_URL 存在时创建（来自 env_file）
      # 缺失时计费 Controller 不注册 —— 这是预期的失败关闭，不是启动失败
    networks: [backend]
    expose: ["8085"]

  # ---------------------------------------------------------------------------
  # Tier 1 · 工作区
  # ---------------------------------------------------------------------------
  workspace-service:
    <<: *java-service
    build: { context: ../../.., dockerfile: apps/workspace-service/Dockerfile }
    environment:
      ELMOS_WORKSPACE_DOCKER_ENABLED: "false"   # 容器执行由独立 Runner 主机承担
      ELMOS_SHUTDOWN_TIMEOUT: "30s"
    networks: [backend]
    expose: ["8082"]

  # ---------------------------------------------------------------------------
  # Tier 1 · 产物存储
  # 若使用云对象存储（S3/OSS/R2），删除本服务并在 env_file 中指向外部 endpoint
  # ---------------------------------------------------------------------------
  minio:
    <<: *hardening
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    env_file: [../elmos-commercial.env]   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    volumes: ["artifact-data:/data"]
    networks: [backend]
    expose: ["9000"]
    healthcheck:
      # minio 镜像不保证带 mc 客户端，用官方健康端点
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  # ---------------------------------------------------------------------------
  # Tier 2 · 受控出网（需要默认拒绝出网策略的执行点时启用）
  # ---------------------------------------------------------------------------
  egress-proxy:
    <<: *java-service
    profiles: ["egress"]
    build: { context: ../../.., dockerfile: apps/egress-proxy/Dockerfile }
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Tier 2 · Spring 升级业务线（profile: spring）
  # 仅在售卖 Boot 2.7.18 / Java 17 / Maven 这一个已验证元组时启用
  # ---------------------------------------------------------------------------
  java-engine-worker:
    <<: *java-service
    profiles: ["spring"]
    build: { context: ../../.., dockerfile: apps/java-engine-worker/Dockerfile }
    environment:
      ELMOS_SPRING_UPGRADE_ENABLED: "true"
      # ⚠ 以下两项必须由真实的 rootless / 网络策略证明置为 true，
      #   在证明产生前保持 false 会让 Spring 升级失败关闭 —— 这是正确行为
      ELMOS_SPRING_UPGRADE_ROOTLESS_ATTESTED: "false"
      ELMOS_SPRING_UPGRADE_NETWORK_POLICY_ATTESTED: "false"
      ELMOS_SPRING_UPGRADE_VERIFIER_ENABLED: "true"
      ELMOS_SPRING_UPGRADE_WORKSPACE_ROOT: /workspace/private-runner
      ELMOS_SHUTDOWN_TIMEOUT: "30s"
    volumes: ["spring-workspaces:/workspace/private-runner"]
    networks: [backend]
    expose: ["8081"]
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 6g }

  java-engine-verifier:
    <<: *java-service
    profiles: ["spring"]
    build: { context: ../../.., dockerfile: apps/java-engine-verifier/Dockerfile }
    networks: [backend]

volumes:
  artifact-data:
  spring-workspaces:

{{- if .Values.pdb.enabled }}
{{- range $component := list "scheduler" "billing" "projector" "worker" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "elmos-runtime.name" $ }}-{{ $component }}
  labels:
    {{- include "elmos-runtime.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ index $.Values.pdb.minAvailable $component }}
  selector:
    matchLabels:
      {{- include "elmos-runtime.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
---
{{- end }}
{{- end }}

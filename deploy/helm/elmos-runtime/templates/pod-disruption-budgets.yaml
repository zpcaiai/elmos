apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elmos-scheduler
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: elmos-runtime
      app.kubernetes.io/component: scheduler
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elmos-billing
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: elmos-runtime
      app.kubernetes.io/component: billing

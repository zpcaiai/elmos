apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elmos-runtime.name" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "elmos-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "elmos-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migration.serviceAccountName }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.images.controlPlane | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["--component=migration", "--spring.main.web-application-type=none"]
          env:
            - {name: SPRING_DATASOURCE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.keys.migration.url }}}}}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.keys.migration.username }}}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.keys.migration.password }}}}}
            - {name: ELMOS_PRODUCTION_RUNTIME_MIGRATION_ENABLED, value: "true"}
            - {name: ELMOS_PRODUCTION_RUNTIME_MIGRATION_EXIT_AFTER_RUN, value: "true"}
            - {name: ELMOS_PRODUCTION_RUNTIME_BILLING_ADAPTER, value: jdbc}
            - {name: ELMOS_PRODUCTION_RUNTIME_SERVICE_MESH_HTTP, value: {{ .Values.serviceMeshHttp | quote }}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.components.migration.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}

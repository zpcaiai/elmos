apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "elmos-runtime.name" . }}-worker
  labels:
    {{- include "elmos-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  serviceName: {{ include "elmos-runtime.name" . }}-{{ .Values.worker.serviceName }}
  replicas: {{ .Values.worker.replicas }}
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "elmos-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "elmos-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/runtime-config: {{ include (print .Template.BasePath "/runtime-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "elmos-runtime.name" . }}-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "elmos-runtime.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "elmos-runtime.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: worker
      containers:
        - name: worker
          image: {{ .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: worker, containerPort: 8090, protocol: TCP}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: WORKER_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: ELMOS_PRODUCTION_WORKER_NAME, value: "$(WORKER_NAME)"}
            - {name: ELMOS_PRODUCTION_WORKER_IDENTITY_NAMESPACE, value: {{ .Values.worker.identityNamespace | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_TYPE, value: {{ .Values.worker.workerType | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_REGION, value: {{ .Values.worker.region | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_ZONE, value: {{ .Values.worker.zone | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_ENDPOINT, value: {{ printf "http://$(WORKER_NAME).%s-%s.$(POD_NAMESPACE).svc.cluster.local:8090" (include "elmos-runtime.name" .) .Values.worker.serviceName | quote }}}
            - {name: ELMOS_PRODUCTION_RUNTIME_CONTROL_PLANE_URL, value: {{ printf "http://%s-scheduler.%s.svc.cluster.local:%v" (include "elmos-runtime.name" .) .Release.Namespace .Values.components.scheduler.port | quote }}}
            - {name: ELMOS_PRODUCTION_RUNTIME_WORKLOAD_TOKEN_FILE, value: /var/run/elmos/credentials/workload-token}
            - {name: ELMOS_PRODUCTION_WORKER_ROUTE_CATALOG_FILE, value: /var/run/elmos/config/routes.json}
            - {name: ELMOS_PRODUCTION_RUNTIME_SERVICE_MESH_HTTP, value: {{ .Values.serviceMeshHttp | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_MAX_CONCURRENT, value: {{ .Values.worker.maxConcurrent | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_MAX_RETAINED, value: {{ .Values.worker.maxRetained | quote }}}
            - {name: ELMOS_PRODUCTION_WORKER_STATE_DIRECTORY, value: /var/lib/elmos/worker-state}
          volumeMounts:
            - {name: runtime-credentials, mountPath: /var/run/elmos/credentials/workload-token, subPath: {{ .Values.credentials.workloadTokenKey }}, readOnly: true}
            - {name: worker-routes, mountPath: /var/run/elmos/config/routes.json, subPath: routes.json, readOnly: true}
            - {name: worker-state, mountPath: /var/lib/elmos/worker-state}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.components.worker.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: worker}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: worker}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: worker}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: runtime-credentials
          secret: {secretName: {{ .Values.credentials.existingSecret }}, defaultMode: 0440}
        - name: worker-routes
          configMap: {name: {{ include "elmos-runtime.name" . }}-worker-routes, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- if not .Values.worker.persistence.enabled }}
        - name: worker-state
          emptyDir: {sizeLimit: 10Gi}
        {{- end }}
  {{- if .Values.worker.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: worker-state
        labels:
          {{- include "elmos-runtime.labels" . | nindent 10 }}
          app.kubernetes.io/component: worker
      spec:
        accessModes:
          {{- toYaml .Values.worker.persistence.accessModes | nindent 10 }}
        {{- if .Values.worker.persistence.storageClass }}
        storageClassName: {{ .Values.worker.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.worker.persistence.size }}
  {{- end }}

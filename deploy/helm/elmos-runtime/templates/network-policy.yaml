{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elmos-runtime-default-deny
  labels:
    app.kubernetes.io/name: elmos-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elmos-runtime
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.ingressNamespaceLabels | indent 14 }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .Values.networkPolicy.databaseCidrs }}
    - to:
{{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if .Values.networkPolicy.providerCidrs }}
    - to:
{{- range .Values.networkPolicy.providerCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}

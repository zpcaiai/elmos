{{- range $name, $component := dict "scheduler" .Values.scheduler "billing" .Values.billing "projector" .Values.projector }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elmos-{{ $name }}
  labels:
    app.kubernetes.io/name: elmos-runtime
    app.kubernetes.io/component: {{ $component.component }}
spec:
  replicas: {{ $component.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elmos-runtime
      app.kubernetes.io/component: {{ $component.component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elmos-runtime
        app.kubernetes.io/component: {{ $component.component }}
    spec:
      automountServiceAccountToken: false
      securityContext:
{{ toYaml $.Values.podSecurityContext | indent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ $.Values.images.controlPlane | quote }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          args: ["--component={{ $component.component }}"]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production-runtime
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.secretName }}
                  key: {{ $.Values.database.jdbcUrlKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
---
{{- end }}

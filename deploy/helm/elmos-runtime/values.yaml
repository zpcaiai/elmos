images:
  controlPlane: ghcr.io/elmos/control-plane@sha256:REPLACE_WITH_REVIEWED_DIGEST
  worker: ghcr.io/elmos/worker@sha256:REPLACE_WITH_REVIEWED_DIGEST
  pullPolicy: IfNotPresent

database:
  secretName: elmos-db
  jdbcUrlKey: jdbc-url

scheduler:
  replicas: 3
  component: scheduler
billing:
  replicas: 3
  component: billing
projector:
  replicas: 2
  component: projector
worker:
  replicas: 4
  serviceName: elmos-worker-headless
  component: worker

networkPolicy:
  enabled: true
  databaseCidrs: []
  providerCidrs: []
  ingressNamespaceLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

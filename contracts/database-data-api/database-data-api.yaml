openapi: 3.1.0
info:
  title: ELMOS Database and Data Platform Engine API
  version: 1.0.0
  description: Vendor-neutral Batch 15 worker contract. Production database operations require approved external Runners.
servers:
  - url: http://localhost:8089
paths:
  /engine/v1/capabilities:
    get:
      operationId: databaseDataCapabilities
      responses:
        "200":
          description: Declared capabilities and Runner requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /engine/v1/scan:
    post:
      operationId: scanDatabaseEstate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: Accepted or fail-closed job result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /engine/v1/plan:
    post:
      operationId: planDatabaseMigration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: Accepted or fail-closed job result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /engine/v1/execute-step:
    post:
      operationId: executeDatabaseMigrationStep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, migrationRunId, migrationPlanVersion, stepDefinition, workspaceRef, sourceCommit, executionBudget, correlationId, idempotencyKey]
      responses:
        "202":
          description: Accepted or fail-closed job result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /engine/v1/validate:
    post:
      operationId: validateDatabaseMigration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: Accepted or fail-closed validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /engine/v1/jobs/{jobId}:
    get:
      operationId: getDatabaseDataJob
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: organizationId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant-scoped job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /engine/v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelDatabaseDataJob
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: organizationId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant-scoped cancellation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
  /engine/v1/sql-preflight/capabilities:
    get:
      operationId: getChinaDbSqlPreflightCapabilities
      summary: Read the immutable ChinaDB commercial planning snapshot.
      description: Returns exact planning metadata and bounded compatibility-mode capability. It does not contact a database or prove a vendor-native renderer.
      responses:
        "200":
          description: Exact 13-target and 78-route planning snapshot; compatibility-mode availability is not vendor-runtime evidence.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                $ref: "../../schemas/batch31/chinadb-commercial-capabilities.schema.json"
        "502": { $ref: "#/components/responses/ChinaDbSqlFailure" }
        "503": { $ref: "#/components/responses/ChinaDbSqlFailure" }
  /engine/v1/sql-preflight/assess:
    post:
      operationId: assessChinaDbSourceSql
      summary: Parse source SQL into typed AST and unresolved migration obligations.
      description: Unsupported requests fail closed with state BLOCKED and targetSql null. Exact allowlisted requests may return LOCAL_EMITTED compatibility SQL; target execution and certification remain NOT_RUN and NOT_CERTIFIED.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/batch31/chinadb-sql-preflight-request.schema.json"
      responses:
        "200":
          description: Typed source assessment with explicit blockers or bounded compatibility-mode target SQL.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                $ref: "../../schemas/batch31/chinadb-sql-preflight-result.schema.json"
        "400": { $ref: "#/components/responses/ChinaDbSqlFailure" }
        "409": { $ref: "#/components/responses/ChinaDbSqlFailure" }
        "413": { $ref: "#/components/responses/ChinaDbSqlFailure" }
        "502": { $ref: "#/components/responses/ChinaDbSqlFailure" }
        "503": { $ref: "#/components/responses/ChinaDbSqlFailure" }
components:
  parameters:
    OrganizationId:
      name: X-ELMOS-Organization-ID
      in: header
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
    ActorId:
      name: X-ELMOS-Actor-ID
      in: header
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,199}$" }
  responses:
    ChinaDbSqlFailure:
      description: Sanitized fail-closed error; no SQL, upstream URL, or target output is returned.
      headers:
        Cache-Control: { schema: { type: string, const: "private, no-store" } }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChinaDbSqlFailure"
  schemas:
    ChinaDbSqlFailure:
      type: object
      additionalProperties: false
      required: [schemaVersion, status, errorCode, message, retryable, targetSql, verification, certification]
      properties:
        schemaVersion: { const: "1.0" }
        status: { const: BLOCKED }
        errorCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,127}$" }
        message: { type: string, minLength: 1, maxLength: 512 }
        retryable: { type: boolean }
        targetSql: { type: "null" }
        verification:
          type: object
          additionalProperties: false
          required: [sourceParse, targetAdapter, targetEmit, targetReparse, sourceExecution, targetExecution, resultEquivalence, externalExecution]
          properties:
            sourceParse: { const: NOT_RUN }
            targetAdapter: { const: NOT_RUN }
            targetEmit: { const: NOT_RUN }
            targetReparse: { const: NOT_RUN }
            sourceExecution: { const: NOT_RUN }
            targetExecution: { const: NOT_RUN }
            resultEquivalence: { const: NOT_RUN }
            externalExecution: { const: NOT_RUN }
        certification: { const: NOT_CERTIFIED }
    JobRequest:
      type: object
      additionalProperties: false
      required: [organizationId, repositorySnapshotRef, workspaceRef, profile, correlationId, idempotencyKey]
      properties:
        organizationId: { type: string, minLength: 1 }
        repositorySnapshotRef: { type: string, minLength: 1 }
        workspaceRef: { type: string, minLength: 1 }
        profile: { type: string, minLength: 1 }
        correlationId: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1 }
    JobResponse:
      type: object
      required: [schemaVersion, jobId, status, evidenceRefs, result]
      properties:
        schemaVersion: { const: "1.0" }
        jobId: { type: string }
        status: { enum: [ACCEPTED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        evidenceRefs: { type: array, items: { type: string } }
        result: { type: object }
        error: { type: [object, "null"] }
    Capabilities:
      type: object
      required: [schemaVersion, engineName, engineVersion, runnerProfiles, solutionFormats, sandboxRequirements]
      properties:
        schemaVersion: { const: "1.0" }
        engineName: { const: ELMOS_DATABASE_DATA }
        engineVersion: { type: string }
        runnerProfiles: { type: array, items: { type: string } }
        solutionFormats:
          type: array
          items: { enum: [OLTP_DATABASE, ANALYTICS_PLATFORM, BI_SEMANTIC] }
        sandboxRequirements: { type: object }

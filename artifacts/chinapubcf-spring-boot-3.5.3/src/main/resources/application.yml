spring:
  application:
    name: chinapubcf
  datasource:
    url: jdbc:h2:mem:chinapubcf;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
  web:
    resources:
      cache:
        period: 3600

server:
  port: ${PORT:8080}
  servlet:
    context-path: /chinapubcf
    session:
      timeout: 5m
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring.lifecycle.timeout-per-shutdown-phase: 20s

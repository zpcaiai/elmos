apiVersion: elmos.billing/v1
kind: EnterpriseByokPolicy
metadata:
  version: 1
  status: draft
contract_precedence:
  - signed_change_order
  - active_enterprise_contract_version
  - tenant_override
  - public_plan_version
byok:
  secret_storage: external_secret_manager_reference_only
  exclude_from_elmos_charge:
    - customer_owned_model_provider_cost
  continue_charging_when_applicable:
    - platform_subscription
    - orchestration
    - sandbox_cpu_gpu
    - browser_automation
    - test_execution
    - storage
    - network
    - observability
    - enterprise_governance
committed_spend:
  cadence: monthly_burn_down_annual_true_up
  negative_commit_balance: forbidden
postpaid:
  require_credit_limit: true
  hard_stop_on_limit: configurable_by_contract
cost_centers:
  require_project_tag: configurable
  over_budget_action: approval_or_pause
sla_credit:
  source: verified_slo_incident
  manual_override_requires_approval: true

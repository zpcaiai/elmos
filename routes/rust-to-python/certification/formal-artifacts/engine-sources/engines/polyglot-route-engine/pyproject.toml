[project]
name = "elmos-polyglot-route"
version = "0.1.0"
description = "Bounded, compiler-backed four-language migration route engine"
requires-python = "==3.12.12"
dependencies = [
  "z3-solver==4.16.0",
]

[project.scripts]
elmos-polyglot-route = "elmos_polyglot_route.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_polyglot_route"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elmos_polyglot_route"]

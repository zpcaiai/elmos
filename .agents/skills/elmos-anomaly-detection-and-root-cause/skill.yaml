apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: anomaly-detection-and-root-cause
  version: 3.0.0
  pack: 12-observability-lineage-finops
  priority: P0
  owner: observability-platform-team
spec:
  description: 关联发布、流量、数据、依赖、模型和环境变化定位异常。
  kernel: Cross-Cutting Observability and Economics Plane
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: runtime events
    required: true
  - name: training events
    required: true
  - name: usage ledger
    required: true
  - name: quality scores
    required: true
  outputs:
  - name: traces
    contentAddressed: true
  - name: metrics
    contentAddressed: true
  - name: lineage
    contentAddressed: true
  - name: dashboards
    contentAddressed: true
  - name: cost attribution
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - otel.emit
    - lineage.emit
    - metric.record
    - cost.allocate
    - trace.replay
    defaultDeny: true
  evidence:
    requiredGates:
    - correlation-id-complete
    - content-capture-policy
    - cost-reconciled
    - slo-observable
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - observability-finops
  capabilityTags:
  - 12-observability-lineage-finops
  - anomaly
  - cause
  - detection
  - observability-finops
  - root
  triggers:
  - 任务需要：关联发布、流量、数据、依赖、模型和环境变化定位异常。
  - 任务属于 observability-finops 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - correlation-id-complete
  - content-capture-policy
  - cost-reconciled
  - slo-observable
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

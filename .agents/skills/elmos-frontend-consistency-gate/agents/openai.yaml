interface:
  display_name: "elmos-frontend-consistency-gate"
  short_description: "Block transformation when grammar, CST, native AST, symbol or source-roundtrip evidence disagrees..."
  default_prompt: "Use $elmos-frontend-consistency-gate through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-frontend-consistency-gate"
  handler_id: "execute_elmos_frontend_consistency_gate"
  operation: "GATE_EVALUATION"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

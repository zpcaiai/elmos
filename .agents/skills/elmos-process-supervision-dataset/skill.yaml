apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: process-supervision-dataset
  version: 2.0.0
  pack: 06-dataset-foundry
  priority: P1
  owner: TBD
spec:
  description: 构造步骤级正确性、工具选择、检查点和错误恢复标签。
  kernel: K6 Dataset Foundry
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: experience episode
    required: true
  - name: knowledge object
    required: true
  - name: human feedback
    required: true
  - name: verification evidence
    required: true
  outputs:
  - name: versioned dataset
    contentAddressed: true
  - name: dataset card
    contentAddressed: true
  - name: lineage graph
    contentAddressed: true
  - name: training eligibility decision
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - dataset.build
    - lineage.emit
    - pii.redact
    - license.check
    - eval.freeze
    defaultDeny: true
  evidence:
    requiredGates:
    - rights-cleared
    - tenant-safe
    - deduplicated
    - split-safe
    - quality-threshold
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

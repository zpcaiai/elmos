  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_NEG_01
    title: critical unknown cannot pass
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: K8 returns BLOCKED
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_NEG_02
    title: stale fencing cannot write
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: worker result is rejected and audited
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_NEG_03
    title: unsupported feature cannot disappear
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: gap ledger contains the feature and critical path blocks
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_NEG_04
    title: tampered evidence cannot certify
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: Merkle/signature verification fails
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_NEG_05
    title: budget exhaustion is bounded
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: run checkpoints, reconciles side effects and terminates without ghost completion
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  releaseRule: all required scenarios explicit; critical failed/unknown/unsupported => BLOCKED

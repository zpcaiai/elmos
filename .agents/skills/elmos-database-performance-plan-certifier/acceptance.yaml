apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-database-performance-plan-certifier
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_AC_01
    title: TPC-style representative query set
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-database-performance-plan-certifier executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_DATABASE_PERFORMANCE_PLAN_CERTIFIER_AC_02

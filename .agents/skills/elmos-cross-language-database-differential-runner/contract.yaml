apiVersion: elmos.ai/v3alpha1
kind: SkillContract
metadata:
  name: elmos-cross-language-database-differential-runner
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  priority: P0
  risk: critical
  group: qa-differential
  kernelAuthorities:
  - K3
  - K6
  - K7
  canonicalInputs:
  - type: GoalContract
    required: true
    binding: goal_id
  - type: RevisionSet
    required: true
    binding: revision_set_id
  - type: EnvironmentAuthority
    required: true
    binding: execution_epoch+authority_digest
  - type: ProofObligationGraph
    required: true
    binding: proof_graph_id
  - type: BudgetAndPolicyEnvelope
    required: true
    binding: policy_bundle_digest
  outputs:
  - path: cross-stack-differential-results.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: interaction-mismatch-graph.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: cross-stack-traces/
    type: ArtifactDirectory
    immutable: true
    evidenceBound: true
    schemaRequired: false
  - path: cross-stack-counterexamples/
    type: ArtifactDirectory
    immutable: true
    evidenceBound: true
    schemaRequired: false
  dependencies:
  - elmos-polyglot-differential-runtime
  - elmos-sql-dual-execution-oracle
  failureMode: fail-closed
  ownership:
    intent: K1
    semantic: K2/K3
    reasoning: K4
    transformation: K5
    verification: K6
    execution: K7
    completion: K8
  invariants:
  - every terminal result binds one exact RevisionSet
  - every write validates tenant, execution epoch, lease generation and fencing token
  - every side effect has idempotency and reconciliation state
  - critical UNKNOWN or UNSUPPORTED cannot become COMPLETE
  - generator, repairer and certifier are independently attributable
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  externalDependencies: []
  packageRole: capability
  standaloneCompletionCeiling: E4_EVIDENCE_ONLY

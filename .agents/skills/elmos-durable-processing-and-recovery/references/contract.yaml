schema_version: 1.0.0
ordinal: 21
name: elmos-durable-processing-and-recovery
title: 持久任务执行与恢复
objective: 确保服务端任务生命周期独立于客户端连接，并能从最近安全检查点恢复而不重复计费或副作用。
dependencies: []
inputs:
- 任务定义、资产、策略
outputs:
- 持久结果、进度、检查点、成本记录
responsibilities:
- 定义 durable workflow、activity、checkpoint 和 lease 模型
- 对外部写入使用幂等键、outbox 和补偿策略
- 记录节点输入、输出、状态、重试、成本和错误
- 支持暂停、取消、超时、心跳、孤儿任务回收和结果持久化
deliverables:
- 工作流编排适配器
- processing_checkpoints、attempts 数据模型
- kill、restart、network partition、duplicate delivery 测试
acceptance:
- 客户端断开不终止服务端任务
- worker 崩溃后从检查点继续而非全部重做
- 重复事件不会重复写入或重复收费
- 取消和超时最终收敛到明确终态
data_entities:
- processing_jobs
- processing_attempts
- processing_checkpoints
events:
- job.checkpointed
- job.resumed
- job.cancelled
metrics:
- recovery_success_rate
- duplicate_side_effect_count
failure_modes:
- worker 崩溃
- 编排器重启
- 消息重复
- 孤儿任务
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

apiVersion: elmos.ai/v3alpha1
kind: SkillContract
metadata:
  name: elmos-ai-cache-semantic-consistency-verifier
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  priority: P1
  risk: critical
  group: runtime-safety
  kernelAuthorities:
  - K2
  - K6
  - K7
  canonicalInputs:
  - type: GoalContract
    required: true
    binding: goal_id
  - type: RevisionSet
    required: true
    binding: revision_set_id
  - type: EnvironmentAuthority
    required: true
    binding: execution_epoch+authority_digest
  - type: ProofObligationGraph
    required: true
    binding: proof_graph_id
  - type: BudgetAndPolicyEnvelope
    required: true
    binding: policy_bundle_digest
  outputs:
  - path: cache-key-contract.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: cache-consistency-results.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: cache-invalidation-events.jsonl
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: cache-isolation-proof.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  dependencies:
  - elmos-ai-runtime-operations-compiler
  failureMode: fail-closed
  ownership:
    intent: K1
    semantic: K2/K3
    reasoning: K4
    transformation: K5
    verification: K6
    execution: K7
    completion: K8
  invariants:
  - every terminal result binds one exact RevisionSet
  - every write validates tenant, execution epoch, lease generation and fencing token
  - every side effect has idempotency and reconciliation state
  - critical UNKNOWN or UNSUPPORTED cannot become COMPLETE
  - generator, repairer and certifier are independently attributable
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  externalDependencies:
  - skill: elmos-ai-provider-behavior-fingerprint-recertifier
    package: elmos-functional-assurance-certification-skills
    versionConstraint: '>=4.1.0,<4.2.0'
    mode: optional-companion-required-for-E4-E5-P05
  packageRole: capability
  standaloneCompletionCeiling: E3

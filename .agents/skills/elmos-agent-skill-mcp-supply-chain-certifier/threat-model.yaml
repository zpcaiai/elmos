apiVersion: elmos.ai/v3alpha1
kind: ThreatModel
metadata:
  name: elmos-agent-skill-mcp-supply-chain-certifier
  version: 4.0.0
spec:
  trustBoundaries:
  - user/tenant to control plane
  - control plane to sandboxed execution
  - execution to model/tool/provider
  - runtime to evidence/certification
  - tenant to shared infrastructure
  assets:
  - Goal and RevisionSet integrity
  - tenant data and memory
  - tool and deployment authority
  - generated artifacts
  - proof and certificate integrity
  - availability and budget
  threats:
  - id: T01
    threat: malicious package update
    asset: tenant data
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: signed trusted package
  - id: T02
    threat: publisher impersonation
    asset: authority
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: unsigned package block
  - id: T03
    threat: dependency confusion
    asset: evidence
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: typosquat fixture
  - id: T04
    threat: manifest/behavior mismatch
    asset: availability
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: hidden script detection
  - id: T05
    threat: signature rollback
    asset: semantic correctness
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: permission expansion block
  assurance:
  - OWASP-style agentic abuse campaign where applicable
  - supply-chain and provenance verification
  - incident kill-switch drill for critical Skills

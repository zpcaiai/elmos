apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-platform-engineering-golden-path-generator
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_AC_01
    title: 'native scenario: compile archetype to approved platform services'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-platform-engineering-golden-path-generator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_AC_02
    title: 'native scenario: generate repo, CI, observability and security defaults'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-platform-engineering-golden-path-generator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_AC_03
    title: 'native scenario: register ownership and service catalog metadata'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-platform-engineering-golden-path-generator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_AC_04
    title: 'native scenario: measure adoption and exception cost'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-platform-engineering-golden-path-generator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_AC_05
    title: 'native scenario: version and deprecate golden paths safely'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-platform-engineering-golden-path-generator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_NEG_01
    title: critical unknown cannot pass
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: K8 returns BLOCKED
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_NEG_02
    title: stale fencing cannot write
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: worker result is rejected and audited
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_NEG_03
    title: unsupported feature cannot disappear
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: gap ledger contains the feature and critical path blocks
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_NEG_04
    title: tampered evidence cannot certify
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: Merkle/signature verification fails
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_PLATFORM_ENGINEERING_GOLDEN_PATH_GENERATOR_NEG_05
    title: budget exhaustion is bounded
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: run checkpoints, reconciles side effects and terminates without ghost completion
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  releaseRule: all required scenarios explicit; critical failed/unknown/unsupported => BLOCKED

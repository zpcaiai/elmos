interface:
  display_name: "elmos-dialect-version-detector"
  short_description: "Infer language dialect, standard edition, compiler mode and vendor extensions per module instead..."
  default_prompt: "Use $elmos-dialect-version-detector through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-dialect-version-detector"
  handler_id: "execute_elmos_dialect_version_detector"
  operation: "MODEL_NORMALIZATION"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

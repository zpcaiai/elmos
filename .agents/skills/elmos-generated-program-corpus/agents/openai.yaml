interface:
  display_name: "elmos-generated-program-corpus"
  short_description: "Generate semantically valid random programs and structured inputs to explore compiler/converter b..."
  default_prompt: "Use $elmos-generated-program-corpus through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-generated-program-corpus"
  handler_id: "execute_elmos_generated_program_corpus"
  operation: "CORPUS_GOVERNANCE"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

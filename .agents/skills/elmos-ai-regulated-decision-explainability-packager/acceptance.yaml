  - id: ELMOS_AI_REGULATED_DECISION_EXPLAINABILITY_PACKAGER_NEG_01
    title: critical unknown cannot pass
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run
    then: K8 returns BLOCKED
    automation: required
    evidence:
    - negative fixture
    - policy decision
    - terminal run state
  - id: ELMOS_AI_REGULATED_DECISION_EXPLAINABILITY_PACKAGER_NEG_02
    title: stale fencing cannot write
    class: negative
    given: the named adverse condition is injected
    when: the Skill and independent gate evaluate the run

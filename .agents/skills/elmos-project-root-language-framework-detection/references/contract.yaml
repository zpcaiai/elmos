schema_version: 1.0.0
ordinal: 46
name: elmos-project-root-language-framework-detection
title: 项目根、语言与框架识别
objective: 基于多信号而非单一扩展名生成带置信度和证据的项目画像，并允许用户校正。
dependencies:
- elmos-project-package-manifest
- elmos-ignore-generated-vendored-file-classification
inputs:
- 项目包 manifest
- 文件内容抽样
- 默认和用户探测策略
- 历史项目画像
outputs:
- ProjectProfile
- 根目录候选
- 语言/框架/构建系统画像
- 用户审查项
responsibilities:
- 从 manifest 中寻找构建清单、工作区配置、源码分布、README、版本控制根和部署文件，生成根目录候选。
- 识别 monorepo、多模块、多个独立项目、文档包、测试数据包和历史版本目录。
- 综合文件扩展名、内容抽样、构建文件、依赖清单、目录惯例和框架特征识别语言与框架。
- 识别 Maven/Gradle/.NET/Cargo/Go Modules/CMake/npm/pnpm/Yarn/Bun/Poetry/uv/Flutter/SPM
  等构建和包管理体系。
- 发现应用、库、服务、CLI、移动端、前端、基础设施和数据项目入口。
- 输出候选、置信度、证据和冲突；低置信度时允许用户指定根及角色。
- 将用户修正版本化为项目知识，并在后续增量包中重新验证而非永久盲信。
- 对生成/第三方目录降低权重，避免 node_modules 或 vendor 被误判为主项目。
deliverables:
- ProjectProfile/ProjectRootCandidate schema
- 语言、框架、构建系统和根目录探测器
- monorepo/多项目分类与用户修正流程
- 多语言公开/合成仓库基准测试
acceptance:
- Java/Kotlin/Python/C#/Go/Rust/C++/PHP/TS/JS/React/Vue/ObjC/Swift/Flutter 等目标语言有探测覆盖
- 能正确识别 monorepo、多模块和多个独立项目
- 每个结论都有文件证据与置信度
- 低置信度或冲突不会静默选择错误根
- vendor、node_modules、build 输出不会主导项目画像
- 用户修正可追溯、可撤销并在新版本中重新验证
data_entities:
- package_project_roots
- package_language_profiles
- package_framework_profiles
- project_profile_corrections
events:
- project.root.detected
- project.profile.created
- project.profile.conflict
- project.profile.corrected
metrics:
- project_root_top1_accuracy
- language_detection_f1
- framework_detection_f1
- manual_correction_rate
failure_modes:
- nested repo mistaken as root
- vendor package dominates
- generated manifest misleading
- ambiguous multi-project package
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

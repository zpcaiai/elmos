apiVersion: elmos.ai/v3alpha1
kind: NativeTestMatrix
metadata:
  name: elmos-chatgpt-apps-sdk-project-generator
  version: 4.0.0
spec:
  fixtures:
  - minimal
  - representative
  - edge
  - negative
  - upgrade
  - recovery
  cases:
  - id: NATIVE-01
    scenario: 'native scenario: classify tool-only/widget/submission archetype'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-02
    scenario: 'native scenario: generate MCP server and UI resource contracts'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-03
    scenario: 'native scenario: set accurate tool annotations and output schemas'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults:
    - timeout
    - worker loss
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-04
    scenario: 'native scenario: generate CSP/auth/deploy/submission artifacts'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-05
    scenario: 'native scenario: run local and review-oriented conformance'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: SEC-01
    scenario: deny unscoped filesystem/network/secret/tool access
    layers:
    - security
    - policy
    required: true
    oracle: policy engine and sandbox audit
    faults:
    - missing authority
    evidence:
    - policy input/output
    - sandbox log
  - id: REC-01
    scenario: resume from last acknowledged checkpoint after worker loss
    layers:
    - resilience
    required: true
    oracle: durable history and artifact hashes
    faults:
    - SIGKILL worker
    evidence:
    - checkpoint
    - lease generation
    - recovery trace
  - id: TENANT-01
    scenario: cross-tenant identifiers cannot read or mutate state
    layers:
    - security
    - database
    required: true
    oracle: RLS/policy negative assertion
    faults:
    - forged tenant id
    evidence:
    - query result
    - policy decision
  - id: EVID-01
    scenario: tampered or stale evidence is rejected
    layers:
    - assurance
    required: true
    oracle: hash/signature/freshness validator
    faults:
    - artifact mutation
    - version drift
    evidence:
    - validation report
  coverageGates:
    requirements: 1.0
    criticalThreats: 1.0
    criticalProofObligations: 1.0
  repeatability: critical Golden Route cases repeat at least three independent times

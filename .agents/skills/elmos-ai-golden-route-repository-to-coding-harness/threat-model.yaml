apiVersion: elmos.ai/v3alpha1
kind: ThreatModel
metadata:
  name: elmos-ai-golden-route-repository-to-coding-harness
  version: 4.0.0
spec:
  trustBoundaries:
  - user/tenant to control plane
  - control plane to sandboxed execution
  - execution to model/tool/provider
  - runtime to evidence/certification
  - tenant to shared infrastructure
  assets:
  - Goal and RevisionSet integrity
  - tenant data and memory
  - tool and deployment authority
  - generated artifacts
  - proof and certificate integrity
  - availability and budget
  threats:
  - id: T01
    threat: benchmark leakage
    asset: tenant data
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: three independent repetitions
  - id: T02
    threat: cherry-picked run
    asset: authority
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: holdout scenario
  - id: T03
    threat: customer evidence fabrication
    asset: evidence
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: rollback and recovery
  - id: T04
    threat: unrepeatable manual step
    asset: availability
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: AiGoldenRouteRepositoryToCodingHarness representative end-to-end fixture
  - id: T05
    threat: envelope overclaim
    asset: semantic correctness
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: crash recovery preserves single-writer semantics
  assurance:
  - OWASP-style agentic abuse campaign where applicable
  - supply-chain and provenance verification
  - incident kill-switch drill for critical Skills

  short_description: "Measure parser/converter coverage over grammar productions, dialect extensions and syntactic comb..."
  default_prompt: "Use $elmos-grammar-feature-coverage through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-grammar-feature-coverage"
  handler_id: "execute_elmos_grammar_feature_coverage"
  operation: "COVERAGE_ANALYSIS"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

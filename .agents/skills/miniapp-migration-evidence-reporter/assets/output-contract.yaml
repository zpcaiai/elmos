skill: miniapp-migration-evidence-reporter
version: 1.0.0
task_ids:
- MAPP-039
- MAPP-040
required_outputs:
- path: migration-evidence.json
  required: true
- path: compatibility-report.html
  required: true
- path: validation-report.md
  required: true
- path: release-readiness.md
  required: true
- path: artifact-index.json
  required: true
gates:
- name: 所有关键 claim 有证据
  required: true
- name: 产物索引无悬空引用
  required: true
- name: 最终结论与门禁一致
  required: true
- name: 成本与运行状态可追溯
  required: true
failure_policy:
  silent_drop: deny
  max_retries: 2
  escalate_on:
  - permission-change
  - real-payment
  - release
  - quality-gate-lowering
  - repeated-equivalent-patch

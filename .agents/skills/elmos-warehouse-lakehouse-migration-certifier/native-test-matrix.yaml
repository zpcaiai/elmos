apiVersion: elmos.ai/v3alpha1
kind: NativeTestMatrix
metadata:
  name: elmos-warehouse-lakehouse-migration-certifier
  version: 4.0.0
spec:
  fixtures:
  - minimal
  - representative
  - edge
  - negative
  - upgrade
  - recovery
  cases:
  - id: NATIVE-01
    scenario: 'native scenario: translate analytical SQL and UDFs'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-02
    scenario: 'native scenario: replay representative BI/ETL workloads'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-03
    scenario: 'native scenario: verify data and aggregate equivalence'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults:
    - timeout
    - worker loss
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-04
    scenario: 'native scenario: validate table-feature and engine compatibility'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-05
    scenario: 'native scenario: certify cost, concurrency and rollback'
    layers:
    - contract
    - integration
    - native
    required: true
    oracle: native tool/runtime plus typed assertions; LLM explanation non-authoritative
    faults: []
    evidence:
    - commands
    - versions
    - digests
    - assertions
    - logs/traces
  - id: NATIVE-06
    scenario: 'native scenario: validate immutable source snapshot, incremental snapshot and CDC cutover equivalence'
    layers:
    - contract
    - integration
    - native
    - data-migration
    required: true
    oracle: source/target snapshot hashes, CDC offsets and typed reconciliation assertions; LLM explanation non-authoritative
    faults:
    - late CDC event
    - duplicate CDC event
    - snapshot/stream boundary overlap
    evidence:
    - source snapshot manifest
    - target snapshot manifest
    - CDC offset ledger
    - row/aggregate reconciliation
    - commands
    - versions
    - digests
  - id: NATIVE-07
    scenario: 'native scenario: certify schema evolution, partition specification and table-format metadata compatibility'
    layers:
    - schema
    - contract
    - integration
    - native
    required: true
    oracle: native catalog/table-format readers plus typed schema and partition compatibility assertions
    faults:
    - field-id reuse
    - incompatible type narrowing
    - partition evolution drift
    - stale catalog metadata
    evidence:
    - source schema
    - target schema
    - schema evolution diff
    - partition metadata
    - catalog snapshots
    - native reader results
  - id: SEC-01
    scenario: deny unscoped filesystem/network/secret/tool access
    layers:
    - security
    - policy
    required: true
    oracle: policy engine and sandbox audit
    faults:
    - missing authority
    evidence:
    - policy input/output
    - sandbox log
  - id: REC-01
    scenario: resume from last acknowledged checkpoint after worker loss
    layers:
    - resilience
    required: true
    oracle: durable history and artifact hashes
    faults:
    - SIGKILL worker
    evidence:
    - checkpoint
    - lease generation
    - recovery trace
  - id: TENANT-01
    scenario: cross-tenant identifiers cannot read or mutate state
    layers:
    - security
    - database
    required: true
    oracle: RLS/policy negative assertion
    faults:
    - forged tenant id
    evidence:
    - query result
    - policy decision
  - id: EVID-01
    scenario: tampered or stale evidence is rejected
    layers:
    - assurance
    required: true
    oracle: hash/signature/freshness validator
    faults:
    - artifact mutation
    - version drift
    evidence:
    - validation report
  coverageGates:
    requirements: 1.0
    criticalThreats: 1.0
    criticalProofObligations: 1.0
  repeatability: critical Golden Route cases repeat at least three independent times

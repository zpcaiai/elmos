    class: native-or-domain
    given: an exact RevisionSet, exact source/target warehouse and table-format versions, immutable snapshot manifests and
      authorized typed inputs
    when: elmos-warehouse-lakehouse-migration-certifier executes this scenario in isolated source and target native environments

schema_version: 1.0.0
ordinal: 31
name: elmos-multimodal-token-accounting
title: 多模态 Token 计量
objective: 建立按模型、模态、来源和任务阶段可复现的 Token/等价预算计量层，使上下文控制、报价、路由与审计使用同一事实来源。
dependencies:
- elmos-context-budget-manager
- elmos-model-capability-discovery
inputs:
- 待装载的多模态内容块
- 模型能力快照
- 工具和 Skill 定义
- 供应商 usage 响应
outputs:
- 分来源 ContextUsage
- TokenEstimate 及误差区间
- 费用计量输入
- 预算告警
responsibilities:
- 定义统一 ContextUsage 与 TokenEstimate 数据契约，区分实测、估算和安全上界。
- 为文本、代码、聊天历史、Skills、工具 schema、工具结果、OCR、ASR、图像和结构化表格实现可插拔计量器。
- 优先调用目标模型官方 tokenizer 或计费接口；不可用时记录估算器版本、误差区间和保守系数。
- 在内容规范化、装载、压缩、重新水化和模型切换后重新计量。
- 按 input package、asset、content block、source、task、agent turn 和 provider execution
  聚合使用量。
- 将上下文占用与累计计费 Token 分开存储，避免把历史消耗误当当前窗口占用。
- 提供超预算预检、差异解释和监控指标。
deliverables:
- ContextUsage/TokenEstimate schema 与数据库迁移
- 各模态 tokenizer adapter 和模型特定计量器
- 预算预检 API、事件与可观测面板
- 黄金样本、误差校准和回归测试
acceptance:
- 同一输入与模型版本重复计量结果确定且可审计
- 文本计量与目标 tokenizer 的误差在定义阈值内，近似计量明确给出误差上界
- 图像、音频等不确定模态不得被记为零
- 当前活动上下文、累计输入输出消耗和费用三者不会混用
- 模型切换或内容变更后预算自动重算
- 每项计量可追溯到来源、计量器版本和时间
data_entities:
- token_estimates
- context_usage_snapshots
- provider_usage_records
events:
- token.estimated
- token.measured
- token.estimate.reconciled
- context.usage.updated
metrics:
- token_estimate_error_ratio
- unmetered_content_count
- usage_reconciliation_lag_seconds
failure_modes:
- tokenizer unavailable
- provider usage missing
- image pricing rule unknown
- double counted tool result
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

interface:
  display_name: "elmos-formal-assurance-gate"
  short_description: "Aggregate proof/refinement/model-checking evidence where required and combine it with runtime evi..."
  default_prompt: "Use $elmos-formal-assurance-gate through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-formal-assurance-gate"
  handler_id: "execute_elmos_formal_assurance_gate"
  operation: "GATE_EVALUATION"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

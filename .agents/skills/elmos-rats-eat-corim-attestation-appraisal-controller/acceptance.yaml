apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-rats-eat-corim-attestation-appraisal-controller
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_RATS_EAT_CORIM_ATTESTATION_APPRAISAL_CONTROLLER_AC_01
    title: 'native scenario: normalize attestation evidence, endorsements and reference values into appraisal claims'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-rats-eat-corim-attestation-appraisal-controller executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_RATS_EAT_CORIM_ATTESTATION_APPRAISAL_CONTROLLER_AC_02

---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringFramework3_2To5_2MvcToSpringBoot3_5_3Java21
displayName: Prepare Spring Framework MVC 3.2-5.2 for Spring Boot 3.5.3 on Java 21
description: >-
  Applies the same deterministic Java 21, Jakarta and Spring Framework 6.2
  transformations used by the exact 5.3.39 MVC edge, then binds Boot 3.5.3
  starter-web. No 3.2-5.2 fixture has been executed, so the catalog must keep
  the route NOT_RUN. The FCM-governed target emitter still owns Boot bootstrap,
  context merge, web.xml retirement and executable-WAR configuration.
recipeList:
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_6_2
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework
      oldArtifactId: spring-webmvc
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-web
      newVersion: 3.5.3
      overrideManagedVersion: false
  - org.openrewrite.maven.AddParentPom:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      version: 3.5.3
      relativePath: ""
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "21"
      addIfMissing: true
      trustParent: false

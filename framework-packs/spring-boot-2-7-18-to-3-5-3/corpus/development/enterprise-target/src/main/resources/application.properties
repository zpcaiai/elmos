spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
enterprise.security.operator-password=${ENTERPRISE_OPERATOR_PASSWORD}
enterprise.security.viewer-password=${ENTERPRISE_VIEWER_PASSWORD}
enterprise.security.admin-password=${ENTERPRISE_ADMIN_PASSWORD}

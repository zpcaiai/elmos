---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot1_5To3_5_15ToBoot3_5_16Java21
displayName: Migrate Spring Boot 1.5-3.5.15 to Spring Boot 3.5.16 on Java 21
description: >-
  Direct user-facing maintenance edge. The recipe applies the versioned Boot
  2.0, 2.7 and 3.5 migrations in order, then pins the result to the exact Boot
  3.5.16 and Java 21 target. No source or target runtime evidence has been
  recorded for this pin, so the catalog must keep the route NOT_RUN.
recipeList:
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_0
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_7
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.5.16
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: 3.5.16
      overrideManagedVersion: true
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-maven-plugin
      newVersion: 3.5.16
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.5.16"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "21"
      addIfMissing: true
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: "21"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: "21"
      addIfMissing: false
      trustParent: false

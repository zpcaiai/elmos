server:
  port: ${ELMOS_CONTROL_PLANE_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
spring:
  application:
    name: elmos-control-plane
  datasource:
    url: ${ELMOS_DATABASE_URL:jdbc:postgresql://localhost:5432/elmos}
    username: ${ELMOS_DATABASE_USER:elmos}
    password: ${ELMOS_DATABASE_PASSWORD:elmos-local-only}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${ELMOS_SHUTDOWN_TIMEOUT:30s}
  mvc:
    problemdetails:
      enabled: true
elmos:
  action-cache:
    enabled: ${ELMOS_ACTION_CACHE_ENABLED:false}
    execution-caller-enabled: ${ELMOS_ACTION_CACHE_EXECUTION_CALLER_ENABLED:false}
    # Required by the tenant ActionCache execution endpoint. The endpoint never derives
    # residency or clearance from caller input; both are deployment-owned policy facts.
    data-residency: ${ELMOS_ACTION_CACHE_DATA_RESIDENCY:}
    security-tier: ${ELMOS_ACTION_CACHE_SECURITY_TIER:CONFIDENTIAL}
    sample-recompute-one-in-n: ${ELMOS_ACTION_CACHE_SAMPLE_RECOMPUTE_ONE_IN_N:0}
  database-data-preflight:
    enabled: ${ELMOS_DATABASE_DATA_PREFLIGHT_ENABLED:false}
    engine-base-url: ${ELMOS_DATABASE_DATA_ENGINE_BASE_URL:http://database-data-engine-worker:8089}
    connect-timeout: ${ELMOS_DATABASE_DATA_PREFLIGHT_CONNECT_TIMEOUT:2s}
    request-timeout: ${ELMOS_DATABASE_DATA_PREFLIGHT_REQUEST_TIMEOUT:20s}
  identity:
    issuer-uri: ${ELMOS_OIDC_ISSUER_URI:}
    jwk-set-uri: ${ELMOS_OIDC_JWKS_URI:}
    audience: ${ELMOS_OIDC_AUDIENCE:}
    local:
      enabled: ${ELMOS_LOCAL_IDENTITY_ENABLED:false}
      pepper-file: ${ELMOS_IDENTITY_PEPPER_FILE:}
  execution:
    images:
      generation: ${ELMOS_RUNNER_IMAGE_GENERATION:}
      translation: ${ELMOS_RUNNER_IMAGE_TRANSLATION:}
      spring-upgrade: ${ELMOS_RUNNER_IMAGE_SPRING_UPGRADE:}
      repository-workspace: ${ELMOS_RUNNER_IMAGE_REPOSITORY_WORKSPACE:}
      modernization-proof: ${ELMOS_RUNNER_IMAGE_MODERNIZATION_PROOF:}
    reaper-interval-ms: ${ELMOS_EXECUTION_REAPER_INTERVAL_MS:15000}
  object-storage:
    credential-reference: ${ELMOS_OBJECT_STORAGE_CREDENTIAL_REFERENCE:}
    access-key-id-file: ${ELMOS_OBJECT_STORAGE_ACCESS_KEY_ID_FILE:}
    secret-access-key-file: ${ELMOS_OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE:}
    session-token-file: ${ELMOS_OBJECT_STORAGE_SESSION_TOKEN_FILE:}
    gc-interval-ms: ${ELMOS_OBJECT_STORAGE_GC_INTERVAL_MS:3600000}
  operations:
    api-key: ${ELMOS_OPERATIONS_API_KEY:}
    api-key-expires-at: ${ELMOS_OPERATIONS_API_KEY_EXPIRES_AT:}
    organization-id: ${ELMOS_OPERATIONS_TENANT_ID:}
    actor-id: ${ELMOS_OPERATIONS_ACTOR_ID:}
    automation-enabled: ${ELMOS_OPERATIONS_AUTOMATION_ENABLED:false}
    evaluation-interval-ms: ${ELMOS_OPERATIONS_EVALUATION_INTERVAL_MS:300000}
    retention-enabled: ${ELMOS_OPERATIONS_RETENTION_ENABLED:false}
    retention-days: ${ELMOS_OPERATIONS_RETENTION_DAYS:30}
    retention-interval-ms: ${ELMOS_OPERATIONS_RETENTION_INTERVAL_MS:86400000}
    notification-enabled: ${ELMOS_OPERATIONS_NOTIFICATION_ENABLED:false}
    notification-webhook-url: ${ELMOS_OPERATIONS_NOTIFICATION_WEBHOOK_URL:}
    notification-hmac-secret-file: ${ELMOS_OPERATIONS_NOTIFICATION_HMAC_SECRET_FILE:}
    notification-interval-ms: ${ELMOS_OPERATIONS_NOTIFICATION_INTERVAL_MS:15000}
  repository-workspace:
    enabled: ${ELMOS_REPOSITORY_WORKSPACE_ENABLED:false}
    legacy-api-key-enabled: ${ELMOS_REPOSITORY_LEGACY_API_KEY_ENABLED:false}
    legacy-api-key-file: ${ELMOS_REPOSITORY_LEGACY_API_KEY_FILE:}
    root: ${ELMOS_REPOSITORY_WORKSPACE_ROOT:}
    credential-root: ${ELMOS_REPOSITORY_CREDENTIAL_ROOT:}
    max-files: ${ELMOS_REPOSITORY_WORKSPACE_MAX_FILES:100000}
    max-bytes: ${ELMOS_REPOSITORY_WORKSPACE_MAX_BYTES:2147483648}
    allow-file-repositories: ${ELMOS_REPOSITORY_ALLOW_FILE_REPOSITORIES:false}
    allowed-generic-hosts: ${ELMOS_REPOSITORY_ALLOWED_GENERIC_HOSTS:}
    max-workspaces: ${ELMOS_REPOSITORY_WORKSPACE_MAX_COUNT:1000}
    ttl-hours: ${ELMOS_REPOSITORY_WORKSPACE_TTL_HOURS:168}
    github-api-base: ${ELMOS_REPOSITORY_GITHUB_API_BASE:https://api.github.com}
    gitee-api-base: ${ELMOS_REPOSITORY_GITEE_API_BASE:https://gitee.com}
  github:
    app:
      enabled: ${ELMOS_GITHUB_APP_ENABLED:false}
      id: ${ELMOS_GITHUB_APP_ID:}
      private-key-path: ${ELMOS_GITHUB_APP_PRIVATE_KEY_PATH:}
      slug: ${ELMOS_GITHUB_APP_SLUG:}
      client-id: ${ELMOS_GITHUB_APP_CLIENT_ID:}
      client-secret-path: ${ELMOS_GITHUB_APP_CLIENT_SECRET_PATH:}
      callback-url: ${ELMOS_GITHUB_APP_CALLBACK_URL:}
      success-url: ${ELMOS_GITHUB_APP_SUCCESS_URL:}
      onboarding-state-secret-path: ${ELMOS_GITHUB_ONBOARDING_STATE_SECRET_PATH:}
    api-version: ${ELMOS_GITHUB_API_VERSION:2026-03-10}
    web-base-url: ${ELMOS_GITHUB_WEB_BASE_URL:https://github.com}
    api-base-url: ${ELMOS_GITHUB_API_BASE_URL:https://api.github.com}
    clone-base-url: ${ELMOS_GITHUB_CLONE_BASE_URL:https://github.com}
    webhook:
      secret: ${ELMOS_GITHUB_WEBHOOK_SECRET:}
      previous-secret: ${ELMOS_GITHUB_WEBHOOK_PREVIOUS_SECRET:}
      secret-file: ${ELMOS_GITHUB_WEBHOOK_SECRET_FILE:}
      previous-secret-file: ${ELMOS_GITHUB_WEBHOOK_PREVIOUS_SECRET_FILE:}
      max-body-bytes: ${ELMOS_GITHUB_WEBHOOK_MAX_BODY_BYTES:1048576}
  snapshot:
    staging-root: ${ELMOS_SNAPSHOT_STAGING_ROOT:}
    artifact-root: ${ELMOS_SNAPSHOT_ARTIFACT_ROOT:}
    materialized-root: ${ELMOS_SNAPSHOT_MATERIALIZED_ROOT:}
    max-artifact-bytes: ${ELMOS_SNAPSHOT_MAX_ARTIFACT_BYTES:1073741824}
    materialization-lease:
      holder-id: ${ELMOS_SNAPSHOT_MATERIALIZATION_LEASE_HOLDER_ID:}
      duration: ${ELMOS_SNAPSHOT_MATERIALIZATION_LEASE_DURATION:PT2M}
      heartbeat-interval: ${ELMOS_SNAPSHOT_MATERIALIZATION_LEASE_HEARTBEAT_INTERVAL:PT30S}
      heartbeat-threads: ${ELMOS_SNAPSHOT_MATERIALIZATION_LEASE_HEARTBEAT_THREADS:2}
    reconciliation:
      pending-grace: ${ELMOS_SNAPSHOT_RECONCILIATION_PENDING_GRACE:PT5M}
      scheduler-enabled: ${ELMOS_SNAPSHOT_RECONCILIATION_SCHEDULER_ENABLED:false}
      worker-id: ${ELMOS_SNAPSHOT_RECONCILIATION_WORKER_ID:}
      tenant-limit: ${ELMOS_SNAPSHOT_RECONCILIATION_TENANT_LIMIT:16}
      per-tenant-limit: ${ELMOS_SNAPSHOT_RECONCILIATION_PER_TENANT_LIMIT:100}
      scheduler-lease: ${ELMOS_SNAPSHOT_RECONCILIATION_SCHEDULER_LEASE:PT2M}
      failure-retry: ${ELMOS_SNAPSHOT_RECONCILIATION_FAILURE_RETRY:PT1M}
      scheduler-interval-ms: ${ELMOS_SNAPSHOT_RECONCILIATION_SCHEDULER_INTERVAL_MS:30000}
    cas:
      enabled: ${ELMOS_SNAPSHOT_CAS_ENABLED:false}
      compatibility-read-enabled: ${ELMOS_SNAPSHOT_CAS_COMPATIBILITY_READ_ENABLED:false}
      root: ${ELMOS_SNAPSHOT_CAS_ROOT:}
      store-name: ${ELMOS_SNAPSHOT_CAS_STORE_NAME:snapshot-local}
      data-residency: ${ELMOS_SNAPSHOT_CAS_DATA_RESIDENCY:}
      security-tier: ${ELMOS_SNAPSHOT_CAS_SECURITY_TIER:CONFIDENTIAL}
      encryption:
        enabled: ${ELMOS_SNAPSHOT_CAS_ENCRYPTION_ENABLED:false}
        provider: ${ELMOS_SNAPSHOT_CAS_ENCRYPTION_PROVIDER:DIRECTORY}
        key-directory: ${ELMOS_SNAPSHOT_CAS_TENANT_KEY_DIRECTORY:}
        kms-broker:
          endpoint: ${ELMOS_CAS_KMS_BROKER_ENDPOINT:}
          connect-timeout: ${ELMOS_CAS_KMS_BROKER_CONNECT_TIMEOUT:5s}
          operation-timeout: ${ELMOS_CAS_KMS_BROKER_OPERATION_TIMEOUT:15s}
          workload-spiffe-id: ${ELMOS_CAS_KMS_WORKLOAD_SPIFFE_ID:}
          mtls-secret-reference: ${ELMOS_CAS_KMS_MTLS_SECRET_REFERENCE:}
          authorization-secret-reference: ${ELMOS_CAS_KMS_AUTHORIZATION_SECRET_REFERENCE:}
management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

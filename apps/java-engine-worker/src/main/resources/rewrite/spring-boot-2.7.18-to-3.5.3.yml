---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot2_7_18To3_5_3Java21
displayName: Migrate Spring Boot 2.7.18 on Java 17 to Spring Boot 3.5.3 on Java 21
description: >-
  Applies the versioned Spring and Java migrations, then binds the supported
  Spring Boot parent and Java property to the exact ELMOS route tuple.
recipeList:
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.5.3
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-parent
      newVersion: 3.5.3
      allowVersionDowngrades: true
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.5.3"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.github.resilience4j
      oldArtifactId: resilience4j-spring-boot2
      newGroupId: io.github.resilience4j
      newArtifactId: resilience4j-spring-boot3
      newVersion: "2.4.0"
      overrideManagedVersion: true
  - org.openrewrite.yaml.DeleteKey:
      keyPath: $.resilience4j.circuitbreaker.instances.default.baseConfig
  - org.openrewrite.yaml.DeleteKey:
      keyPath: $.resilience4j.retry.instances.default.baseConfig
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "21"
      addIfMissing: true
      trustParent: false

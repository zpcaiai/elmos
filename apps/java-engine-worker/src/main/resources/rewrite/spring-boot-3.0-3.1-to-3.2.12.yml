---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot3_0To3_1ToBoot3_2_12Java17
displayName: Migrate Spring Boot 3.0-3.1 to Spring Boot 3.2.12 on Java 17
description: >-
  Applies the ordered Boot 3.2 migration and pins the exact Java 17 target
  tuple. The edge remains NOT_RUN until real source and target behavior passes.
recipeList:
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_2
  - org.openrewrite.java.migrate.UpgradeToJava17
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-parent
      newVersion: 3.2.12
      allowVersionDowngrades: false
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.2.12
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.2.12"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "17"
      addIfMissing: true
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: "17"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: "17"
      addIfMissing: false
      trustParent: false

---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot2_7ToBoot3_2_12Java17
displayName: Migrate Spring Boot 2.7 to Spring Boot 3.2.12 on Java 17
description: >-
  Crosses the Boot 3 and Jakarta boundary, retains Java 17 and pins the exact
  directed ELMOS target tuple. Security 6, ORM/provider, transaction,
  serialization and messaging behavior remains NOT_RUN until executed.
recipeList:
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_2
  - org.openrewrite.java.migrate.UpgradeToJava17
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-parent
      newVersion: 3.2.12
      allowVersionDowngrades: false
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.2.12
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.2.12"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.github.resilience4j
      oldArtifactId: resilience4j-spring-boot2
      newGroupId: io.github.resilience4j
      newArtifactId: resilience4j-spring-boot3
      newVersion: "2.2.0"
      overrideManagedVersion: true
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "17"
      addIfMissing: true
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: "17"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: "17"
      addIfMissing: false
      trustParent: false

---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot1_5ToBoot3_5_16Java21
displayName: Migrate Spring Boot 1.5 through 3.5.15 on Java 8-21 to Spring Boot 3.5.16 on Java 21
description: >-
  Applies the ordered Spring Boot 2.0, 2.7 and 3.5 migrations before the Java
  21 migration, then pins the target parent and compiler properties to the
  exact Boot 3.5.16 / Java 21 route. Source behavior, security, persistence,
  transaction and messaging obligations remain subject to the framework
  contract and runtime verification.
recipeList:
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_0
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_7
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-parent
      newVersion: 3.5.16
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.5.16
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.5.16"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "21"
      addIfMissing: true
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: "21"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: "21"
      addIfMissing: false
      trustParent: false

---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot3_0To3_4ToBoot3_5_3Java21
displayName: Migrate Spring Boot 3.0-3.4 to Spring Boot 3.5.3 on Java 21
description: >-
  A Spring Boot 3.0 through 3.4 project is already on the jakarta baseline, so
  this route is limited to the Spring Boot 3.5 migration and the Java 21
  language and API migration, then binds the supported Spring Boot parent and
  Java property to the exact ELMOS route tuple.
recipeList:
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-parent
      newVersion: 3.5.3
      allowVersionDowngrades: true
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.5.3
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.5.3"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "21"
      addIfMissing: true
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: "21"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: "21"
      addIfMissing: false
      trustParent: false

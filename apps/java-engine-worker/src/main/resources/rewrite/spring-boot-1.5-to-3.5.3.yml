---
type: specs.openrewrite.org/v1beta/recipe
name: io.elmos.openrewrite.SpringBoot1_5ToBoot3_5_3Java21
displayName: Migrate Spring Boot 1.5 on Java 8 to Spring Boot 3.5.3 on Java 21
description: >-
  Steps a Spring Boot 1.5 Maven project through the 2.0, 2.7 and 3.5 migrations
  in order, then applies the Java 8 to Java 21 migration and binds the supported
  Spring Boot parent and Java property to the exact ELMOS route tuple. Skipping
  an intermediate major line leaves removed 1.5 auto-configuration and relocated
  Actuator endpoints unmigrated, so the ordering here is load bearing.
recipeList:
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_0
  - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_7
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: org.springframework.boot
      newArtifactId: spring-boot-starter-parent
      newVersion: 3.5.3
      allowVersionDowngrades: true
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.5.3
  - org.openrewrite.maven.ChangePropertyValue:
      key: spring-boot.version
      newValue: "3.5.3"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: java.version
      newValue: "21"
      addIfMissing: true
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: "21"
      addIfMissing: false
      trustParent: false
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: "21"
      addIfMissing: false
      trustParent: false

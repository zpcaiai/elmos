server:
  port: ${ELMOS_TRANSFORMER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
spring:
  application:
    name: elmos-java-engine-transformer
management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
elmos:
  transformer:
    workspace-root: ${ELMOS_TRANSFORMER_WORKSPACE_ROOT:/workspace}
    source-java-home: ${ELMOS_SOURCE_JAVA_HOME:/opt/java/openjdk-17}
    target-java-home: ${ELMOS_TARGET_JAVA_HOME:/opt/java/openjdk}
    maven-executable: ${ELMOS_MAVEN_EXECUTABLE:/usr/share/maven/bin/mvn}
    allowed-git-hosts: ${ELMOS_ALLOWED_GIT_HOSTS:github.com}
    one-time-secret: ${ELMOS_TRANSFORMER_HMAC_SECRET_VALUE:}
    auth-window-seconds: ${ELMOS_TRANSFORMER_AUTH_WINDOW_SECONDS:90}

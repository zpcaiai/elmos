server:
  port: ${ELMOS_WORKSPACE_SERVICE_PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
spring:
  application:
    name: elmos-workspace-service
  datasource:
    url: ${ELMOS_DATABASE_URL:jdbc:postgresql://localhost:5432/elmos}
    username: ${ELMOS_DATABASE_USER:elmos}
    password: ${ELMOS_DATABASE_PASSWORD:elmos-local-only}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${ELMOS_SHUTDOWN_TIMEOUT:30s}
  mvc:
    problemdetails:
      enabled: true
elmos:
  workspace:
    service-auth:
      api-key: ${ELMOS_REPOSITORY_WORKSPACE_API_KEY:}
      api-key-expires-at: ${ELMOS_REPOSITORY_WORKSPACE_API_KEY_EXPIRES_AT:}
      organization-id: ${ELMOS_REPOSITORY_WORKSPACE_TENANT_ID:}
      actor-id: ${ELMOS_REPOSITORY_WORKSPACE_ACTOR_ID:}
    docker:
      enabled: ${ELMOS_WORKSPACE_DOCKER_ENABLED:false}
    snapshot-artifact-root: ${ELMOS_SNAPSHOT_ARTIFACT_ROOT:}
    snapshot-max-artifact-bytes: ${ELMOS_SNAPSHOT_MAX_ARTIFACT_BYTES:1073741824}
    snapshot-legacy-compatibility-enabled: ${ELMOS_WORKSPACE_SNAPSHOT_LEGACY_COMPATIBILITY_ENABLED:false}
    snapshot-cas:
      root: ${ELMOS_SNAPSHOT_CAS_ROOT:}
      store-name: ${ELMOS_SNAPSHOT_CAS_STORE_NAME:snapshot-local}
      data-residency: ${ELMOS_SNAPSHOT_CAS_DATA_RESIDENCY:}
      security-tier: ${ELMOS_SNAPSHOT_CAS_SECURITY_TIER:CONFIDENTIAL}
      allow-unencrypted-single-host: ${ELMOS_SNAPSHOT_CAS_ALLOW_UNENCRYPTED_SINGLE_HOST:false}
      encryption:
        enabled: ${ELMOS_SNAPSHOT_CAS_ENCRYPTION_ENABLED:false}
        provider: ${ELMOS_SNAPSHOT_CAS_ENCRYPTION_PROVIDER:DIRECTORY}
        key-directory: ${ELMOS_SNAPSHOT_CAS_TENANT_KEY_DIRECTORY:}
        kms-broker:
          endpoint: ${ELMOS_SNAPSHOT_CAS_KMS_BROKER_ENDPOINT:}
          connect-timeout: ${ELMOS_SNAPSHOT_CAS_KMS_BROKER_CONNECT_TIMEOUT:5s}
          operation-timeout: ${ELMOS_SNAPSHOT_CAS_KMS_BROKER_OPERATION_TIMEOUT:15s}
          workload-spiffe-id: ${ELMOS_SNAPSHOT_CAS_KMS_WORKLOAD_SPIFFE_ID:}
          mtls-secret-reference: ${ELMOS_SNAPSHOT_CAS_KMS_MTLS_SECRET_REFERENCE:}
          authorization-secret-reference: ${ELMOS_SNAPSHOT_CAS_KMS_AUTHORIZATION_SECRET_REFERENCE:}
    command-artifact-root: ${ELMOS_COMMAND_ARTIFACT_ROOT:}
    snapshot-helper-image-digest: ${ELMOS_SNAPSHOT_HELPER_IMAGE_DIGEST:}
    egress-proxy-image-digest: ${ELMOS_EGRESS_PROXY_IMAGE_DIGEST:}
    spring-runtime:
      enabled: ${ELMOS_SPRING_RUNTIME_ENABLED:false}
      image-digest: ${ELMOS_JAVA_RUNTIME_IMAGE_DIGEST:}
      service-artifact-root: ${ELMOS_JAVA_UPGRADE_ARTIFACT_ROOT:}
      host-artifact-root: ${ELMOS_JAVA_UPGRADE_ARTIFACT_HOST_ROOT:}
      hmac-secret-file: ${ELMOS_SPRING_RUNTIME_HMAC_SECRET_FILE:}
      auth-window-seconds: ${ELMOS_SPRING_RUNTIME_AUTH_WINDOW_SECONDS:90}
    spring-verifier:
      enabled: ${ELMOS_EPHEMERAL_SPRING_VERIFIER_ENABLED:false}
      image-digest: ${ELMOS_SPRING_VERIFIER_IMAGE_DIGEST:}
      id: ${ELMOS_SPRING_VERIFIER_ID:}
      internal-network-name: ${ELMOS_JAVA_UPGRADE_INTERNAL_NETWORK:}
      egress-proxy-url: ${ELMOS_JAVA_UPGRADE_EGRESS_PROXY_URL:}
      service-input-root: ${ELMOS_SPRING_VERIFIER_SERVICE_INPUT_ROOT:}
      host-input-root: ${ELMOS_SPRING_VERIFIER_HOST_INPUT_ROOT:}
      service-evidence-root: ${ELMOS_SPRING_VERIFIER_SERVICE_EVIDENCE_ROOT:}
      host-evidence-root: ${ELMOS_SPRING_VERIFIER_HOST_EVIDENCE_ROOT:}
      hmac-secret-file: ${ELMOS_SPRING_VERIFIER_HMAC_SECRET_FILE:}
      auth-window-seconds: ${ELMOS_SPRING_VERIFIER_AUTH_WINDOW_SECONDS:90}
    spring-transformer:
      enabled: ${ELMOS_EPHEMERAL_SPRING_TRANSFORMER_ENABLED:false}
      image-digest: ${ELMOS_SPRING_TRANSFORMER_IMAGE_DIGEST:}
      internal-network-name: ${ELMOS_JAVA_UPGRADE_INTERNAL_NETWORK:}
      egress-proxy-url: ${ELMOS_JAVA_UPGRADE_EGRESS_PROXY_URL:}
      allowed-git-hosts: ${ELMOS_ALLOWED_GIT_HOSTS:github.com}
      service-run-root: ${ELMOS_SPRING_TRANSFORMER_SERVICE_RUN_ROOT:}
      host-run-root: ${ELMOS_SPRING_TRANSFORMER_HOST_RUN_ROOT:}
      hmac-secret-file: ${ELMOS_SPRING_TRANSFORMER_HMAC_SECRET_FILE:}
      auth-window-seconds: ${ELMOS_SPRING_TRANSFORMER_AUTH_WINDOW_SECONDS:90}
    secrets:
      enabled: ${ELMOS_WORKSPACE_SECRETS_ENABLED:false}
    provider-secret-root: ${ELMOS_PROVIDER_SECRET_ROOT:}
management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

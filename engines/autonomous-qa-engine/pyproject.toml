[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-autonomous-qa-engine"
version = "0.1.0"
description = "Fail-closed autonomous QA control-plane and artifact core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
elmos-autonomous-qa = "elmos_autonomous_qa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-formal-assurance-engine"
version = "0.1.0"
description = "Bounded, tenant-scoped runtime for the ELMOS Formal Assurance Kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elmos-formal-assurance = "elmos_formal_assurance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

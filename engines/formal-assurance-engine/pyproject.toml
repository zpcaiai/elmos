[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-formal-assurance-engine"
version = "1.0.0"
description = "Production execution and evidence runtime for the ELMOS Formal Assurance Kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.0,<51"]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "mypy==2.1.0",
    "pyyaml==6.0.2",
    "ruff==0.15.20",
]

[project.scripts]
elmos-formal-assurance = "elmos_formal_assurance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

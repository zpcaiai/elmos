[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elmos-functional-assurance-engine"
version = "4.1.0"
description = "Elmos Functional Assurance & Certification Runtime Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.25.1",
    "cryptography>=50.0.0,<51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
elmos-functional-assurance = "elmos_functional_assurance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_functional_assurance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project]
name = "elmos-sql-dialect"
version = "0.1.0"
description = "Certified-subset SQL DDL dialect translation (certified-ddl-v1) across Oracle, SQL Server, MySQL and PostgreSQL, built on a real dialect-aware SQL parser rather than string templates. Fails closed outside the certified subset."
requires-python = ">=3.10"
dependencies = [
    "sqlglot==30.14.0",
]

[project.optional-dependencies]
# Real execution-level validation against an actual running database. Optional
# because the certified-ddl-v1 subset must still be usable (with syntax-level
# validation only) in environments without a reachable Postgres/MySQL/Oracle/
# SQL Server instance -- see README.md "Execution validation" section.
execution = [
    "psycopg2-binary==2.9.12",
    "PyMySQL==1.2.0",
]

# Dev tooling lives in a dependency group, not an optional extra, so a plain
# `uv sync --locked` installs it -- the same invocation CI uses for every other
# engine here. As an extra it was invisible to that command, which is why this
# package had no working lint or type gate. Versions match the other engines so
# "ruff clean" means the same thing across the repository.
[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pytest==9.0.3",
  "ruff==0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_sql_dialect"]

[project.scripts]
elmos-sql-dialect = "elmos_sql_dialect.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elmos_sql_dialect"]

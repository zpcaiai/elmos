[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elmos-ai-capability-engine"
version = "4.1.0"
description = "Elmos AI Capability Enhancement Runtime Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
elmos-ai-capability = "elmos_ai_capability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_ai_capability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

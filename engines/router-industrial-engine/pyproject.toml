[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-router-industrial-engine"
version = "1.0.0"
description = "Production-grade model intelligence and routing engine for Elmos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.0",
    "jsonschema>=4.20.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
elmos-router = "elmos_router_industrial.orchestrator.master:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

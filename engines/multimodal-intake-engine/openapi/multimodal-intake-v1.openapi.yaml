    SkillExecutionRequest:
      allOf:
        - { $ref: "#/components/schemas/SkillExecutionRequestEnvelope" }
        - { $ref: "#/components/schemas/SkillOperationDiscriminator" }
        - { $ref: "#/components/schemas/TypedOperationInputConstraints" }
      discriminator:
        propertyName: skill
    SkillExecutionRequestEnvelope:
      type: object
      additionalProperties: false
      required: [schema_version, skill, operation, tenant_id, project_id, actor_id, idempotency_key, trace_id, input]
      properties:
        schema_version: { const: 1.0.0 }
        skill: { type: string, minLength: 7, maxLength: 96, pattern: "^elmos-[a-z0-9]+(?:-[a-z0-9]+)*$" }
        operation: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
        tenant_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
        project_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
        actor_id: { type: string, minLength: 1, maxLength: 200, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,199}$" }
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          description: Printable value bounded to 200 UTF-8 bytes by the runtime.
        trace_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Non-control UTF-8 text, bounded to 128 bytes by the runtime.
        input:
          type: object
          description: >-
            Strict JSON only; duplicate keys, lone Unicode surrogates,
            non-finite numbers, integers outside +/-9007199254740991, depth
            above 32, and trees above 200000 nodes are rejected.

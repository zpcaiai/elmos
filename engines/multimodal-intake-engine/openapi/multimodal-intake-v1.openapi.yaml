openapi: 3.1.0
info:
  title: ELMOS Multimodal Intake API
  version: 1.0.0
  description: >-
    Tenant-bound exact Skill execution API. User content is untrusted data and
    never grants permissions or selects executable commands. Requests are at
    most 2 MiB and responses are at most 4 MiB of UTF-8 JSON. Handler business
    outcomes, including BLOCKED and FAILED, use HTTP 200 with a
    SkillExecutionResult; non-200 responses are transport, boundary,
    authentication, authorization, or idempotency errors only.
servers:
  - url: https://elmos.invalid
    description: Replace with an approved deployment; this document is not a live endpoint.
x-elmos-progress-sdk-support:
  python: { sse: true, websocket: false }
  typescript: { sse: true, websocket: false }
  java: { sse: true, websocket: false }
  note: >-
    All checked-in SDKs use one-shot authenticated SSE. The runtime also exposes
    read-only one-shot WebSocket routes, but no checked-in SDK claims WebSocket
    support; in particular, the browser SDK never puts a bearer token in a URL.
x-elmos-human-review-current-correction:
  skill: elmos-human-review-and-correction
  operation: current_correction
  authorization: tenant-project-bound REVIEW ACL
  inputSchema: { $ref: "#/components/schemas/HumanReviewCurrentCorrectionInput" }
  outputSchema: { $ref: "#/components/schemas/HumanReviewCurrentCorrectionOutput" }
  successCode: HUMAN_REVIEW_CURRENT_CORRECTION_RETRIEVED
  absentCode: HUMAN_REVIEW_CURRENT_CORRECTION_NOT_AVAILABLE
  description: >-
    Authoritative response-loss recovery for a durably committed edit. The
    operation returns only the current immutable correction after correction
    digest, task target, and authoritative source-lineage validation. It never
    infers a correction from task state and fails closed when the task has no
    committed correction version.
x-elmos-human-review-source-list:
  skill: elmos-human-review-and-correction
  operation: source_list
  authorization: tenant-project-bound REVIEW ACL
  inputSchema: { $ref: "#/components/schemas/HumanReviewSourceListInput" }
  outputSchema: { $ref: "#/components/schemas/HumanReviewSourceListOutput" }
  successCode: HUMAN_REVIEW_SOURCES_LISTED
  description: >-
    Lists a bounded exact snapshot of authoritative target heads without large
    original values. The opaque cursor binds tenant, project, content version,
    filters, and the complete validated summary collection; collection drift
    fails closed.
x-elmos-human-review-source-get:
  skill: elmos-human-review-and-correction
  operation: source_get
  authorization: tenant-project-bound REVIEW ACL
  inputSchema: { $ref: "#/components/schemas/HumanReviewSourceGetInput" }
  outputSchema: { $ref: "#/components/schemas/HumanReviewSourceGetOutput" }
  successCode: HUMAN_REVIEW_SOURCE_RETRIEVED
  description: >-
    Retrieves one exact authoritative target, value, confidence, and v2 source
    reference after asset, snapshot, producer, decision, propagation, and head
    integrity validation.
x-elmos-human-review-source-bound-enqueue:
  skill: elmos-human-review-and-correction
  operation: enqueue
  authorization: tenant-project-bound REVIEW ACL plus mutation policy
  inputSchema: { $ref: "#/components/schemas/HumanReviewSourceBoundEnqueueInput" }
  successCode: HUMAN_REVIEW_TASK_ENQUEUED
  description: >-
    Enqueues only by source identity. Clients never echo target JSON,
    authoritative value, or confidence. Four mandatory snapshot/head CAS fields
    and the public canonical original-value digest prevent stale and ABA writes.
x-elmos-human-review-enqueue-prepare:
  skill: elmos-human-review-and-correction
  operation: enqueue_prepare
  authorization: tenant-project-actor-bound REVIEW ACL
  inputSchema: { $ref: "#/components/schemas/HumanReviewEnqueuePrepareInput" }
  outputSchema: { $ref: "#/components/schemas/HumanReviewEnqueuePrepareOutput" }
  successCode: HUMAN_REVIEW_ENQUEUE_PREPARED
  ttlSeconds: 86400
  activeQuotaPerActor: 100
  retainedQuotaPerActor: 10000
  description: >-
    Stores only SHA-256 digests of the opaque recovery handle and execute
    idempotency key. The exact source-bound enqueue input is immutable and
    tenant/project/actor scoped; the browser persists no content or reason.
x-elmos-human-review-enqueue-execute:
  skill: elmos-human-review-and-correction
  operation: enqueue_execute
  authorization: tenant-project-actor-bound REVIEW ACL
  inputSchema: { $ref: "#/components/schemas/HumanReviewEnqueueExecuteInput" }
  outputSchema: { $ref: "#/components/schemas/HumanReviewEnqueueExecuteOutput" }
  successCodes:
    - HUMAN_REVIEW_TASK_ENQUEUED_FROM_PREPARATION
    - HUMAN_REVIEW_ENQUEUE_PREPARATION_ABSENT
    - HUMAN_REVIEW_ENQUEUE_PREPARATION_EXPIRED
  description: >-
    Receipt-first execution loads the immutable server-side input and enqueues
    in one transaction. ABSENT and EXPIRED are digest-bound safe-to-clear
    outcomes; an existing unexpired preparation is never silently cleared.
x-elmos-human-review-target-head-reservation-status:
  skill: elmos-human-review-and-correction
  operation: reservation_status
  authorization: tenant-project-bound REVIEW ACL
  inputSchema: { $ref: "#/components/schemas/HumanReviewReservationStatusInput" }
  outputSchema: { $ref: "#/components/schemas/HumanReviewReservationStatusOutput" }
  successCode: HUMAN_REVIEW_TARGET_HEAD_RESERVATION_STATUS
  description: >-
    Returns the immutable, digest-bound approve/revert reservation history for
    one task. A reservation fence owns one exact authoritative target-head
    version; UNKNOWN and FAILED remain non-success and are never released for a
    competing decision.
x-elmos-governance-deletion:
  skill: elmos-data-retention-and-governance
  operation: delete
  authorization: tenant-project-bound ADMIN ACL plus trusted retention policy
  inputSchema: { $ref: "#/components/schemas/GovernanceDeleteInput" }
  outputSchema: { $ref: "#/components/schemas/GovernanceDeletionJob" }
  initialCode: DELETION_PROPAGATION_NOT_RUN
  terminalCode: DELETION_PROPAGATION_VERIFIED
  description: >-
    Creates an immutable per-store/object/version deletion command set from the
    trusted inventory. Inventory deletion flags are never proof. Every command
    remains non-success until a runtime-owned worker capability records an exact
    execution receipt and a distinct verifier capability records observed
    absence; backup lag and legal hold fail closed.
x-elmos-governance-deletion-status:
  skill: elmos-data-retention-and-governance
  operation: delete_status
  authorization: tenant-project-bound READ ACL
  inputSchema: { $ref: "#/components/schemas/GovernanceDeletionStatusInput" }
  outputSchema: { $ref: "#/components/schemas/GovernanceDeletionJob" }
  description: >-
    Reads durable status and may deterministically assemble the deletion proof
    only after all byte/digest-bound command receipts have independent
    verification and the persisted backup deletion deadline has passed.
paths:
  /api/v1/multimodal-intake/capabilities:
    get:
      operationId: getMultimodalIntakeCapabilities
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Exact installed Skill catalog and evidence boundary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityResponse" }
        "401": { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "404": { description: Unknown route, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "405": { description: HTTP method is not allowed, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "422": { description: Local runtime configuration is invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "500": { description: Internal transport failure, content: { application/json: { schema: { $ref: "#/components/schemas/ServerErrorResponse" } } } }
  /api/v1/multimodal-intake/execute:
    post:
      operationId: executeMultimodalIntakeSkill
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillExecutionRequest" }
      responses:
        "200":
          description: >-
            Local handler business result, including SUCCEEDED, PARTIAL,
            BLOCKED, FAILED, NOT_APPLICABLE, and NOT_RUN_EXTERNAL. External
            evidence is independent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillExecutionResult" }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "401": { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "403": { description: Authorization denied, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "404": { description: Unknown Skill or resource, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "405": { description: HTTP method is not allowed, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "408": { description: Request body read timed out, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "409": { description: Idempotency or version conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "413": { description: Request exceeds the 2 MiB transport limit, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "415": { description: Content-Type is not application/json or request content encoding is unsupported, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "422": { description: Request-contract or boundary-integrity rejection, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "503": { description: Required capability unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ServerErrorResponse" } } } }
        "500": { description: Internal execution failure, content: { application/json: { schema: { $ref: "#/components/schemas/ServerErrorResponse" } } } }
  /api/v1/multimodal-intake/progress/tasks/{task_id}/events:
    get:
      operationId: getMultimodalTaskProgressEvents
      summary: Read one bounded, resumable task-progress SSE batch.
      description: >-
        Loopback-only, read-only and one-shot. The server closes after at most 64
        canonical events or one heartbeat. Clients resume with the last verified
        cursor; request bodies and client commands are forbidden.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
        - { $ref: "#/components/parameters/ProgressCursor" }
        - { $ref: "#/components/parameters/BoundTenantId" }
        - { $ref: "#/components/parameters/BoundProjectId" }
        - { $ref: "#/components/parameters/BoundActorId" }
      responses:
        "200":
          description: Bounded canonical SSE frames (`progress` or `heartbeat`).
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store, max-age=0" } }
            X-Accel-Buffering: { schema: { type: string, const: "no" } }
          content:
            text/event-stream:
              schema: { type: string, maxLength: 4194304 }
              examples:
                progress:
                  value: "id: p1-1-<64 lowercase hex>\nevent: progress\ndata: <canonical TaskProgressEvent JSON>\n\n"
        "400": { description: Invalid resource ID, cursor, request target or body, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "401": { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "403": { description: Tenant/project authorization or loopback boundary denied, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "404": { description: Task not found in the bound scope, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "406": { description: Accept must be exactly text/event-stream, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "409": { description: Cursor is ahead of or diverges from durable history, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
  /api/v1/multimodal-intake/progress/jobs/{job_id}/events:
    get:
      operationId: getMultimodalJobProgressEvents
      summary: Read one bounded, resumable job-progress SSE snapshot.
      description: >-
        Loopback-only, read-only and one-shot. Returns one canonical job snapshot
        or one heartbeat, then closes. Request bodies and client commands are forbidden.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/ProgressCursor" }
        - { $ref: "#/components/parameters/BoundTenantId" }
        - { $ref: "#/components/parameters/BoundProjectId" }
        - { $ref: "#/components/parameters/BoundActorId" }
      responses:
        "200":
          description: One canonical `progress` or `heartbeat` SSE frame.
          content:
            text/event-stream:
              schema: { type: string, maxLength: 4194304 }
        "400": { description: Invalid resource ID, cursor, request target or body, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "401": { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "403": { description: Tenant/project authorization or loopback boundary denied, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "404": { description: Job not found in the bound scope, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "406": { description: Accept must be exactly text/event-stream, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "409": { description: Cursor is ahead of or diverges from durable state, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
  /api/v1/multimodal-intake/progress/ws/tasks/{task_id}:
    get:
      operationId: upgradeMultimodalTaskProgressReadOnlyWebSocket
      summary: Upgrade to one read-only task-progress WebSocket batch.
      description: >-
        Runtime-only loopback transport. Bearer Authorization and RFC 6455 headers
        are required. The server writes canonical text frames followed by a normal
        close and never reads a client frame, command, subscription or extension.
        Checked-in Python, TypeScript and Java SDKs do not implement this transport.
      security: [{ bearerAuth: [] }]
      x-elmos-websocket-mode: read-only-one-shot-server-to-client
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
        - { $ref: "#/components/parameters/ProgressCursor" }
        - { $ref: "#/components/parameters/BoundTenantId" }
        - { $ref: "#/components/parameters/BoundProjectId" }
        - { $ref: "#/components/parameters/BoundActorId" }
      responses:
        "101":
          description: WebSocket upgrade; only unfragmented canonical text progress frames are sent.
          headers:
            Upgrade: { schema: { type: string, const: websocket } }
            Connection: { schema: { type: string, const: Upgrade } }
            Sec-WebSocket-Accept: { schema: { type: string } }
        "400": { description: Invalid cursor or WebSocket handshake, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "401": { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "403": { description: Tenant/project authorization or loopback boundary denied, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "404": { description: Task not found in the bound scope, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "409": { description: Cursor is ahead of or diverges from durable task history, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "426": { description: WebSocket upgrade is required; clients unable to set Bearer Authorization must use the SSE route, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "500": { description: Progress integrity or internal transport failure, content: { application/json: { schema: { $ref: "#/components/schemas/ServerErrorResponse" } } } }
  /api/v1/multimodal-intake/progress/ws/jobs/{job_id}:
    get:
      operationId: upgradeMultimodalJobProgressReadOnlyWebSocket
      summary: Upgrade to one read-only job-progress WebSocket snapshot.
      description: >-
        Runtime-only loopback transport with the same server-to-client-only frame
        and normal-close contract as the task route. Checked-in SDK support is SSE-only.
      security: [{ bearerAuth: [] }]
      x-elmos-websocket-mode: read-only-one-shot-server-to-client
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/ProgressCursor" }
        - { $ref: "#/components/parameters/BoundTenantId" }
        - { $ref: "#/components/parameters/BoundProjectId" }
        - { $ref: "#/components/parameters/BoundActorId" }
      responses:
        "101":
          description: WebSocket upgrade; one canonical text snapshot or heartbeat is sent.
          headers:
            Upgrade: { schema: { type: string, const: websocket } }
            Connection: { schema: { type: string, const: Upgrade } }
            Sec-WebSocket-Accept: { schema: { type: string } }
        "400": { description: Invalid cursor or WebSocket handshake, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "401": { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "403": { description: Tenant/project authorization or loopback boundary denied, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "404": { description: Job not found in the bound scope, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "409": { description: Cursor is ahead of or diverges from durable job state, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "426": { description: WebSocket upgrade is required; clients unable to set Bearer Authorization must use the SSE route, content: { application/json: { schema: { $ref: "#/components/schemas/ClientErrorResponse" } } } }
        "500": { description: Progress integrity or internal transport failure, content: { application/json: { schema: { $ref: "#/components/schemas/ServerErrorResponse" } } } }
components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ProgressResourceId" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ProgressResourceId" }
    ProgressCursor:
      name: cursor
      in: query
      required: false
      allowEmptyValue: false
      schema: { $ref: "#/components/schemas/ProgressCursor" }
    BoundTenantId:
      name: X-ELMOS-Bound-Tenant
      in: header
      required: true
      description: Must exactly repeat the tenant identity already bound to the trusted bearer endpoint.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
    BoundProjectId:
      name: X-ELMOS-Bound-Project
      in: header
      required: true
      description: Must exactly repeat the project identity already bound to the trusted bearer endpoint.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
    BoundActorId:
      name: X-ELMOS-Bound-Actor
      in: header
      required: true
      description: Must exactly repeat the actor identity already bound to the trusted bearer endpoint.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,199}$" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: short-lived tenant-bound token
  schemas:
    ProgressResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    ProgressCursor:
      type: string
      minLength: 69
      maxLength: 84
      pattern: "^p1-[1-9][0-9]{0,15}-[0-9a-f]{64}$"
    ProgressContentDigest:
      type: string
      minLength: 71
      maxLength: 71
      pattern: "^sha256:[0-9a-f]{64}$"
    TaskProgressEvent:
      type: object
      additionalProperties: false
      required: [schema_version, kind, resource_id, sequence_number, event_type, state, previous_state, occurred_at, content_digest, cursor]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        kind: { type: string, const: TASK_PROGRESS }
        resource_id: { $ref: "#/components/schemas/ProgressResourceId" }
        sequence_number: { type: integer, minimum: 1, maximum: 9007199254740991 }
        event_type: { type: string, const: durable.task.transitioned }
        state: { $ref: "#/components/schemas/TaskProgressState" }
        previous_state: { $ref: "#/components/schemas/TaskProgressState" }
        occurred_at: { type: string, format: date-time }
        content_digest: { $ref: "#/components/schemas/ProgressContentDigest" }
        cursor: { $ref: "#/components/schemas/ProgressCursor" }
    JobProgressEvent:
      type: object
      additionalProperties: false
      required: [schema_version, kind, resource_id, sequence_number, event_type, state, result_status, attempt, max_attempts, occurred_at, content_digest, cursor]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        kind: { type: string, const: JOB_PROGRESS }
        resource_id: { $ref: "#/components/schemas/ProgressResourceId" }
        sequence_number: { type: integer, minimum: 1, maximum: 9007199254740991 }
        event_type: { type: string, const: processing.job.snapshot }
        state: { enum: [QUEUED, RUNNING, COMPLETED, PARTIAL, NEEDS_REVIEW, BLOCKED, FAILED, CANCELLED] }
        result_status: { enum: [PASSED, PARTIAL, NEEDS_REVIEW, NOT_RUN, BLOCKED, FAILED] }
        attempt: { type: integer, minimum: 0, maximum: 9007199254740991 }
        max_attempts: { type: integer, minimum: 1, maximum: 9007199254740991 }
        occurred_at: { type: string, format: date-time }
        content_digest: { $ref: "#/components/schemas/ProgressContentDigest" }
        cursor: { $ref: "#/components/schemas/ProgressCursor" }
      allOf:
        - oneOf:
            - { properties: { state: { const: QUEUED }, result_status: { const: NOT_RUN } } }
            - { properties: { state: { const: RUNNING }, result_status: { const: NOT_RUN } } }
            - { properties: { state: { const: COMPLETED }, result_status: { const: PASSED } } }
            - { properties: { state: { const: PARTIAL }, result_status: { const: PARTIAL } } }
            - { properties: { state: { const: NEEDS_REVIEW }, result_status: { const: NEEDS_REVIEW } } }
            - { properties: { state: { const: BLOCKED }, result_status: { const: BLOCKED } } }
            - { properties: { state: { const: FAILED }, result_status: { const: FAILED } } }
            - { properties: { state: { const: CANCELLED }, result_status: { const: BLOCKED } } }
    ProgressHeartbeat:
      type: object
      additionalProperties: false
      required: [schema_version, kind, resource_id, sequence_number, status, content_digest, cursor]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        kind: { enum: [TASK_PROGRESS_HEARTBEAT, JOB_PROGRESS_HEARTBEAT] }
        resource_id: { $ref: "#/components/schemas/ProgressResourceId" }
        sequence_number: { type: integer, minimum: 0, maximum: 9007199254740991 }
        status: { type: string, const: NO_CHANGE }
        content_digest: { $ref: "#/components/schemas/ProgressContentDigest" }
        cursor:
          oneOf:
            - { $ref: "#/components/schemas/ProgressCursor" }
            - { type: "null" }
    TaskProgressState:
      enum: [PENDING, RUNNING, PAUSED, SUCCEEDED, FAILED_RETRYABLE, FAILED_FINAL, CANCELLED]
    ProgressDocument:
      oneOf:
        - { $ref: "#/components/schemas/TaskProgressEvent" }
        - { $ref: "#/components/schemas/JobProgressEvent" }
        - { $ref: "#/components/schemas/ProgressHeartbeat" }
    SkillOperationDiscriminator:
      oneOf:
        - { $ref: "#/components/schemas/OrchestratorSkillExecutionRequest" }
        - { $ref: "#/components/schemas/UploadSkillExecutionRequest" }
        - { $ref: "#/components/schemas/FileTypeSkillExecutionRequest" }
        - { $ref: "#/components/schemas/MalwareSkillExecutionRequest" }
        - { $ref: "#/components/schemas/AudioSkillExecutionRequest" }
        - { $ref: "#/components/schemas/ImageSkillExecutionRequest" }
        - { $ref: "#/components/schemas/VisualUiSkillExecutionRequest" }
        - { $ref: "#/components/schemas/DiagramSkillExecutionRequest" }
        - { $ref: "#/components/schemas/PdfSkillExecutionRequest" }
        - { $ref: "#/components/schemas/WordSkillExecutionRequest" }
        - { $ref: "#/components/schemas/TextSkillExecutionRequest" }
        - { $ref: "#/components/schemas/ContentIrSkillExecutionRequest" }
        - { $ref: "#/components/schemas/SourceAnchorSkillExecutionRequest" }
        - { $ref: "#/components/schemas/RequirementSkillExecutionRequest" }
        - { $ref: "#/components/schemas/FusionSkillExecutionRequest" }
        - { $ref: "#/components/schemas/ConflictSkillExecutionRequest" }
        - { $ref: "#/components/schemas/HumanReviewSkillExecutionRequest" }
        - { $ref: "#/components/schemas/PromptDefenseSkillExecutionRequest" }
        - { $ref: "#/components/schemas/ProviderRouteSkillExecutionRequest" }
        - { $ref: "#/components/schemas/StorageSkillExecutionRequest" }

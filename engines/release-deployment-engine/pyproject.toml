[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-release-deployment"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.7"]

[project.scripts]
elmos-deployment-agent = "elmos_release_deployment.remote_agent:main"
elmos-deployment-worker-check = "elmos_release_deployment.isolated_native_worker:main"

[project.optional-dependencies]
temporal = ["temporalio==1.32.0"]
native = ["pyyaml==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

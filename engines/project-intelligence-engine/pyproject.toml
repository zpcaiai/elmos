[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-project-intelligence-engine"
version = "0.1.0"
description = "Bounded local runtime for ELMOS Project Intelligence Skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
  "jsonschema==4.25.1",
  "pytest==9.0.3",
  "pyyaml==6.0.2",
]

[project.scripts]
elmos-project-intelligence = "elmos_project_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

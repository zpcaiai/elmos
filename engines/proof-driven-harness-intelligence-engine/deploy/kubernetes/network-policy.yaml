apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elmos-pdhi-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elmos-pdhi
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              elmos.dev/pdhi-ingress: "true"
          podSelector:
            matchLabels:
              elmos.dev/mtls-client: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              elmos.dev/pdhi-database: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              elmos.dev/pdhi-observability: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317

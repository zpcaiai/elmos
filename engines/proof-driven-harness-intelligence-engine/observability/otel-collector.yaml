receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /var/run/secrets/otel/tls.crt
          key_file: /var/run/secrets/otel/tls.key
          client_ca_file: /var/run/secrets/otel/ca.crt

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
      - key: service.namespace
        action: upsert
        value: elmos
      - key: service.name
        action: upsert
        value: proof-driven-harness-intelligence
  attributes/privacy:
    actions:
      - key: enduser.id
        action: delete
      - key: tenant_id
        action: delete
      - key: project_id
        action: delete
      - key: actor_id
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: db.statement
        action: delete
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/approved-backend:
    endpoint: telemetry-gateway.invalid:4317
    tls:
      ca_file: /var/run/secrets/otel-export/ca.crt
      cert_file: /var/run/secrets/otel-export/tls.crt
      key_file: /var/run/secrets/otel-export/tls.key
  debug/quarantine:
    verbosity: basic
    sampling_initial: 0
    sampling_thereafter: 0

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/privacy, batch]
      exporters: [otlp/approved-backend]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/privacy, batch]
      exporters: [otlp/approved-backend]

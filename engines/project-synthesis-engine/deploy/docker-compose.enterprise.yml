version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: elmos-enterprise-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enterprise_password
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: elmos-enterprise-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "enterprise_redis_pwd"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "enterprise_redis_pwd", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: elmos-enterprise-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fleet-control-plane:
    image: python:3.12-slim
    container_name: elmos-fleet-control-plane
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:enterprise_password@postgres:5432/enterprise_db
      REDIS_URL: redis://:enterprise_redis_pwd@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLEET_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["python", "-m", "elmos_project_synthesis.cli", "--help"]
    restart: unless-stopped

  fleet-worker-1:
    image: python:3.12-slim
    container_name: elmos-fleet-worker-1
    working_dir: /app
    environment:
      WORKER_NODE_ID: worker-node-01
      FLEET_CONTROL_PLANE_URL: http://fleet-control-plane:8080
      MAX_CONCURRENCY: 4
    depends_on:
      - fleet-control-plane
    restart: unless-stopped

  fleet-worker-2:
    image: python:3.12-slim
    container_name: elmos-fleet-worker-2
    working_dir: /app
    environment:
      WORKER_NODE_ID: worker-node-02
      FLEET_CONTROL_PLANE_URL: http://fleet-control-plane:8080
      MAX_CONCURRENCY: 4
    depends_on:
      - fleet-control-plane
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:

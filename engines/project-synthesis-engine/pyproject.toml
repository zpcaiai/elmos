[project]
name = "elmos-project-synthesis"
version = "1.4.0"
description = "Evidence-bounded ELMOS project synthesis engine"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
elmos-project-synthesis = "elmos_project_synthesis.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pyyaml==6.0.2",
  "pytest==9.1.1",
  "ruff==0.12.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_project_synthesis"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
# Emitters and contract generators construct parameterized SQL templates
"src/elmos_project_synthesis/production_runtime.py" = ["S608"]
"src/elmos_project_synthesis/enterprise_production_contract.py" = ["S608"]
"src/elmos_project_synthesis/enterprise_polyglot_targets.py" = ["S608"]
# OS, container sandbox, and cluster controller low-level primitives
"src/elmos_project_synthesis/k8s_deployment_controller.py" = ["S110", "S310", "S603"]
"src/elmos_project_synthesis/rootless_container_sandbox.py" = ["S108", "S603"]
"src/elmos_project_synthesis/messaging_infrastructure/distributed_cache_lock_emitter.py" = ["S311"]
"src/elmos_project_synthesis/messaging_infrastructure/messaging_middleware_emitter.py" = ["S311"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elmos_project_synthesis"]

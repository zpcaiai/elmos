[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-legacy-web-modernization-engine"
version = "1.0.0"
description = "Bounded local Repository Semantic Compiler for Java legacy web modernization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.20,<5"]

[project.scripts]
elmos-legacy-web = "elmos_legacy_web_modernization.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

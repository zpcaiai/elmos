[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-openhands-absorption-engine"
version = "1.0.0"
description = "Fail-closed, durable agent runtime and evidence control plane for the ELMOS OpenHands absorption package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elmos-openhands = "elmos_openhands.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elmos_openhands = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
strict = true

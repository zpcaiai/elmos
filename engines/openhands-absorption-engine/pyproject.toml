[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-openhands-absorption-engine"
version = "1.0.0"
description = "Fail-closed, durable agent runtime and evidence control plane for the ELMOS OpenHands absorption package"
readme = "README.md"
requires-python = ">=3.11"
# Ed25519 verification is part of the core evidence contract.  Keep it in the
# base distribution so a normal installation cannot import the runtime with a
# silently unavailable security verifier.
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]"]
object-store = ["boto3"]
temporal = ["temporalio"]
browser = ["playwright"]
api = ["fastapi", "uvicorn", "grpcio", "protobuf"]
telemetry = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp"]
crypto = []
production = [
  "boto3",
  "cryptography==50.0.1",
  "fastapi",
  "grpcio",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "playwright",
  "psycopg[binary]",
  "protobuf",
  "temporalio",
  "uvicorn",
]
dev = ["mypy", "pyright", "ruff", "types-grpcio"]

[project.scripts]
elmos-openhands = "elmos_openhands.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elmos_openhands = ["schemas/*.json", "implementation_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
strict = true

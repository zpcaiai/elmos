syntax = "proto3";

package elmos.openhands.v1;

import "google/protobuf/struct.proto";

// Authentication, tenant scope and roles are derived from gRPC transport
// credentials/interceptors. They are deliberately absent from caller payloads.
service RuntimeGateway {
  rpc CreateRun(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Turn(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Resume(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Cancel(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc EventPage(google.protobuf.Struct) returns (google.protobuf.Struct);
}

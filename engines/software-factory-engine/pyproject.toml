[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-software-factory-engine"
version = "0.2.0"
description = "Bounded runtime and evidence campaigns for ELMOS 7+1 commercial software-factory Skills"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elmos-software-factory = "elmos_software_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elmos_software_factory = [
  "skill_registry.json",
  "capability_registry.json",
  "public_method_registry.json"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-spring-golden-route-engine"
version = "0.1.0"
description = "Fail-closed local control-plane runtime for the ELMOS Spring Golden Route Skill contracts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ELMOS" }]
dependencies = []

[project.scripts]
elmos-spring-golden-route = "elmos_spring_golden_route.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elmos_spring_golden_route = ["*.json"]

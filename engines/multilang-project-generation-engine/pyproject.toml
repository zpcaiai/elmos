[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-multilang-project-generation-engine"
version = "0.1.0"
description = "Multi-language project generation engine for ELMOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
test = [
  "pytest==9.0.3",
]

[project.scripts]
elmos-project-gen = "elmos_multilang_project_generation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

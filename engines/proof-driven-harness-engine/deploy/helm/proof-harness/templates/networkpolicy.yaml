apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proof-harness.fullname" . }}
  labels:
{{ include "proof-harness.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "proof-harness.selectorLabels" . | indent 6 }}
  policyTypes: [Ingress, Egress]
{{- if .Values.networkPolicy.allowedIngress }}
  ingress:
{{- range .Values.networkPolicy.allowedIngress }}
    - from:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports:
        - {protocol: TCP, port: {{ $.Values.service.port }}}
{{- end }}
{{- else }}
  ingress: []
{{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: {{ .Values.postgresql.networkCIDR | quote }} }
      ports:
        - {protocol: TCP, port: {{ .Values.postgresql.port }} }
{{- range .Values.networkPolicy.allowedEgress }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports:
        - {protocol: TCP, port: {{ .port }}}
{{- end }}

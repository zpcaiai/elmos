apiVersion: v1
kind: Service
metadata:
  name: {{ include "proof-harness.fullname" . }}
  labels:
{{ include "proof-harness.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "proof-harness.selectorLabels" . | indent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

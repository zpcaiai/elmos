[build-system]
requires = ["setuptools==75.8.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-proof-driven-harness-engine"
version = "3.1.0"
description = "Fail-closed proof-driven semantic compiler and v3.1 runtime-assured agentic harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.13"]

[project.scripts]
elmos-proof-harness = "elmos_proof_harness.cli:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
packages = ["elmos_proof_harness"]

# The runtime package is accompanied by a byte-addressed, fail-closed release
# contract.  Keep every manifest-owned non-Python asset at the same relative
# path below ``share/elmos-proof-harness`` so wheels and installed releases
# can be checked against the repository manifest without relying on cwd.
[tool.setuptools.data-files]
"share/elmos-proof-harness" = ["README.md", "pyproject.toml"]
"share/elmos-proof-harness/schemas" = [
  "schemas/adapter-contract.schema.json",
  "schemas/admission.schema.json",
  "schemas/architecture-graph.schema.json",
  "schemas/completion-certificate.schema.json",
  "schemas/completion-review.schema.json",
  "schemas/domain-pack.schema.json",
  "schemas/environment-authority.schema.json",
  "schemas/evidence.schema.json",
  "schemas/goal-contract.schema.json",
  "schemas/invocation.schema.json",
  "schemas/proof-obligation-graph.schema.json",
  "schemas/proof-result.schema.json",
  "schemas/repository-evidence-graph.schema.json",
  "schemas/result.schema.json",
  "schemas/revision-set.schema.json",
  "schemas/semantic-ir.schema.json",
  "schemas/semantic-profile.schema.json",
  "schemas/workflow-ir.schema.json",
]
"share/elmos-proof-harness/schemas/delta-v3.1" = [
  "schemas/delta-v3.1/capability-lease.schema.json",
  "schemas/delta-v3.1/delta-invocation.schema.json",
  "schemas/delta-v3.1/delta-result.schema.json",
  "schemas/delta-v3.1/durable-event-registration.schema.json",
  "schemas/delta-v3.1/environment-authority-snapshot.schema.json",
  "schemas/delta-v3.1/executor-generation.schema.json",
  "schemas/delta-v3.1/permission-profile-replay.schema.json",
  "schemas/delta-v3.1/protocol-capabilities.schema.json",
  "schemas/delta-v3.1/skill-provenance.schema.json",
  "schemas/delta-v3.1/step-execution-plan.schema.json",
  "schemas/delta-v3.1/subagent-execution-spec.schema.json",
  "schemas/delta-v3.1/tool-result-commit.schema.json",
  "schemas/delta-v3.1/typed-ingress.schema.json",
  "schemas/delta-v3.1/verified-security-context.schema.json",
  "schemas/delta-v3.1/workspace-lease.schema.json",
]
"share/elmos-proof-harness/examples/delta-v3.1" = [
  "examples/delta-v3.1/capability-lease.example.json",
  "examples/delta-v3.1/delta-invocation.example.json",
  "examples/delta-v3.1/delta-result.example.json",
  "examples/delta-v3.1/durable-event-registration.example.json",
  "examples/delta-v3.1/environment-authority-snapshot.example.json",
  "examples/delta-v3.1/executor-generation.example.json",
  "examples/delta-v3.1/permission-profile-replay.example.json",
  "examples/delta-v3.1/protocol-capabilities.example.json",
  "examples/delta-v3.1/skill-provenance.example.json",
  "examples/delta-v3.1/step-execution-plan.example.json",
  "examples/delta-v3.1/subagent-execution-spec.example.json",
  "examples/delta-v3.1/tool-result-commit.example.json",
  "examples/delta-v3.1/typed-ingress.example.json",
  "examples/delta-v3.1/verified-security-context.example.json",
  "examples/delta-v3.1/workspace-lease.example.json",

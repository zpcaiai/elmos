[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-commercial-capability-expansion-engine"
version = "2.0.0"
description = "Production-grade Commercial Capability Expansion Engine for Elmos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
]

[project.scripts]
elmos-commercial-expansion = "elmos_commercial_expansion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

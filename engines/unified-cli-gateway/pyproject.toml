[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-unified-cli-gateway"
version = "3.0.0"
description = "ELMOS Enterprise Unified CLI Gateway & Multi-Engine Dispatcher"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "elmos-sql-transpiler",
    "elmos-sql-dialect",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
elmos = "elmos_cli.dispatcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
elmos-sql-transpiler = { path = "../database-data-engine/sql-transpiler" }
elmos-sql-dialect = { path = "../sql-dialect-engine" }

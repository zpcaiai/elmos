[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-unified-cli-gateway"
version = "3.0.0"
description = "ELMOS Enterprise Unified CLI Gateway & Multi-Engine Dispatcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
elmos = "elmos_cli.dispatcher:main"

[tool.setuptools.packages.find]
where = ["src"]

openapi: 3.1.0
info:
  title: ELMOS Cache and Workspace Control Plane
  version: 1.0.0
servers:
  - url: /v1
security:
  - gatewayMutualTLS: []
components:
  securitySchemes:
    gatewayMutualTLS:
      type: mutualTLS
      description: A trusted gateway authenticates the peer and injects the server-only WSGI identity context; HTTP identity headers are not trusted.
  schemas:
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
            - PERMISSION_DENIED
            - NOT_FOUND
            - DIGEST_MISMATCH
            - STALE_LEASE
            - INVALID_TRANSITION
            - VALIDATION_TOO_LOW
            - QUARANTINED
            - CONFLICT
            - QUOTA_EXCEEDED
            - POLICY_DENIED
        message: { type: string }
        retryable: { type: boolean }
        details: { type: object }
    ActionLookup:
      type: object
      required: [hit, action_key, miss_reasons]
      properties:
        hit: { type: boolean }
        action_key: { type: string }
        result_manifest_ref: { type: [string, "null"] }
        validation_level: { type: [string, "null"] }
        miss_reasons:
          type: array
          items: { type: object }
    StagedFileTransition:
      type: object
      required: [expected_version, lease_epoch]
      properties:
        expected_version: { type: integer }
        lease_epoch: { type: integer }
        digest: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        metadata: { type: object }
paths:
  /cache/actions/{actionKey}:
    get:
      operationId: lookupAction
      parameters:
        - in: path
          name: actionKey
          required: true
          schema: { type: string }
        - in: query
          name: minimumValidationLevel
          schema: { type: string }
        - in: query
          name: trustNamespace
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lookup decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionLookup" }
        "403": { description: Policy denied }
    put:
      operationId: commitAction
      parameters:
        - in: path
          name: actionKey
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Committed }
        "200": { description: Identical entry already exists }
        "409": { description: Conflicting output quarantined }
  /blobs/{digest}:
    head:
      operationId: blobExists
      parameters:
        - in: path
          name: digest
          required: true
          schema: { type: string }
      responses:
        "200": { description: Exists }
        "404": { description: Missing }
    put:
      operationId: putBlob
      parameters:
        - in: path
          name: digest
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "201": { description: Stored }
        "200": { description: Already present }
        "422": { description: Digest mismatch }
    get:
      operationId: getBlob
      parameters:
        - in: path
          name: digest
          required: true
          schema: { type: string }
        - in: header
          name: Range
          schema: { type: string }
      responses:
        "200":
          description: Blob stream
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "206": { description: Partial content }
        "404": { description: Missing or inaccessible }
  /runs:
    post:
      operationId: createRun
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Run created }
  /runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Run state }
        "404": { description: Not found }
  /runs/{runId}/resume:
    post:
      operationId: resumeRun
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "202": { description: Recovery claimed or scheduled }
        "409": { description: Run cannot be recovered }
  /runs/{runId}/staged-files:
    post:
      operationId: reserveStagedFile
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, attempt, logical_path, file_class, lease_epoch]
      responses:
        "201": { description: Reserved }
        "409": { description: Logical path conflict }
  /runs/{runId}/staged-files/{stagedFileId}/start:
    post:
      operationId: startStagedFileWrite
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stagedFileId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagedFileTransition" }
      responses:
        "200": { description: WRITING }
        "409": { description: Stale version or lease }
  /runs/{runId}/staged-files/{stagedFileId}/seal:
    post:
      operationId: sealStagedFile
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stagedFileId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StagedFileTransition" }
      responses:
        "200": { description: SEALED }
        "409": { description: Stale version or lease }
        "422": { description: Digest, schema, or policy failure }
  /runs/{runId}/staged-files/{stagedFileId}/promote:
    post:
      operationId: promoteStagedFile
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stagedFileId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "200": { description: CAS_PROMOTED or already promoted }
        "409": { description: Invalid transition }
  /runs/{runId}/checkpoints:
    post:
      operationId: commitCheckpoint
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Checkpoint committed }
        "409": { description: Incompatible or stale state }
  /runs/{runId}/publish:
    post:
      operationId: publishTree
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tree_manifest_digest, evidence_bundle_digest, expected_run_version]
      responses:
        "200": { description: Published or already published }
        "409": { description: State conflict }
        "412": { description: Validation, provenance, security, or evidence gate failed }

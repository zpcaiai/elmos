[project]
name = "elmos-assurance-engine"
version = "4.0.0"
description = "Repository-owned core assurance engine implementing elmos.assurance/v4 specification"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.25.1",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_assurance_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]


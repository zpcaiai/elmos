[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-repository-orchestrator-engine"
version = "0.1.0"
description = "Fail-closed repository planning, task decomposition, and cost routing runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
elmos-repository-orchestrator = "elmos_repository_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-semantic-assurance-engine"
version = "1.0.0"
description = "Production-grade Semantic Assurance Engine for Elmos (Batches J-R, Skills 169-300)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
]

[project.scripts]
elmos-semantic-assurance = "elmos_semantic_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

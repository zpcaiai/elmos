[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elmos-knowledge-skill-model-foundry-engine"
version = "2.0.0"
description = "Elmos Knowledge-Skill-Model Foundry Runtime Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
elmos-foundry = "elmos_foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

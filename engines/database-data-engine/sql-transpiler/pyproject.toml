[project]
name = "elmos-sql-transpiler"
version = "0.1.0"
description = "Fail-closed, typed, cross-dialect SQL transpilation for the ELMOS database engine"
requires-python = ">=3.12,<3.15"
dependencies = [
  "anyio==4.14.2",
  "cryptography==50.0.0",
  "duckdb==1.5.4",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "sqlglot==30.13.0",
  "uvicorn==0.51.0",
]

[project.scripts]
elmos-chinadb-preflight = "elmos_sql_transpiler.http_api:main"
elmos-sql-transpiler = "elmos_sql_transpiler.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_sql_transpiler"]

[tool.hatch.build.targets.wheel.force-include]
"src/elmos_sql_transpiler/data" = "elmos_sql_transpiler/data"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==8.4.2",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elmos_sql_transpiler"]

[project]
name = "elmos-pricing-billing-reference"
version = "0.1.0"
description = "Deterministic local reference behavior for ELMOS pricing and billing Skills"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
elmos-pricing-billing = "elmos_pricing_billing.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pytest==9.0.3",
  "ruff==0.12.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmos_pricing_billing"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elmos_pricing_billing"]

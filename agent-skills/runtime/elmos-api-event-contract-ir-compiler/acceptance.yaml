apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-api-event-contract-ir-compiler
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_API_EVENT_CONTRACT_IR_COMPILER_AC_01
    title: 'native scenario: normalize request/response and streaming shapes'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-api-event-contract-ir-compiler executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_API_EVENT_CONTRACT_IR_COMPILER_AC_02
    title: 'native scenario: model error and retry semantics'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs

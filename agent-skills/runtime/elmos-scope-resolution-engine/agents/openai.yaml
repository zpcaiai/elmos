interface:
  display_name: "elmos-scope-resolution-engine"
  short_description: "Resolve lexical, dynamic, imported, inherited and host-environment scopes and preserve binding id..."
  default_prompt: "Use $elmos-scope-resolution-engine through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-scope-resolution-engine"
  handler_id: "execute_elmos_scope_resolution_engine"
  operation: "MODEL_NORMALIZATION"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

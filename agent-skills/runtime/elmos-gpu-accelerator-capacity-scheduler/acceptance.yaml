apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-gpu-accelerator-capacity-scheduler
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_GPU_ACCELERATOR_CAPACITY_SCHEDULER_AC_01
    title: 'native scenario: model accelerator capabilities and topology'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-gpu-accelerator-capacity-scheduler executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_GPU_ACCELERATOR_CAPACITY_SCHEDULER_AC_02
    title: 'native scenario: bin-pack models with memory/KV constraints'
    class: native-or-domain

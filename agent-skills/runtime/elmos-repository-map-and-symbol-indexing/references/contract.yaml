schema_version: 1.0.0
ordinal: 48
name: elmos-repository-map-and-symbol-indexing
title: 仓库地图与符号索引
objective: 从多语言项目生成可增量、可查询、带源码范围的 Repository Map，为代码理解、生成、转换、测试和上下文装载提供结构事实。
dependencies:
- elmos-project-root-language-framework-detection
- elmos-ignore-generated-vendored-file-classification
- elmos-repository-context-map
inputs:
- 分析视图 manifest
- ProjectProfile
- 源文件
- 历史 RepositoryMap
outputs:
- RepositoryMap
- 符号与依赖索引
- 影响/测试映射
- 解析覆盖报告
responsibilities:
- 按项目画像选择解析器、LSP、tree-sitter、编译器前端或安全静态分析器，不执行项目安装脚本。
- 索引模块、包/命名空间、类型、函数、字段、路由、API、数据实体、消息主题、配置键和测试。
- 建立 import、调用、继承、实现、读写、API、数据库、消息、构建和测试覆盖关系。
- 为每个符号保留路径、字节/行范围、签名、可见性、语言、版本、哈希和解析置信度。
- 识别动态关系、反射、代码生成和框架约定，无法确定时保留候选与置信度。
- 根据 manifest diff 只重建变更符号及受影响边，并进行孤儿和一致性检查。
- 为下游提供符号搜索、调用链、影响分析、入口点、测试映射和图导出。
- 监控索引覆盖、陈旧节点、解析失败和跨语言边准确率。
deliverables:
- RepositoryMap/Symbol/Edge schema 与数据库迁移
- 目标语言/框架解析适配器与调度器
- 增量索引、影响分析和查询 API
- 多语言仓库黄金集、性能和准确率报告
acceptance:
- 每个符号可追溯到具体项目版本、文件和源码范围
- 增量索引后无陈旧/孤儿边且结果与全量重建一致
- 解析失败被显式报告，不伪造完整覆盖
- 不在索引阶段执行 install、postinstall、Makefile、Dockerfile 或用户脚本
- 目标语言和框架达到定义的符号/关系覆盖门槛
- 大型仓库的索引吞吐、存储和查询延迟满足SLO
data_entities:
- repository_maps
- repository_modules
- repository_symbols
- repository_dependencies
- repository_index_runs
events:
- repository.index.started
- repository.symbol.indexed
- repository.index.completed
- repository.index.partial
metrics:
- symbol_index_coverage
- edge_precision
- incremental_index_latency_seconds
- stale_symbol_count
failure_modes:
- parser crash
- dynamic edge missed
- stale symbol retained
- user code executed during indexing
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

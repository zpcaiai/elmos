apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: audit-readiness-package
  version: 3.0.0
  pack: 14-human-governance-operations
  priority: P0
  owner: governance-operations-team
spec:
  description: 按审计目标组织政策、证据、抽样、变更、访问和事件材料。
  kernel: Human Assurance Plane
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: review request
    required: true
  - name: evidence bundle
    required: true
  - name: risk decision
    required: true
  - name: human feedback
    required: true
  outputs:
  - name: approval
    contentAddressed: true
  - name: annotation
    contentAddressed: true
  - name: waiver
    contentAddressed: true
  - name: decision record
    contentAddressed: true
  - name: escalation
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - review.assign
    - approval.record
    - annotation.write
    - waiver.issue
    - incident.escalate
    defaultDeny: true
  evidence:
    requiredGates:
    - reviewer-qualified
    - conflict-disclosed
    - decision-reasoned
    - reversible
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - human-governance
  capabilityTags:
  - 14-human-governance-operations
  - audit
  - human-governance
  - package
  - readiness
  triggers:
  - 任务需要：按审计目标组织政策、证据、抽样、变更、访问和事件材料。
  - 任务属于 human-governance 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - reviewer-qualified
  - conflict-disclosed
  - decision-reasoned
  - reversible
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: connector-health-and-backfill
  version: 3.0.0
  pack: 01-knowledge-ingestion-governance
  priority: P1
  owner: knowledge-platform-team
spec:
  description: 监控同步延迟、缺页、断点、权限变化，并安全完成补采与校验。
  kernel: K1 Knowledge Fabric
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: repository
    required: true
  - name: document
    required: true
  - name: API schema
    required: true
  - name: database metadata
    required: true
  - name: runtime trace
    required: true
  - name: ticket or incident
    required: true
  outputs:
  - name: normalized artifact
    contentAddressed: true
  - name: source provenance
    contentAddressed: true
  - name: rights classification
    contentAddressed: true
  - name: freshness status
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - source.connect
    - artifact.parse
    - secret.scan
    - license.scan
    - object.store
    defaultDeny: true
  evidence:
    requiredGates:
    - source-authorized
    - provenance-complete
    - sensitive-data-classified
    - parse-quality-pass
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - knowledge-ingestion
  capabilityTags:
  - 01-knowledge-ingestion-governance
  - backfill
  - connector
  - health
  - knowledge-ingestion
  triggers:
  - 任务需要：监控同步延迟、缺页、断点、权限变化，并安全完成补采与校验。
  - 任务属于 knowledge-ingestion 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - source-authorized
  - provenance-complete
  - sensitive-data-classified
  - parse-quality-pass
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: standard
    deprecationPolicyRequired: true

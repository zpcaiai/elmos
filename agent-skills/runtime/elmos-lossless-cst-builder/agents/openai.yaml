interface:
  display_name: "elmos-lossless-cst-builder"
  short_description: "Build a lossless concrete syntax tree that retains every token, trivia item, directive and source..."
  default_prompt: "Use $elmos-lossless-cst-builder through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-lossless-cst-builder"
  handler_id: "execute_elmos_lossless_cst_builder"
  operation: "MODEL_NORMALIZATION"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

schema_version: 1.0.0
ordinal: 35
name: elmos-context-checkpoint-and-recovery
title: 上下文检查点与恢复
objective: 持久保存可重放的任务与上下文状态，使恢复精确、幂等且不重复副作用或计费。
dependencies:
- elmos-durable-processing-and-recovery
- elmos-structured-context-compaction
- elmos-context-integrity-and-loss-detection
inputs:
- 任务执行状态
- ContextLoadPlan/CompactionCheckpoint
- 工具副作用账本
- 模型与资产版本
outputs:
- 持久检查点
- 恢复计划
- 恢复结果
- 幂等/补偿记录
responsibilities:
- 定义任务检查点，包含任务状态、工作流节点、ContextLoadPlan、压缩引用、变量、工具幂等键和成本账游标。
- 在安全边界、外部副作用前后、压缩前后和阶段完成时创建一致性检查点。
- 使用事务/outbox 或等价机制原子提交状态与事件，防止数据库与队列分裂。
- 恢复时验证租户、权限、输入资产版本、模型能力、工具版本和检查点完整性。
- 根据工具幂等键判断重放、跳过、补偿或人工审批，禁止重复支付、发送或写入。
- 客户端断开只改变订阅状态，不取消服务端任务；服务重启从最后安全检查点继续。
- 提供检查点列表、差异、恢复、回滚和保留策略。
- 通过 kill -9、网络分区、队列重复投递和数据库故障注入验证恢复。
deliverables:
- TaskCheckpoint/RecoveryAttempt 数据模型
- 检查点创建、恢复、回滚和幂等协调器
- 事务事件/outbox 与重复投递防护
- 故障注入与恢复一致性报告
acceptance:
- 客户端断线后任务按策略继续并可重新订阅进度
- 服务进程被终止后可从最后安全点恢复
- 同一检查点重复恢复不会重复外部副作用或成本记账
- 恢复前后 P0/P1、待办、修改文件和测试状态一致
- 损坏或不兼容检查点被拒绝并给出安全恢复路径
- 所有恢复尝试有 trace、操作者、原因和结果
data_entities:
- task_checkpoints
- checkpoint_artifacts
- recovery_attempts
- side_effect_ledger
events:
- context.checkpoint.created
- context.recovery.started
- context.recovery.completed
- context.recovery.blocked
metrics:
- checkpoint_recovery_success_rate
- duplicate_side_effect_count
- recovery_point_objective_seconds
- recovery_time_seconds
failure_modes:
- partial checkpoint
- duplicate billing
- stale asset version
- incompatible tool schema
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

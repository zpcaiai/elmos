apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: capability-taxonomy-governance
  version: 2.0.0
  pack: 00-foundation-contracts
  priority: P0
  owner: TBD
spec:
  description: 统一定义能力域、Skill 粒度、风险等级、成熟度、依赖和所有权，防止能力重复与边界漂移。
  kernel: K0 Cross-Kernel Contracts
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: business requirement
    required: true
  - name: architecture decision
    required: true
  - name: policy profile
    required: true
  - name: runtime capability inventory
    required: true
  outputs:
  - name: typed contract
    contentAddressed: true
  - name: compatibility declaration
    contentAddressed: true
  - name: evidence obligation
    contentAddressed: true
  - name: release identity
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - registry.read
    - schema.validate
    - policy.evaluate
    - artifact.hash
    defaultDeny: true
  evidence:
    requiredGates:
    - schema-valid
    - globally-unique-id
    - versioned
    - owner-assigned
    - rollback-defined
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

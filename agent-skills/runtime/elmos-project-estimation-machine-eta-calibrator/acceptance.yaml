apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-project-estimation-machine-eta-calibrator
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_PROJECT_ESTIMATION_MACHINE_ETA_CALIBRATOR_AC_01
    title: 'native scenario: extract size, graph, route and risk features'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-project-estimation-machine-eta-calibrator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PROJECT_ESTIMATION_MACHINE_ETA_CALIBRATOR_AC_02
    title: 'native scenario: separate execution, queue and approval time'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs

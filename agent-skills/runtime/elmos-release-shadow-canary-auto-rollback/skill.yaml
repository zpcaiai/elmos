apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: release-shadow-canary-auto-rollback
  version: 2.0.0
  pack: 16-self-evolution-release-engineering
  priority: P0
  owner: TBD
spec:
  description: 根据硬门和实时 SLO 自动暂停、回滚或扩大流量。
  kernel: Learning Flywheel and Release Kernel
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: failure clusters
    required: true
  - name: quality metrics
    required: true
  - name: research signals
    required: true
  - name: release candidate
    required: true
  outputs:
  - name: improvement proposal
    contentAddressed: true
  - name: new skill or dataset
    contentAddressed: true
  - name: certified release
    contentAddressed: true
  - name: rollback decision
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - gap.mine
    - experiment.run
    - release.assemble
    - canary.evaluate
    - rollback.execute
    defaultDeny: true
  evidence:
    requiredGates:
    - causal-evidence
    - no-eval-leakage
    - independent-certification
    - reversible-release
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: contract-migration-manager
  version: 3.0.0
  pack: 00-foundation-contracts
  priority: P1
  owner: foundation-architecture-team
spec:
  description: 在契约 Schema 升级时完成向前兼容、双写、迁移验证和安全回滚。
  kernel: K0 Cross-Kernel Contracts
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: business requirement
    required: true
  - name: architecture decision
    required: true
  - name: policy profile
    required: true
  - name: runtime capability inventory
    required: true
  outputs:
  - name: typed contract
    contentAddressed: true
  - name: compatibility declaration
    contentAddressed: true
  - name: evidence obligation
    contentAddressed: true
  - name: release identity
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - registry.read
    - schema.validate
    - policy.evaluate
    - artifact.hash
    defaultDeny: true
  evidence:
    requiredGates:
    - schema-valid
    - globally-unique-id
    - versioned
    - owner-assigned
    - rollback-defined
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - platform-foundation
  capabilityTags:
  - 00-foundation-contracts
  - contract
  - manager
  - migration
  - platform-foundation
  triggers:
  - 任务需要：在契约 Schema 升级时完成向前兼容、双写、迁移验证和安全回滚。
  - 任务属于 platform-foundation 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - schema-valid
  - globally-unique-id
  - versioned
  - owner-assigned
  - rollback-defined
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: standard
    deprecationPolicyRequired: true

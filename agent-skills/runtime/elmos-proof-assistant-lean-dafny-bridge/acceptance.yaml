apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-proof-assistant-lean-dafny-bridge
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_PROOF_ASSISTANT_LEAN_DAFNY_BRIDGE_AC_01
    title: 'native scenario: emit typed theorem and contract artifacts'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-proof-assistant-lean-dafny-bridge executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PROOF_ASSISTANT_LEAN_DAFNY_BRIDGE_AC_02
    title: 'native scenario: separate generated conjecture from checked proof'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-proof-assistant-lean-dafny-bridge executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_PROOF_ASSISTANT_LEAN_DAFNY_BRIDGE_AC_03

interface:
  display_name: "elmos-proof-counterexample-replayer"
  short_description: "Convert solver/model-checker/refinement counterexamples into executable regression tests in sourc..."
  default_prompt: "Use $elmos-proof-counterexample-replayer through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-proof-counterexample-replayer"
  handler_id: "execute_elmos_proof_counterexample_replayer"
  operation: "COUNTEREXAMPLE_REPLAY"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

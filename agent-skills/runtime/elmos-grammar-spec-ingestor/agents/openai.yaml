interface:
  display_name: "elmos-grammar-spec-ingestor"
  short_description: "Ingest normative grammars, vendor dialect grammars and parser artifacts into a versioned grammar..."
  default_prompt: "Use $elmos-grammar-spec-ingestor through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-grammar-spec-ingestor"
  handler_id: "execute_elmos_grammar_spec_ingestor"
  operation: "MODEL_NORMALIZATION"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

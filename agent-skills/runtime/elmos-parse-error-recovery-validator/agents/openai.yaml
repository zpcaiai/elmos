interface:
  display_name: "elmos-parse-error-recovery-validator"
  short_description: "Validate partial and malformed repositories without allowing parser recovery to silently invent e..."
  default_prompt: "Use $elmos-parse-error-recovery-validator through its exact repository-owned semantic-assurance runtime binding; preserve NOT_RUN and blockers."
runtime:
  module: "elmos_semantic_assurance.registry"
  registry: "SkillRegistry"
  registry_key: "elmos-parse-error-recovery-validator"
  handler_id: "execute_elmos_parse_error_recovery_validator"
  operation: "SEMANTIC_COMPARISON"
  generic_fallback: false
security:
  trusted_scope_required: true
  archive_code_execution: "forbidden"
  external_effects: "not-authorized-by-skill"
evidence:
  external: "NOT_RUN"
  certification: "NOT_CERTIFIED"

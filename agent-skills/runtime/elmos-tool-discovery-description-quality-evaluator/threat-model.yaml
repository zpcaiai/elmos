apiVersion: elmos.ai/v3alpha1
kind: ThreatModel
metadata:
  name: elmos-tool-discovery-description-quality-evaluator
  version: 4.0.0
spec:
  trustBoundaries:
  - user/tenant to control plane
  - control plane to sandboxed execution
  - execution to model/tool/provider
  - runtime to evidence/certification
  - tenant to shared infrastructure
  assets:
  - Goal and RevisionSet integrity
  - tenant data and memory
  - tool and deployment authority
  - generated artifacts
  - proof and certificate integrity
  - availability and budget
  threats:
  - id: T01
    threat: description overclaims capability
    asset: tenant data
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: build positive and nearby-negative intent corpus'
  - id: T02
    threat: tools collide semantically
    asset: authority
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: measure tool selection precision/recall'
  - id: T03
    threat: negative corpus too easy
    asset: evidence
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: check schema constraints and sensitive inputs'
  - id: T04
    threat: schema permits injection payload
    asset: availability
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: evaluate side-effect annotations and descriptions'
  - id: T05
    threat: metadata optimization hides destructive effect
    asset: semantic correctness
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: optimize metadata under versioned experiments'
  assurance:
  - OWASP-style agentic abuse campaign where applicable
  - supply-chain and provenance verification
  - incident kill-switch drill for critical Skills

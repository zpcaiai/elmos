apiVersion: elmos.ai/v3alpha1
kind: SkillContract
metadata:
  name: elmos-ai-controllability-override-fail-safe-certifier
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  priority: P0
  risk: critical
  group: ai-control
  kernelAuthorities:
  - K1
  - K2
  - K4
  - K6
  - K7
  - K8
  canonicalInputs:
  - type: GoalContract
    required: true
    binding: goal_id
  - type: RevisionSet
    required: true
    binding: revision_set_id
  - type: EnvironmentAuthority
    required: true
    binding: execution_epoch+authority_digest
  - type: ProofObligationGraph
    required: true
    binding: proof_graph_id
  - type: BudgetAndPolicyEnvelope
    required: true
    binding: policy_bundle_digest
  outputs:
  - path: artifacts/elmos-ai-controllability-override-fail-safe-certifier/profile.yaml
    type: YamlArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: artifacts/elmos-ai-controllability-override-fail-safe-certifier/plan.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: artifacts/elmos-ai-controllability-override-fail-safe-certifier/result.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: artifacts/elmos-ai-controllability-override-fail-safe-certifier/evidence/
    type: ArtifactDirectory
    immutable: true
    evidenceBound: true
    schemaRequired: false
  - path: artifacts/elmos-ai-controllability-override-fail-safe-certifier/assurance-case.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  dependencies: []
  failureMode: fail-closed
  ownership:
    intent: K1
    semantic: K2/K3
    reasoning: K4
    transformation: K5
    verification: K6
    execution: K7
    completion: K8
  invariants:
  - every terminal result binds one exact RevisionSet
  - every write validates tenant, execution epoch, lease generation and fencing token
  - every side effect has idempotency and reconciliation state
  - critical UNKNOWN or UNSUPPORTED cannot become COMPLETE
  - generator, repairer and certifier are independently attributable
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  externalDependencies:
  - skill: elmos-human-oversight-consent-contract-compiler
    package: elmos-ai-capability-enhancement-skills
    versionConstraint: '>=4.1.0,<4.2.0'
    mode: required-base-evidence-producer
  - skill: elmos-ai-runaway-loop-economic-dos-guard
    package: elmos-ai-capability-enhancement-skills
    versionConstraint: '>=4.1.0,<4.2.0'
    mode: required-base-evidence-producer
  packageRole: certification
  standaloneCompletionCeiling: K8_CERTIFICATION_DECISION

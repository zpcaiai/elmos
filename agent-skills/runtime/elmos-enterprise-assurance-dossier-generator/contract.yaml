apiVersion: elmos.ai/v3alpha1
kind: SkillContract
metadata:
  name: elmos-enterprise-assurance-dossier-generator
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  priority: P0
  risk: high
  group: commercial-assurance
  kernelAuthorities:
  - K1
  - K2
  - K6
  - K8
  canonicalInputs:
  - type: GoalContract
    required: true
    binding: goal_id
  - type: RevisionSet
    required: true
    binding: revision_set_id
  - type: EnvironmentAuthority
    required: true
    binding: execution_epoch+authority_digest
  - type: ProofObligationGraph
    required: true
    binding: proof_graph_id
  - type: BudgetAndPolicyEnvelope
    required: true
    binding: policy_bundle_digest
  outputs:
  - path: enterprise-assurance-dossier/
    type: ArtifactDirectory
    immutable: true
    evidenceBound: true
    schemaRequired: false
  - path: security-questionnaire-evidence-map.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: customer-control-matrix.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: dossier-gap-register.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  dependencies:
  - elmos-external-audit-oscal-evidence-exporter
  - elmos-independent-k8-certificate-signer
  - elmos-operability-support-readiness-certifier
  - elmos-privacy-impact-consent-purpose-verifier
  - elmos-open-source-license-ip-compliance-certifier
  - elmos-vulnerability-vex-kev-response-governor
  failureMode: fail-closed
  ownership:
    intent: K1
    semantic: K2/K3
    reasoning: K4
    transformation: K5
    verification: K6
    execution: K7
    completion: K8
  invariants:
  - every terminal result binds one exact RevisionSet
  - every write validates tenant, execution epoch, lease generation and fencing token
  - every side effect has idempotency and reconciliation state
  - critical UNKNOWN or UNSUPPORTED cannot become COMPLETE
  - generator, repairer and certifier are independently attributable
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  externalDependencies:
  - skill: elmos-ai-system-impact-assessment-compiler
    package: elmos-ai-capability-enhancement-skills
    versionConstraint: '>=4.1.0,<4.2.0'
    mode: required-base-evidence-producer
  packageRole: certification
  standaloneCompletionCeiling: K8_CERTIFICATION_DECISION

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elmos
      POSTGRES_PASSWORD: elmos_dev
      POSTGRES_DB: elmos_cache
    ports: ["5432:5432"]
    volumes:
      - elmos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - elmos-redis:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: elmos
      MINIO_ROOT_PASSWORD: elmos_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - elmos-minio:/data

volumes:
  elmos-postgres: {}
  elmos-redis: {}
  elmos-minio: {}

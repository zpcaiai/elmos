elmos:
  cache:
    enabled: true
    mode: read-write
    local:
      root: .elmos/cache
      metadata: .elmos/cache/index.sqlite
      max_size_gb: 20
      canonical_hash: sha256
    remote:
      enabled: false
    workspace:
      root: .elmos/workspaces
      source_read_only: true
      quota_gb_per_run: 10
      undeclared_output_policy: quarantine
      publish_strategy: versioned-atomic-pointer
    checkpoint:
      stage_boundary: true
      interval_seconds: 60
    validation:
      default_minimum: TEST_VERIFIED

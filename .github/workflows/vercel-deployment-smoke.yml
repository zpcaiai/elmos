name: Vercel deployment smoke

on:
  push:
    branches: [main]
    paths:
      - ".vercelignore"
      - "apps/web-console/**"
      - "contracts/pricing-catalog-schema/elmos-cny-self-serve-v1.json"
      - "routes/inventory.json"
      - "routes/*/route.json"
      - "routes/*/support-matrix.json"
      - "routes/*/certification/certification.json"
      - "routes/*/certification/evidence.json"
      - "pom.xml"
      - "engines/database-data-engine/sql-transpiler/src/elmos_sql_transpiler/data/chinadb-commercial-v1.json"
      - "engines/dotnet-engine/src/Elmos.Dotnet.SemanticCli/Elmos.Dotnet.SemanticCli.csproj"
      - "engines/frontend-client-engine/src/polyglot.ts"
      - "engines/polyglot-route-engine/native/**"
      - "engines/polyglot-route-engine/src/elmos_polyglot_route/clang_analyzer.py"
      - "engines/polyglot-route-engine/src/elmos_polyglot_route/emitter.py"
      - "engines/polyglot-route-engine/src/elmos_polyglot_route/python_analyzer.py"
      - "scripts/operations/wait_for_vercel_deployment.py"
      - ".github/workflows/vercel-deployment-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - ".vercelignore"
      - "apps/web-console/**"
      - "contracts/pricing-catalog-schema/elmos-cny-self-serve-v1.json"
      - "routes/inventory.json"
      - "routes/*/route.json"
      - "routes/*/support-matrix.json"
      - "routes/*/certification/certification.json"
      - "routes/*/certification/evidence.json"
      - "pom.xml"
      - "engines/database-data-engine/sql-transpiler/src/elmos_sql_transpiler/data/chinadb-commercial-v1.json"
      - "engines/dotnet-engine/src/Elmos.Dotnet.SemanticCli/Elmos.Dotnet.SemanticCli.csproj"
      - "engines/frontend-client-engine/src/polyglot.ts"
      - "engines/polyglot-route-engine/native/**"
      - "engines/polyglot-route-engine/src/elmos_polyglot_route/clang_analyzer.py"
      - "engines/polyglot-route-engine/src/elmos_polyglot_route/emitter.py"
      - "engines/polyglot-route-engine/src/elmos_polyglot_route/python_analyzer.py"
      - "scripts/operations/wait_for_vercel_deployment.py"
      - ".github/workflows/vercel-deployment-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: vercel-deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Vercel deployment surface smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELMOS_DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ELMOS_VERCEL_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.ELMOS_DEPLOYMENT_SHA }}"

      - name: Resolve exact successful Vercel deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/operations/wait_for_vercel_deployment.py
          --repository "${GITHUB_REPOSITORY}"
          --sha "${ELMOS_DEPLOYMENT_SHA}"
          --github-env "${GITHUB_ENV}"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install exact pnpm
        run: npm install --global pnpm@10.12.4

      - name: Reject non-HTTPS deployment targets
        run: |
          case "$ELMOS_E2E_BASE_URL" in
            https://*) ;;
            *) echo "::error::ELMOS_E2E_BASE_URL must be an HTTPS deployment URL"; exit 1 ;;
          esac

      - name: Install locked web dependencies
        run: pnpm --dir apps/web-console install --frozen-lockfile

      - name: Install Chromium for the deployment probe
        run: pnpm --dir apps/web-console exec playwright install --with-deps chromium

      - name: Request short-lived Vercel Trusted Source token
        id: vercel-trusted-source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Run deployment surface smoke
        env:
          ELMOS_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-trusted-source.outputs.token }}
        run: pnpm --dir apps/web-console test:vercel-smoke

      - name: Preserve deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-deployment-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web-console/test-results/vercel-deployment-smoke
            apps/web-console/test-results/vercel-deployment-smoke-report
          if-no-files-found: warn
          retention-days: 30

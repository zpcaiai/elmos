name: Vercel deployment smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/web-console/**"
      - ".github/workflows/vercel-deployment-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web-console/**"
      - ".github/workflows/vercel-deployment-smoke.yml"
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "HTTPS Vercel deployment URL to probe"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Vercel deployment surface smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELMOS_E2E_BASE_URL: ${{ inputs.deployment_url || vars.ELMOS_VERCEL_SMOKE_URL || 'https://elmos-alpha.vercel.app' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install exact pnpm
        run: npm install --global pnpm@10.12.4

      - name: Reject non-HTTPS deployment targets
        run: |
          case "$ELMOS_E2E_BASE_URL" in
            https://*) ;;
            *) echo "::error::ELMOS_E2E_BASE_URL must be an HTTPS deployment URL"; exit 1 ;;
          esac

      - name: Install locked web dependencies
        run: pnpm --dir apps/web-console install --frozen-lockfile

      - name: Install Chromium for the deployment probe
        run: pnpm --dir apps/web-console exec playwright install --with-deps chromium

      - name: Run deployment surface smoke
        run: pnpm --dir apps/web-console test:vercel-smoke

      - name: Preserve deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-deployment-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web-console/test-results/vercel-deployment-smoke
            apps/web-console/test-results/vercel-deployment-smoke-report
          if-no-files-found: warn
          retention-days: 30

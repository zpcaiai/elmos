name: Directed language native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-native-matrix:
    name: Exact native route matrix (NOT_CERTIFIED)
    # This label set intentionally targets only the repository-governed host
    # whose compiler/runtime paths and binary digests match the Batch 29
    # exact-toolchain contract. GitHub-hosted images are not substitutes.
    runs-on: [self-hosted, macOS, ARM64, elmos-polyglot-exact]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact native matrix
        run: |
          uv --directory engines/polyglot-route-engine sync --locked
          uv --directory engines/polyglot-route-engine run --locked pytest
          uv --directory engines/polyglot-route-engine run --locked ruff check src tests
          uv --directory engines/polyglot-route-engine run --locked mypy src
      - name: Verify route packs and conservative fail-closed decision
        run: |
          python3 scripts/operations/validate_translation_route_matrix.py
          v3_gate_log="$RUNNER_TEMP/elmos-v3-route-gate.log"
          python3 scripts/batch29/run_route_gate.py routes/cpp-to-flutter | tee "$v3_gate_log"
          grep -F "status=research decision=NOT_CERTIFIED" "$v3_gate_log"
          gate_log="$RUNNER_TEMP/elmos-route-gate-negative.log"
          if python3 scripts/batch29/run_route_gate.py routes/cpp-to-csharp >"$gate_log" 2>&1; then
            echo "NOT_RUN route unexpectedly passed the certification gate" >&2
            exit 1
          fi
          grep -F "GATE FAIL: limited route requires local execution PASSED" "$gate_log"

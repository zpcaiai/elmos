name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java reactor
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
          cache: maven
      - name: Verify Maven reactor
        run: mvn -B -ntp verify

  commercial-billing-integration:
    name: Commercial billing PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elmos_billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elmos_billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ELMOS_BILLING_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/elmos_billing
      ELMOS_BILLING_TEST_DATABASE_USERNAME: postgres
      ELMOS_BILLING_TEST_DATABASE_PASSWORD: postgres
      ELMOS_BILLING_TEST_RUNTIME_USERNAME: elmos_billing_runtime
      ELMOS_BILLING_TEST_RUNTIME_PASSWORD: runtime-test-password
      ELMOS_BILLING_TEST_DISPOSABLE_CONFIRMED: "true"
      ELMOS_COMMERCIAL_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/elmos_billing
      ELMOS_COMMERCIAL_DATABASE_USERNAME: elmos_billing_runtime
      ELMOS_COMMERCIAL_DATABASE_PASSWORD: runtime-test-password
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Compile persistence dependencies
        run: mvn -B -ntp -q -DskipTests -pl modules/persistence -am install

      - name: Replay and validate all Flyway migrations
        run: >-
          mvn -B -ntp -f modules/persistence/pom.xml
          -Dflyway.url="$ELMOS_COMMERCIAL_DATABASE_URL"
          -Dflyway.user=postgres
          -Dflyway.password=postgres
          flyway:migrate flyway:validate

      - name: Provision least-privileged runtime role
        env:
          PGPASSWORD: postgres
          ELMOS_COMMERCIAL_DATABASE_MIGRATION_USERNAME: postgres
          ELMOS_COMMERCIAL_DATABASE_MIGRATION_PASSWORD: postgres
          ELMOS_COMMERCIAL_DATABASE_RUNTIME_USERNAME: elmos_billing_runtime
        run: |
          psql "${ELMOS_COMMERCIAL_DATABASE_URL#jdbc:}" --username postgres \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --command "create role elmos_billing_runtime login nosuperuser nobypassrls password 'runtime-test-password'"
          bash scripts/commercial/configure_billing_runtime_role.sh

      - name: Verify billing persistence and API journeys
        run: |
          mvn -B -ntp -q -pl modules/persistence -am \
            -Dtest=JdbcSelfServiceBillingLiveTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -ntp -q -pl apps/commercial-api -am \
            -Dtest=SelfServiceBillingApiLiveTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

  dotnet-engine:
    name: .NET Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.301"
          cache: true
          cache-dependency-path: engines/dotnet-engine/**/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore engines/dotnet-engine/Elmos.Dotnet.slnx --locked-mode
      - name: Test .NET Engine
        run: dotnet test engines/dotnet-engine/Elmos.Dotnet.slnx --configuration Release --no-restore

  python-engine:
    name: Python Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install locked uv tool
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Test and type-check Python Engine
        run: |
          uv --directory engines/python-engine run --locked pytest
          uv --directory engines/python-engine run --locked ruff check src tests
          uv --directory engines/python-engine run --locked mypy src

  frontend-client-engine:
    name: Frontend Client Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked pnpm tool
        run: npm install --global pnpm@10.12.4
      - name: Install locked dependencies
        run: pnpm --dir engines/frontend-client-engine install --frozen-lockfile
      - name: Test Frontend Client Engine
        run: pnpm --dir engines/frontend-client-engine check

  polyglot-routes:
    name: Directed language route contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python 3.12.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.301"
      - name: Set up Node.js 26.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.0.0"
      - name: Install locked tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
          pnpm --dir engines/frontend-client-engine install --frozen-lockfile
      - name: Verify compiler-backed route engine
        run: |
          export ELMOS_JAVA21_HOME="$JAVA_HOME"
          uv --directory engines/polyglot-route-engine sync --locked
          uv --directory engines/polyglot-route-engine run --locked pytest
          uv --directory engines/polyglot-route-engine run --locked ruff check src tests
          uv --directory engines/polyglot-route-engine run --locked mypy src
      - name: Verify all route packs and console contracts
        run: |
          python scripts/operations/validate_translation_route_matrix.py
          for route in routes/*/; do
            python scripts/batch29/run_route_gate.py "$route"
          done

  project-synthesis:
    name: Project Synthesis and operability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked uv tool
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Verify Project Synthesis
        working-directory: engines/project-synthesis-engine
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check src tests
          uv run mypy src
      - name: Verify service operability contracts
        run: |
          uv run --with pyyaml python tooling/validate_runtime_operability.py
          uv run --with pyyaml python -m unittest discover -s tests/production-readiness -p 'test_*.py'
      - name: Verify three-line workflow protocol pack
        run: |
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/validate_verification_pack.py \
            verification-packs/elmos-three-line-workflow-protocol
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/run_verification_gate.py \
            verification-packs/elmos-three-line-workflow-protocol |
            tee /tmp/elmos-workflow-gate.txt
          grep -F "decision=NOT_CERTIFIED" /tmp/elmos-workflow-gate.txt
      - name: Verify project generation source and cloud evidence packs
        run: |
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/validate_verification_pack.py \
            verification-packs/elmos-project-generation-source-ingestion
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/run_verification_gate.py \
            verification-packs/elmos-project-generation-source-ingestion |
            tee /tmp/elmos-generation-source-gate.txt
          grep -F "decision=NOT_CERTIFIED" /tmp/elmos-generation-source-gate.txt
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch33/run_cloud_gate.py \
            cloud-packs/elmos-project-generation-cloud-run-handoff
      - name: Verify Batch 45 fail-closed toolkit
        run: |
          uv run --with 'jsonschema>=4.23' --with pyyaml python scripts/mature_product_toolkit.py validate --batch 45
          uv run --with 'jsonschema>=4.23' --with pyyaml python -m unittest discover -s tests/batch45 -p 'test_*.py'
      - name: Verify Batch 97-104 Skill distribution
        run: make batch97-104-skills
      - name: Verify Product closure and convergence distributions
        run: make product-closure-convergence-skills

  project-synthesis-acceptance:
    name: Eight-language synthesis acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python 3.12.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.301"
      - name: Set up Node.js 26.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.0.0"
      - name: Set up Go 1.25
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25.0"
      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          toolchain: "1.89.0"
          components: clippy,rustfmt
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Install exact Maven, PHP, and PostgreSQL toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential libpq-dev libssl-dev pkg-config
          scripts/toolchains/install_project_synthesis_ci_toolchains.sh
      - name: Install locked synthesis tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
          uv --directory engines/project-synthesis-engine sync --locked
      - name: Run exact starter-profile acceptance
        run: >-
          uv --directory engines/project-synthesis-engine run --locked
          python scripts/run_acceptance.py --require-all-toolchains
      - name: Run PostgreSQL JWT and OIDC production matrix
        run: >-
          uv --directory engines/project-synthesis-engine run --locked
          python scripts/run_production_matrix.py

  web-console:
    name: Web Console
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked pnpm tool
        run: npm install --global pnpm@10.12.4
      - name: Install dependencies
        run: pnpm --dir apps/web-console install --frozen-lockfile
      - name: Type-check and build
        run: pnpm --dir apps/web-console check
      - name: Install Chromium for browser journeys
        run: pnpm --dir apps/web-console exec playwright install --with-deps chromium
      - name: Verify desktop and mobile browser journeys
        env:
          ELMOS_E2E_PORT: "3210"
          ELMOS_E2E_WEB_SERVER_MODE: development
          ELMOS_E2E_OUTPUT_DIR: test-results/ci-playwright
          ELMOS_E2E_REPORT_DIR: test-results/ci-playwright-report
        run: >-
          pnpm --dir apps/web-console exec playwright test
          --project=chromium
          --project=mobile-chromium
          e2e/console-usability.spec.ts
          e2e/core-business-lines-ui.spec.ts
          e2e/experience-quality.spec.ts
          e2e/maturity-status-ui.spec.ts
          e2e/operations-admin-ui.spec.ts
          e2e/pricing-ui.spec.ts
          e2e/repository-workspace-ui.spec.ts
          e2e/runtime-deployment-guide.spec.ts
          e2e/usage-meter-ui.spec.ts

  web-console-generation:
    name: Project generation browser qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Python 3.12.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Install locked browser and synthesis tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
      - name: Install dependencies
        run: pnpm --dir apps/web-console install --frozen-lockfile
      - name: Type-check and build
        run: pnpm --dir apps/web-console check
      - name: Install exact browser engines
        run: pnpm --dir apps/web-console exec playwright install --with-deps chromium firefox webkit
      - name: Verify project generation across desktop and mobile browsers
        env:
          ELMOS_E2E_PORT: "3212"
          ELMOS_E2E_WEB_SERVER_MODE: development
          ELMOS_E2E_OUTPUT_DIR: test-results/ci-generation-browser-matrix
          ELMOS_E2E_REPORT_DIR: test-results/ci-generation-browser-matrix-report
        run: |
          ELMOS_UV_PATH="$(command -v uv)" \
            pnpm --dir apps/web-console exec playwright test \
              --workers=1 \
              --project=chromium \
              --project=firefox \
              --project=webkit \
              --project=mobile-chromium \
              --project=mobile-webkit \
              e2e/account-session-ui.spec.ts \
              e2e/generation-source-ingestion.spec.ts \
              e2e/generation-ui.spec.ts

  web-console-runner-e2e:
    name: Isolated browser Runner journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Python 3.12.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install exact production Runner toolchains
        run: bash scripts/toolchains/install_project_synthesis_ci_toolchains.sh
      - name: Install locked browser and Runner tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
          pnpm --dir apps/web-console install --frozen-lockfile
          pnpm --dir apps/web-console exec playwright install --with-deps chromium
      - name: Verify real Spring and generation Runner journeys once
        env:
          ELMOS_E2E_PORT: "3211"
          ELMOS_E2E_WEB_SERVER_MODE: development
          ELMOS_E2E_OUTPUT_DIR: test-results/ci-runner-playwright
          ELMOS_E2E_REPORT_DIR: test-results/ci-runner-playwright-report
        run: |
          ELMOS_UV_PATH="$(command -v uv)" \
            pnpm --dir apps/web-console exec playwright test \
              --project=chromium \
              e2e/generation-runner.spec.ts \
              e2e/spring-real-journey-ui.spec.ts

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java reactor
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
          cache: maven
      - name: Verify Maven reactor
        run: mvn -B -ntp verify

  commercial-billing-integration:
    name: Commercial billing PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa # 17.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elmos_billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elmos_billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ELMOS_BILLING_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/elmos_billing
      ELMOS_BILLING_TEST_DATABASE_USERNAME: postgres
      ELMOS_BILLING_TEST_DATABASE_PASSWORD: postgres
      ELMOS_BILLING_TEST_RUNTIME_USERNAME: elmos_billing_runtime
      ELMOS_BILLING_TEST_RUNTIME_PASSWORD: runtime-test-password
      ELMOS_BILLING_TEST_DISPOSABLE_CONFIRMED: "true"
      ELMOS_COMMERCIAL_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/elmos_billing
      ELMOS_COMMERCIAL_DATABASE_USERNAME: elmos_billing_runtime
      ELMOS_COMMERCIAL_DATABASE_PASSWORD: runtime-test-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Compile persistence dependencies
        run: mvn -B -ntp -q -DskipTests -pl modules/persistence -am install

      - name: Replay and validate all Flyway migrations
        run: >-
          mvn -B -ntp -f modules/persistence/pom.xml
          -Dflyway.url="$ELMOS_COMMERCIAL_DATABASE_URL"
          -Dflyway.user=postgres
          -Dflyway.password=postgres
          flyway:migrate flyway:validate

      - name: Provision least-privileged runtime role
        env:
          PGPASSWORD: postgres
          ELMOS_COMMERCIAL_DATABASE_MIGRATION_USERNAME: postgres
          ELMOS_COMMERCIAL_DATABASE_MIGRATION_PASSWORD: postgres
          ELMOS_COMMERCIAL_DATABASE_RUNTIME_USERNAME: elmos_billing_runtime
        run: |
          psql "${ELMOS_COMMERCIAL_DATABASE_URL#jdbc:}" --username postgres \
            --no-psqlrc --set ON_ERROR_STOP=1 \
            --command "create role elmos_billing_runtime login nosuperuser nobypassrls password 'runtime-test-password'"
          bash scripts/commercial/configure_billing_runtime_role.sh

      - name: Verify billing persistence and API journeys
        run: |
          mvn -B -ntp -q -pl modules/persistence -am \
            -Dtest=JdbcSelfServiceBillingLiveTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -ntp -q -pl apps/commercial-api -am \
            -Dtest=SelfServiceBillingApiLiveTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

  dotnet-engine:
    name: .NET Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.301"
          cache: true
          cache-dependency-path: engines/dotnet-engine/**/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore engines/dotnet-engine/Elmos.Dotnet.slnx --locked-mode
      - name: Test .NET Engine
        run: dotnet test engines/dotnet-engine/Elmos.Dotnet.slnx --configuration Release --no-restore

  python-engine:
    name: Python Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked uv tool
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Test and type-check Python Engine
        run: |
          uv --directory engines/python-engine run --locked pytest
          uv --directory engines/python-engine run --locked ruff check src tests
          uv --directory engines/python-engine run --locked mypy src

  external-gate-intake:
    name: External intake anti-fabrication (pre-gate only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked uv tool
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Run external intake anti-fabrication tests
        run: >-
          uv run --with 'jsonschema>=4.23'
          python -m unittest discover
          -s tests/external_gate -p 'test_*.py' -v

  frontend-client-engine:
    name: Frontend Client Engine
    # The locked frontend formal profile is a macOS arm64 Z3 4.16.0
    # artifact. Running this contract on Linux would correctly return
    # MISSING and make the fail-closed solver tests fail before they exercise
    # the engine.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked pnpm tool
        run: npm install --global pnpm@10.12.4
      - name: Set up Python 3.11 schema validator
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked schema validator
        run: python3.11 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Install locked dependencies
        run: pnpm --dir engines/frontend-client-engine install --frozen-lockfile
      - name: Bind locked Z3 solver
        run: |
          chmod +x client-packs/frontend-72-route-equivalence-v2/formal-campaign/environment/z3
          echo "ELMOS_FRONTEND_Z3=$GITHUB_WORKSPACE/client-packs/frontend-72-route-equivalence-v2/formal-campaign/environment/z3" >> "$GITHUB_ENV"
      - name: Test Frontend Client Engine
        run: pnpm --dir engines/frontend-client-engine check

  polyglot-routes:
    name: Directed language route contracts
    # Objective-C target execution requires the real Foundation framework.
    # Linux clang can parse the bounded source subset, but cannot provide that
    # runtime contract, so the complete 9-language matrix runs on macOS.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bootstrap Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # CPython stopped publishing the macOS installers consumed by
          # setup-python after 3.12.10.  This interpreter only bootstraps uv;
          # route execution uses uv's separately pinned CPython 3.12.12 below.
          python-version: "3.12.10"
          architecture: arm64
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.301"
      - name: Set up Node.js 26.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.0.0"
      - name: Set up Go 1.25.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          toolchain: "1.89.0"
      - name: Provision digest-bound route toolchains
        run: scripts/toolchains/install_polyglot_route_ci_toolchains.sh
      - name: Install locked tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          uv python install 3.12.12
          npm install --global pnpm@10.12.4
          pnpm --dir engines/frontend-client-engine install --frozen-lockfile
          # The native Rust analyzer executes with --offline --locked so a
          # repository workload cannot cause an undeclared network fetch.
          # Hydrate only the checked-in Cargo.lock graph before that
          # fail-closed execution phase starts.
          cargo fetch \
            --locked \
            --manifest-path engines/polyglot-route-engine/native/rust/Cargo.toml
      - name: Verify compiler-backed route engine
        run: |
          # The installer and route engine independently bind exact versions,
          # file/tree digests, native dependency closures, and Xcode identity.
          # This remains local evidence and never upgrades external status.
          if [[ -z "${ELMOS_JAVA21_HOME:-}" ]]; then
            export ELMOS_JAVA21_HOME="$JAVA_HOME"
          fi
          uv --directory engines/polyglot-route-engine sync --locked
          uv --directory engines/polyglot-route-engine run --locked pytest
          uv --directory engines/polyglot-route-engine run --locked ruff check src tests
          uv --directory engines/polyglot-route-engine run --locked mypy src
      - name: Verify all route packs and console contracts
        run: |
          python scripts/operations/validate_translation_route_matrix.py
          for route in routes/*/; do
            python scripts/batch29/run_route_gate.py "$route"
          done

  sql-dialect-engine:
    name: SQL Dialect Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked uv tool
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Verify SQL Dialect Engine
        working-directory: engines/sql-dialect-engine
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check src tests
          uv run mypy src

  typed-sql-transpiler:
    name: Typed SQL transpiler exact-runtime qualification
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install exact CPython and SQLite runtime
        env:
          ELMOS_POLYGLOT_ROUTE_CI_PROFILE: typed-sql
        run: scripts/toolchains/install_polyglot_route_ci_toolchains.sh
      - name: Install locked uv tool
        run: python3.14 -m pip install --disable-pip-version-check uv==0.11.16
      - name: Verify typed SQL transpiler exact-runtime qualification
        working-directory: engines/database-data-engine/sql-transpiler
        run: |
          uv sync --locked
          uv run --locked pytest
          uv run --locked ruff check src tests
          uv run --locked mypy src

  project-synthesis:
    name: Project Synthesis and operability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked uv tool
        run: python -m pip install --disable-pip-version-check uv==0.11.16
      - name: Verify installed Project Synthesis distribution boundary
        run: |
          python tooling/validate_project_synthesis_integration.py --require-packages |
            tee /tmp/elmos-project-synthesis-integration.txt
          grep -F "OK: 417 global Project Synthesis skills + 180 package-local Language Pack skills" \
            /tmp/elmos-project-synthesis-integration.txt
      - name: Verify Project Synthesis
        working-directory: engines/project-synthesis-engine
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check src tests
          uv run mypy src
      - name: Verify service operability contracts
        run: |
          uv run --with pyyaml python tooling/validate_runtime_operability.py
          uv run --with pyyaml python -m unittest discover -s tests/production-readiness -p 'test_*.py'
          uv run --with pyyaml python -m unittest discover -s scripts/operations -p 'test_*.py'
      - name: Verify three-line workflow protocol pack
        run: |
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/validate_verification_pack.py \
            verification-packs/elmos-three-line-workflow-protocol
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/run_verification_gate.py \
            verification-packs/elmos-three-line-workflow-protocol |
            tee /tmp/elmos-workflow-gate.txt
          grep -F "decision=NOT_CERTIFIED" /tmp/elmos-workflow-gate.txt
      - name: Verify project generation source and cloud evidence packs
        run: |
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/validate_verification_pack.py \
            verification-packs/elmos-project-generation-source-ingestion
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch35/run_verification_gate.py \
            verification-packs/elmos-project-generation-source-ingestion |
            tee /tmp/elmos-generation-source-gate.txt
          grep -F "decision=NOT_CERTIFIED" /tmp/elmos-generation-source-gate.txt
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python scripts/batch33/run_cloud_gate.py \
            cloud-packs/elmos-project-generation-cloud-run-handoff
      - name: Verify Batch 38-45 fail-closed toolkit
        run: |
          for batch in 38 39 40 41 42 43 44 45; do
            uv run --with 'jsonschema>=4.23' --with pyyaml \
              python scripts/mature_product_toolkit.py validate --batch "$batch"
            uv run --with 'jsonschema>=4.23' --with pyyaml \
              python -m unittest discover -s "tests/batch$batch" -p 'test_*.py'
          done
      - name: Verify Batch 38-45 toolkit extension and compatibility tests
        run: |
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python -m unittest tests.mature_product_toolkit_extensions_test
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python -m unittest tests.batch43_schema_compatibility_test
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python -m unittest tests.batch40_supply_chain_test
          uv run --with 'jsonschema>=4.23' --with pyyaml \
            python -m unittest discover -s tests -p 'mature_product_gate_test.py'
      - name: Refresh Batch 38-45 gap inventories
        run: |
          # Recompute every inventory and fail if a committed one is stale.
          # --allow-blocking keeps open gaps from failing the build: the point
          # of this step is that the work list is current, not that it is empty.
          for pack in mature-product-packs/batch*/*/; do
            batch=$(basename "$(dirname "$pack")" | tr -dc '0-9')
            uv run --with 'jsonschema>=4.23' --with pyyaml \
              python scripts/mature_product_toolkit.py gaps --batch "$batch" "$pack" --allow-blocking
          done
          git diff --exit-code -- 'mature-product-packs/**/gap-inventory.json' 'mature-product-packs/**/gap-report.md'
      - name: Verify Batch 43 schema compatibility check
        run: |
          python3 scripts/batch43_schema_compatibility_check.py \
            --root schemas --root contracts --root telemetry --output /tmp/b43-compat.json
      - name: Verify Batch 97-104 Skill distribution
        run: |
          if [[ -f elmos-codex-skills-batch97-104-complete/manifest.json ]]; then
            make batch97-104-skills
          else
            python tooling/validate_batch97_104_installed.py
            python -m unittest tests.test_batch97_104_installed
          fi
      - name: Verify Product closure and convergence distributions
        run: make product-closure-convergence-skills

  project-synthesis-acceptance:
    name: Eight-language synthesis acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.301"
      - name: Set up Node.js 26.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.0.0"
      - name: Set up Go 1.25
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          toolchain: "1.89.0"
          components: clippy,rustfmt
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "8.14.3"
      - name: Install exact Maven, PHP, and PostgreSQL toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential libpq-dev libssl-dev pkg-config
          scripts/toolchains/install_project_synthesis_ci_toolchains.sh
      - name: Install locked synthesis tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
          uv --directory engines/project-synthesis-engine sync --locked
      - name: Run exact starter-profile acceptance
        run: >-
          uv --directory engines/project-synthesis-engine run --locked
          python scripts/run_acceptance.py --require-all-toolchains
      - name: Run PostgreSQL JWT and OIDC production matrix
        run: >-
          uv --directory engines/project-synthesis-engine run --locked
          python scripts/run_production_matrix.py

  web-console:
    name: Web Console
    # Batch 32 formal packs carry a locked macOS arm64 Z3 4.16.0 binary.
    # Keep pack replay on the matching runner; the browser jobs below remain
    # real Playwright journeys and are not converted into a certification claim.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # setup-python does not publish 3.12.12 for the macOS 15 arm64
          # image; 3.12.10 is the pinned supported patch used by the route
          # jobs and is sufficient for the console validation scripts.
          python-version: "3.12.10"
      - name: Provision receipt-bound Node for Batch 32 replay
        env:
          ELMOS_POLYGLOT_ROUTE_CI_PROFILE: frontend-formal
        run: scripts/toolchains/install_polyglot_route_ci_toolchains.sh
      - name: Install locked pnpm tool
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
      - name: Install dependencies
        run: |
          uv --directory engines/polyglot-route-engine sync --locked --no-dev
          pnpm --dir engines/frontend-client-engine install --frozen-lockfile
          pnpm --dir apps/web-console install --frozen-lockfile
      - name: Build frontend client engine for Batch 32 replay
        run: pnpm --dir engines/frontend-client-engine build
      - name: Verify WeChat Native QR encoder
        run: pnpm --dir apps/web-console test:qr-code
      - name: Type-check and build
        run: pnpm --dir apps/web-console check
      - name: Verify every Batch 32 client pack
        run: |
          python scripts/batch32/validate_account_usage_corpora.py
          find client-packs -mindepth 1 -maxdepth 1 -type d -print | sort | while IFS= read -r pack; do
            python scripts/batch32/run_client_gate.py "$pack"
          done
      - name: Set up Node.js 26.0.0 for exact Translation execution
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.0.0"
      - name: Install locked pnpm tool for Translation execution
        run: npm install --global pnpm@10.12.4
      - name: Install Chromium for browser journeys
        run: pnpm --dir apps/web-console exec playwright install --with-deps chromium
      - name: Verify desktop and mobile browser journeys
        env:
          ELMOS_E2E_PORT: "3210"
          ELMOS_E2E_WEB_SERVER_MODE: development
          ELMOS_E2E_OUTPUT_DIR: test-results/ci-playwright
          ELMOS_E2E_REPORT_DIR: test-results/ci-playwright-report
        run: >-
          pnpm --dir apps/web-console exec playwright test
          --project=chromium
          --project=mobile-chromium
          e2e/console-usability.spec.ts
          e2e/core-business-lines-ui.spec.ts
          e2e/experience-quality.spec.ts
          e2e/maturity-status-ui.spec.ts
          e2e/operations-admin-ui.spec.ts
          e2e/pricing-ui.spec.ts
          e2e/repository-workspace-ui.spec.ts
          e2e/runtime-deployment-guide.spec.ts
          e2e/usage-meter-ui.spec.ts
      - name: Preserve browser journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-console-browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web-console/test-results/ci-playwright
            apps/web-console/test-results/ci-playwright-report

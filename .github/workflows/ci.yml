  precision-migration-b01-44:
    name: Precision Migration trust and coverage
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact captured 3.12.12 runtime is installed by the route
          # closure installer; this interpreter only bootstraps the scripts.
          python-version: "3.12.10"
          architecture: arm64
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Java 21.0.11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Provision exact Java and Python route closure
        env:
          ELMOS_POLYGLOT_ROUTE_CI_PROFILE: java-python
        run: scripts/toolchains/install_polyglot_route_ci_toolchains.sh
      - name: Install locked tools and web dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          uv --directory engines/polyglot-route-engine sync --locked --no-dev
          npm install --global pnpm@10.12.4
          pnpm --dir apps/web-console install --frozen-lockfile
      - name: Verify immutable package, adapters, evidence trust, coverage, and Batch 35 boundary
        run: make precision-migration-b01-44-check
      - name: Type-check and build the job API and Skills workspace
        run: pnpm --dir apps/web-console check

  web-console-generation:
    name: Project generation browser qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Python 3.12.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
      - name: Install locked browser and synthesis tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          npm install --global pnpm@10.12.4
      - name: Install dependencies
        run: |
          pnpm --dir engines/frontend-client-engine install --frozen-lockfile
          pnpm --dir apps/web-console install --frozen-lockfile
      - name: Type-check and build
        run: pnpm --dir apps/web-console check
      - name: Install exact browser engines
        run: pnpm --dir apps/web-console exec playwright install --with-deps chromium firefox webkit
      - name: Verify project generation across desktop and mobile browsers
        env:
          ELMOS_E2E_PORT: "3212"
          ELMOS_E2E_WEB_SERVER_MODE: development
          ELMOS_E2E_OUTPUT_DIR: test-results/ci-generation-browser-matrix
          ELMOS_E2E_REPORT_DIR: test-results/ci-generation-browser-matrix-report
        run: |
          ELMOS_UV_PATH="$(command -v uv)" \
            pnpm --dir apps/web-console exec playwright test \
              --workers=1 \
              --project=chromium \
              --project=firefox \
              --project=webkit \
              --project=mobile-chromium \
              --project=mobile-webkit \
              e2e/account-session-ui.spec.ts \
              e2e/generation-source-ingestion.spec.ts \
              e2e/generation-ui.spec.ts \
              e2e/runtime-deployment-guide.spec.ts
      - name: Preserve project generation browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-generation-browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web-console/test-results/ci-generation-browser-matrix
            apps/web-console/test-results/ci-generation-browser-matrix-report
          if-no-files-found: error
          retention-days: 30


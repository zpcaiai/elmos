schema_version: 1.0.0
ordinal: 34
name: elmos-structured-context-compaction
title: 结构化上下文压缩
objective: 把冗长历史转换为可验证、可恢复、带来源的任务状态，而不是不可追溯的普通摘要。
dependencies:
- elmos-context-pressure-monitor
- elmos-source-anchor-and-provenance
- elmos-context-integrity-and-loss-detection
inputs:
- 活动上下文快照
- 关键事实集合
- 压力状态
- pin/eviction 策略
outputs:
- 结构化压缩检查点
- 压缩后的装载计划
- 完整性报告
- 回滚引用
responsibilities:
- 定义 CompactionCheckpoint，强制包含目标、最新要求、约束、验收标准、决策、已完成/未完成工作、修改文件、测试、安全发现和来源。
- 将原始消息、工具结果和内容块外置到不可变存储，压缩对象只保存结构化事实、哈希和检索键。
- 对候选历史分区，禁止压缩系统安全规则、当前用户指令和被 pin 的 P0/P1 内容。
- 对每个压缩事实保留一到多个 source anchor，并标记事实状态、可信度、版本和冲突。
- 在替换活动上下文前执行完整性检查，比较关键事实集合与验收标准。
- 保留压缩算法、模型、提示模板、输入清单、输出和 token 节省量，以便复现。
- 支持分层压缩与多次压缩，避免摘要的摘要造成语义漂移。
- 失败时回滚到压缩前 ContextLoadPlan 和检查点。
deliverables:
- CompactionCheckpoint schema 与持久化
- 分区、压缩、事实对齐和完整性校验实现
- 原始历史外置与可追溯检索
- 压缩回滚和多轮漂移评测
acceptance:
- 压缩后目标、最新要求、约束、验收标准和待办完整率为100%
- 所有关键事实至少有一个有效来源锚点
- 原始内容仍可按哈希和定位符恢复
- 压缩失败不改变有效活动上下文
- 多轮压缩的事实漂移低于定义门槛且被自动检测
- 不得使用单段自由文本摘要替代结构化契约
data_entities:
- context_compaction_runs
- compaction_checkpoints
- compacted_fact_items
events:
- context.compaction.started
- context.compaction.completed
- context.compaction.failed
- context.compaction.rolled_back
metrics:
- compaction_ratio
- critical_fact_retention
- source_anchor_retention
- semantic_drift_score
failure_modes:
- latest instruction lost
- acceptance criteria omitted
- summary drift
- raw history unavailable
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

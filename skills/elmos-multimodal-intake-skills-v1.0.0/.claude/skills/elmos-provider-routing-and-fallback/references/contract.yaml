schema_version: 1.0.0
ordinal: 19
name: elmos-provider-routing-and-fallback
title: 解析与模型供应商路由
objective: 基于能力、隐私、准确率、成本、负载和时延选择 provider，并确保回退不改变数据治理边界。
dependencies: []
inputs:
- 任务需求、数据分类、预算、provider 状态
outputs:
- ProviderExecution、路由决策、结果
responsibilities:
- 定义 provider capability registry 和统一接口
- 实现策略路由、健康检查、限流、熔断、重试和 fallback chain
- 支持本地、私有和经授权云端模型层级
- 记录每次调用的版本、配置、token、时长、成本和质量
deliverables:
- ProviderRegistry、Router
- 策略配置与 provider 适配器
- 故障、限流、隐私禁止和成本预算测试
acceptance:
- 单 provider 故障不会导致无界重试
- 未经授权的数据不会回退到外部云模型
- 相同请求可复现所用 provider、版本和参数
- 路由决策和成本可审计
data_entities:
- provider_capabilities
- provider_executions
- provider_health
events:
- provider.selected
- provider.fallback
- provider.circuit_open
metrics:
- provider_success_rate
- fallback_rate
- cost_per_asset
failure_modes:
- 限流
- 模型下线
- 质量不足
- 隐私策略冲突
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

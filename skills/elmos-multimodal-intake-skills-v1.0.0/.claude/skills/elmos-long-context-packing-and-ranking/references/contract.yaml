schema_version: 1.0.0
ordinal: 32
name: elmos-long-context-packing-and-ranking
title: 长上下文装箱与排序
objective: 把有限活动窗口分配给最高价值、最新、可信且覆盖完整的证据，并提供可解释、确定、可回滚的装箱计划。
dependencies:
- elmos-context-budget-manager
- elmos-multimodal-token-accounting
- elmos-source-anchor-and-provenance
- elmos-repository-context-map
inputs:
- 任务目标与阶段
- 候选内容块
- 上下文预算
- 来源/版本/依赖元数据
outputs:
- ContextLoadPlan
- 上下文装载顺序
- 排除与压缩理由
- 覆盖报告
responsibilities:
- 建立候选内容池，保留 source anchor、版本、可信度、任务相关性、依赖距离、时效性和 token 成本。
- 将系统/安全策略、当前用户指令、不可违反约束、验收标准定义为 P0/P1 固定项。
- 结合关键词、向量、符号图、调用图、知识图谱、版本关系和历史决策进行混合排序。
- 执行语义去重、近重复合并、多样性约束和来源覆盖约束，防止单一文档挤占窗口。
- 采用预算感知装箱，为输出、工具调用、推理余量和安全 headroom 预留容量。
- 生成 ContextLoadPlan，列出纳入、排除、压缩和延迟加载项及理由。
- 在任务阶段、依赖图或失败证据变化时增量重排，而非盲目重建全部上下文。
- 用消融评测验证排序质量与关键事实召回率。
deliverables:
- ContextCandidate/ContextLoadPlan schema
- 混合排序、去重、多样性和预算装箱实现
- 可解释装载清单与调试界面
- 长仓库与多文档检索评测集
acceptance:
- P0/P1 内容在任何正常压缩或驱逐路径中都不被移除
- 装载总量不超过有效输入预算且保留输出与安全余量
- 关键需求、直接依赖、测试失败和安全发现召回率达到验收门槛
- 每个纳入或排除决定都有机器可读理由
- 相同快照与配置产生确定性计划
- 超大候选集处理不会退化为随机截断或按上传顺序截断
data_entities:
- context_candidates
- context_load_plans
- context_load_plan_items
events:
- context.plan.created
- context.plan.updated
- context.source.selected
- context.source.deferred
metrics:
- critical_fact_recall
- context_precision
- duplicate_token_ratio
- source_coverage_ratio
failure_modes:
- critical constraint evicted
- single source dominance
- stale version selected
- budget overflow
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

schema_version: 1.0.0
ordinal: 22
name: elmos-processing-cost-and-eta-estimation
title: 处理成本与机器 ETA
objective: 以历史遥测和实时阶段进度给出可校准 ETA，明确排除人工开发工期或人日。
dependencies:
- elmos-durable-processing-and-recovery
- elmos-multimodal-observability
inputs:
- 任务阶段、历史样本、资源价格
outputs:
- ETA、成本明细、校准记录
responsibilities:
- 分阶段采集队列、CPU/GPU、I/O、模型 token 和 provider 费用
- 按格式、大小、页数、音频时长和复杂度建立 ETA 模型
- 持续更新剩余时间、置信区间和预计完成时间
- 对预估、实际和偏差做版本化校准
deliverables:
- CostLedger、ETAEstimator
- 任务进度与成本 API
- 回放评估和校准报表
acceptance:
- 所有 ETA 指 Elmos 机器执行墙钟时间而非人工时间
- 进行中任务随真实进度更新 ETA
- 最终账单可按 asset、stage、provider 解释
- 估算误差被持续监控并有置信区间
data_entities:
- cost_ledger_entries
- eta_predictions
- eta_calibration_runs
events:
- eta.updated
- cost.accrued
- eta.calibration.completed
metrics:
- eta_mape
- cost_estimation_error
failure_modes:
- 冷启动无历史
- 价格变化
- 阶段卡住
- 样本漂移
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

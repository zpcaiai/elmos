schema_version: 1.0.0
package_version: 1.0.0
global_gates:
- id: G-01
  requirement: Exactly 50 canonical Skills and valid mirrors
  evidence: scripts/validate_package.py
- id: G-02
  requirement: No silent truncation or silent input omission
  evidence: long-context and package E2E
- id: G-03
  requirement: Critical source anchor coverage is 100%
  evidence: provenance report
- id: G-04
  requirement: No cross-tenant data leak
  evidence: isolation security suite
- id: G-05
  requirement: No archive sandbox escape or uncontrolled bomb
  evidence: archive attack corpus
- id: G-06
  requirement: No duplicate external effect/provider charge on recovery
  evidence: fault-injection ledger report
- id: G-07
  requirement: Machine wall-clock ETA and actuals are recorded
  evidence: runtime metrics
- id: G-08
  requirement: No secrets/passwords in logs, traces, events or prompts
  evidence: redaction scans
skills:
- ordinal: 1
  name: elmos-multimodal-input-orchestrator
  title: 统一多模态输入总控
  acceptance:
  - id: S01-01
    criterion: 同一幂等键不会创建重复任务或副作用
  - id: S01-02
    criterion: 单资产失败不阻塞同包其他资产，包状态准确反映部分就绪
  - id: S01-03
    criterion: 所有 READY 内容具备来源锚点和处理报告
  - id: S01-04
    criterion: 下游无需感知 PDF、Word、音频等原始格式
  required_deliverables:
  - 编排服务与端口适配器
  - 状态机、事件和数据库迁移
  - 跨模态端到端测试与运行手册
- ordinal: 2
  name: elmos-secure-resumable-upload
  title: 安全断点续传
  acceptance:
  - id: S02-01
    criterion: 任意分片重复上传不产生重复字节计费
  - id: S02-02
    criterion: 页面关闭重连后从已确认分片继续
  - id: S02-03
    criterion: 最终对象哈希不一致时不得进入解析
  - id: S02-04
    criterion: 跨租户无法猜测、读取或覆盖上传对象
  required_deliverables:
  - 上传 API/SDK 与状态迁移
  - 对象存储适配器和数据库迁移
  - 断网、乱序、重复分片和校验失败测试
- ordinal: 3
  name: elmos-file-type-detection-and-validation
  title: 文件类型识别与验证
  acceptance:
  - id: S03-01
    criterion: 仅改扩展名无法绕过识别
  - id: S03-02
    criterion: 未知格式不会被错误交给宽松解析器
  - id: S03-03
    criterion: 识别结果包含依据、置信度和注册表版本
  - id: S03-04
    criterion: 检测过程有资源上限且不会执行文件内容
  required_deliverables:
  - FileTypeDetector 接口与适配器
  - 格式注册表和决策规则
  - 伪扩展名、截断文件和 polyglot 文件测试
- ordinal: 4
  name: elmos-malware-quarantine-and-sandbox
  title: 恶意文件隔离与解析沙箱
  acceptance:
  - id: S04-01
    criterion: Office 宏、PDF JavaScript 和归档脚本在接入阶段绝不执行
  - id: S04-02
    criterion: 沙箱无法读取宿主机或其他租户数据
  - id: S04-03
    criterion: 超时/OOM 后主服务保持稳定
  - id: S04-04
    criterion: 隔离资产不能被普通预览、索引或模型读取
  required_deliverables:
  - QuarantineService 与 SandboxRunner
  - 安全策略和运行时配置
  - 恶意样本模拟、超时、OOM 和逃逸回归测试
- ordinal: 5
  name: elmos-audio-asr-and-diarization
  title: 音频识别与说话人分离
  acceptance:
  - id: S05-01
    criterion: 每个转录片段包含 start/end、speaker、language、confidence
  - id: S05-02
    criterion: 点击文本可跳转原音频位置
  - id: S05-03
    criterion: 长音频可断点恢复且重试不重复片段
  - id: S05-04
    criterion: 低置信度片段被明确标记
  required_deliverables:
  - AudioPipeline 与 provider 接口
  - audio_segments 数据模型和编辑 API
  - 清晰、噪声、中英混合和多说话人测试集
- ordinal: 6
  name: elmos-image-ocr-and-preprocessing
  title: 图片 OCR 与预处理
  acceptance:
  - id: S06-01
    criterion: OCR 块可精确回到原图 bounding box
  - id: S06-02
    criterion: 大图切片后坐标可还原到全图
  - id: S06-03
    criterion: 低置信度和不可读区域显式呈现
  - id: S06-04
    criterion: 预处理不会覆盖不可变原始资产
  required_deliverables:
  - ImagePreprocessor/OCRProvider 接口
  - OCRDocument 数据模型和纠错 API
  - 清晰、模糊、旋转、长截图和表格图片评测
- ordinal: 7
  name: elmos-visual-ui-understanding
  title: UI 截图理解
  acceptance:
  - id: S07-01
    criterion: 每个 UI 元素包含截图区域与层级关系
  - id: S07-02
    criterion: 事实识别与推断内容被区分
  - id: S07-03
    criterion: 生成代码由视觉回归验证而非只看编译
  - id: S07-04
    criterion: 不从单张截图臆造关键业务规则
  required_deliverables:
  - UIVisualIR schema 与解析服务
  - 截图到组件清单和页面需求的转换器
  - 多分辨率和视觉回归测试
- ordinal: 8
  name: elmos-diagram-and-architecture-understanding
  title: 图表与架构图理解
  acceptance:
  - id: S08-01
    criterion: 箭头方向和节点关系可追溯到原图
  - id: S08-02
    criterion: 无法确定的连线不会被强行确定
  - id: S08-03
    criterion: 导出后可重新渲染并做结构对比
  - id: S08-04
    criterion: 图模型可被架构和数据流工作流消费
  required_deliverables:
  - DiagramIR schema 与解析管线
  - 可导出 Mermaid、PlantUML、JSON 的转换器
  - 标准图、交叉线和手绘图评测
- ordinal: 9
  name: elmos-pdf-layout-table-parser
  title: PDF 版面与表格解析
  acceptance:
  - id: S09-01
    criterion: 所有内容块包含 page 和 bbox 或明确逻辑锚点
  - id: S09-02
    criterion: 扫描与原生页面可正确混用
  - id: S09-03
    criterion: 表格单元格关系不会被扁平化
  - id: S09-04
    criterion: 密码不会进入日志、普通字段或模型上下文
  required_deliverables:
  - PDFParser 适配器与 page/block/table 模型
  - 原生与 OCR 混合决策器
  - 多栏、跨页表格、扫描页、加密 PDF 测试
- ordinal: 10
  name: elmos-word-document-parser
  title: Word 文档解析
  acceptance:
  - id: S10-01
    criterion: 宏与嵌入可执行对象绝不运行
  - id: S10-02
    criterion: 用户可选择修订视图且输出可复现
  - id: S10-03
    criterion: 批注、删除和插入内容不被静默丢弃
  - id: S10-04
    criterion: 关键块可定位到段落、表格、书签或页面近似位置
  required_deliverables:
  - WordParser 与修订策略接口
  - WordBlock、Revision、Comment 模型
  - 复杂表格、批注、修订和旧 DOC 安全转换测试
- ordinal: 11
  name: elmos-markdown-text-log-parser
  title: Markdown、TXT 与日志解析
  acceptance:
  - id: S11-01
    criterion: 所有文本块保留行号范围
  - id: S11-02
    criterion: 代码块不会被当作系统命令执行
  - id: S11-03
    criterion: 重复日志可聚合但原始行仍可回查
  - id: S11-04
    criterion: 流式解析受内存上限约束
  required_deliverables:
  - TextParser/LogParser 适配器
  - line-range 来源锚点与日志事件模型
  - 多编码、超大文件、混合日志和恶意 Markdown 测试
- ordinal: 12
  name: elmos-unified-multimodal-content-ir
  title: 统一多模态内容 IR
  acceptance:
  - id: S12-01
    criterion: 任何解析器输出都能映射到统一 IR 且无关键结构丢失
  - id: S12-02
    criterion: 未知扩展字段可安全保留
  - id: S12-03
    criterion: 旧版本数据可迁移或兼容读取
  - id: S12-04
    criterion: 下游不需读取格式专有内部对象
  required_deliverables:
  - JSON Schema、语言类型和验证器
  - IR 版本迁移与兼容测试
  - 各解析器到 IR 的适配契约
- ordinal: 13
  name: elmos-source-anchor-and-provenance
  title: 来源锚点与证据链
  acceptance:
  - id: S13-01
    criterion: 关键需求与决策来源锚点覆盖率 100%
  - id: S13-02
    criterion: 锚点能解析到不可变原始资产或明确失效状态
  - id: S13-03
    criterion: 派生链包含处理版本与哈希
  - id: S13-04
    criterion: 任何压缩或融合不会删除证据引用
  required_deliverables:
  - SourceAnchor、ProvenanceEdge schema
  - 来源解析与预览 API
  - 锚点迁移和内容哈希完整性测试
- ordinal: 14
  name: elmos-multimodal-requirement-extraction
  title: 多模态需求提取
  acceptance:
  - id: S14-01
    criterion: 所有已接受需求具备来源锚点或用户新决策 ID
  - id: S14-02
    criterion: 推断字段与原文字段可区分
  - id: S14-03
    criterion: 矛盾需求不会被静默覆盖
  - id: S14-04
    criterion: 验收标准可被测试生成器直接消费
  required_deliverables:
  - Requirement schema 与提取流水线
  - 审阅 API 和需求变更历史
  - 跨模态需求评测集
- ordinal: 15
  name: elmos-multi-asset-content-fusion
  title: 多资产内容融合
  acceptance:
  - id: S15-01
    criterion: 重复内容不会在上下文中无意义占用多份
  - id: S15-02
    criterion: 来源差异仍可单独查看
  - id: S15-03
    criterion: 自动角色分类可被用户覆盖并审计
  - id: S15-04
    criterion: 融合结果不改变原始资产
  required_deliverables:
  - FusionService 与角色分类器
  - AssetRelation、EntityLink 模型
  - 重复、互补和矛盾资料融合测试
- ordinal: 16
  name: elmos-document-version-and-conflict-detection
  title: 文档版本与冲突检测
  acceptance:
  - id: S16-01
    criterion: 任何被覆盖陈述仍保留来源和版本
  - id: S16-02
    criterion: 未解决冲突不能被标记为已确定需求
  - id: S16-03
    criterion: 优先级规则可配置并有审计记录
  - id: S16-04
    criterion: 用户决策后能更新依赖需求和上下文
  required_deliverables:
  - VersionGraph、Conflict schema
  - 差异与冲突检测服务
  - 冲突审阅 UI、API 和测试集
- ordinal: 17
  name: elmos-human-review-and-correction
  title: 人工审阅与纠错
  acceptance:
  - id: S17-01
    criterion: 任何修正可回退并保留历史
  - id: S17-02
    criterion: 并发修改有乐观锁或等效控制
  - id: S17-03
    criterion: 低置信度结果可被批量定位
  - id: S17-04
    criterion: 批准修正后相关索引和需求一致更新
  required_deliverables:
  - ReviewTask、Correction 模型与 API
  - 音频、图片和文档审阅界面契约
  - 并发编辑、撤销和传播测试
- ordinal: 18
  name: elmos-prompt-injection-defense
  title: 多模态提示注入防护
  acceptance:
  - id: S18-01
    criterion: 文档内容不能修改系统策略或租户权限
  - id: S18-02
    criterion: 高风险动作必须经过独立授权或审批
  - id: S18-03
    criterion: 检测器失效时默认保持最小权限
  - id: S18-04
    criterion: 安全拦截有可审计原因且不泄露内部策略细节
  required_deliverables:
  - InjectionClassifier 与 trust metadata
  - 工具调用策略执行点
  - 跨模态红队样本与防绕过测试
- ordinal: 19
  name: elmos-provider-routing-and-fallback
  title: 解析与模型供应商路由
  acceptance:
  - id: S19-01
    criterion: 单 provider 故障不会导致无界重试
  - id: S19-02
    criterion: 未经授权的数据不会回退到外部云模型
  - id: S19-03
    criterion: 相同请求可复现所用 provider、版本和参数
  - id: S19-04
    criterion: 路由决策和成本可审计
  required_deliverables:
  - ProviderRegistry、Router
  - 策略配置与 provider 适配器
  - 故障、限流、隐私禁止和成本预算测试
- ordinal: 20
  name: elmos-storage-index-and-retrieval
  title: 存储、索引与检索
  acceptance:
  - id: S20-01
    criterion: 搜索结果始终返回来源锚点和权限上下文
  - id: S20-02
    criterion: 删除或保留策略能传播到所有派生索引
  - id: S20-03
    criterion: 索引失败可重放且不丢原始数据
  - id: S20-04
    criterion: 跨租户检索结果为零泄露
  required_deliverables:
  - StoragePorts 与索引作业
  - 查询 API 和一致性修复器
  - 索引延迟、删除传播、权限过滤和召回评测
- ordinal: 21
  name: elmos-durable-processing-and-recovery
  title: 持久任务执行与恢复
  acceptance:
  - id: S21-01
    criterion: 客户端断开不终止服务端任务
  - id: S21-02
    criterion: worker 崩溃后从检查点继续而非全部重做
  - id: S21-03
    criterion: 重复事件不会重复写入或重复收费
  - id: S21-04
    criterion: 取消和超时最终收敛到明确终态
  required_deliverables:
  - 工作流编排适配器
  - processing_checkpoints、attempts 数据模型
  - kill、restart、network partition、duplicate delivery 测试
- ordinal: 22
  name: elmos-processing-cost-and-eta-estimation
  title: 处理成本与机器 ETA
  acceptance:
  - id: S22-01
    criterion: 所有 ETA 指 Elmos 机器执行墙钟时间而非人工时间
  - id: S22-02
    criterion: 进行中任务随真实进度更新 ETA
  - id: S22-03
    criterion: 最终账单可按 asset、stage、provider 解释
  - id: S22-04
    criterion: 估算误差被持续监控并有置信区间
  required_deliverables:
  - CostLedger、ETAEstimator
  - 任务进度与成本 API
  - 回放评估和校准报表
- ordinal: 23
  name: elmos-multimodal-observability
  title: 多模态可观测性
  acceptance:
  - id: S23-01
    criterion: 单个任务可从上传追踪到下游交付
  - id: S23-02
    criterion: 日志不包含密码、密钥或未经批准的原文
  - id: S23-03
    criterion: 失败可按阶段、provider、文件类型聚合
  - id: S23-04
    criterion: 高基数标签受控且不拖垮监控系统
  required_deliverables:
  - Telemetry 规范与 instrumentation
  - 告警、SLO 规则和仪表盘定义
  - 链路完整性与日志泄露测试
- ordinal: 24
  name: elmos-multimodal-evaluation-framework
  title: 多模态评测框架
  acceptance:
  - id: S24-01
    criterion: 每个核心技能至少有正向、边界、失败和安全用例
  - id: S24-02
    criterion: 模型或解析器升级必须跑兼容评测
  - id: S24-03
    criterion: 评测数据不含未经授权生产隐私
  - id: S24-04
    criterion: 回归超过阈值会阻止发布或要求批准
  required_deliverables:
  - EvalRunner 与数据集清单
  - 确定性检查和 rubric grader
  - CI 报告、基线和回归阈值
- ordinal: 25
  name: elmos-multimodal-input-workbench-ui
  title: 多模态输入工作台 UI
  acceptance:
  - id: S25-01
    criterion: 用户能区分已上传、已解析、已索引、已装入上下文和仅可检索
  - id: S25-02
    criterion: 错误信息可操作且不泄露内部路径或敏感值
  - id: S25-03
    criterion: 大目录树和长转录保持可用性能
  - id: S25-04
    criterion: 刷新或重连后状态与服务端一致
  required_deliverables:
  - 前端页面与组件
  - SSE、WebSocket 状态同步层
  - 组件、E2E、视觉回归和可访问性测试
- ordinal: 26
  name: elmos-ingestion-api-and-sdk
  title: 接入 API 与 SDK
  acceptance:
  - id: S26-01
    criterion: API 版本升级不静默破坏现有客户端
  - id: S26-02
    criterion: 错误包含稳定代码、trace id 和可操作说明
  - id: S26-03
    criterion: Webhook 可验证、可重放且防重复
  - id: S26-04
    criterion: SDK 与服务端 schema 在 CI 中保持一致
  required_deliverables:
  - OpenAPI、AsyncAPI 规范
  - SDK、示例和鉴权中间件
  - 向后兼容、幂等、分页和 webhook 重放测试
- ordinal: 27
  name: elmos-data-retention-and-governance
  title: 数据保留与治理
  acceptance:
  - id: S27-01
    criterion: 用户删除请求能覆盖所有派生副本或明确受法律保留限制
  - id: S27-02
    criterion: 未经许可的资产不发送第三方模型
  - id: S27-03
    criterion: 租户可配置保留期限且新策略可追踪
  - id: S27-04
    criterion: 审计日志防篡改并与业务内容隔离
  required_deliverables:
  - GovernancePolicyEngine
  - retention、delete、export workflows
  - 删除传播、法律保留和跨租户测试
- ordinal: 28
  name: elmos-downstream-agent-integration
  title: 下游 Agent 集成
  acceptance:
  - id: S28-01
    criterion: 下游 Agent 不直接调用格式专有解析器
  - id: S28-02
    criterion: 每项关键实现可追溯到需求和源文件
  - id: S28-03
    criterion: 文件内提示不能授予工具权限
  - id: S28-04
    criterion: 结果回写不会篡改原始输入
  required_deliverables:
  - AgentContextBuilder 与 tool policy adapter
  - 下游工作流契约和示例
  - 需求到实现再到测试的端到端测试
- ordinal: 29
  name: elmos-codex-context-capacity-parity
  title: Codex 同级上下文容量
  acceptance:
  - id: S29-01
    criterion: 当前基线仅位于版本化能力配置而非业务代码常量
  - id: S29-02
    criterion: 总上传语料可超过窗口并通过检索使用
  - id: S29-03
    criterion: 任何模型调用在发送前完成预算校验
  - id: S29-04
    criterion: 超限不会丢弃用户最新要求或验收标准
  required_deliverables:
  - CodexParityPolicy 与配置
  - 兼容性检查 API、前端状态
  - 多模型容量切换和超限测试
- ordinal: 30
  name: elmos-context-budget-manager
  title: 上下文预算管理器
  acceptance:
  - id: S30-01

schema_version: 1.0.0
ordinal: 41
name: elmos-folder-tree-input
title: 文件夹树输入
objective: 将文件夹作为一等 InputPackage 接收，可靠保留目录、文件、空目录和项目边界，同时绝不采集客户端绝对路径。
dependencies:
- elmos-multimodal-input-orchestrator
- elmos-secure-resumable-upload
- elmos-project-package-manifest
inputs:
- 本地目录树
- 用户选择的根目录名称
- 租户上传和忽略策略
outputs:
- 标准化 FolderManifest
- 目录/文件条目
- 上传协商结果
- 树一致性报告
responsibilities:
- 实现目录选择、拖拽、多根目录和文件/文件夹混合输入的统一清单协议。
- 在客户端只生成相对于用户选择根目录的标准化路径，不上传 /Users、盘符或其他绝对路径。
- 保留同名文件的不同父目录、空目录、文件类型、大小、修改时间、哈希和可选权限元数据。
- 处理 Unicode 规范化、大小写敏感差异、超长路径、保留名、点文件和跨平台分隔符。
- 为目录、文件、符号链接和不支持条目建立显式 EntryType，不自动跟随链接。
- 先提交 manifest，再以文件哈希协商上传，支持去重与缺失文件校验。
- 在完成前验证服务端目录树与客户端清单一致，并生成差异。
- 将文件夹输入接入统一 InputSession、状态机、配额和审计。
deliverables:
- FolderManifest/FolderEntry schema
- 浏览器、CLI 和 SDK 的文件夹扫描/提交实现
- 目录树校验、差异和绝对路径泄露防护
- 跨平台路径与大目录测试
acceptance:
- 相对路径和目录层次100%保留，同名不同路径文件不覆盖
- 请求、日志、数据库和模型上下文中不出现用户本地绝对路径
- Unicode、大小写、点文件和空目录行为有明确且通过测试的规则
- 符号链接默认不跟随，目标仅作为安全元数据
- 客户端与服务端清单不一致时包不能被标为完整
- 多根目录可独立标记项目角色和根名称
data_entities:
- folder_input_sessions
- folder_entries
- folder_manifest_versions
events:
- folder.scan.started
- folder.manifest.submitted
- folder.tree.verified
- folder.input.completed
metrics:
- folder_manifest_match_rate
- absolute_path_leak_count
- duplicate_path_collision_count
- scan_files_per_second
failure_modes:
- absolute path captured
- path collision
- folder changed during upload
- unsupported filesystem entry
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

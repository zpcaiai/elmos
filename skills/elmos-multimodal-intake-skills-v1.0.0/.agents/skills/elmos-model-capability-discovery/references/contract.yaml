schema_version: 1.0.0
ordinal: 39
name: elmos-model-capability-discovery
title: 模型能力发现与注册
objective: 用版本化能力注册表取代散落硬编码，使上下文、路由、费用和兼容判断基于可审计快照。
dependencies: []
inputs:
- 供应商模型元数据
- 管理员策略
- 实测探测结果
- 租户可用模型范围
outputs:
- ModelCapabilitySnapshot
- 模型兼容矩阵
- 能力变化事件
- 历史能力快照
responsibilities:
- 定义 ModelCapabilitySnapshot，包含 provider、model id、版本、context window、max output、输入模态、工具能力、价格与限制。
- 从官方/供应商接口、管理员配置或经批准的探测任务同步能力，并记录来源、时间和可信等级。
- 区分声明能力、实测能力与租户策略限制，取三者的安全交集。
- 在模型别名指向新版本、能力变化或配置过期时触发重新发现和影响分析。
- 向 Context Budget Manager、路由器、Token计量和前端提供一致查询接口。
- 禁止把 Codex 同级基线值散落在业务代码；基线只作为带日期的配置/测试夹具。
- 在能力未知、冲突或过期时采取保守限制并提示管理员。
- 建立兼容性矩阵与回归探测，验证上下文和输出边界。
deliverables:
- ModelCapabilitySnapshot schema 与注册表
- 供应商适配器、管理员覆写和缓存刷新
- 能力查询/兼容判断 API 与事件
- 边界探测和配置漂移测试
acceptance:
- 当前 Codex 对齐基线通过注册表配置，升级无需修改业务逻辑
- 每个能力值有来源、获取时间、版本和可信状态
- 上下文窗口和最大输出分开建模
- 未知或过期能力不会被当作无限制
- 模型切换会触发预算重算和兼容性检查
- 能力快照可回滚并能解释历史任务当时采用的限制
data_entities:
- model_capabilities
- model_capability_snapshots
- model_capability_sources
- model_probe_runs
events:
- model.capability.discovered
- model.capability.changed
- model.capability.expired
- model.compatibility.failed
metrics:
- capability_freshness_seconds
- unknown_capability_count
- probe_success_rate
- configuration_drift_count
failure_modes:
- stale context window
- alias changed silently
- provider metadata conflict
- unsafe admin override
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

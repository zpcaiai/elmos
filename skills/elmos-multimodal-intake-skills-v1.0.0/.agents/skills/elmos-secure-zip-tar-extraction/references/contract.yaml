schema_version: 1.0.0
ordinal: 44
name: elmos-secure-zip-tar-extraction
title: 安全 ZIP/TAR 解压
objective: 在不执行任何内容的前提下对归档先检查后解压，产生可验证清单并隔离所有危险条目。
dependencies:
- elmos-malware-quarantine-and-sandbox
- elmos-archive-bomb-and-path-traversal-defense
- elmos-project-package-manifest
inputs:
- 原始归档对象
- 归档/租户安全策略
- 可选短期密码句柄
outputs:
- 安全解压对象集
- 归档检查报告
- 解压后 manifest
- 隔离/拒绝条目
responsibilities:
- 通过扩展名、MIME 和文件魔数识别 ZIP/TAR/GZIP 及组合格式，拒绝类型伪装。
- 先流式检查目录、声明大小、条目类型、嵌套归档和加密状态，再决定是否解压。
- 在无网络、只读基础镜像、受限CPU/内存/磁盘/进程和硬超时的沙箱中解压。
- 逐条执行安全路径解析、配额、压缩比、链接和特殊文件策略；不得先写入再检查。
- 默认不创建或跟随符号链接/硬链接，不创建设备、FIFO、socket 或 setuid 条目。
- 加密包仅接受用户提供密码，密码放入短期秘密通道，不落普通日志/数据库/模型上下文。
- 每层嵌套归档重新检查；默认只自动展开第一层，深层需策略或用户批准。
- 完成后计算内容哈希、构建解压清单、重新恶意扫描并原子发布到隔离对象区。
deliverables:
- ZIP/TAR/TAR.GZ/TGZ/GZIP 流式检查与解压适配器
- 隔离沙箱和资源限制配置
- 加密密码短期秘密处理
- 恶意归档语料与跨平台回归测试
acceptance:
- 支持格式的正常归档正确展开并保留目录
- 归档处理期间不执行脚本、宏、安装钩子、Dockerfile 或二进制
- 所有写入目标在写入前确认位于沙箱根内
- 密码不出现在普通日志、持久明文、trace 或模型上下文
- 嵌套归档每层重新扫描并受累计限额
- 任一危险条目不会造成沙箱外文件创建或主机访问
data_entities:
- archive_inspections
- archive_extraction_jobs
- archive_entries
- archive_password_sessions
events:
- archive.inspection.started
- archive.password.required
- archive.extraction.started
- archive.extraction.completed
- archive.entry.quarantined
metrics:
- archive_extraction_success_rate
- sandbox_escape_count
- password_leak_count
- extracted_bytes_per_second
failure_modes:
- unsupported method
- corrupt archive
- password invalid
- sandbox resource exceeded
- dangerous entry found
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

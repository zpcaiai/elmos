schema_version: 1.0.0
ordinal: 50
name: elmos-project-package-preview-and-review-ui
title: 项目包预览与审查界面
objective: 提供透明、可操作的项目包审查工作台，让用户了解系统实际接收、排除、隔离和将要加载的内容。
dependencies:
- elmos-multimodal-input-workbench-ui
- elmos-project-package-manifest
- elmos-project-root-language-framework-detection
- elmos-ignore-generated-vendored-file-classification
inputs:
- PackageManifest/分析视图
- 项目画像
- 安全发现
- 上传/解压/索引进度
outputs:
- 可交互审查界面
- 用户项目角色与覆盖配置
- 提交确认
- 审计事件
responsibilities:
- 展示虚拟化目录树、文件数、原始/预计展开大小、项目根、语言、框架、构建系统和处理状态。
- 突出嵌套归档、大文件、二进制、生成/第三方、敏感信息、恶意条目、失败和低置信度识别。
- 允许设置主/辅助/参考项目、文档目录、测试数据、历史版本和禁止模型读取区域。
- 允许预览并版本化 .elmosignore/分析视图覆盖，但安全隔离不可被普通UI覆盖。
- 对加密归档提供安全密码输入，前端不得回显、持久化或写入遥测。
- 显示上传、检查、解压、扫描、分类、索引的真实进度、机器剩余时间、成本和部分就绪状态。
- 清晰区分：已上传、已解析、已索引、当前上下文已加载、可检索但未加载、隔离、失败。
- 所有用户操作具备权限、审计、可撤销或二次确认，并通过无障碍与大目录性能测试。
deliverables:
- 项目包预览页面与虚拟化目录树
- 项目角色、分析视图和模型读取权限交互
- 安全发现/低置信度/部分就绪状态组件
- 无障碍、前端安全、10万条目性能和端到端测试
acceptance:
- 用户能在提交前准确看到系统纳入、排除、隔离和未完成的内容
- 10万级目录树不一次性渲染全部节点且交互满足SLO
- 密码、密钥和被遮蔽值不进入前端日志、分析或错误追踪
- 安全隔离不能通过普通选择框解除
- PARTIALLY_READY 不会被展示为完整完成，下游状态清楚
- 每项用户覆盖可追溯、可撤销并生成新分析视图
data_entities:
- package_review_sessions
- package_review_overrides
- package_model_access_rules
events:
- package.review.opened
- package.review.override.saved
- package.review.submitted
- package.review.cancelled
metrics:
- review_completion_rate
- large_tree_render_p95_ms
- unsafe_override_count
- status_misrepresentation_count
failure_modes:
- tree freezes browser
- secret shown in telemetry
- quarantine bypassed
- partial readiness hidden
cross_cutting_invariants:
- immutable_original_assets
- tenant_isolation
- source_provenance
- idempotent_durable_execution
- no_silent_truncation
- untrusted_content_not_instructions
- machine_wall_clock_eta_not_human_effort
- tests_and_evidence_required_before_completion

name: Elmos Database Contract

on:
  workflow_call:
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/validate_database_design.py'
      - 'deploy/helm/elmos/**'
      - 'deploy/local/docker-compose.yml'
      - '.github/workflows/database-ci.yml'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/validate_database_design.py'
      - 'deploy/helm/elmos/**'
      - '.github/workflows/database-ci.yml'

permissions:
  contents: read

env:
  FLYWAY_IMAGE: redgate/flyway:11-alpine
  POSTGRES_USER: elmos
  POSTGRES_PASSWORD: elmos-ci-password
  POSTGRES_DB: elmos

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pyyaml jsonschema
      - run: python3 scripts/validate_database_design.py
      - run: python3 scripts/validate_bundle.py
      - name: Shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

  postgres-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: elmos
          POSTGRES_PASSWORD: elmos-ci-password
          POSTGRES_DB: elmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elmos -d elmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Migrate empty database
        run: |
          docker run --rm --network host \
            -v "$PWD/database/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/elmos \
            -e FLYWAY_USER="$POSTGRES_USER" \
            -e FLYWAY_PASSWORD="$POSTGRES_PASSWORD" \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            -e FLYWAY_VALIDATE_MIGRATION_NAMING=true \
            -e FLYWAY_CLEAN_DISABLED=true \
            "$FLYWAY_IMAGE" migrate

      - name: Validate migration checksums
        run: |
          docker run --rm --network host \
            -v "$PWD/database/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/elmos \
            -e FLYWAY_USER="$POSTGRES_USER" \
            -e FLYWAY_PASSWORD="$POSTGRES_PASSWORD" \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            "$FLYWAY_IMAGE" validate

      - name: Apply production-style role hardening
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/database/roles:/roles:ro" \
            postgres:${{ matrix.postgres }}-alpine \
            psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -f /roles/roles-and-grants.example.sql

      - name: Verify role and function-owner hardening
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/database/queries:/queries:ro" \
            postgres:${{ matrix.postgres }}-alpine \
            psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -f /queries/role_hardening_check.sql

      - name: Database invariants
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -v "$PWD/database/tests:/tests:ro" \
            postgres:${{ matrix.postgres }}-alpine \
            psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -f /tests/invariants.sql

      - name: Schema inventory
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:${{ matrix.postgres }}-alpine \
            psql -At -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "select count(*) from information_schema.tables where table_schema in ('core','exec','artifact','analysis','generation','transform','verify','metering','cache','integration','learning','ops','audit') and table_type='BASE TABLE';"

  migration-image:
    runs-on: ubuntu-latest
    needs: [static-contract, postgres-matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/migration-image/Dockerfile
          push: false
          tags: elmos-migrate:test
          build-args: |
            FLYWAY_BASE_IMAGE=${{ env.FLYWAY_IMAGE }}

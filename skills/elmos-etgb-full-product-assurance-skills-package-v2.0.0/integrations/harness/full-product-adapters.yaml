schema_version: '2.0'
contract_id: elmos.etgb.full-product-adapter-catalog
failure_mode: fail-closed
release_rules:
  unavailable_adapter_count: 0
  unresolved_environment_profile_count: 0
  hidden_test_authority_isolated: true
  exact_toolchain_and_provider_revisions_required: true
  allow_unavailable_in_release: false
common_requirements:
- tenant-bound environment and artifact authority
- idempotency keys on every mutating phase
- lease, generation and fencing validation
- durable phase checkpoint and resume compatibility
- raw evidence persisted before normalization
- OpenTelemetry trace correlation from UI/API through worker and provider
- cleanup receipt without deleting sealed evidence

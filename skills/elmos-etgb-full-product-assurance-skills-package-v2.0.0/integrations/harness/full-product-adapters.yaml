  status: implementation-required
  phases:
  - prepare
  - seed
  - execute
  - observe
  - negative-or-fault
  - recover
  - assert
  - publish-evidence
  required_oracle: identity-policy-security-session-and-audit
  conformance_profiles:
  - nominal
  - boundary
  - negative-security
  - concurrent-recovery
  release_blocking: true

schema_version: '2.0'
model_id: ETGB-FULL-PRODUCT-COVERAGE-2.0
definition: 100% means every required matrix cell has at least the declared variants and Oracle classes.
business_lines:
  spring-modernization:
    matrix: matrices/spring-modernization.yaml
    dimensions:
    - archetype
    - feature
    - variant
    required_variants: 2
  cross-language:
    matrix: matrices/cross-language.yaml
    dimensions:
    - pair
    - feature
    - variant
    required_variants: 2
  project-generation:
    matrix: matrices/project-generation.yaml
    dimensions:
    - stack
    - template-or-change
    - deployment-or-mode
    required_variants: 1
  sql-conversion:
    matrix: matrices/sql-conversion.yaml
    dimensions:
    - pair
    - feature
    - variant
    required_variants: 2
  cross-cutting:
    matrix: matrices/cross-cutting.yaml
    dimensions:
    - business-line
    - scenario
    - fault-position
    required_variants: 2
mandatory_oracle_classes:
- static
- build
- behavior
- state-side-effect
- security
- performance
- disclosure
mandatory_test_techniques:
- example-based
- property-based
- differential
- metamorphic
- fuzz
- mutation
- fault-injection
- temporal-hidden
mandatory_evidence:
- input-digest
- source-commit
- toolchain-digest
- model-version
- skill-version
- commands
- stdout-stderr
- oracle-results
- cost
- wall-clock
- artifacts-digest
required_matrices:
- matrices/spring-modernization.yaml
- matrices/cross-language.yaml
- matrices/project-generation.yaml
- matrices/sql-conversion.yaml
- matrices/full-product.yaml
- matrices/product-journeys.yaml
- matrices/standards-controls.yaml
- matrices/cross-cutting.yaml
- matrices/feature-registry.yaml
hard_gates:
- Every declared feature must have at least one concrete test case.
- Every concrete test case must resolve to a declared adapter or an offline reference adapter.
- P0 features require nominal, boundary, negative-security and concurrent-recovery coverage where applicable.
- Critical cross-domain journeys require financial, security, state, artifact and audit reconciliation.
- Unavailable adapters are release blockers; --allow-unavailable is never permitted in release profiles.
- Hidden tests and generation environments must use separate authority domains.
- No standards profile result may be represented as accredited or legal certification.

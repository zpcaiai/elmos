apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: tenant-policy-aware-retrieval
  version: 3.0.0
  pack: 03-retrieval-context-engineering
  priority: P0
  owner: retrieval-platform-team
spec:
  description: 在检索前执行租户、项目、角色、地域和敏感级别权限裁剪。
  kernel: K3 Retrieval and Context Kernel
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: task contract
    required: true
  - name: semantic graph
    required: true
  - name: knowledge objects
    required: true
  - name: token budget
    required: true
  - name: policy context
    required: true
  outputs:
  - name: ranked evidence
    contentAddressed: true
  - name: context package
    contentAddressed: true
  - name: citation map
    contentAddressed: true
  - name: retrieval trace
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - search.lexical
    - search.vector
    - graph.query
    - reranker.score
    - context.pack
    defaultDeny: true
  evidence:
    requiredGates:
    - provenance-bound
    - tenant-authorized
    - version-compatible
    - budget-respected
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - retrieval-context
  capabilityTags:
  - 03-retrieval-context-engineering
  - aware
  - policy
  - retrieval
  - retrieval-context
  - tenant
  triggers:
  - 任务需要：在检索前执行租户、项目、角色、地域和敏感级别权限裁剪。
  - 任务属于 retrieval-context 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - policy-contract
  - evidence-contract
  invariants:
  - provenance-bound
  - tenant-authorized
  - version-compatible
  - budget-respected
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true
  dependencySemantics: bootstrap-dag

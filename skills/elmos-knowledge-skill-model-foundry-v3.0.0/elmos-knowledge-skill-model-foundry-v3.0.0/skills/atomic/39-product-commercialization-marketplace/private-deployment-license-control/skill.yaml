apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: private-deployment-license-control
  version: 3.0.0
  pack: 39-product-commercialization-marketplace
  priority: P0
  owner: commercial-platform-team
spec:
  description: 支持离线许可证、容量、模型与 Skill 授权、审计、续期和防误停。
  kernel: K1 Commercial Control Plane
  riskClass: high
  exposure: atomic-registry-only
  businessLines:
  - product-commercialization
  capabilityTags:
  - 39-product-commercialization-marketplace
  - control
  - deployment
  - license
  - private
  - product-commercialization
  triggers:
  - 任务明确要求：支持离线许可证、容量、模型与 Skill 授权、审计、续期和防误停。
  - 任务属于 product-commercialization，需要仓库级、可重放、带证据和回滚的执行。
  - 注册表确认 private-deployment-license-control 与目标技术栈、版本、租户和风险相容。
  negativeTriggers:
  - 仅询问概念或写作，不访问仓库、数据、环境或工具。
  - 没有租户授权、版本锁定、基线、验收标准或验证环境。
  - 目标是绕过测试、权限、签名、证据、审计或回滚门。
  - 已有更窄且风险更低的确定性 Skill 能完整处理任务。
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  - baseline.snapshotAvailable == true
  - evidence.serviceAvailable == true
  inputs:
  - name: task contract
    required: true
  - name: tenant and repository identity
    required: true
  - name: version-pinned environment
    required: true
  - name: acceptance and evidence obligations
    required: true
  - name: offering, entitlement, pricing and metering policy
    required: true
  outputs:
  - name: execution plan
    contentAddressed: true
  - name: versioned artifacts or patch set
    contentAddressed: true
  - name: verification and evidence bundle
    contentAddressed: true
  - name: risk, cost and machine wall-clock report
    contentAddressed: true
  - name: rollback or compensation record
    contentAddressed: true
  workflow:
  - define-offering-and-entitlement
  - estimate-and-reserve
  - meter-and-deliver
  - reconcile-and-settle
  - handle-sla-and-refund
  - analyze-margin-and-demand
  - promote-or-retire
  tools:
    allowed:
    - entitlement.evaluate
    - metering.query
    - wallet.reserve
    - billing.settle
    - marketplace.publish
    - risk.score
    - evidence.write
    defaultDeny: true
    parameterValidationRequired: true
    environmentOwnedAuthority: true
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  - feature-entitlement-and-license
  - usage-billing-reconciliation
  - commercial-margin-and-unit-economics
  invariants:
  - entitlement-correct
  - usage-reconciled
  - billing-auditable
  - tenant-data-isolated
  - unit-economics-acceptable
  - tenant-boundary-preserved
  - source-and-target-traceable
  - no-hidden-test-weakening
  - no-evidence-fabrication
  - machine-wall-clock-recorded
  failureModes:
  - unsupported-source-or-target-version
  - insufficient-semantic-or-contract-coverage
  - deterministic-verification-failure
  - security-privacy-or-license-policy-failure
  - performance-or-capacity-regression
  - rollback-or-recovery-evidence-missing
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
    maxUnverifiedSideEffects: 0
  evidence:
    requiredGates:
    - entitlement-correct
    - usage-reconciled
    - billing-auditable
    - tenant-data-isolated
    - unit-economics-acceptable
    minimumLevel: E3
    sourceBindingRequired: true
    independentReplayRequired: true
  rollback:
    required: true
    strategy: restore-versioned-checkpoint-and-compensate-side-effects
    rehearsalRequired: false
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
    minimumDatasetTier: Gold
    humanAcceptanceRequired: false
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
    emitProgress: true
    emitEvidenceLineage: true
    sensitiveContentDefault: redacted
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: transaction-and-data-equivalence
  version: 3.0.0
  pack: 09-evaluation-proof-certification
  priority: P0
  owner: verification-team
spec:
  description: 验证事务边界、隔离、锁、回滚、幂等和最终数据一致性。
  kernel: K8 Formal Assurance and Evidence
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: candidate output
    required: true
  - name: trace
    required: true
  - name: repository snapshot
    required: true
  - name: policy
    required: true
  - name: baseline
    required: true
  outputs:
  - name: scores
    contentAddressed: true
  - name: counterexamples
    contentAddressed: true
  - name: evidence bundle
    contentAddressed: true
  - name: certification decision
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - compiler.run
    - test.run
    - analyzer.run
    - prover.run
    - grader.score
    defaultDeny: true
  evidence:
    requiredGates:
    - independent-grader
    - evidence-addressable
    - no-critical-regression
    - rollback-ready
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - evaluation-certification
  capabilityTags:
  - 09-evaluation-proof-certification
  - data
  - equivalence
  - evaluation-certification
  - transaction
  triggers:
  - 任务需要：验证事务边界、隔离、锁、回滚、幂等和最终数据一致性。
  - 任务属于 evaluation-certification 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - independent-grader
  - evidence-addressable
  - no-critical-regression
  - rollback-ready
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

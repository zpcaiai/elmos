apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: capability-gap-and-unknown-mining
  version: 3.0.0
  pack: 16-self-evolution-release-engineering
  priority: P1
  owner: release-engineering-team
spec:
  description: 从失败、人工接管、低置信、客户需求和未覆盖证据中发现能力缺口。
  kernel: Learning Flywheel and Release Kernel
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: failure clusters
    required: true
  - name: quality metrics
    required: true
  - name: research signals
    required: true
  - name: release candidate
    required: true
  outputs:
  - name: improvement proposal
    contentAddressed: true
  - name: new skill or dataset
    contentAddressed: true
  - name: certified release
    contentAddressed: true
  - name: rollback decision
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - gap.mine
    - experiment.run
    - release.assemble
    - canary.evaluate
    - rollback.execute
    defaultDeny: true
  evidence:
    requiredGates:
    - causal-evidence
    - no-eval-leakage
    - independent-certification
    - reversible-release
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - self-evolution-release
  capabilityTags:
  - 16-self-evolution-release-engineering
  - capability
  - gap
  - mining
  - self-evolution-release
  - unknown
  triggers:
  - 任务需要：从失败、人工接管、低置信、客户需求和未覆盖证据中发现能力缺口。
  - 任务属于 self-evolution-release 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - causal-evidence
  - no-eval-leakage
  - independent-certification
  - reversible-release
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: standard
    deprecationPolicyRequired: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: customer-acceptance-report
  version: 3.0.0
  pack: 13-commercial-multitenant-platform
  priority: P0
  owner: commercial-platform-team
spec:
  description: 输出需求覆盖、测试、证据、未决风险、环境和交付物清单。
  kernel: Commercial Control Plane
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: tenant configuration
    required: true
  - name: contract
    required: true
  - name: usage event
    required: true
  - name: deployment profile
    required: true
  outputs:
  - name: entitlement decision
    contentAddressed: true
  - name: invoice record
    contentAddressed: true
  - name: acceptance pack
    contentAddressed: true
  - name: support bundle
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - tenant.manage
    - entitlement.check
    - wallet.reserve
    - billing.reconcile
    - support.export
    defaultDeny: true
  evidence:
    requiredGates:
    - tenant-isolated
    - usage-reconciled
    - contract-respected
    - supportable
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - commercial-platform
  capabilityTags:
  - 13-commercial-multitenant-platform
  - acceptance
  - commercial-platform
  - customer
  - report
  triggers:
  - 任务需要：输出需求覆盖、测试、证据、未决风险、环境和交付物清单。
  - 任务属于 commercial-platform 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - tenant-isolated
  - usage-reconciled
  - contract-respected
  - supportable
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

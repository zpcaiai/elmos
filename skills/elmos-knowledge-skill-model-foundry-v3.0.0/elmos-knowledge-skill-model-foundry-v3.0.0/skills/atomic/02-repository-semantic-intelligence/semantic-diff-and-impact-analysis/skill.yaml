apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: semantic-diff-and-impact-analysis
  version: 3.0.0
  pack: 02-repository-semantic-intelligence
  priority: P0
  owner: semantic-intelligence-team
spec:
  description: 比较两个版本的 API、行为、数据、依赖和风险变化，而非仅文本差异。
  kernel: K2 Repository Semantic Compiler
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: normalized repository artifact
    required: true
  - name: build metadata
    required: true
  - name: runtime trace
    required: true
  - name: test result
    required: true
  outputs:
  - name: semantic graph
    contentAddressed: true
  - name: architecture model
    contentAddressed: true
  - name: semantic diff
    contentAddressed: true
  - name: confidence report
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - parser.run
    - compiler.query
    - graph.write
    - symbol.resolve
    - trace.correlate
    defaultDeny: true
  evidence:
    requiredGates:
    - parse-coverage
    - symbol-resolution-threshold
    - graph-consistency
    - source-map-complete
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - repository-intelligence
  capabilityTags:
  - 02-repository-semantic-intelligence
  - analysis
  - diff
  - impact
  - repository-intelligence
  - semantic
  triggers:
  - 任务需要：比较两个版本的 API、行为、数据、依赖和风险变化，而非仅文本差异。
  - 任务属于 repository-intelligence 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - parse-coverage
  - symbol-resolution-threshold
  - graph-consistency
  - source-map-complete
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: proof-carrying-skill
  version: 3.0.0
  pack: 05-skill-foundry-runtime
  priority: P0
  owner: skill-foundry-team
spec:
  description: 要求 Skill 输出可机器验证的证明义务、测试结果、未决风险和回滚信息。
  kernel: K5 Skill Foundry and Runtime
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: runbook
    required: true
  - name: experience episodes
    required: true
  - name: task contract
    required: true
  - name: semantic IR
    required: true
  - name: policy context
    required: true
  outputs:
  - name: skill package
    contentAddressed: true
  - name: activation rules
    contentAddressed: true
  - name: workflow DAG
    contentAddressed: true
  - name: evidence bundle
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - skill.registry
    - workflow.execute
    - sandbox.run
    - policy.evaluate
    - eval.run
    defaultDeny: true
  evidence:
    requiredGates:
    - trigger-eval-pass
    - tool-permission-bounded
    - evidence-complete
    - rollback-tested
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - skill-runtime
  capabilityTags:
  - 05-skill-foundry-runtime
  - carrying
  - proof
  - skill
  - skill-runtime
  triggers:
  - 任务需要：要求 Skill 输出可机器验证的证明义务、测试结果、未决风险和回滚信息。
  - 任务属于 skill-runtime 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - trigger-eval-pass
  - tool-permission-bounded
  - evidence-complete
  - rollback-tested
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: tenant-key-and-cache-isolation
  version: 3.0.0
  pack: 11-security-privacy-compliance
  priority: P0
  owner: security-governance-team
spec:
  description: 确保对象、向量、缓存、Adapter、Checkpoint 和备份按租户隔离。
  kernel: Cross-Cutting Trust Plane
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: identity
    required: true
  - name: request context
    required: true
  - name: artifact provenance
    required: true
  - name: data classification
    required: true
  - name: policy profile
    required: true
  outputs:
  - name: policy decision
    contentAddressed: true
  - name: audit event
    contentAddressed: true
  - name: security evidence
    contentAddressed: true
  - name: incident action
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - identity.verify
    - policy.evaluate
    - sandbox.enforce
    - artifact.verify
    - audit.write
    defaultDeny: true
  evidence:
    requiredGates:
    - least-privilege
    - tenant-isolation
    - signed-artifact
    - audit-complete
    - critical-risk-zero
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - security-privacy
  capabilityTags:
  - 11-security-privacy-compliance
  - cache
  - isolation
  - key
  - security-privacy
  - tenant
  triggers:
  - 任务需要：确保对象、向量、缓存、Adapter、Checkpoint 和备份按租户隔离。
  - 任务属于 security-privacy 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - least-privilege
  - tenant-isolation
  - signed-artifact
  - audit-complete
  - critical-risk-zero
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

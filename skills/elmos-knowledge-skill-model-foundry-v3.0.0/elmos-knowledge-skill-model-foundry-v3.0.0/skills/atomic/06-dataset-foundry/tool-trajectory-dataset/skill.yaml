apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: tool-trajectory-dataset
  version: 3.0.0
  pack: 06-dataset-foundry
  priority: P1
  owner: dataset-platform-team
spec:
  description: 标准化多轮工具调用、参数、环境反馈和终止状态用于 Agent 训练。
  kernel: K6 Dataset Foundry
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: experience episode
    required: true
  - name: knowledge object
    required: true
  - name: human feedback
    required: true
  - name: verification evidence
    required: true
  outputs:
  - name: versioned dataset
    contentAddressed: true
  - name: dataset card
    contentAddressed: true
  - name: lineage graph
    contentAddressed: true
  - name: training eligibility decision
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - dataset.build
    - lineage.emit
    - pii.redact
    - license.check
    - eval.freeze
    defaultDeny: true
  evidence:
    requiredGates:
    - rights-cleared
    - tenant-safe
    - deduplicated
    - split-safe
    - quality-threshold
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - dataset-foundry
  capabilityTags:
  - 06-dataset-foundry
  - dataset
  - dataset-foundry
  - tool
  - trajectory
  triggers:
  - 任务需要：标准化多轮工具调用、参数、环境反馈和终止状态用于 Agent 训练。
  - 任务属于 dataset-foundry 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - rights-cleared
  - tenant-safe
  - deduplicated
  - split-safe
  - quality-threshold
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: standard
    deprecationPolicyRequired: true

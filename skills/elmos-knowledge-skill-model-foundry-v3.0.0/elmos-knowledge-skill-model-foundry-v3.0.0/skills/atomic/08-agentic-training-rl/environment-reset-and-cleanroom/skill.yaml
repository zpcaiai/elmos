apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: environment-reset-and-cleanroom
  version: 3.0.0
  pack: 08-agentic-training-rl
  priority: P0
  owner: agent-training-team
spec:
  description: 确保每次 Rollout 从已知状态开始，并检测跨任务状态和答案泄漏。
  kernel: K7 Private Model Foundry / Agent Learning
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: repository environment
    required: true
  - name: task
    required: true
  - name: tools
    required: true
  - name: reward functions
    required: true
  - name: verified terminal state
    required: true
  outputs:
  - name: agent policy
    contentAddressed: true
  - name: trajectory dataset
    contentAddressed: true
  - name: verifier scores
    contentAddressed: true
  - name: training checkpoint
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - env.create
    - agent.rollout
    - reward.compute
    - sandbox.reset
    - checkpoint.save
    defaultDeny: true
  evidence:
    requiredGates:
    - environment-reproducible
    - reward-non-gameable
    - terminal-state-verified
    - safety-constraints
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - agentic-training
  capabilityTags:
  - 08-agentic-training-rl
  - agentic-training
  - cleanroom
  - environment
  - reset
  triggers:
  - 任务需要：确保每次 Rollout 从已知状态开始，并检测跨任务状态和答案泄漏。
  - 任务属于 agentic-training 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - environment-reproducible
  - reward-non-gameable
  - terminal-state-verified
  - safety-constraints
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: LTS-candidate
    deprecationPolicyRequired: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: continual-learning-with-replay
  version: 3.0.0
  pack: 07-private-model-foundry
  priority: P1
  owner: model-foundry-team
spec:
  description: 通过回放、正则化和领域采样持续学习，同时保持旧能力。
  kernel: K7 Private Model Foundry
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: certified dataset
    required: true
  - name: base model candidate
    required: true
  - name: training policy
    required: true
  - name: compute budget
    required: true
  outputs:
  - name: checkpoint
    contentAddressed: true
  - name: adapter
    contentAddressed: true
  - name: model card
    contentAddressed: true
  - name: evaluation report
    contentAddressed: true
  - name: signed release
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - train.launch
    - checkpoint.save
    - registry.log
    - eval.run
    - artifact.sign
    defaultDeny: true
  evidence:
    requiredGates:
    - license-approved
    - dataset-frozen
    - reproducible-run
    - eval-regression-pass
    - signed
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true
  businessLines:
  - private-model
  capabilityTags:
  - 07-private-model-foundry
  - continual
  - learning
  - private-model
  - replay
  triggers:
  - 任务需要：通过回放、正则化和领域采样持续学习，同时保持旧能力。
  - 任务属于 private-model 且需要仓库级执行、证据与回滚。
  negativeTriggers:
  - 仅解释普通概念且不需要访问仓库、数据、模型或工具。
  - 没有租户授权、版本锁定、验收标准或可用验证环境。
  - 请求绕过测试、权限、证据、签名或回滚门。
  dependencies:
  - typed-skill-contract
  - evidence-contract
  - policy-contract
  - skill-transaction-and-rollback
  - tenant-policy-aware-retrieval
  invariants:
  - license-approved
  - dataset-frozen
  - reproducible-run
  - eval-regression-pass
  - signed
  - tenant-boundary-preserved
  - no-evidence-fabrication
  - hard-gates-not-weakened
  failureModes:
  - unsupported-version-or-environment
  - insufficient-semantic-coverage
  - deterministic-verification-failure
  - authorization-or-data-rights-failure
  - rollback-target-unavailable
  execution:
    class: durable-replayable
    idempotencyRequired: true
    checkpointRequired: true
    independentVerificationRequired: true
    productionWriteApprovalRequired: true
  compatibility:
    packageVersion: 3.0.0
    runtime: Elmos Proof-Driven Agentic Harness v3+
    versionPinned: true
    matrixRequired: true
  maturity:
    status: specification-ready
    runtimeImplementation: required
    certificationTarget: E3
  support:
    supportTier: standard
    deprecationPolicyRequired: true

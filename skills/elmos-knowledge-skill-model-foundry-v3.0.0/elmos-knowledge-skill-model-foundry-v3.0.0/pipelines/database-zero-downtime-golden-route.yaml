apiVersion: elmos.ai/v1
kind: DurablePipeline
metadata:
  name: database-zero-downtime-golden-route
  version: 3.0.0
spec:
  durable: true
  idempotent: true
  environmentOwnedAuthority: true
  checkpointAfterEachStep: true
  hardFailureAction: block-and-rollback
  steps:
  - id: inventory-workload
    emitEvidence: true
  - id: convert-schema-routines
    emitEvidence: true
  - id: baseline-data
    emitEvidence: true
  - id: backfill
    emitEvidence: true
  - id: start-cdc
    emitEvidence: true
  - id: reconcile
    emitEvidence: true
  - id: load-and-lock-test
    emitEvidence: true
  - id: cutover-rehearsal
    emitEvidence: true
  - id: cutover-or-fallback
    emitEvidence: true

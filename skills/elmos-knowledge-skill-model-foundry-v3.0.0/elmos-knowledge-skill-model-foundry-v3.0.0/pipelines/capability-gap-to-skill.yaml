apiVersion: elmos.ai/v1
kind: DurablePipeline
metadata:
  name: capability-gap-to-skill
  version: 3.0.0
spec:
  durable: true
  idempotent: true
  environmentOwnedAuthority: true
  checkpointAfterEachStep: true
  hardFailureAction: block-and-rollback
  steps:
  - id: collect-failures
    emitEvidence: true
  - id: cluster-gaps
    emitEvidence: true
  - id: choose-knowledge-skill-model-tool
    emitEvidence: true
  - id: author-candidate
    emitEvidence: true
  - id: generate-evals
    emitEvidence: true
  - id: sandbox-replay
    emitEvidence: true
  - id: human-review
    emitEvidence: true
  - id: sign-and-release
    emitEvidence: true

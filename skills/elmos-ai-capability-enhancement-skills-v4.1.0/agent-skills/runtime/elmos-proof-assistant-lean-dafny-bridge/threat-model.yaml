apiVersion: elmos.ai/v3alpha1
kind: ThreatModel
metadata:
  name: elmos-proof-assistant-lean-dafny-bridge
  version: 4.0.0
spec:
  trustBoundaries:
  - user/tenant to control plane
  - control plane to sandboxed execution
  - execution to model/tool/provider
  - runtime to evidence/certification
  - tenant to shared infrastructure
  assets:
  - Goal and RevisionSet integrity
  - tenant data and memory
  - tool and deployment authority
  - generated artifacts
  - proof and certificate integrity
  - availability and budget
  threats:
  - id: T01
    threat: admit hidden as proof
    asset: tenant data
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: emit typed theorem and contract artifacts'
  - id: T02
    threat: theorem proves wrong model
    asset: authority
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: separate generated conjecture from checked proof'
  - id: T03
    threat: extraction changes semantics
    asset: evidence
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: bind source maps and extracted code'
  - id: T04
    threat: proof cache reused after assumption change
    asset: availability
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: record axioms, admits and trusted base'
  - id: T05
    threat: untrusted plugin expands TCB
    asset: semantic correctness
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: recheck after code or toolchain drift'
  assurance:
  - OWASP-style agentic abuse campaign where applicable
  - supply-chain and provenance verification
  - incident kill-switch drill for critical Skills

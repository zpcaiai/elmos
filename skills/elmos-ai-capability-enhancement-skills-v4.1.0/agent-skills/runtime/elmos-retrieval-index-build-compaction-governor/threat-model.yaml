apiVersion: elmos.ai/v3alpha1
kind: ThreatModel
metadata:
  name: elmos-retrieval-index-build-compaction-governor
  version: 4.0.0
spec:
  trustBoundaries:
  - user/tenant to control plane
  - control plane to sandboxed execution
  - execution to model/tool/provider
  - runtime to evidence/certification
  - tenant to shared infrastructure
  assets:
  - Goal and RevisionSet integrity
  - tenant data and memory
  - tool and deployment authority
  - generated artifacts
  - proof and certificate integrity
  - availability and budget
  threats:
  - id: T01
    threat: partial index published
    asset: tenant data
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: plan versioned full and incremental builds'
  - id: T02
    threat: compaction resurrects deleted item
    asset: authority
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: coordinate replicas and online cutover'
  - id: T03
    threat: replica versions mixed
    asset: evidence
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: verify compaction does not lose ACL/deletes'
  - id: T04
    threat: resource surge affects production
    asset: availability
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: bound CPU, memory, IO and duration'
  - id: T05
    threat: rollback index garbage-collected
    asset: semantic correctness
    entryPoints:
    - typed input
    - repository artifact
    - adapter/tool
    - runtime event
    preventiveControls:
    - schema/profile validation
    - least privilege
    - version/digest pinning
    - fail-closed policy
    detectiveControls:
    - audit event
    - anomaly metric
    - negative test
    - evidence consistency check
    response:
    - block path
    - revoke authority
    - quarantine artifacts
    - preserve evidence
    requiredTest: 'native scenario: retain rollback index until certification'
  assurance:
  - OWASP-style agentic abuse campaign where applicable
  - supply-chain and provenance verification
  - incident kill-switch drill for critical Skills

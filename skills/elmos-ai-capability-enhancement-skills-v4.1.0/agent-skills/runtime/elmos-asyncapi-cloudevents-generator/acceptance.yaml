apiVersion: elmos.ai/v3alpha1
kind: AcceptanceSuite
metadata:
  name: elmos-asyncapi-cloudevents-generator
  version: 4.0.0
spec:
  minimumAssurance: A2 for critical; A1 otherwise
  scenarios:
  - id: ELMOS_ASYNCAPI_CLOUDEVENTS_GENERATOR_AC_01
    title: 'native scenario: emit AsyncAPI channels, operations and messages'
    class: native-or-domain
    given: an exact RevisionSet, exact target/tool versions and authorized typed inputs
    when: elmos-asyncapi-cloudevents-generator executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code
    - input/output hashes
    - trace or native log
    - proof result
  - id: ELMOS_ASYNCAPI_CLOUDEVENTS_GENERATOR_AC_02
    title: 'native scenario: generate protocol bindings and CloudEvents envelopes'
    class: native-or-domain

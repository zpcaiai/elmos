    when: elmos-cross-language-concurrency-memory-model-verifier executes this scenario in an isolated reproducible environment
    then: the declared semantic, security, recovery and evidence assertions hold; uncertainty is explicit and critical uncertainty
      blocks
    automation: required
    evidence:
    - command+exit-code

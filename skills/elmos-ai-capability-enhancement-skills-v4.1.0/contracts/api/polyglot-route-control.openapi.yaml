openapi: 3.2.0
info:
  title: Polyglot Route Control API
  version: 4.0.0
servers:
- url: https://RELEASE_TIME_CONTROL_PLANE
paths:
  /v1/polyglot/routes:
    post:
      operationId: v1_polyglot_routes_start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Accepted
        '403':
          description: Denied
        '409':
          description: Conflict
        '422':
          description: Invalid contract
    get:
      operationId: v1_polyglot_routes_list
      responses:
        '200':
          description: Typed, tenant-scoped results
  /v1/polyglot/runs:
    post:
      operationId: v1_polyglot_runs_start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Accepted
        '403':
          description: Denied
        '409':
          description: Conflict
        '422':
          description: Invalid contract
    get:
      operationId: v1_polyglot_runs_list
      responses:
        '200':
          description: Typed, tenant-scoped results
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://RELEASE_TIME_IDP/.well-known/openid-configuration
  schemas:
    RunRequest:
      type: object
      required:
      - goal_id
      - revision_set_id
      properties:
        goal_id:
          type: string
        revision_set_id:
          type: string
        idempotency_key:
          type: string
security:
- oidc: []

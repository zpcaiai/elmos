apiVersion: elmos.ai/v3alpha1
kind: CommercialGoldenRoute
metadata:
  name: stored-routine-service-extraction
  version: 4.0.0
  status: not-certified
spec:
  skill: elmos-stored-routine-service-extraction-compiler
  workflow: workflows/stored-routine-service-extraction.yaml
  source: Oracle/SQL Server/PostgreSQL stored routines → governed service plus outbox/workflow and dual-run evidence
  targets:
  - oracle-dialect
  - sqlserver-dialect
  - postgresql-dialect
  - testcontainers
  adapterCoverage:
    knownAdapters:
    - oracle-dialect
    - sqlserver-dialect
    - postgresql-dialect
    - testcontainers
    conceptualOrExternalTargets: []
  eligibility:
  - exact source/target versions and digests available
  - observable acceptance, rollback and data ownership declared
  - critical semantic/security/side-effect boundaries modeled
  requiredEvidence:
  - clean-room native build/load/start
  - positive and negative conformance
  - differential or invariant evidence
  - fault/recovery and rollback drill
  - supply-chain/signature/provenance
  - machine wall-clock and full cost ledger
  - customer hidden holdout where applicable
  benchmark:
    independentRepetitions: 3
    holdoutRequired: true
    faultInjectionRequired: true
    machineWallClockRequired: true
    costLedgerRequired: true
  releaseGate:
    E0toE5: true
    P05ForProduction: true
    criticalUnknown: BLOCK
    sideEffectsSettled: true
    exactRevisionSet: true
    evidenceFreshnessRequired: true
    independentCertifier: true
  routeOwner: domain-pack.project-generation
  routable: false
  holdoutScenarios:
  - unseen repository/data/topology variant
  - upstream version or behavior drift
  - worker/dependency/region failure
  - rollback after partial side effect
  nonClaim: This route remains a contract until exact native runs, repeated holdout, rollback and independent K8 certification
    are complete.

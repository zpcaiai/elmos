apiVersion: elmos.ai/v3alpha1
kind: CommercialGoldenRoute
metadata:
  name: langchain-to-langgraph
  version: 4.0.0
  status: not-certified
spec:
  skill: elmos-ai-golden-route-langchain-to-langgraph
  workflow: workflows/langchain-to-langgraph.yaml
  source: existing LangChain repository + lockfile + tests/traffic fixtures
  targets:
  - langgraph-python
  eligibility:
  - source baseline classified
  - tools/retrievers/providers observable
  - state/termination can be recovered or approved
  requiredEvidence:
  - source/target trace differential
  - checkpoint/resume
  - interrupt/HITL where required
  - retry-safe side effects
  - load and recovery
  benchmark:
    independentRepetitions: 3
    holdoutRequired: true
    customerAcceptanceRequired: true
    machineWallClockRequired: true
    costLedgerRequired: true
  releaseGate:
    E0toE5: true
    P05ForProduction: true
    criticalUnknown: BLOCK
    sideEffectsSettled: true
    exactRevisionSet: true
    evidenceFreshnessRequired: true
    independentCertifier: true
  nonClaim: This route is a contract until executed on exact source/target revisions with sealed evidence.
  routeOwner: domain-pack.project-generation
  routable: false
  holdoutScenarios:
  - unseen repository variant
  - upstream upgrade drift
  - worker failure and resume
  - rollback after partial side effect

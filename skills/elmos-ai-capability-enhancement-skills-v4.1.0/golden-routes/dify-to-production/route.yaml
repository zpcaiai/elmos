apiVersion: elmos.ai/v3alpha1
kind: CommercialGoldenRoute
metadata:
  name: dify-to-production
  version: 4.0.0
  status: not-certified
spec:
  skill: elmos-ai-golden-route-dify-to-production-code
  workflow: workflows/dify-to-production.yaml
  source: exported Dify DSL + plugin dependencies + representative scenarios
  targets:
  - langgraph-python
  - spring-ai-java
  eligibility:
  - DSL importable at exact version
  - custom plugins available or declared opaque
  - critical workflow features representable
  requiredEvidence:
  - source Dify execution traces
  - target native build/start
  - tool/retrieval/state/side-effect differential
  - unsupported feature ledger
  - rollback
  benchmark:
    independentRepetitions: 3
    holdoutRequired: true
    customerAcceptanceRequired: true
    machineWallClockRequired: true
    costLedgerRequired: true
  releaseGate:
    E0toE5: true
    P05ForProduction: true
    criticalUnknown: BLOCK
    sideEffectsSettled: true
    exactRevisionSet: true
    evidenceFreshnessRequired: true
    independentCertifier: true
  nonClaim: This route is a contract until executed on exact source/target revisions with sealed evidence.
  routeOwner: domain-pack.project-generation
  routable: false
  holdoutScenarios:
  - unseen repository variant
  - upstream upgrade drift
  - worker failure and resume
  - rollback after partial side effect

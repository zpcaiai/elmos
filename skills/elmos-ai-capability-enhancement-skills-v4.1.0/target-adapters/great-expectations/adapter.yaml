apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: great-expectations
  ecosystem: Great Expectations
  version: 4.0.0
spec:
  adapterKind: data-quality
  maturity: P1
  modes:
  - expectations
  - checkpoints
  - docs
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - great-expectations exact-version profile
  - great-expectations capability and semantic-gap map
  - great-expectations native conformance evidence
  - great-expectations deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: json-schema-2020-12
  ecosystem: JSON Schema Draft 2020-12
  version: 4.0.0
spec:
  adapterKind: schema-contract
  maturity: P1
  modes:
  - validate
  - bundle
  - evolve
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - json-schema-2020-12 exact-version profile
  - json-schema-2020-12 capability and semantic-gap map
  - json-schema-2020-12 native conformance evidence
  - json-schema-2020-12 deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

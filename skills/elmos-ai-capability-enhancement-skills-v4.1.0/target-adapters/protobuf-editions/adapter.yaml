apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: protobuf-editions
  ecosystem: Protocol Buffers Editions
  version: 4.0.0
spec:
  adapterKind: wire-schema
  maturity: P1
  modes:
  - parse
  - emit
  - compatibility
  - codegen
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - protobuf-editions exact-version profile
  - protobuf-editions capability and semantic-gap map
  - protobuf-editions native conformance evidence
  - protobuf-editions deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

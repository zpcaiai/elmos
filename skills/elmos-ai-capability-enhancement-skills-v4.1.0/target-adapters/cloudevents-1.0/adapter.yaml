apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: cloudevents-1.0
  ecosystem: CloudEvents 1.0
  version: 4.0.0
spec:
  adapterKind: event-contract
  maturity: P1
  modes:
  - emit
  - validate
  - bindings
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - cloudevents-1.0 exact-version profile
  - cloudevents-1.0 capability and semantic-gap map
  - cloudevents-1.0 native conformance evidence
  - cloudevents-1.0 deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: apache-iceberg
  ecosystem: Apache Iceberg
  version: 4.0.0
spec:
  adapterKind: table-format
  maturity: P1
  modes:
  - schema
  - snapshots
  - partition-evolution
  - catalogs
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - apache-iceberg exact-version profile
  - apache-iceberg capability and semantic-gap map
  - apache-iceberg native conformance evidence
  - apache-iceberg deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

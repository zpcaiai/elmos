apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: wasi-preview2
  ecosystem: WASI Preview 2
  version: 4.0.0
spec:
  adapterKind: sandbox-runtime
  maturity: P1
  modes:
  - capability
  - filesystem
  - network
  - clocks
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - wasi-preview2 exact-version profile
  - wasi-preview2 capability and semantic-gap map
  - wasi-preview2 native conformance evidence
  - wasi-preview2 deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

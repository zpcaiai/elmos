apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: azure-event-hubs
  ecosystem: Azure Event Hubs
  version: 4.0.0
spec:
  adapterKind: managed-messaging
  maturity: P1
  modes:
  - produce
  - consume
  - capture
  - identity
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - azure-event-hubs exact-version profile
  - azure-event-hubs capability and semantic-gap map
  - azure-event-hubs native conformance evidence
  - azure-event-hubs deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: guac-supply-chain
  ecosystem: GUAC Supply-chain Graph
  version: 4.0.0
spec:
  adapterKind: supply-chain-intelligence
  maturity: P1
  modes:
  - ingest
  - query
  - policy
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - guac-supply-chain exact-version profile
  - guac-supply-chain capability and semantic-gap map
  - guac-supply-chain native conformance evidence
  - guac-supply-chain deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

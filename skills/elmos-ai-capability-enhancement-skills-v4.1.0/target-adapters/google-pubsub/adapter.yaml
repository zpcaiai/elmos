apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: google-pubsub
  ecosystem: Google Cloud Pub/Sub
  version: 4.0.0
spec:
  adapterKind: managed-messaging
  maturity: P1
  modes:
  - publish
  - subscribe
  - ordering
  - dead-letter
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - google-pubsub exact-version profile
  - google-pubsub capability and semantic-gap map
  - google-pubsub native conformance evidence
  - google-pubsub deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: tensorflow-lite
  ecosystem: TensorFlow Lite
  version: 4.0.0
spec:
  adapterKind: edge-inference
  maturity: P1
  modes:
  - models
  - delegates
  - quantization
  - mobile
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - tensorflow-lite exact-version profile
  - tensorflow-lite capability and semantic-gap map
  - tensorflow-lite native conformance evidence
  - tensorflow-lite deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

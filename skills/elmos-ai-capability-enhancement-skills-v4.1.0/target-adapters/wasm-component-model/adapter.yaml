apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: wasm-component-model
  ecosystem: WebAssembly Component Model and WIT
  version: 4.0.0
spec:
  adapterKind: component-runtime
  maturity: P1
  modes:
  - wit
  - compose
  - link
  - conformance
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - wasm-component-model exact-version profile
  - wasm-component-model capability and semantic-gap map
  - wasm-component-model native conformance evidence
  - wasm-component-model deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

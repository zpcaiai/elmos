apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: databricks-sql
  ecosystem: Databricks SQL
  version: 4.0.0
spec:
  adapterKind: warehouse
  maturity: P1
  modes:
  - sql
  - unity-catalog
  - jobs
  - serverless
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - databricks-sql exact-version profile
  - databricks-sql capability and semantic-gap map
  - databricks-sql native conformance evidence
  - databricks-sql deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

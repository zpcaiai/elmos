apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: kata-containers
  ecosystem: Kata Containers
  version: 4.0.0
spec:
  adapterKind: sandbox
  maturity: P1
  modes:
  - runtime
  - vm-isolation
  - attestation
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - kata-containers exact-version profile
  - kata-containers capability and semantic-gap map
  - kata-containers native conformance evidence
  - kata-containers deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

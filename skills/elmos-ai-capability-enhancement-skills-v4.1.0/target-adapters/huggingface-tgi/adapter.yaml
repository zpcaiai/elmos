apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: huggingface-tgi
  ecosystem: Hugging Face TGI
  version: 4.0.0
spec:
  adapterKind: model-serving
  maturity: P1
  modes:
  - server
  - streaming
  - quantization
  - metrics
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - huggingface-tgi exact-version profile
  - huggingface-tgi capability and semantic-gap map
  - huggingface-tgi native conformance evidence
  - huggingface-tgi deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: nats-jetstream
  ecosystem: NATS JetStream
  version: 4.0.0
spec:
  adapterKind: messaging
  maturity: P1
  modes:
  - streams
  - consumers
  - kv
  - object-store
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - nats-jetstream exact-version profile
  - nats-jetstream capability and semantic-gap map
  - nats-jetstream native conformance evidence
  - nats-jetstream deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

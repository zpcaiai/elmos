apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: chatgpt-apps-sdk
  ecosystem: OpenAI ChatGPT Apps/Plugins SDK
  version: 4.0.0
spec:
  adapterKind: plugin-ui
  maturity: P1
  modes:
  - skills
  - mcp-server
  - mcp-apps-ui
  - submission
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - chatgpt-apps-sdk exact-version profile
  - chatgpt-apps-sdk capability and semantic-gap map
  - chatgpt-apps-sdk native conformance evidence
  - chatgpt-apps-sdk deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

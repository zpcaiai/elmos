apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: nvidia-triton
  ecosystem: NVIDIA Triton Inference Server
  version: 4.0.0
spec:
  adapterKind: model-serving
  maturity: P1
  modes:
  - model-repository
  - http-grpc
  - batching
  - ensembles
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - nvidia-triton exact-version profile
  - nvidia-triton capability and semantic-gap map
  - nvidia-triton native conformance evidence
  - nvidia-triton deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

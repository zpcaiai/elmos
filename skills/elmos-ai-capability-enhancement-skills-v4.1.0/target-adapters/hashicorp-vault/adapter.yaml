apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: hashicorp-vault
  ecosystem: HashiCorp Vault
  version: 4.0.0
spec:
  adapterKind: secret-key-runtime
  maturity: P1
  modes:
  - identity
  - secret
  - transit
  - pki
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - hashicorp-vault exact-version profile
  - hashicorp-vault capability and semantic-gap map
  - hashicorp-vault native conformance evidence
  - hashicorp-vault deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

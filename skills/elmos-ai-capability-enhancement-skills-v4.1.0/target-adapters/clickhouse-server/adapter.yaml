apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: clickhouse-server
  ecosystem: ClickHouse Server
  version: 4.0.0
spec:
  adapterKind: analytics-database
  maturity: P1
  modes:
  - ddl
  - query
  - replication
  - mutation
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - clickhouse-server exact-version profile
  - clickhouse-server capability and semantic-gap map
  - clickhouse-server native conformance evidence
  - clickhouse-server deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

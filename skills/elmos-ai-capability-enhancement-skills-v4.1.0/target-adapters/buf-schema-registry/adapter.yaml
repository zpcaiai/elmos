apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: buf-schema-registry
  ecosystem: Buf Schema Registry and Breaking Change
  version: 4.0.0
spec:
  adapterKind: schema-registry
  maturity: P1
  modes:
  - lint
  - breaking
  - generate
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - buf-schema-registry exact-version profile
  - buf-schema-registry capability and semantic-gap map
  - buf-schema-registry native conformance evidence
  - buf-schema-registry deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

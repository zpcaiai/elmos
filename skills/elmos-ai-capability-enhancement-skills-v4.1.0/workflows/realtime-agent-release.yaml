apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: realtime-agent-release
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-realtime-voice-multimodal-agent-generator
  stateStore: PostgreSQL 17 append-only journal plus WORM evidence
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
    machineWallClockEta: true
  stages:
  - id: S01
    name: compile-realtime-contract
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S02
    name: provision-media-and-models
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S03
    name: test-interruption-turn-taking
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S04
    name: safety-and-consent
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S05
    name: network-faults
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S06
    name: load-and-cost
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S07
    name: canary
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S08
    name: certify
    dependsOn:
    - S07
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

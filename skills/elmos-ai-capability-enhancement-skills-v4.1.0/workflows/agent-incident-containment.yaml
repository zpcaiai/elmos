apiVersion: elmos.ai/v3alpha1
kind: DurableWorkflow
metadata:
  name: agent-incident-containment
  version: 4.0.0
spec:
  authority: Environment-owned
  failureMode: fail-closed
  steps:
  - id: detect-incident
    ordinal: 1
    dependsOn: []
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: freeze-evidence
    ordinal: 2
    dependsOn:
    - detect-incident
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: propagate-kill-switch
    ordinal: 3
    dependsOn:
    - freeze-evidence
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: revoke-identity-and-tools
    ordinal: 4
    dependsOn:
    - propagate-kill-switch
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: cancel-and-reconcile
    ordinal: 5
    dependsOn:
    - revoke-identity-and-tools
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: root-cause-review
    ordinal: 6
    dependsOn:
    - cancel-and-reconcile
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: safe-restart
    ordinal: 7
    dependsOn:
    - root-cause-review
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  terminalGate: independent K8 evaluation
  machineEtaRequired: true

apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: full-qa-release
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-qa-evidence-assembler
  stateStore: PostgreSQL durable event journal
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
  stages:
  - id: S01
    name: static-contract
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S02
    name: unit-component
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S03
    name: native-integration
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S04
    name: differential
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S05
    name: property-fuzz-mutation
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S06
    name: security
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S07
    name: performance-soak
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S08
    name: chaos-recovery
    dependsOn:
    - S07
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S09
    name: release-evidence
    dependsOn:
    - S08
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: continuous-improvement-promotion
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-counterexample-to-rule-skill-promotion-controller
  stateStore: PostgreSQL 17 append-only journal plus WORM evidence
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
    machineWallClockEta: true
  stages:
  - id: S01
    name: mine-counterexamples
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S02
    name: propose-rule-skill-change
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S03
    name: isolate-training-eval
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S04
    name: arena-and-holdout
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S05
    name: security-review
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S06
    name: shadow-canary
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S07
    name: independent-promotion
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S08
    name: rollback-monitor
    dependsOn:
    - S07
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

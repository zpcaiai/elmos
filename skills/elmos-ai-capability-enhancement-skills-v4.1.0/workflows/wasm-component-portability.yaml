apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: wasm-component-portability
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-wasm-component-wit-portability-compiler
  stateStore: PostgreSQL 17 append-only journal plus WORM evidence
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
    machineWallClockEta: true
  stages:
  - id: S01
    name: freeze-language-and-wit-profiles
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S02
    name: compile-components-and-worlds
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S03
    name: lower-canonical-abi
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S04
    name: compose-and-link
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S05
    name: wasi-capability-test
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S06
    name: cross-runtime-roundtrip
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S07
    name: rollback-drill
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S08
    name: certify
    dependsOn:
    - S07
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

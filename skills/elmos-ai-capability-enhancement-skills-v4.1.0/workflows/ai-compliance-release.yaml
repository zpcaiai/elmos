apiVersion: elmos.ai/v3alpha1
kind: DurableWorkflow
metadata:
  name: ai-compliance-release
  version: 4.0.0
spec:
  authority: Environment-owned
  failureMode: fail-closed
  steps:
  - id: compile-applicability
    ordinal: 1
    dependsOn: []
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: map-controls
    ordinal: 2
    dependsOn:
    - compile-applicability
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: generate-aibom-and-cards
    ordinal: 3
    dependsOn:
    - map-controls
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: verify-retention-and-labeling
    ordinal: 4
    dependsOn:
    - generate-aibom-and-cards
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: human-legal-review
    ordinal: 5
    dependsOn:
    - verify-retention-and-labeling
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: execute-evidence-tests
    ordinal: 6
    dependsOn:
    - human-legal-review
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  - id: release-or-block
    ordinal: 7
    dependsOn:
    - execute-evidence-tests
    retry:
      maxAttempts: 2
      backoff: bounded-exponential
    checkpoint: true
    evidenceRequired: true
  terminalGate: independent K8 evaluation
  machineEtaRequired: true

apiVersion: elmos.ai/v3alpha1
kind: DurableWorkflow
metadata:
  name: generated-project-upgrade
  title: Upgrade generated AI project
spec:
  routeOwner: domain-pack.project-generation
  revisionBound: true
  nodes:
  - id: detect-drift
    sequence: 0
    owner: K2
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
  - id: freeze-old-new-profiles
    sequence: 1
    owner: K7
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - detect-drift
  - id: impact-analysis
    sequence: 2
    owner: K1
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - freeze-old-new-profiles
  - id: semantic-three-way-merge
    sequence: 3
    owner: K5
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - impact-analysis
  - id: selective-regeneration
    sequence: 4
    owner: K5
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - semantic-three-way-merge
  - id: native-conformance
    sequence: 5
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - selective-regeneration
  - id: selective-recertification
    sequence: 6
    owner: K8
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - native-conformance
  - id: publish-upgrade
    sequence: 7
    owner: K5
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - selective-recertification
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  authority: Environment-owned; every write checks tenant, epoch, lease generation and fencing
  evidence: each node emits immutable evidence or explicit NOT_EXECUTED reason

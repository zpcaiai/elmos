batch: 14
slug: backend-compiler-adapters
title: "后端语言Compiler Adapter"
phase: "E 后端语言互转"
skills:
  - name: java-parser-adapter
    description: "使用 Java 原生或高保真解析前端构建语法树，并保留源码位置、注释和语法特征。"
  - name: java-symbol-adapter
    description: "解析 Java 符号、作用域、绑定、重载与跨文件引用，输出统一符号模型。"
  - name: java-type-adapter
    description: "提取并规范化 Java 类型、泛型、可空性、联合类型和类型约束。"
  - name: java-cfg-ssa-adapter
    description: "为 Java 构建控制流、数据流与 SSA/近似 SSA 表示，支持切片和验证。"
  - name: java-error-exception-adapter
    description: "恢复 Java 的异常、错误返回、panic/throw 与清理路径语义。"
  - name: java-async-concurrency-adapter
    description: "恢复 Java 的异步、线程、任务、协程、取消和同步原语语义。"
  - name: java-framework-detector
    description: "识别 Java 仓库中的主流框架、版本、约定、插件和隐式运行时行为。"
  - name: java-code-generator
    description: "从目标语义 IR 生成可构建、符合 Java 惯例且可追踪到源位置的代码。"
  - name: java-formatter-linter-adapter
    description: "接入 Java 格式化、Lint 和静态分析工具，并规范化诊断结果。"
  - name: java-test-adapter
    description: "发现、迁移、运行并规范化 Java 单元、集成、契约和端到端测试。"

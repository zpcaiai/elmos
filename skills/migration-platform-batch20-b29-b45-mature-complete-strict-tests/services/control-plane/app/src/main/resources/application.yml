server:
  port: 8080

spring:
  application:
    name: migration-control-plane
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migration}
    username: ${SPRING_DATASOURCE_USERNAME:migration}
    password: ${SPRING_DATASOURCE_PASSWORD:migration}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  artifact-root: ${APP_ARTIFACT_ROOT:./artifacts}

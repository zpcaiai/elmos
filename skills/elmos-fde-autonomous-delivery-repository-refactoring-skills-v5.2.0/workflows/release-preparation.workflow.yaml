apiVersion: elmos.ai/v1
kind: DurableWorkflow
metadata:
  id: release-preparation
  version: 5.2.0
spec:
  engine: canonical-K7-adapter
  steps:
  - id: prepare-shadow
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  - id: prevent-effects
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  - id: reconcile
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  - id: prepare-canary
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  - id: define-slo
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  - id: rehearse-rollback
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  - id: handoff-to-external-production-authority
    checkpoint: true
    onFailure: fail-closed-and-reconcile
  authority: environment-owned
  cancellation: bounded
  completionAuthority: K8

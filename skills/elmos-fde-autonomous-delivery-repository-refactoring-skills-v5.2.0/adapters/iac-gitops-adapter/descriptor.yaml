apiVersion: elmos.ai/v1
kind: AdapterDescriptor
metadata:
  id: iac-gitops-adapter
  version: 5.2.0
spec:
  providers:
  - Terraform
  - Pulumi
  - Helm
  - ArgoCD
  - Flux
  scope: infrastructure semantics, drift, plans and controlled rollout
  replaceable: true
  completionAuthority: false
  routeAuthority: false
  semanticTruthAuthority: false
  riskClass: medium
  requiredCapabilities:
  - capability-negotiation
  - invocation-scoped-lease
  - verified-security-context
  - typed-result
  - version-pinning
  - fencing
  sideEffects:
    default: none
    writesRequire:
    - explicit plan step
    - policy approval
    - idempotency key
    - effect ledger
  dataHandling:
    tenantIsolation: true
    secretsModelVisible: false
    retention: tenant-policy
  conformance:
  - happy path
  - auth denial
  - tenant denial
  - timeout
  - retry
  - idempotency
  - stale generation
  - version mismatch
  - partial result
  - cancellation
  - audit completeness

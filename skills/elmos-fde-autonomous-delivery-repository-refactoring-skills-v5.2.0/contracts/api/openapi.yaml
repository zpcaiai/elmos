openapi: 3.1.0
info:
  title: Elmos FDE Delivery and Repository Transformation API
  version: 5.2.0
servers:
- url: /api/v1
paths:
  /engagements:
    post:
      operationId: createEngagement
      responses:
        '202':
          description: Accepted
  /engagements/{engagementId}:
    get:
      operationId: getEngagement
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Engagement projection
  /repositories/{repositoryId}/assessments:
    post:
      operationId: startAssessment
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Assessment started
  /findings:
    get:
      operationId: searchFindings
      responses:
        '200':
          description: Findings
  /transformation-plans:
    post:
      operationId: createTransformationPlan
      responses:
        '202':
          description: Plan requested
  /transformation-plans/{planId}/execute:
    post:
      operationId: executeTransformationPlan
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Execution accepted
        '403':
          description: Authority denied
  /evidence/{subjectId}:
    get:
      operationId: getEvidenceBundle
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Evidence bundle

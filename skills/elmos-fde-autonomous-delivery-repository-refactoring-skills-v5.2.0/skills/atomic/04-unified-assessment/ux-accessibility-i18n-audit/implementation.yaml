apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: ux-accessibility-i18n-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: UxAccessibilityI18NAuditService
    workflow: UxAccessibilityI18NAuditWorkflow
    policyGate: UxAccessibilityI18NAuditPolicyGate
    evidenceProducer: UxAccessibilityI18NAuditEvidenceProducer
    repositoryPort: UxAccessibilityI18NAuditRepositoryPort
  requiredPorts:
  - id: browser.test
    direction: inbound
  - id: accessibility.scan
    direction: inbound
  - id: performance.measure
    direction: inbound
  - id: snapshot.compare
    direction: inbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/ux-accessibility-i18n-audit/runs
  - GET /api/v1/skills/ux-accessibility-i18n-audit/runs/{runId}
  - POST /api/v1/skills/ux-accessibility-i18n-audit/runs/{runId}/cancel
  - POST /api/v1/skills/ux-accessibility-i18n-audit/runs/{runId}/resume
  events:
  - elmos.skill.ux-accessibility-i18n-audit.requested.v1
  - elmos.skill.ux-accessibility-i18n-audit.checkpointed.v1
  - elmos.skill.ux-accessibility-i18n-audit.completed.v1
  - elmos.skill.ux-accessibility-i18n-audit.failed.v1
  workflowSteps:
  - Select critical journeys, user roles, devices, locales, and accessibility needs.
  - Inspect component, route, state, form, and network behavior.
  - Run automated checks and browser-level scripted journeys.
  - Perform required human review for non-automatable accessibility and usability questions.
  - Correlate defects with analytics and support evidence where available.
  - Publish findings and verification scenarios.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

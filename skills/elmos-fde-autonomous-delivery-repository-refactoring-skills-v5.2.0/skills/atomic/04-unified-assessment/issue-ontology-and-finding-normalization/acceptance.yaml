apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: issue-ontology-and-finding-normalization
  version: 5.2.0
spec:
  positiveScenarios:
  - Multiple tools report the same SQL injection path
  - Many local smells share one missing architecture boundary
  - A model suggests a bug with no reproducible evidence
  negativeControls:
  - paste scanner output
  - create unsupported finding
  - assign severity without impact context
  checks:
  - id: issue-ontology-and-finding-normalization-AC-01
    requirement: Use one ontology across business correctness, code, architecture, data, security, reliability, tests, infrastructure,
      AI, UX, and operations.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: issue-ontology-and-finding-normalization-AC-02
    requirement: Require location, evidence, trigger condition, impact, likelihood, confidence, root cause, remediation, and
      verification plan.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: issue-ontology-and-finding-normalization-AC-03
    requirement: Deduplicate, correlate, and cluster symptoms under evidence-supported root causes.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: issue-ontology-and-finding-normalization-AC-04
    requirement: Preserve source-tool identifiers, suppressed results, waivers, and false-positive rationale.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: issue-ontology-and-finding-normalization-AC-05
    requirement: Link findings to business capabilities, invariants, acceptance criteria, and affected revisions.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

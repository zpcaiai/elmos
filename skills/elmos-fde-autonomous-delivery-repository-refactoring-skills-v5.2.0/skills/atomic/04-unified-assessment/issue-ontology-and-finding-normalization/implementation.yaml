apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: issue-ontology-and-finding-normalization
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: IssueOntologyAndFindingNormalizationService
    workflow: IssueOntologyAndFindingNormalizationWorkflow
    policyGate: IssueOntologyAndFindingNormalizationPolicyGate
    evidenceProducer: IssueOntologyAndFindingNormalizationEvidenceProducer
    repositoryPort: IssueOntologyAndFindingNormalizationRepositoryPort
  requiredPorts:
  - id: finding.import
    direction: inbound
  - id: schema.validate
    direction: inbound
  - id: evidence.verify
    direction: outbound
  - id: graph.cluster
    direction: inbound
  - id: risk.score
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/issue-ontology-and-finding-normalization/runs
  - GET /api/v1/skills/issue-ontology-and-finding-normalization/runs/{runId}
  - POST /api/v1/skills/issue-ontology-and-finding-normalization/runs/{runId}/cancel
  - POST /api/v1/skills/issue-ontology-and-finding-normalization/runs/{runId}/resume
  events:
  - elmos.skill.issue-ontology-and-finding-normalization.requested.v1
  - elmos.skill.issue-ontology-and-finding-normalization.checkpointed.v1
  - elmos.skill.issue-ontology-and-finding-normalization.completed.v1
  - elmos.skill.issue-ontology-and-finding-normalization.failed.v1
  workflowSteps:
  - Import observations from analyzers, tests, traces, humans, and documents.
  - Validate evidence identity, freshness, location, and reproducibility.
  - Map each observation to the canonical issue taxonomy.
  - Deduplicate and build symptom, cause, dependency, and amplification relationships.
  - Score severity, likelihood, blast radius, business impact, confidence, and false-positive risk.
  - Publish findings and unresolved review queues.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

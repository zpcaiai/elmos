apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: correctness-concurrency-consistency-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: CorrectnessConcurrencyConsistencyAuditService
    workflow: CorrectnessConcurrencyConsistencyAuditWorkflow
    policyGate: CorrectnessConcurrencyConsistencyAuditPolicyGate
    evidenceProducer: CorrectnessConcurrencyConsistencyAuditEvidenceProducer
    repositoryPort: CorrectnessConcurrencyConsistencyAuditRepositoryPort
  requiredPorts:
  - id: static.analyze
    direction: inbound
  - id: race.detect
    direction: inbound
  - id: fuzz.execute
    direction: outbound
  - id: trace.replay
    direction: inbound
  - id: model.check
    direction: outbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/correctness-concurrency-consistency-audit/runs
  - GET /api/v1/skills/correctness-concurrency-consistency-audit/runs/{runId}
  - POST /api/v1/skills/correctness-concurrency-consistency-audit/runs/{runId}/cancel
  - POST /api/v1/skills/correctness-concurrency-consistency-audit/runs/{runId}/resume
  events:
  - elmos.skill.correctness-concurrency-consistency-audit.requested.v1
  - elmos.skill.correctness-concurrency-consistency-audit.checkpointed.v1
  - elmos.skill.correctness-concurrency-consistency-audit.completed.v1
  - elmos.skill.correctness-concurrency-consistency-audit.failed.v1
  workflowSteps:
  - Select critical behaviors and invariants from the business and system graphs.
  - Run language-specific static and compiler analyses.
  - Generate adversarial interleavings, failure sequences, and boundary cases.
  - Reproduce high-impact candidates in the native runtime lab.
  - Correlate symptoms to shared consistency and lifecycle causes.
  - Publish findings with counterexamples and verification obligations.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: ai-agent-system-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: AiAgentSystemAuditService
    workflow: AiAgentSystemAuditWorkflow
    policyGate: AiAgentSystemAuditPolicyGate
    evidenceProducer: AiAgentSystemAuditEvidenceProducer
    repositoryPort: AiAgentSystemAuditRepositoryPort
  requiredPorts:
  - id: eval.execute
    direction: outbound
  - id: redteam.execute
    direction: outbound
  - id: trace.query
    direction: outbound
  - id: prompt.inspect
    direction: outbound
  - id: policy.test
    direction: inbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/ai-agent-system-audit/runs
  - GET /api/v1/skills/ai-agent-system-audit/runs/{runId}
  - POST /api/v1/skills/ai-agent-system-audit/runs/{runId}/cancel
  - POST /api/v1/skills/ai-agent-system-audit/runs/{runId}/resume
  events:
  - elmos.skill.ai-agent-system-audit.requested.v1
  - elmos.skill.ai-agent-system-audit.checkpointed.v1
  - elmos.skill.ai-agent-system-audit.completed.v1
  - elmos.skill.ai-agent-system-audit.failed.v1
  workflowSteps:
  - Map the complete AI execution and trust graph.
  - Collect representative and adversarial evaluation cases under data-use policy.
  - Run deterministic checks, model-based rubrics, red-team cases, and recovery tests.
  - Measure quality, safety, latency, cost, variance, and intervention by segment.
  - Validate high-risk findings with independent evaluators and runtime evidence.
  - Publish findings, eval gaps, and remediation gates.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

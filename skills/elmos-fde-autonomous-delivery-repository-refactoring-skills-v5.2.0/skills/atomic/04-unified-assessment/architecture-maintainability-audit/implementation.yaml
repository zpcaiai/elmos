apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: architecture-maintainability-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: ArchitectureMaintainabilityAuditService
    workflow: ArchitectureMaintainabilityAuditWorkflow
    policyGate: ArchitectureMaintainabilityAuditPolicyGate
    evidenceProducer: ArchitectureMaintainabilityAuditEvidenceProducer
    repositoryPort: ArchitectureMaintainabilityAuditRepositoryPort
  requiredPorts:
  - id: graph.query
    direction: outbound
  - id: architecture.rule
    direction: inbound
  - id: metric.compute
    direction: inbound
  - id: history.query
    direction: outbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/architecture-maintainability-audit/runs
  - GET /api/v1/skills/architecture-maintainability-audit/runs/{runId}
  - POST /api/v1/skills/architecture-maintainability-audit/runs/{runId}/cancel
  - POST /api/v1/skills/architecture-maintainability-audit/runs/{runId}/resume
  events:
  - elmos.skill.architecture-maintainability-audit.requested.v1
  - elmos.skill.architecture-maintainability-audit.checkpointed.v1
  - elmos.skill.architecture-maintainability-audit.completed.v1
  - elmos.skill.architecture-maintainability-audit.failed.v1
  workflowSteps:
  - Recover current logical, deployment, data, and ownership architecture.
  - Evaluate dependency direction, module responsibilities, and public integration surfaces.
  - Combine structural metrics with history, incidents, runtime, and business criticality.
  - Identify root causes and architecture drift.
  - Define conservative, balanced, and strategic remediation options.
  - Create findings and candidate fitness functions.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

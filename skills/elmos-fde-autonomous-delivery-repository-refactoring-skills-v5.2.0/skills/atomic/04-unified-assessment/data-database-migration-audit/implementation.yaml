apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: data-database-migration-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: DataDatabaseMigrationAuditService
    workflow: DataDatabaseMigrationAuditWorkflow
    policyGate: DataDatabaseMigrationAuditPolicyGate
    evidenceProducer: DataDatabaseMigrationAuditEvidenceProducer
    repositoryPort: DataDatabaseMigrationAuditRepositoryPort
  requiredPorts:
  - id: schema.extract
    direction: inbound
  - id: sql.analyze
    direction: inbound
  - id: plan.explain
    direction: outbound
  - id: lineage.query
    direction: outbound
  - id: migration.simulate
    direction: inbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/data-database-migration-audit/runs
  - GET /api/v1/skills/data-database-migration-audit/runs/{runId}
  - POST /api/v1/skills/data-database-migration-audit/runs/{runId}/cancel
  - POST /api/v1/skills/data-database-migration-audit/runs/{runId}/resume
  events:
  - elmos.skill.data-database-migration-audit.requested.v1
  - elmos.skill.data-database-migration-audit.checkpointed.v1
  - elmos.skill.data-database-migration-audit.completed.v1
  - elmos.skill.data-database-migration-audit.failed.v1
  workflowSteps:
  - Inventory databases, schemas, access paths, data classes, and migration history.
  - Extract schema and routine semantics into DB-SIR.
  - Correlate application queries, ORM mappings, runtime plans, locks, and incidents.
  - Model migration, backfill, reconciliation, and rollback obligations.
  - Reproduce material issues on representative sanitized data.
  - Publish findings, migration risk, and data proof obligations.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

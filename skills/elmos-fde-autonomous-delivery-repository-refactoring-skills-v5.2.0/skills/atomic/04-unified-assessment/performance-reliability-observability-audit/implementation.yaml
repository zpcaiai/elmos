apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: performance-reliability-observability-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: PerformanceReliabilityObservabilityAuditService
    workflow: PerformanceReliabilityObservabilityAuditWorkflow
    policyGate: PerformanceReliabilityObservabilityAuditPolicyGate
    evidenceProducer: PerformanceReliabilityObservabilityAuditEvidenceProducer
    repositoryPort: PerformanceReliabilityObservabilityAuditRepositoryPort
  requiredPorts:
  - id: profile.execute
    direction: outbound
  - id: load.test
    direction: inbound
  - id: chaos.inject
    direction: inbound
  - id: telemetry.query
    direction: outbound
  - id: capacity.model
    direction: outbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/performance-reliability-observability-audit/runs
  - GET /api/v1/skills/performance-reliability-observability-audit/runs/{runId}
  - POST /api/v1/skills/performance-reliability-observability-audit/runs/{runId}/cancel
  - POST /api/v1/skills/performance-reliability-observability-audit/runs/{runId}/resume
  events:
  - elmos.skill.performance-reliability-observability-audit.requested.v1
  - elmos.skill.performance-reliability-observability-audit.checkpointed.v1
  - elmos.skill.performance-reliability-observability-audit.completed.v1
  - elmos.skill.performance-reliability-observability-audit.failed.v1
  workflowSteps:
  - Identify critical journeys, workload envelopes, SLOs, and failure budgets.
  - Inspect code and configuration for likely bottlenecks and resilience gaps.
  - Collect profiles, query plans, telemetry, and resource curves in the runtime lab.
  - Run load, soak, stress, and approved fault tests at staged scale.
  - Correlate bottlenecks and operational symptoms to root causes.
  - Publish findings, capacity model, and observability remediation plan.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

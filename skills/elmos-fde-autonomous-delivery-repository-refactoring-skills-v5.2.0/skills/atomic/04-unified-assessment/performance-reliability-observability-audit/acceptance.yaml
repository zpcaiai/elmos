apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: performance-reliability-observability-audit
  version: 5.2.0
spec:
  positiveScenarios:
  - P95 latency grows superlinearly
  - Retry storm during dependency outage
  - No trace links user error to backend failure
  negativeControls:
  - benchmark on non-representative data without caveat
  - optimize before measuring
  checks:
  - id: performance-reliability-observability-audit-AC-01
    requirement: Assess algorithmic complexity, CPU, memory, GC, I/O, locks, connections, queues, caches, batching, and backpressure.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: performance-reliability-observability-audit-AC-02
    requirement: Evaluate timeout, retry, circuit breaker, bulkhead, failover, backup, restore, disaster recovery, and graceful
      degradation.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: performance-reliability-observability-audit-AC-03
    requirement: Map service-level indicators, objectives, error budgets, dashboards, alerts, traces, logs, metrics, and profiles.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: performance-reliability-observability-audit-AC-04
    requirement: Use representative workload models and preserve hardware, dataset, configuration, and sampling identity.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: performance-reliability-observability-audit-AC-05
    requirement: Estimate cost and capacity impact of remediation options.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

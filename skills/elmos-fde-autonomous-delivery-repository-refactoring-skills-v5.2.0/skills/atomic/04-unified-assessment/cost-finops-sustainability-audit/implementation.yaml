apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: cost-finops-sustainability-audit
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: CostFinopsSustainabilityAuditService
    workflow: CostFinopsSustainabilityAuditWorkflow
    policyGate: CostFinopsSustainabilityAuditPolicyGate
    evidenceProducer: CostFinopsSustainabilityAuditEvidenceProducer
    repositoryPort: CostFinopsSustainabilityAuditRepositoryPort
  requiredPorts:
  - id: usage.query
    direction: outbound
  - id: cost.allocate
    direction: inbound
  - id: capacity.model
    direction: outbound
  - id: experiment.plan
    direction: outbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/cost-finops-sustainability-audit/runs
  - GET /api/v1/skills/cost-finops-sustainability-audit/runs/{runId}
  - POST /api/v1/skills/cost-finops-sustainability-audit/runs/{runId}/cancel
  - POST /api/v1/skills/cost-finops-sustainability-audit/runs/{runId}/resume
  events:
  - elmos.skill.cost-finops-sustainability-audit.requested.v1
  - elmos.skill.cost-finops-sustainability-audit.checkpointed.v1
  - elmos.skill.cost-finops-sustainability-audit.completed.v1
  - elmos.skill.cost-finops-sustainability-audit.failed.v1
  workflowSteps:
  - Collect cost and usage data with exact time, tenant, workflow, and version identity.
  - Normalize unit cost and allocate shared resources using declared rules.
  - Relate spend to acceptance progress, evidence value, and business outcomes.
  - Identify waste, capacity, routing, caching, and scheduling opportunities.
  - Simulate conservative savings and quality impact.
  - Publish cost findings and controlled optimization experiments.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

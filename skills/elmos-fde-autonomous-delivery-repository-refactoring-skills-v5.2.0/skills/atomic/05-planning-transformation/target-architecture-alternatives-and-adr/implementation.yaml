apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: target-architecture-alternatives-and-adr
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: TargetArchitectureAlternativesAndAdrService
    workflow: TargetArchitectureAlternativesAndAdrWorkflow
    policyGate: TargetArchitectureAlternativesAndAdrPolicyGate
    evidenceProducer: TargetArchitectureAlternativesAndAdrEvidenceProducer
    repositoryPort: TargetArchitectureAlternativesAndAdrRepositoryPort
  requiredPorts:
  - id: graph.design
    direction: inbound
  - id: tradeoff.evaluate
    direction: outbound
  - id: adr.write
    direction: outbound
  - id: cost.model
    direction: outbound
  - id: approval.request
    direction: inbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/target-architecture-alternatives-and-adr/runs
  - GET /api/v1/skills/target-architecture-alternatives-and-adr/runs/{runId}
  - POST /api/v1/skills/target-architecture-alternatives-and-adr/runs/{runId}/cancel
  - POST /api/v1/skills/target-architecture-alternatives-and-adr/runs/{runId}/resume
  events:
  - elmos.skill.target-architecture-alternatives-and-adr.requested.v1
  - elmos.skill.target-architecture-alternatives-and-adr.checkpointed.v1
  - elmos.skill.target-architecture-alternatives-and-adr.completed.v1
  - elmos.skill.target-architecture-alternatives-and-adr.failed.v1
  workflowSteps:
  - Load root causes, invariants, support profile, constraints, and business priorities.
  - Generate feasible architecture alternatives without changing canonical Elmos owners.
  - Evaluate each alternative against functional, security, data, reliability, cost, and adoption criteria.
  - Design transition states, compatibility layers, and rollback boundaries.
  - Write ADRs for material decisions and unresolved tradeoffs.
  - Submit the selected target state for approval.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

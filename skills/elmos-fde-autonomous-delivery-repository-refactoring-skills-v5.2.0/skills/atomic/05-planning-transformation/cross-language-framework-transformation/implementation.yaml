apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: cross-language-framework-transformation
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: CrossLanguageFrameworkTransformationService
    workflow: CrossLanguageFrameworkTransformationWorkflow
    policyGate: CrossLanguageFrameworkTransformationPolicyGate
    evidenceProducer: CrossLanguageFrameworkTransformationEvidenceProducer
    repositoryPort: CrossLanguageFrameworkTransformationRepositoryPort
  requiredPorts:
  - id: sir.extract
    direction: inbound
  - id: route.map
    direction: outbound
  - id: code.generate
    direction: outbound
  - id: compiler.execute
    direction: outbound
  - id: differential.execute
    direction: outbound
  - id: finding.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/cross-language-framework-transformation/runs
  - GET /api/v1/skills/cross-language-framework-transformation/runs/{runId}
  - POST /api/v1/skills/cross-language-framework-transformation/runs/{runId}/cancel
  - POST /api/v1/skills/cross-language-framework-transformation/runs/{runId}/resume
  events:
  - elmos.skill.cross-language-framework-transformation.requested.v1
  - elmos.skill.cross-language-framework-transformation.checkpointed.v1
  - elmos.skill.cross-language-framework-transformation.completed.v1
  - elmos.skill.cross-language-framework-transformation.failed.v1
  workflowSteps:
  - Validate source and target support profiles and route contract.
  - Extract repository, language, framework, API, data, and build semantics.
  - Plan semantic mappings, shims, manual decisions, and target architecture.
  - Generate in atomic dependency order and compile continuously.
  - Run source-target differential, property, performance, and security verification.
  - Publish gaps, residual risk, generated artifacts, and cutover preparation.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

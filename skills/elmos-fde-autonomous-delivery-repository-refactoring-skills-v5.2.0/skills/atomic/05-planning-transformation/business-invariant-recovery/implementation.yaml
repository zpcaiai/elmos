apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: business-invariant-recovery
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: BusinessInvariantRecoveryService
    workflow: BusinessInvariantRecoveryWorkflow
    policyGate: BusinessInvariantRecoveryPolicyGate
    evidenceProducer: BusinessInvariantRecoveryEvidenceProducer
    repositoryPort: BusinessInvariantRecoveryRepositoryPort
  requiredPorts:
  - id: rule.mine
    direction: inbound
  - id: test.generate
    direction: outbound
  - id: contract.write
    direction: outbound
  - id: owner.approve
    direction: inbound
  - id: obligation.create
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/business-invariant-recovery/runs
  - GET /api/v1/skills/business-invariant-recovery/runs/{runId}
  - POST /api/v1/skills/business-invariant-recovery/runs/{runId}/cancel
  - POST /api/v1/skills/business-invariant-recovery/runs/{runId}/resume
  events:
  - elmos.skill.business-invariant-recovery.requested.v1
  - elmos.skill.business-invariant-recovery.checkpointed.v1
  - elmos.skill.business-invariant-recovery.completed.v1
  - elmos.skill.business-invariant-recovery.failed.v1
  workflowSteps:
  - Select critical user journeys, data, interfaces, state machines, and side effects.
  - Mine candidate invariants from all available evidence sources.
  - Generate positive, negative, boundary, and historical counterexamples.
  - Review conflicts with business, security, data, and operations owners.
  - Encode approved invariants into the registry and verification harness.
  - Create unknown and risk-waiver records for unresolved properties.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: database-schema-routine-data-transformation
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: DatabaseSchemaRoutineDataTransformationService
    workflow: DatabaseSchemaRoutineDataTransformationWorkflow
    policyGate: DatabaseSchemaRoutineDataTransformationPolicyGate
    evidenceProducer: DatabaseSchemaRoutineDataTransformationEvidenceProducer
    repositoryPort: DatabaseSchemaRoutineDataTransformationRepositoryPort
  requiredPorts:
  - id: dbsir.extract
    direction: inbound
  - id: sql.transform
    direction: outbound
  - id: migration.execute
    direction: outbound
  - id: cdc.configure
    direction: inbound
  - id: reconcile.execute
    direction: outbound
  - id: rollback.execute
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/database-schema-routine-data-transformation/runs
  - GET /api/v1/skills/database-schema-routine-data-transformation/runs/{runId}
  - POST /api/v1/skills/database-schema-routine-data-transformation/runs/{runId}/cancel
  - POST /api/v1/skills/database-schema-routine-data-transformation/runs/{runId}/resume
  events:
  - elmos.skill.database-schema-routine-data-transformation.requested.v1
  - elmos.skill.database-schema-routine-data-transformation.checkpointed.v1
  - elmos.skill.database-schema-routine-data-transformation.completed.v1
  - elmos.skill.database-schema-routine-data-transformation.failed.v1
  workflowSteps:
  - Extract DB-SIR and application/database access contracts.
  - Identify semantic gaps, data quality blockers, downtime constraints, and rollback limits.
  - Generate staged schema, routine, application, backfill, CDC, and verification changes.
  - Execute on sanitized representative data before any approved production path.
  - Run reconciliation, performance, concurrency, failure, and permission tests.
  - Prepare cutover, rollback, and evidence packets without issuing E4/E5 certification.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: modernization-strangler-and-rearchitecture
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: ModernizationStranglerAndRearchitectureService
    workflow: ModernizationStranglerAndRearchitectureWorkflow
    policyGate: ModernizationStranglerAndRearchitecturePolicyGate
    evidenceProducer: ModernizationStranglerAndRearchitectureEvidenceProducer
    repositoryPort: ModernizationStranglerAndRearchitectureRepositoryPort
  requiredPorts:
  - id: compatibility.generate
    direction: outbound
  - id: featureflag.configure
    direction: inbound
  - id: traffic.route
    direction: outbound
  - id: diff.verify
    direction: outbound
  - id: migration.execute
    direction: outbound
  - id: rollback.execute
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/modernization-strangler-and-rearchitecture/runs
  - GET /api/v1/skills/modernization-strangler-and-rearchitecture/runs/{runId}
  - POST /api/v1/skills/modernization-strangler-and-rearchitecture/runs/{runId}/cancel
  - POST /api/v1/skills/modernization-strangler-and-rearchitecture/runs/{runId}/resume
  events:
  - elmos.skill.modernization-strangler-and-rearchitecture.requested.v1
  - elmos.skill.modernization-strangler-and-rearchitecture.checkpointed.v1
  - elmos.skill.modernization-strangler-and-rearchitecture.completed.v1
  - elmos.skill.modernization-strangler-and-rearchitecture.failed.v1
  workflowSteps:
  - Select a bounded capability and document current and target contracts.
  - Introduce characterization, compatibility, telemetry, and routing seams.
  - Implement the new path behind a reversible switch.
  - Run replay, shadow, or dual execution and reconcile differences.
  - Increase traffic or ownership in controlled stages with rollback triggers.
  - Retire the old path and update architecture knowledge only after approval.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

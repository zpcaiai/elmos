apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: changeset-commit-and-provenance-governance
  version: 5.2.0
spec:
  positiveScenarios:
  - Agent modifies an unrelated lockfile
  - Generated code and source changes need separate commits
  - Commit passes tests but violates scope
  negativeControls:
  - git add all
  - mix unrelated changes
  - force push without approval
  checks:
  - id: changeset-commit-and-provenance-governance-AC-01
    requirement: Each ChangeSet must have one purpose, bounded files, linked findings, invariants, plan step, tests, evidence,
      and rollback.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: changeset-commit-and-provenance-governance-AC-02
    requirement: Record agent, model, tool, prompt or recipe, environment, input and output hashes, and approvals.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: changeset-commit-and-provenance-governance-AC-03
    requirement: Intercept tool results before commit and reject unexpected file or side-effect deltas.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: changeset-commit-and-provenance-governance-AC-04
    requirement: Prevent self-approval by the producing agent and preserve independent review.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: changeset-commit-and-provenance-governance-AC-05
    requirement: Support staged integration, conflict detection, revert, and compensation without rewriting audit history.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

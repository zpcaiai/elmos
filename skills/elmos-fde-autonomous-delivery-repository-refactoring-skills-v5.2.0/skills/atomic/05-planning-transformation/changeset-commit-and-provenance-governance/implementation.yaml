apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: changeset-commit-and-provenance-governance
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: ChangesetCommitAndProvenanceGovernanceService
    workflow: ChangesetCommitAndProvenanceGovernanceWorkflow
    policyGate: ChangesetCommitAndProvenanceGovernancePolicyGate
    evidenceProducer: ChangesetCommitAndProvenanceGovernanceEvidenceProducer
    repositoryPort: ChangesetCommitAndProvenanceGovernanceRepositoryPort
  requiredPorts:
  - id: workspace.write
    direction: outbound
  - id: diff.inspect
    direction: outbound
  - id: toolresult.intercept
    direction: inbound
  - id: commit.create
    direction: outbound
  - id: provenance.append
    direction: outbound
  - id: approval.request
    direction: inbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/changeset-commit-and-provenance-governance/runs
  - GET /api/v1/skills/changeset-commit-and-provenance-governance/runs/{runId}
  - POST /api/v1/skills/changeset-commit-and-provenance-governance/runs/{runId}/cancel
  - POST /api/v1/skills/changeset-commit-and-provenance-governance/runs/{runId}/resume
  events:
  - elmos.skill.changeset-commit-and-provenance-governance.requested.v1
  - elmos.skill.changeset-commit-and-provenance-governance.checkpointed.v1
  - elmos.skill.changeset-commit-and-provenance-governance.completed.v1
  - elmos.skill.changeset-commit-and-provenance-governance.failed.v1
  workflowSteps:
  - Open an isolated workspace bound to the approved step and RevisionSet.
  - Declare expected files, generated artifacts, commands, and side effects.
  - Execute changes and capture all tool results before commit.
  - Compare actual deltas with scope and run required checks.
  - Request independent review and required human approval.
  - Commit atomically and append immutable provenance and rollback data.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

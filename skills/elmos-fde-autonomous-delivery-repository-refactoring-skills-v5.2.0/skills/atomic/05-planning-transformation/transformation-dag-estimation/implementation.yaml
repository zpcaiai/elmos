apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: transformation-dag-estimation
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: TransformationDagEstimationService
    workflow: TransformationDagEstimationWorkflow
    policyGate: TransformationDagEstimationPolicyGate
    evidenceProducer: TransformationDagEstimationEvidenceProducer
    repositoryPort: TransformationDagEstimationRepositoryPort
  requiredPorts:
  - id: dag.write
    direction: outbound
  - id: dependency.solve
    direction: inbound
  - id: estimate.compute
    direction: inbound
  - id: policy.evaluate
    direction: outbound
  - id: approval.request
    direction: inbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/transformation-dag-estimation/runs
  - GET /api/v1/skills/transformation-dag-estimation/runs/{runId}
  - POST /api/v1/skills/transformation-dag-estimation/runs/{runId}/cancel
  - POST /api/v1/skills/transformation-dag-estimation/runs/{runId}/resume
  events:
  - elmos.skill.transformation-dag-estimation.requested.v1
  - elmos.skill.transformation-dag-estimation.checkpointed.v1
  - elmos.skill.transformation-dag-estimation.completed.v1
  - elmos.skill.transformation-dag-estimation.failed.v1
  workflowSteps:
  - Decompose target-state deltas into atomic transformation objectives.
  - Add dependency, compatibility, data, side-effect, and approval edges.
  - Attach verification and rollback obligations to each step.
  - Estimate tool, model, compute, storage, and network use with confidence ranges.
  - Simulate failure, cancellation, resume, and partial-completion paths.
  - Publish the signed plan and initial execution horizon.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: characterization-differential-mutation-verification
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: CharacterizationDifferentialMutationVerificationService
    workflow: CharacterizationDifferentialMutationVerificationWorkflow
    policyGate: CharacterizationDifferentialMutationVerificationPolicyGate
    evidenceProducer: CharacterizationDifferentialMutationVerificationEvidenceProducer
    repositoryPort: CharacterizationDifferentialMutationVerificationRepositoryPort
  requiredPorts:
  - id: test.generate
    direction: outbound
  - id: differential.execute
    direction: outbound
  - id: property.execute
    direction: outbound
  - id: fuzz.execute
    direction: outbound
  - id: mutation.execute
    direction: outbound
  - id: claim.evaluate
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/characterization-differential-mutation-verification/runs
  - GET /api/v1/skills/characterization-differential-mutation-verification/runs/{runId}
  - POST /api/v1/skills/characterization-differential-mutation-verification/runs/{runId}/cancel
  - POST /api/v1/skills/characterization-differential-mutation-verification/runs/{runId}/resume
  events:
  - elmos.skill.characterization-differential-mutation-verification.requested.v1
  - elmos.skill.characterization-differential-mutation-verification.checkpointed.v1
  - elmos.skill.characterization-differential-mutation-verification.completed.v1
  - elmos.skill.characterization-differential-mutation-verification.failed.v1
  workflowSteps:
  - Build a requirement, invariant, risk, and ChangeSet coverage matrix.
  - Generate or import characterization and contract oracles.
  - Execute source and target against representative, adversarial, and historical inputs.
  - Normalize and compare outputs, state, side effects, performance, and security behavior.
  - Run mutation, fuzz, property, and regression campaigns according to risk.
  - Publish claims, counterexamples, coverage, residual unknowns, and verifier decision inputs.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

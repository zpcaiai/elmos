apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: portfolio-multi-repository-governance
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: PortfolioMultiRepositoryGovernanceService
    workflow: PortfolioMultiRepositoryGovernanceWorkflow
    policyGate: PortfolioMultiRepositoryGovernancePolicyGate
    evidenceProducer: PortfolioMultiRepositoryGovernanceEvidenceProducer
    repositoryPort: PortfolioMultiRepositoryGovernanceRepositoryPort
  requiredPorts:
  - id: portfolio.read
    direction: outbound
  - id: graph.merge
    direction: inbound
  - id: risk.normalize
    direction: inbound
  - id: wave.plan
    direction: outbound
  - id: cost.model
    direction: outbound
  - id: report.generate
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/portfolio-multi-repository-governance/runs
  - GET /api/v1/skills/portfolio-multi-repository-governance/runs/{runId}
  - POST /api/v1/skills/portfolio-multi-repository-governance/runs/{runId}/cancel
  - POST /api/v1/skills/portfolio-multi-repository-governance/runs/{runId}/resume
  events:
  - elmos.skill.portfolio-multi-repository-governance.requested.v1
  - elmos.skill.portfolio-multi-repository-governance.checkpointed.v1
  - elmos.skill.portfolio-multi-repository-governance.completed.v1
  - elmos.skill.portfolio-multi-repository-governance.failed.v1
  workflowSteps:
  - Ingest repository-level snapshots, findings, support profiles, plans, and evidence.
  - Resolve cross-repository dependency and ownership graph.
  - Cluster common patterns and incompatible exceptions.
  - Score and sequence modernization waves under constraints.
  - Track program-level value, risk, cost, evidence, and adoption.
  - Publish portfolio decisions while preserving drill-down provenance.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

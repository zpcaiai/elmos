apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: formal-assurance-routing
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: FormalAssuranceRoutingService
    workflow: FormalAssuranceRoutingWorkflow
    policyGate: FormalAssuranceRoutingPolicyGate
    evidenceProducer: FormalAssuranceRoutingEvidenceProducer
    repositoryPort: FormalAssuranceRoutingRepositoryPort
  requiredPorts:
  - id: formal.route
    direction: outbound
  - id: solver.execute
    direction: outbound
  - id: modelchecker.execute
    direction: outbound
  - id: proof.check
    direction: inbound
  - id: artifact.hash
    direction: inbound
  - id: claim.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/formal-assurance-routing/runs
  - GET /api/v1/skills/formal-assurance-routing/runs/{runId}
  - POST /api/v1/skills/formal-assurance-routing/runs/{runId}/cancel
  - POST /api/v1/skills/formal-assurance-routing/runs/{runId}/resume
  events:
  - elmos.skill.formal-assurance-routing.requested.v1
  - elmos.skill.formal-assurance-routing.checkpointed.v1
  - elmos.skill.formal-assurance-routing.completed.v1
  - elmos.skill.formal-assurance-routing.failed.v1
  workflowSteps:
  - Classify the property and failure consequence.
  - Choose executable contract, symbolic execution, SMT, model checking, theorem proving, or translation validation.
  - Define the model boundary, assumptions, and source-to-model traceability.
  - Generate and independently check the artifact using pinned tools.
  - Interpret counterexamples against implementation and environment evidence.
  - Publish proof scope, result, TCB, residual risk, and invalidation triggers.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: final-handoff-training-support
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: FinalHandoffTrainingSupportService
    workflow: FinalHandoffTrainingSupportWorkflow
    policyGate: FinalHandoffTrainingSupportPolicyGate
    evidenceProducer: FinalHandoffTrainingSupportEvidenceProducer
    repositoryPort: FinalHandoffTrainingSupportRepositoryPort
  requiredPorts:
  - id: runbook.generate
    direction: outbound
  - id: training.generate
    direction: outbound
  - id: exercise.execute
    direction: outbound
  - id: acceptance.record
    direction: outbound
  - id: bundle.seal
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/final-handoff-training-support/runs
  - GET /api/v1/skills/final-handoff-training-support/runs/{runId}
  - POST /api/v1/skills/final-handoff-training-support/runs/{runId}/cancel
  - POST /api/v1/skills/final-handoff-training-support/runs/{runId}/resume
  events:
  - elmos.skill.final-handoff-training-support.requested.v1
  - elmos.skill.final-handoff-training-support.checkpointed.v1
  - elmos.skill.final-handoff-training-support.completed.v1
  - elmos.skill.final-handoff-training-support.failed.v1
  workflowSteps:
  - Inventory required operating knowledge, responsibilities, and access.
  - Generate role-specific runbooks, diagrams, training, and checklists.
  - Run knowledge-transfer sessions and operational exercises.
  - Record gaps, questions, and remediation actions.
  - Obtain receiving-owner acceptance against exit criteria.
  - Seal the handoff packet and transition support ownership.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

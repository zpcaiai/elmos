apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: runtime-observation-and-traffic-capture
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: RuntimeObservationAndTrafficCaptureService
    workflow: RuntimeObservationAndTrafficCaptureWorkflow
    policyGate: RuntimeObservationAndTrafficCapturePolicyGate
    evidenceProducer: RuntimeObservationAndTrafficCaptureEvidenceProducer
    repositoryPort: RuntimeObservationAndTrafficCaptureRepositoryPort
  requiredPorts:
  - id: telemetry.read
    direction: outbound
  - id: profile.capture
    direction: outbound
  - id: traffic.capture
    direction: outbound
  - id: redaction.apply
    direction: inbound
  - id: artifact.hash
    direction: inbound
  - id: policy.evaluate
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/runtime-observation-and-traffic-capture/runs
  - GET /api/v1/skills/runtime-observation-and-traffic-capture/runs/{runId}
  - POST /api/v1/skills/runtime-observation-and-traffic-capture/runs/{runId}/cancel
  - POST /api/v1/skills/runtime-observation-and-traffic-capture/runs/{runId}/resume
  events:
  - elmos.skill.runtime-observation-and-traffic-capture.requested.v1
  - elmos.skill.runtime-observation-and-traffic-capture.checkpointed.v1
  - elmos.skill.runtime-observation-and-traffic-capture.completed.v1
  - elmos.skill.runtime-observation-and-traffic-capture.failed.v1
  workflowSteps:
  - Define observation questions and minimum signals.
  - Approve capture scope, retention, and redaction policy.
  - Instrument or connect to existing telemetry using least privilege.
  - Capture representative workflows, failures, and resource profiles.
  - Normalize and correlate events into behavioral traces.
  - Seal the dataset with limitations and replay controls.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: repository-custody-and-revisionset
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: RepositoryCustodyAndRevisionsetService
    workflow: RepositoryCustodyAndRevisionsetWorkflow
    policyGate: RepositoryCustodyAndRevisionsetPolicyGate
    evidenceProducer: RepositoryCustodyAndRevisionsetEvidenceProducer
    repositoryPort: RepositoryCustodyAndRevisionsetRepositoryPort
  requiredPorts:
  - id: scm.read
    direction: outbound
  - id: artifact.hash
    direction: inbound
  - id: custody.append
    direction: outbound
  - id: workspace.create
    direction: outbound
  - id: policy.evaluate
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/repository-custody-and-revisionset/runs
  - GET /api/v1/skills/repository-custody-and-revisionset/runs/{runId}
  - POST /api/v1/skills/repository-custody-and-revisionset/runs/{runId}/cancel
  - POST /api/v1/skills/repository-custody-and-revisionset/runs/{runId}/resume
  events:
  - elmos.skill.repository-custody-and-revisionset.requested.v1
  - elmos.skill.repository-custody-and-revisionset.checkpointed.v1
  - elmos.skill.repository-custody-and-revisionset.completed.v1
  - elmos.skill.repository-custody-and-revisionset.failed.v1
  workflowSteps:
  - Resolve authorization and data classification for every source.
  - Acquire repositories, submodules, LFS objects, archives, and supplied binaries without mutation.
  - Record commit identities, refs, shallow-history limits, and missing objects.
  - Generate content hashes and custody events.
  - Assemble and seal the RevisionSet.
  - Create isolated read-only and writable workspace references.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: asset-inventory-and-classification
  version: 5.2.0
spec:
  positiveScenarios:
  - Million-line monorepo
  - Repository includes generated SDKs and vendored libraries
  - Encrypted or proprietary binary assets are present
  negativeControls:
  - assume every file is authored source
  - delete generated or vendored code
  checks:
  - id: asset-inventory-and-classification-AC-01
    requirement: Classify every file and directory with confidence, origin, ownership, and processing policy.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: asset-inventory-and-classification-AC-02
    requirement: Detect languages, frameworks, build systems, package managers, schemas, IaC, CI/CD, and test assets.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: asset-inventory-and-classification-AC-03
    requirement: Identify generated, vendored, duplicated, encrypted, binary, ignored, and unreachable assets.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: asset-inventory-and-classification-AC-04
    requirement: Map monorepo, polyrepo, service, module, package, and deployable-unit boundaries.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: asset-inventory-and-classification-AC-05
    requirement: Report unclassified and inaccessible assets as explicit unknowns.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

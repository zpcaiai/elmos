apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: external-dependency-stub-and-service-virtualization
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: ExternalDependencyStubAndServiceVirtualizationService
    workflow: ExternalDependencyStubAndServiceVirtualizationWorkflow
    policyGate: ExternalDependencyStubAndServiceVirtualizationPolicyGate
    evidenceProducer: ExternalDependencyStubAndServiceVirtualizationEvidenceProducer
    repositoryPort: ExternalDependencyStubAndServiceVirtualizationRepositoryPort
  requiredPorts:
  - id: contract.extract
    direction: inbound
  - id: stub.generate
    direction: outbound
  - id: traffic.replay
    direction: inbound
  - id: sandbox.execute
    direction: outbound
  - id: evidence.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/external-dependency-stub-and-service-virtualization/runs
  - GET /api/v1/skills/external-dependency-stub-and-service-virtualization/runs/{runId}
  - POST /api/v1/skills/external-dependency-stub-and-service-virtualization/runs/{runId}/cancel
  - POST /api/v1/skills/external-dependency-stub-and-service-virtualization/runs/{runId}/resume
  events:
  - elmos.skill.external-dependency-stub-and-service-virtualization.requested.v1
  - elmos.skill.external-dependency-stub-and-service-virtualization.checkpointed.v1
  - elmos.skill.external-dependency-stub-and-service-virtualization.completed.v1
  - elmos.skill.external-dependency-stub-and-service-virtualization.failed.v1
  workflowSteps:
  - Extract external dependency contracts from code, config, traces, and docs.
  - Classify dependencies by side effect, criticality, and required fidelity.
  - Select and configure the least risky virtualization strategy.
  - Generate deterministic fixtures and failure modes.
  - Run contract checks against available authoritative systems.
  - Publish fidelity, coverage, and prohibited-claim notes.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

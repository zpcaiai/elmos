apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: status-risk-decision-communications
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: StatusRiskDecisionCommunicationsService
    workflow: StatusRiskDecisionCommunicationsWorkflow
    policyGate: StatusRiskDecisionCommunicationsPolicyGate
    evidenceProducer: StatusRiskDecisionCommunicationsEvidenceProducer
    repositoryPort: StatusRiskDecisionCommunicationsRepositoryPort
  requiredPorts:
  - id: repository.read
    direction: outbound
  - id: artifact.write
    direction: outbound
  - id: schema.validate
    direction: inbound
  - id: policy.evaluate
    direction: outbound
  - id: evidence.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/status-risk-decision-communications/runs
  - GET /api/v1/skills/status-risk-decision-communications/runs/{runId}
  - POST /api/v1/skills/status-risk-decision-communications/runs/{runId}/cancel
  - POST /api/v1/skills/status-risk-decision-communications/runs/{runId}/resume
  events:
  - elmos.skill.status-risk-decision-communications.requested.v1
  - elmos.skill.status-risk-decision-communications.checkpointed.v1
  - elmos.skill.status-risk-decision-communications.completed.v1
  - elmos.skill.status-risk-decision-communications.failed.v1
  workflowSteps:
  - Read approved scope and latest ledger snapshots.
  - Compute milestone and acceptance-criteria status.
  - Rank current risks and blockers by impact and urgency.
  - Draft audience-specific summaries with links to evidence.
  - Record requested decisions and deadlines.
  - Publish only after consistency and sensitive-data checks.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

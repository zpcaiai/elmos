apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: adoption-change-management
  version: 5.2.0
spec:
  positiveScenarios:
  - Pilot works technically but usage is low
  - Operations team refuses ownership
  - Training must differ by role
  negativeControls:
  - code refactor only
  - user surveillance without consent
  checks:
  - id: adoption-change-management-AC-01
    requirement: Segment users by role, workflow, risk, and readiness.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: adoption-change-management-AC-02
    requirement: Define enablement, pilot cohorts, champions, office hours, and support channels.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: adoption-change-management-AC-03
    requirement: Measure activation, repeat use, completion, intervention, and business outcomes.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: adoption-change-management-AC-04
    requirement: Capture feedback with consent and tenant-specific data-use controls.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: adoption-change-management-AC-05
    requirement: Create an operational ownership and knowledge-transfer exit plan.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

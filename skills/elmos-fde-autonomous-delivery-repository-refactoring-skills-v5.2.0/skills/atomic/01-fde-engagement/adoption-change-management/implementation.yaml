apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: adoption-change-management
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: AdoptionChangeManagementService
    workflow: AdoptionChangeManagementWorkflow
    policyGate: AdoptionChangeManagementPolicyGate
    evidenceProducer: AdoptionChangeManagementEvidenceProducer
    repositoryPort: AdoptionChangeManagementRepositoryPort
  requiredPorts:
  - id: repository.read
    direction: outbound
  - id: artifact.write
    direction: outbound
  - id: schema.validate
    direction: inbound
  - id: policy.evaluate
    direction: outbound
  - id: evidence.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/adoption-change-management/runs
  - GET /api/v1/skills/adoption-change-management/runs/{runId}
  - POST /api/v1/skills/adoption-change-management/runs/{runId}/cancel
  - POST /api/v1/skills/adoption-change-management/runs/{runId}/resume
  events:
  - elmos.skill.adoption-change-management.requested.v1
  - elmos.skill.adoption-change-management.checkpointed.v1
  - elmos.skill.adoption-change-management.completed.v1
  - elmos.skill.adoption-change-management.failed.v1
  workflowSteps:
  - Map changed workflows and affected user groups.
  - Identify adoption barriers and required training assets.
  - Define cohort rollout, support, and feedback collection.
  - Instrument adoption and quality metrics.
  - Run training, office hours, and feedback review.
  - Complete handoff only when support ownership and runbooks are accepted.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

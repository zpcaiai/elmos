apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: pilot-scope-sow-acceptance
  version: 5.2.0
spec:
  positiveScenarios:
  - Two-week pilot with production integration requested
  - Scope expands after discovery
  - Acceptance criteria conflict across stakeholders
  negativeControls:
  - unbounded build everything request
  - production approval without evidence
  checks:
  - id: pilot-scope-sow-acceptance-AC-01
    requirement: Classify engagement phase as discovery, PoC, pilot, production, remediation, or handoff.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: pilot-scope-sow-acceptance-AC-02
    requirement: Define in-scope, out-of-scope, dependencies, customer responsibilities, and non-goals.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: pilot-scope-sow-acceptance-AC-03
    requirement: Make acceptance criteria machine-verifiable where possible.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: pilot-scope-sow-acceptance-AC-04
    requirement: Define stop, escalation, rollback, and re-scope conditions.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: pilot-scope-sow-acceptance-AC-05
    requirement: Bind scope to exact repositories, environments, data classes, and authority boundaries.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

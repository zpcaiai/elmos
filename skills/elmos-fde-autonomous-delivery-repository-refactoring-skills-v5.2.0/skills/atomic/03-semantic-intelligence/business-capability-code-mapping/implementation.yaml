apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: business-capability-code-mapping
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: BusinessCapabilityCodeMappingService
    workflow: BusinessCapabilityCodeMappingWorkflow
    policyGate: BusinessCapabilityCodeMappingPolicyGate
    evidenceProducer: BusinessCapabilityCodeMappingEvidenceProducer
    repositoryPort: BusinessCapabilityCodeMappingRepositoryPort
  requiredPorts:
  - id: graph.query
    direction: outbound
  - id: document.read
    direction: outbound
  - id: trace.read
    direction: outbound
  - id: rule.extract
    direction: inbound
  - id: evidence.append
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/business-capability-code-mapping/runs
  - GET /api/v1/skills/business-capability-code-mapping/runs/{runId}
  - POST /api/v1/skills/business-capability-code-mapping/runs/{runId}/cancel
  - POST /api/v1/skills/business-capability-code-mapping/runs/{runId}/resume
  events:
  - elmos.skill.business-capability-code-mapping.requested.v1
  - elmos.skill.business-capability-code-mapping.checkpointed.v1
  - elmos.skill.business-capability-code-mapping.completed.v1
  - elmos.skill.business-capability-code-mapping.failed.v1
  workflowSteps:
  - Load approved workflow and stakeholder evidence.
  - Query the semantic system graph for candidate implementations.
  - Recover rules and state transitions from code, schema, tests, traces, and docs.
  - Validate material mappings with domain owners or authoritative examples.
  - Record confidence, conflicts, and unknowns.
  - Publish capability-to-system and journey-to-test matrices.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: business-capability-code-mapping
  version: 5.2.0
spec:
  positiveScenarios:
  - Core order workflow spans five services
  - Business rules differ between UI and database routine
  - No owner knows a legacy exception path
  negativeControls:
  - infer business truth from names alone
  - replace domain expert approval
  checks:
  - id: business-capability-code-mapping-AC-01
    requirement: Link each approved workflow step to implementing modules, endpoints, queries, events, screens, and tests.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: business-capability-code-mapping-AC-02
    requirement: Extract explicit and implicit rules, decision tables, state transitions, calculations, and exception policies.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: business-capability-code-mapping-AC-03
    requirement: Record conflicting implementations and undocumented behavior.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: business-capability-code-mapping-AC-04
    requirement: Associate business criticality, users, data classes, and owners with technical components.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: business-capability-code-mapping-AC-05
    requirement: Maintain traceability across revisions and transformations.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

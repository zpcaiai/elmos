apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: static-dynamic-evidence-fusion
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: StaticDynamicEvidenceFusionService
    workflow: StaticDynamicEvidenceFusionWorkflow
    policyGate: StaticDynamicEvidenceFusionPolicyGate
    evidenceProducer: StaticDynamicEvidenceFusionEvidenceProducer
    repositoryPort: StaticDynamicEvidenceFusionRepositoryPort
  requiredPorts:
  - id: evidence.read
    direction: outbound
  - id: claim.evaluate
    direction: outbound
  - id: provenance.verify
    direction: outbound
  - id: graph.write
    direction: outbound
  - id: obligation.create
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/static-dynamic-evidence-fusion/runs
  - GET /api/v1/skills/static-dynamic-evidence-fusion/runs/{runId}
  - POST /api/v1/skills/static-dynamic-evidence-fusion/runs/{runId}/cancel
  - POST /api/v1/skills/static-dynamic-evidence-fusion/runs/{runId}/resume
  events:
  - elmos.skill.static-dynamic-evidence-fusion.requested.v1
  - elmos.skill.static-dynamic-evidence-fusion.checkpointed.v1
  - elmos.skill.static-dynamic-evidence-fusion.completed.v1
  - elmos.skill.static-dynamic-evidence-fusion.failed.v1
  workflowSteps:
  - Normalize evidence into typed artifacts and claims.
  - Check identity, freshness, scope, and provenance compatibility.
  - Fuse compatible evidence under explicit precedence rules.
  - Create contradiction and missing-evidence records.
  - Calculate confidence and release impact without hiding uncertainty.
  - Publish fact snapshots and proof obligations.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: polyglot-semantic-system-graph
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: PolyglotSemanticSystemGraphService
    workflow: PolyglotSemanticSystemGraphWorkflow
    policyGate: PolyglotSemanticSystemGraphPolicyGate
    evidenceProducer: PolyglotSemanticSystemGraphEvidenceProducer
    repositoryPort: PolyglotSemanticSystemGraphRepositoryPort
  requiredPorts:
  - id: parser.execute
    direction: outbound
  - id: compiler.query
    direction: outbound
  - id: lsp.query
    direction: outbound
  - id: graph.write
    direction: outbound
  - id: runtime.trace.read
    direction: outbound
  - id: schema.validate
    direction: inbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/polyglot-semantic-system-graph/runs
  - GET /api/v1/skills/polyglot-semantic-system-graph/runs/{runId}
  - POST /api/v1/skills/polyglot-semantic-system-graph/runs/{runId}/cancel
  - POST /api/v1/skills/polyglot-semantic-system-graph/runs/{runId}/resume
  events:
  - elmos.skill.polyglot-semantic-system-graph.requested.v1
  - elmos.skill.polyglot-semantic-system-graph.checkpointed.v1
  - elmos.skill.polyglot-semantic-system-graph.completed.v1
  - elmos.skill.polyglot-semantic-system-graph.failed.v1
  workflowSteps:
  - Select analyzers according to the support profile and exact toolchain versions.
  - Build syntax, symbol, type, and build dependency layers.
  - Add control, call, data, exception, state, event, transaction, and permission edges.
  - Merge database, API, frontend, infrastructure, test, and runtime evidence.
  - Attach provenance, confidence, freshness, and unresolved candidates to every inferred edge.
  - Validate graph consistency and publish queryable snapshots.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

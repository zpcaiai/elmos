apiVersion: elmos.ai/v1
kind: SkillAcceptance
metadata:
  skillId: polyglot-semantic-system-graph
  version: 5.2.0
spec:
  positiveScenarios:
  - Java and TypeScript monorepo
  - Polyglot microservices with shared schemas
  - Reflection and generated clients create ambiguous edges
  negativeControls:
  - text-only summary
  - regex-only refactor
  - claim resolved dynamic behavior without evidence
  checks:
  - id: polyglot-semantic-system-graph-AC-01
    requirement: Parse supported assets into lossless syntax and typed semantic representations while preserving source locations.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: polyglot-semantic-system-graph-AC-02
    requirement: Resolve symbols, types, calls, control flow, data flow, exceptions, concurrency, transactions, events, and
      side effects.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: polyglot-semantic-system-graph-AC-03
    requirement: Link code to build, runtime, database, API, infrastructure, tests, and generated artifacts.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: polyglot-semantic-system-graph-AC-04
    requirement: Represent ambiguous dynamic dispatch, reflection, macros, code generation, and native boundaries as candidate
      edges with confidence.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  - id: polyglot-semantic-system-graph-AC-05
    requirement: Support incremental rebuilds keyed by RevisionSet and analyzer versions.
    method: deterministic-check-or-independent-review
    requiredEvidence:
    - exact RevisionSet
    - execution trace
    - artifact hash
    - independent result
    blocking: true
  globalGates:
  - schema-valid
  - unique-id-and-owner
  - exact-revision-and-environment
  - default-deny-authority
  - idempotency-and-checkpoint
  - evidence-and-counterexample-retention
  - rollback-or-compensation-defined
  - independent-verification
  - no-E4-E5-or-production-claim
  blockers:
  - UNKNOWN material to acceptance
  - UNSUPPORTED critical path
  - stale or mismatched evidence
  - unresolved critical side effect
  - missing required approval
  - producer self-approval
  - release-time pin unresolved for executed claim
  completion: E3-capability-readiness-at-most

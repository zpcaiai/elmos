apiVersion: elmos.ai/v1
kind: SkillImplementation
metadata:
  skillId: data-event-permission-lineage
  version: 5.2.0
spec:
  architecture:
    style: ports-and-adapters-with-durable-workflow
    domainService: DataEventPermissionLineageService
    workflow: DataEventPermissionLineageWorkflow
    policyGate: DataEventPermissionLineagePolicyGate
    evidenceProducer: DataEventPermissionLineageEvidenceProducer
    repositoryPort: DataEventPermissionLineageRepositoryPort
  requiredPorts:
  - id: graph.query
    direction: outbound
  - id: taint.analyze
    direction: inbound
  - id: policy.trace
    direction: inbound
  - id: event.trace
    direction: inbound
  - id: lineage.write
    direction: outbound
  persistence:
  - append-only Evidence Ledger event
  - append-only Claim Ledger event
  - append-only Change/Effect Ledger event when applicable
  - versioned skill result projection
  - idempotency record
  - checkpoint record
  apis:
  - POST /api/v1/skills/data-event-permission-lineage/runs
  - GET /api/v1/skills/data-event-permission-lineage/runs/{runId}
  - POST /api/v1/skills/data-event-permission-lineage/runs/{runId}/cancel
  - POST /api/v1/skills/data-event-permission-lineage/runs/{runId}/resume
  events:
  - elmos.skill.data-event-permission-lineage.requested.v1
  - elmos.skill.data-event-permission-lineage.checkpointed.v1
  - elmos.skill.data-event-permission-lineage.completed.v1
  - elmos.skill.data-event-permission-lineage.failed.v1
  workflowSteps:
  - Identify critical data classes, events, identities, tenants, and effects.
  - Build static lineage across code, queries, schemas, configs, and infrastructure.
  - Overlay runtime traces and observed policy decisions.
  - Locate missing, transformed, or ambiguous context propagation.
  - Generate risk paths and candidate controls.
  - Publish lineage graphs and verification obligations.
  implementationTasks:
  - Define domain contracts and JSON Schema examples.
  - Implement policy, authority, idempotency, checkpoint, and evidence middleware.
  - Implement ports with replaceable adapters and no adapter-owned completion status.
  - Implement durable workflow, cancellation, resume, compensation, and telemetry.
  - Add deterministic unit, integration, negative-control, failure-injection, and contract tests.
  - Add UI/API projection, runbook, migration, and package traceability.
  requiredTests:
  - happy path
  - negative trigger does not activate
  - authority denial
  - idempotent replay
  - checkpoint and resume
  - stale RevisionSet rejection
  - unknown and unsupported blocker
  - adapter failure
  - independent verification
  - rollback or compensation
  - tenant isolation
  - telemetry and evidence completeness
  migration:
    mode: additive-extension
    mustNotCreate:
    - second Goal store
    - second AI-SIR owner
    - second runtime authority
    - second completion authority
    canonicalBindingsRequired: true

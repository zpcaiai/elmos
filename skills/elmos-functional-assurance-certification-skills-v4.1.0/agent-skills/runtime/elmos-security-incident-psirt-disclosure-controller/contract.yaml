apiVersion: elmos.ai/v3alpha1
kind: SkillContract
metadata:
  name: elmos-security-incident-psirt-disclosure-controller
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  priority: P0
  risk: critical
  group: commercial-assurance
  kernelAuthorities:
  - K1
  - K2
  - K7
  - K8
  canonicalInputs:
  - type: GoalContract
    required: true
    binding: goal_id
  - type: RevisionSet
    required: true
    binding: revision_set_id
  - type: EnvironmentAuthority
    required: true
    binding: execution_epoch+authority_digest
  - type: ProofObligationGraph
    required: true
    binding: proof_graph_id
  - type: BudgetAndPolicyEnvelope
    required: true
    binding: policy_bundle_digest
  outputs:
  - path: psirt-case.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: security-advisory/
    type: ArtifactDirectory
    immutable: true
    evidenceBound: true
    schemaRequired: false
  - path: notification-ledger.json
    type: JsonArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  - path: post-incident-review.md
    type: MarkdownArtifact
    immutable: true
    evidenceBound: true
    schemaRequired: true
  dependencies:
  - elmos-vulnerability-vex-kev-response-governor
  failureMode: fail-closed
  ownership:
    intent: K1
    semantic: K2/K3
    reasoning: K4
    transformation: K5
    verification: K6
    execution: K7
    completion: K8
  invariants:
  - every terminal result binds one exact RevisionSet
  - every write validates tenant, execution epoch, lease generation and fencing token
  - every side effect has idempotency and reconciliation state
  - critical UNKNOWN or UNSUPPORTED cannot become COMPLETE
  - generator, repairer and certifier are independently attributable
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  externalDependencies:
  - skill: elmos-ai-incident-kill-switch-controller
    package: elmos-ai-capability-enhancement-skills
    versionConstraint: '>=4.1.0,<4.2.0'
    mode: required-base-evidence-producer
  - skill: elmos-ai-system-model-card-generator
    package: elmos-ai-capability-enhancement-skills
    versionConstraint: '>=4.1.0,<4.2.0'
    mode: required-base-evidence-producer
  packageRole: certification
  standaloneCompletionCeiling: K8_CERTIFICATION_DECISION

apiVersion: elmos.ai/v3alpha1
kind: TargetAdapter
metadata:
  name: rekor-transparency-log
  ecosystem: Sigstore Rekor
  version: 4.0.0
spec:
  adapterKind: transparency
  maturity: P1
  modes:
  - publish
  - verify
  - monitor
  interfaces:
  - detect
  - profile
  - import
  - lower
  - emit
  - native_validate
  - upgrade
  - evidence
  versionPolicy:
    discovery: official metadata, source lockfile or exact customer environment
    pin: exact version and artifact digest at release
    evidenceInvalidation:
    - API/DSL/schema/protocol change
    - runtime/plugin change
    - security advisory or signer revocation
    - conformance suite change
  authority:
    ambientFilesystem: false
    ambientNetwork: false
    ambientSecrets: false
    requestScoped: true
    failureMode: fail-closed
  artifacts:
  - rekor-transparency-log exact-version profile
  - rekor-transparency-log capability and semantic-gap map
  - rekor-transparency-log native conformance evidence
  - rekor-transparency-log deployment/rollback profile
  releaseBoundary: adapter package presence is not native conformance

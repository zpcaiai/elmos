policy: policies/rego/measurement_uncertainty_gate.rego
intent: critical conformity decision requires declared uncertainty and policy-approved decision rule
cases:
- name: allow-complete-independent-current
  input:
    critical: true
    status: TESTED
    revision_bound: true
    independent: true
    evidence_fresh: true
    side_effects_settled: true
    method_rule_satisfied: true
  allow: true
- name: deny-critical-unknown
  input:
    critical: true
    status: UNKNOWN
    revision_bound: true
    independent: true
    evidence_fresh: true
    side_effects_settled: true
    method_rule_satisfied: true
  allow: false
- name: deny-self-certification
  input:
    critical: true
    status: TESTED
    revision_bound: true
    independent: false
    evidence_fresh: true
    side_effects_settled: true
    method_rule_satisfied: true
  allow: false

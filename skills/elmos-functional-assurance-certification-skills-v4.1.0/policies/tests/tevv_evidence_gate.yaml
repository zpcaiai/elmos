policy: policies/rego/tevv_evidence_gate.rego
intent: TEVV claim requires representative scenario, valid metric, uncertainty and independent review
cases:
- name: allow-complete-independent-current
  input:
    critical: true
    status: TESTED
    revision_bound: true
    independent: true
    evidence_fresh: true
    side_effects_settled: true
    method_rule_satisfied: true
  allow: true
- name: deny-critical-unknown
  input:
    critical: true
    status: UNKNOWN
    revision_bound: true
    independent: true
    evidence_fresh: true
    side_effects_settled: true
    method_rule_satisfied: true
  allow: false
- name: deny-self-certification
  input:
    critical: true
    status: TESTED
    revision_bound: true
    independent: false
    evidence_fresh: true
    side_effects_settled: true
    method_rule_satisfied: true
  allow: false

apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: polyglot-route-certification
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-polyglot-route-certifier
  stateStore: PostgreSQL durable event journal
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
  stages:
  - id: S01
    name: freeze-route-envelope
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S02
    name: compile-source-profile
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S03
    name: compile-target-profile
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S04
    name: emit-gap-obligations
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S05
    name: build-source-target
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S06
    name: differential-runtime
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S07
    name: seal-route-evidence
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S08
    name: independent-route-decision
    dependsOn:
    - S07
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

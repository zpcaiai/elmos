apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: accreditation-readiness
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  execution: durable-event-sourced
  steps:
  - id: 01-scope-matrix
    dependsOn: []
    command: ScopeMatrix
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 02-competence
    dependsOn:
    - 01-scope-matrix
    command: Competence
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 03-impartiality
    dependsOn:
    - 02-competence
    command: Impartiality
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 04-witness-assessment
    dependsOn:
    - 03-impartiality
    command: WitnessAssessment
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 05-findings
    dependsOn:
    - 04-witness-assessment
    command: Findings
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 06-closure
    dependsOn:
    - 05-findings
    command: Closure
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 07-export
    dependsOn:
    - 06-closure
    command: Export
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  completion: independent K8 decision bound to exact RevisionSet and sealed evidence root

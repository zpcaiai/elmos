apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: certificate-verifiable-issuance
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  execution: durable-event-sourced
  steps:
  - id: 01-profile
    dependsOn: []
    command: Profile
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 02-claim-map
    dependsOn:
    - 01-profile
    command: ClaimMap
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 03-evidence-root
    dependsOn:
    - 02-claim-map
    command: EvidenceRoot
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 04-signature
    dependsOn:
    - 03-evidence-root
    command: Signature
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 05-status-list
    dependsOn:
    - 04-signature
    command: StatusList
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 06-transparency-log
    dependsOn:
    - 05-status-list
    command: TransparencyLog
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 07-relying-party-test
    dependsOn:
    - 06-transparency-log
    command: RelyingPartyTest
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  completion: independent K8 decision bound to exact RevisionSet and sealed evidence root

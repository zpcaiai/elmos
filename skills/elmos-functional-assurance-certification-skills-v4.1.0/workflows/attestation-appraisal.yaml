apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: attestation-appraisal
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  execution: durable-event-sourced
  steps:
  - id: 01-endorsement
    dependsOn: []
    command: Endorsement
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 02-reference-values
    dependsOn:
    - 01-endorsement
    command: ReferenceValues
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 03-evidence
    dependsOn:
    - 02-reference-values
    command: Evidence
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 04-appraisal
    dependsOn:
    - 03-evidence
    command: Appraisal
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 05-policy
    dependsOn:
    - 04-appraisal
    command: Policy
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 06-receipt
    dependsOn:
    - 05-policy
    command: Receipt
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 07-admission
    dependsOn:
    - 06-receipt
    command: Admission
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  completion: independent K8 decision bound to exact RevisionSet and sealed evidence root

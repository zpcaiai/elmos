apiVersion: elmos.ai/v3alpha1
kind: DurableWorkflow
metadata:
  name: release-certification
  title: E0-E5 release certification
spec:
  routeOwner: domain-pack.project-generation
  revisionBound: true
  nodes:
  - id: freeze-revision
    sequence: 0
    owner: K7
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
  - id: seal-evidence
    sequence: 1
    owner: K1
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - freeze-revision
  - id: evaluate-e0
    sequence: 2
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - seal-evidence
  - id: evaluate-e1
    sequence: 3
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-e0
  - id: evaluate-e2
    sequence: 4
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-e1
  - id: evaluate-e3
    sequence: 5
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-e2
  - id: evaluate-e4
    sequence: 6
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-e3
  - id: evaluate-e5
    sequence: 7
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-e4
  - id: evaluate-p05
    sequence: 8
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-e5
  - id: settle-side-effects
    sequence: 9
    owner: K7
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-p05
  - id: issue-or-block
    sequence: 10
    owner: K8
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - settle-side-effects
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  authority: Environment-owned; every write checks tenant, epoch, lease generation and fencing
  evidence: each node emits immutable evidence or explicit NOT_EXECUTED reason

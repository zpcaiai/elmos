apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: surveillance-recertification
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  execution: durable-event-sourced
  steps:
  - id: 01-signal-ingest
    dependsOn: []
    command: SignalIngest
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 02-risk-selection
    dependsOn:
    - 01-signal-ingest
    command: RiskSelection
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 03-surveillance
    dependsOn:
    - 02-risk-selection
    command: Surveillance
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 04-scope-impact
    dependsOn:
    - 03-surveillance
    command: ScopeImpact
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 05-decision
    dependsOn:
    - 04-scope-impact
    command: Decision
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 06-status-update
    dependsOn:
    - 05-decision
    command: StatusUpdate
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  - id: 07-notification
    dependsOn:
    - 06-status-update
    command: Notification
    checkpoint: true
    retry:
      maxAttempts: 2
      backoff: exponential
    authority: environment-owned
    requiredEvidence:
    - input-hash
    - tool/version-digest
    - result-hash
    - trace-id
    failure: critical UNKNOWN, stale authority or unsettled side effect => BLOCKED
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  completion: independent K8 decision bound to exact RevisionSet and sealed evidence root

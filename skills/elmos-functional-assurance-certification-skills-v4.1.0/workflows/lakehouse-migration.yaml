apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: lakehouse-migration
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-warehouse-lakehouse-migration-certifier
  stateStore: PostgreSQL 17 append-only journal plus WORM evidence
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
    machineWallClockEta: true
  stages:
  - id: S01
    name: freeze-table-formats
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S02
    name: compile-catalog-lineage
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S03
    name: translate-schema-partitions
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S04
    name: copy-snapshot
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S05
    name: incremental-sync
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S06
    name: query-dual-run
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S07
    name: optimize
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  - id: S08
    name: certify
    dependsOn:
    - S07
    checkpoint: true
    authority: environment-owned
    idempotency: required for writes
    failurePolicy: critical unknown/refuted/unsupported => BLOCK; retry only idempotent or reconciled operations
    evidence:
    - input-hash
    - tool-version-digest
    - command-exit-code
    - trace-reference
    - resource-and-cost-event
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

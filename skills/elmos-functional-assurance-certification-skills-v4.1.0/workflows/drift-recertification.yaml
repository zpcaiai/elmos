apiVersion: elmos.ai/v3alpha1
kind: DurableWorkflow
metadata:
  name: drift-recertification
  title: Capability drift and recertification
spec:
  routeOwner: domain-pack.project-generation
  revisionBound: true
  nodes:
  - id: detect-upstream-change
    sequence: 0
    owner: K2
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
  - id: classify-impact
    sequence: 1
    owner: K1
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - detect-upstream-change
  - id: invalidate-evidence
    sequence: 2
    owner: K6
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - classify-impact
  - id: select-regression-envelope
    sequence: 3
    owner: K1
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - invalidate-evidence
  - id: execute-regression
    sequence: 4
    owner: K7
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - select-regression-envelope
  - id: evaluate-certificate
    sequence: 5
    owner: K8
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - execute-regression
  - id: renew-or-revoke
    sequence: 6
    owner: K8
    retry:
      maxAttempts: 3
      backoff: exponential
      idempotencyRequired: true
    checkpoint: true
    failure: BLOCKED for critical unknown; otherwise route counterexample to bounded repair
    dependsOn:
    - evaluate-certificate
  terminalStates:
  - COMPLETED
  - BLOCKED
  - FAILED
  - CANCELLED
  authority: Environment-owned; every write checks tenant, epoch, lease generation and fencing
  evidence: each node emits immutable evidence or explicit NOT_EXECUTED reason

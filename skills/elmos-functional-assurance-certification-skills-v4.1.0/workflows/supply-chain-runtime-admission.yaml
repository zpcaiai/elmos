apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: supply-chain-runtime-admission
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-runtime-admission-attestation-controller
  stateStore: PostgreSQL durable event journal
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
  stages:
  - id: S01
    name: verify-source-build-provenance
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S02
    name: verify-sbom-aibom
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S03
    name: verify-vex
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S04
    name: verify-signatures
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S05
    name: remote-attestation
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S06
    name: policy-admission
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S07
    name: continuous-monitor
    dependsOn:
    - S06
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

apiVersion: elmos.ai/v3alpha1
kind: DurableCertificationWorkflow
metadata:
  name: certificate-revocation-recertification
  version: 4.0.0
spec:
  routeOwner: domain-pack.project-generation
  routable: false
  skill: elmos-certificate-drift-revocation-controller
  stateStore: PostgreSQL durable event journal
  execution:
    pauseResumeCancel: true
    leaseFencing: true
    sideEffectReconciliation: true
  stages:
  - id: S01
    name: detect-trigger
    dependsOn: []
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S02
    name: compute-impact
    dependsOn:
    - S01
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S03
    name: suspend-claims
    dependsOn:
    - S02
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S04
    name: invalidate-evidence
    dependsOn:
    - S03
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S05
    name: execute-incremental-validation
    dependsOn:
    - S04
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  - id: S06
    name: reissue-or-revoke
    dependsOn:
    - S05
    checkpoint: true
    authority: environment-owned
    failurePolicy: BLOCK critical; retry only idempotent/reconciled operations
    evidence:
    - input-hash
    - tool-and-version-digest
    - command-or-policy-result
    - trace-reference
  terminalRule: COMPLETED only after independent K8 decision; otherwise typed BLOCKED/FAILED/CANCELLED

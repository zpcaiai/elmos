          - ISSUED
          - SUSPENDED
          - REVOKED
          - EXPIRED
          - SUPERSEDED
        valid_until: *id007
        status_checked_at: *id007
        statement_artifact_digest: *id003
        verification_artifact_digest: *id003
      required:
      - attestation_digest
      - subject_artifact_digest
      - scope_digest
      - profile_id
      - status
      - valid_until
      - status_checked_at
      - statement_artifact_digest
      - verification_artifact_digest
    RevokeAttestationRequest:
      type: object
      additionalProperties: false
      properties:
        attestation_digest: *id003
        reason_code: *id004
        reason: *id006
        revocation_approval_id: *id004
      required:
      - attestation_digest
      - reason_code
      - reason
      - revocation_approval_id
    AcceptedResource:
      type: object
      additionalProperties: false
      properties:
        resource_id: *id004
        revision: *id008
        state: *id006
      required:
      - resource_id
      - revision
      - state

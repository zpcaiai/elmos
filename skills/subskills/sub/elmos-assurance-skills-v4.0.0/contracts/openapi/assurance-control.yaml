components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id002
        message: *id002
        trace_id: *id001
        retryable:
          type: boolean
      required:
      - code
      - message
      - trace_id
      - retryable
    RunState: &id005
      type: object
      additionalProperties: false
      properties:
        run_id: *id001
        state:
          enum:
          - QUEUED
          - RUNNING
          - PAUSED_BUDGET
          - CANCEL_REQUESTED
          - CANCELLED
          - SEALED
          - AUDITING
          - DECIDED
        verdict:
          anyOf:
          - enum:
            - PASS
            - FAIL
            - INCONCLUSIVE
          - type: 'null'
        revision:
          type: integer
          minimum: 0
        blocking_reasons:
          type: array
          items: *id002
          minItems: 0
      required:
      - run_id
      - state
      - verdict
      - revision
      - blocking_reasons
    CreateInventoryRequest:
      type: object
      additionalProperties: false
      properties:
        source_artifact_digest: &id003
          type: string
          pattern: ^[0-9a-f]{64}$
        scope_digest: *id003
        discovery_profile_id: &id004
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$
        runtime_observation_allowed:
          type: boolean
      required:
      - source_artifact_digest
      - scope_digest
      - discovery_profile_id
      - runtime_observation_allowed
    CreateContractDraftRequest:
      type: object
      additionalProperties: false
      properties:
        inventory_id: *id004
        requirement_artifact_digest: *id003
        parent_contract_digest:
          anyOf:
          - *id003
          - type: 'null'
        proposal_artifact_digest: *id003
      required:
      - inventory_id
      - requirement_artifact_digest
      - parent_contract_digest
      - proposal_artifact_digest
    ApproveContractRequest:
      type: object
      additionalProperties: false
      properties:
        contract_digest: *id003
        scope_digest: *id003
        approval_challenge_id: *id004
        decision:
          enum:
          - APPROVE
          - REJECT
          - NEEDS_CLARIFICATION
        rationale: &id006
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - contract_digest
      - scope_digest
      - approval_challenge_id
      - decision
      - rationale
    CreateTestPlanRequest:
      type: object
      additionalProperties: false
      properties:
        contract_digest: *id003
        scope_digest: *id003
        coverage_profile_id: *id004
        runner_matrix_digest: *id003
        budget_minor_units: &id008
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - contract_digest
      - scope_digest
      - coverage_profile_id
      - runner_matrix_digest
      - budget_minor_units
      - currency
    CreateRunRequest:
      type: object
      additionalProperties: false
      properties:
        plan_id: *id004
        scope_digest: *id003
        revision_set:
          type: object
          additionalProperties: false
          properties:
            source: *id003
            target: *id003
            artifact: *id003
            scope: *id003
            contract: *id003
            policy: *id003
            environment: *id003
            toolchain: *id003
            suite: *id003
            data: *id003
            comparator: *id003
            rules: *id003
          required:

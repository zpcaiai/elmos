        profile_id: *id004
        verdict:
          anyOf:
          - enum:
            - PASS
            - FAIL
            - INCONCLUSIVE
          - type: 'null'
        blocking_codes:
          type: array
          items: *id004
          minItems: 0
        decision_artifact_digest:
          anyOf:
          - *id003
          - type: 'null'
      required:

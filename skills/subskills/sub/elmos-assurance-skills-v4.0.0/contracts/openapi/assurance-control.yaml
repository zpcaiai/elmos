  /projects/{projectId}/assurance/inventories:
    post:
      operationId: createInventory
      summary: createInventory
      description: Implementation contract only. Require permission inventory:write; compare authenticated tenant/project.
        No caller-supplied authority. Raw artifacts use brokered content-addressed upload, never arbitrary callback
        URLs.
      parameters:
      - name: projectId
        in: path
        required: true
        schema: &id001
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      - name: If-Match
        in: header
        required: true
        schema: &id002
          type: string
          minLength: 1
          maxLength: 4096
      security:
      - bearerAuth: []
      x-required-permission: inventory:write
      responses:
        '202':
          description: Accepted resource or current state; async response is not a test PASS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResource'
        '400':
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unsupported semantics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota/concurrency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequest'

schema_version: '1.0'
workspace_root: .etgb/workspaces
artifact_root: reports/evidence
max_parallel: 3
default_timeout_seconds: 900
network_policy: deny-by-default
container_runtime: docker
resource_limits:
  cpu: 4
  memory: 8GiB
  pids: 512
  disk: 20GiB
secrets_policy: ephemeral-scoped
redaction:
  enabled: true
  patterns:
  - token
  - password
  - secret
  - authorization
retries:
  infrastructure_only: 1
  test_failures: 0
random_seeds:
- 17
- 43
- 101

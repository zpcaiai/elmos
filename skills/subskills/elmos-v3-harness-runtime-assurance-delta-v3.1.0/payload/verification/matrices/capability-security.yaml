apiVersion: elmos.ai/v3delta1
kind: VerificationMatrix
metadata:
  name: capability-security
  version: 3.1.0
spec:
  cases:
  - case: use after invocation
    expected: rejected
  - case: cancel then use
    expected: rejected
  - case: plugin cached handle
    expected: rejected
  - case: caller forged verified context
    expected: stripped
  - case: account switch
    expected: UNKNOWN/DENY
  - case: remote mutable privileged tool
    expected: DENY

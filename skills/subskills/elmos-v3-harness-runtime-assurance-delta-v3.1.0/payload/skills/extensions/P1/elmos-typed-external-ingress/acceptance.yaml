apiVersion: elmos.ai/v3delta1
kind: KernelExtensionAcceptance
metadata:
  skill: elmos-typed-external-ingress
  version: 3.1.0
spec:
  hardGates:
  - external result is never rewritten as a fake user message
  - producer, originating call, event, causation and correlation identities are persisted
  - duplicate delivery is idempotently rejected or reconciled
  - typed text/media/encrypted/unknown content is preserved without stringify loss
  - resume and paginated history reproduce ingress causality
  scenarios:
  - id: ELMOS-V3D-012-A01
    title: external result is never rewritten as a fake user message
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-typed-external-ingress processes a production lifecycle transition
    then:
    - external result is never rewritten as a fake user message is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-012-A02
    title: producer, originating call, event, causation and correlation identities are persisted
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-typed-external-ingress processes a production lifecycle transition
    then:
    - producer, originating call, event, causation and correlation identities are persisted is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-012-A03
    title: duplicate delivery is idempotently rejected or reconciled
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-typed-external-ingress processes a production lifecycle transition
    then:
    - duplicate delivery is idempotently rejected or reconciled is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-012-A04
    title: typed text/media/encrypted/unknown content is preserved without stringify loss
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-typed-external-ingress processes a production lifecycle transition
    then:
    - typed text/media/encrypted/unknown content is preserved without stringify loss is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-012-A05
    title: resume and paginated history reproduce ingress causality
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-typed-external-ingress processes a production lifecycle transition
    then:
    - resume and paginated history reproduce ingress causality is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-012-NEG-STALE
    title: Reject stale authority, generation or lease
    given:
    - stale execution context
    when: an authoritative effect or commit is attempted
    then:
    - operation is rejected
    - audit event is emitted
    - no completion evidence is accepted
    priority: P0
  - id: ELMOS-V3D-012-NEG-REPLAY
    title: Reject replay divergence
    given:
    - committed journal and artifacts
    when: the execution is replayed or resumed
    then:
    - same effective state is reconstructed
    - provider loss is explicit
    - divergence blocks certification
    priority: P0
  - id: ELMOS-V3D-012-RECOVERY
    title: Recover after worker, connection or plugin interruption
    given:
    - durable checkpoint and fencing state
    when: a replacement worker resumes
    then:
    - committed side effects are not duplicated
    - stale actors are fenced
    - lineage remains complete
    priority: P0
  releaseRequirement: all P0 scenarios pass in target environment

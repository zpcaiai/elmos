apiVersion: elmos.ai/v3delta1
kind: KernelExtensionSkill
metadata:
  id: ELMOS-V3D-011
  name: elmos-registered-durable-plugin-events
  version: 3.1.0
  priority: P1
  labels:
    routable: 'false'
    architecture: eight-kernel
    commercialTier: production
spec:
  summary: 插件只能写入注册、版本化、可升级的 durable event；required state 与 optional observation 具有不同恢复语义。
  ownerKernels:
  - K7
  - K8
  extends:
  - elmos-harness-runtime-kernel
  - elmos-certification-kernel
  dependencies:
  - name: elmos-harness-runtime-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  - name: elmos-certification-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  - name: elmos-tool-result-interception-commit
    version: '>=3.1.0 <4.0.0'
    kind: kernel-extension
  components:
  - DurableEventRegistry
  - EventSchemaValidator
  - EventUpgrader
  - ProjectionRegistry
  - UnknownEventRecoveryGate
  invariants:
  - plugins cannot append arbitrary unregistered string event types
  - required state is never treated as ignorable observation
  - event schema upgrades are deterministic and content-addressed
  - unknown required event prevents authoritative resume
  upstreamEvidence:
  - deepseek-harness-discussion-4815-ecosystem-signal
  runtime:
    durable: true
    multiTenant: true
    idempotencyRequired: true
    outboxRequired: true
    environmentAuthorityRequired: true
    proofObligationAware: true
    failMode: fail-closed
  security:
    llmAuthoritativeOracle: DENY
    selfCertification: DENY
    authorityWidening: DENY
    providerTypesInCore: DENY
  lifecycle:
    initial: CANDIDATE
    activationGate: DELTA_TARGET_CONFORMANCE
    immutableVersions: true

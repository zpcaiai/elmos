apiVersion: elmos.ai/v3delta1
kind: KernelExtensionAcceptance
metadata:
  skill: elmos-subagent-model-execution-spec
  version: 3.1.0
spec:
  hardGates:
  - provider, model, reasoning effort and output limit are explicit and policy-validated
  - child environment and authority are subsets of parent-authorized resources
  - child gets its own finalized step execution plan
  - model selection cannot implicitly widen tools, network, secrets or workspace scope
  - cost, token and wall-clock budgets are reserved before child activation
  scenarios:
  - id: ELMOS-V3D-013-A01
    title: provider, model, reasoning effort and output limit are explicit and policy-validated
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-subagent-model-execution-spec processes a production lifecycle transition
    then:
    - provider, model, reasoning effort and output limit are explicit and policy-validated is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-013-A02
    title: child environment and authority are subsets of parent-authorized resources
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-subagent-model-execution-spec processes a production lifecycle transition
    then:
    - child environment and authority are subsets of parent-authorized resources is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-013-A03
    title: child gets its own finalized step execution plan
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-subagent-model-execution-spec processes a production lifecycle transition
    then:
    - child gets its own finalized step execution plan is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-013-A04
    title: model selection cannot implicitly widen tools, network, secrets or workspace scope
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-subagent-model-execution-spec processes a production lifecycle transition
    then:
    - model selection cannot implicitly widen tools, network, secrets or workspace scope is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-013-A05
    title: cost, token and wall-clock budgets are reserved before child activation
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-subagent-model-execution-spec processes a production lifecycle transition
    then:
    - cost, token and wall-clock budgets are reserved before child activation is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P1
  - id: ELMOS-V3D-013-NEG-STALE
    title: Reject stale authority, generation or lease
    given:
    - stale execution context
    when: an authoritative effect or commit is attempted
    then:
    - operation is rejected
    - audit event is emitted
    - no completion evidence is accepted
    priority: P0
  - id: ELMOS-V3D-013-NEG-REPLAY
    title: Reject replay divergence
    given:
    - committed journal and artifacts
    when: the execution is replayed or resumed
    then:
    - same effective state is reconstructed
    - provider loss is explicit
    - divergence blocks certification
    priority: P0
  - id: ELMOS-V3D-013-RECOVERY
    title: Recover after worker, connection or plugin interruption
    given:
    - durable checkpoint and fencing state
    when: a replacement worker resumes
    then:
    - committed side effects are not duplicated
    - stale actors are fenced
    - lineage remains complete
    priority: P0
  releaseRequirement: all P0 scenarios pass in target environment

apiVersion: elmos.ai/v3delta1
kind: KernelExtensionAcceptance
metadata:
  skill: elmos-tool-result-interception-commit
  version: 3.1.0
spec:
  hardGates:
  - rawResult and effectiveResult are both content-addressed and revision-bound
  - call identity, authority, environment and originating plan cannot be silently mutated
  - completion event and model input consume the same committed result
  - cancel, timeout, interceptor failure and error replacement have deterministic terminal semantics
  - replay reproduces the committed effective result without re-running non-replay-safe interceptors
  scenarios:
  - id: ELMOS-V3D-001-A01
    title: rawResult and effectiveResult are both content-addressed and revision-bound
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-tool-result-interception-commit processes a production lifecycle transition
    then:
    - rawResult and effectiveResult are both content-addressed and revision-bound is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-001-A02
    title: call identity, authority, environment and originating plan cannot be silently mutated
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-tool-result-interception-commit processes a production lifecycle transition
    then:
    - call identity, authority, environment and originating plan cannot be silently mutated is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-001-A03
    title: completion event and model input consume the same committed result
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-tool-result-interception-commit processes a production lifecycle transition
    then:
    - completion event and model input consume the same committed result is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-001-A04
    title: cancel, timeout, interceptor failure and error replacement have deterministic terminal semantics
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-tool-result-interception-commit processes a production lifecycle transition
    then:
    - cancel, timeout, interceptor failure and error replacement have deterministic terminal semantics is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-001-A05
    title: replay reproduces the committed effective result without re-running non-replay-safe interceptors
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-tool-result-interception-commit processes a production lifecycle transition
    then:
    - replay reproduces the committed effective result without re-running non-replay-safe interceptors is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-001-NEG-STALE
    title: Reject stale authority, generation or lease
    given:
    - stale execution context
    when: an authoritative effect or commit is attempted
    then:
    - operation is rejected
    - audit event is emitted
    - no completion evidence is accepted
    priority: P0
  - id: ELMOS-V3D-001-NEG-REPLAY
    title: Reject replay divergence
    given:
    - committed journal and artifacts
    when: the execution is replayed or resumed
    then:
    - same effective state is reconstructed
    - provider loss is explicit
    - divergence blocks certification
    priority: P0
  - id: ELMOS-V3D-001-RECOVERY
    title: Recover after worker, connection or plugin interruption
    given:
    - durable checkpoint and fencing state
    when: a replacement worker resumes
    then:
    - committed side effects are not duplicated
    - stale actors are fenced
    - lineage remains complete
    priority: P0
  releaseRequirement: all P0 scenarios pass in target environment

apiVersion: elmos.ai/v3delta1
kind: KernelExtensionSkill
metadata:
  id: ELMOS-V3D-006
  name: elmos-environment-attachment-authority
  version: 3.1.0
  priority: P0
  labels:
    routable: 'false'
    architecture: eight-kernel
    commercialTier: production
spec:
  summary: Tool/MCP/Executor 的有效权限来自拥有该能力的 Environment/Attachment 快照与上层策略交集，而不是 Thread 全局状态。
  ownerKernels:
  - K7
  extends:
  - elmos-harness-runtime-kernel
  dependencies:
  - name: elmos-harness-runtime-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  components:
  - AuthorityOwnerResolver
  - EnvironmentAuthoritySnapshot
  - AttachmentAuthorityBinder
  - EffectivePolicyCalculator
  - RuntimeRepublisher
  invariants:
  - ToolInvocation→EnvironmentRef→AuthoritySnapshot→EffectivePolicy is mandatory
  - effective authority equals owner authority intersected with parent and global policy
  - thread defaults are fallback inputs only when an explicit contract permits them
  - authority snapshot identity is included in plan, journal, artifacts and certificate
  upstreamEvidence:
  - openai/codex#40728
  - openai/codex#40771
  runtime:
    durable: true
    multiTenant: true
    idempotencyRequired: true
    outboxRequired: true
    environmentAuthorityRequired: true
    proofObligationAware: true
    failMode: fail-closed
  security:
    llmAuthoritativeOracle: DENY
    selfCertification: DENY
    authorityWidening: DENY
    providerTypesInCore: DENY
  lifecycle:
    initial: CANDIDATE
    activationGate: DELTA_TARGET_CONFORMANCE
    immutableVersions: true

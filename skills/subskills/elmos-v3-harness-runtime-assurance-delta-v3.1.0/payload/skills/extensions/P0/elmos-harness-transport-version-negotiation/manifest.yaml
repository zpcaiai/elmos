apiVersion: elmos.ai/v3delta1
kind: KernelExtensionSkill
metadata:
  id: ELMOS-V3D-009
  name: elmos-harness-transport-version-negotiation
  version: 3.1.0
  priority: P0
  labels:
    routable: 'false'
    architecture: eight-kernel
    commercialTier: production
spec:
  summary: Provider transport、history、typed result、schema dialect、mode 与版本差异通过能力协商和版本隔离层处理。
  ownerKernels:
  - K7
  extends:
  - elmos-harness-runtime-kernel
  dependencies:
  - name: elmos-harness-runtime-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  - name: elmos-environment-attachment-authority
    version: '>=3.1.0 <4.0.0'
    kind: kernel-extension
  components:
  - ProtocolHandshake
  - CapabilityMatrix
  - VersionMapper
  - TransportAuthenticator
  - CompatibilityGate
  invariants:
  - canonical Elmos types are stable across upstream renames
  - capability negotiation result is immutable for a connection epoch
  - history pagination and consistency are explicit protocol properties
  - transport authentication is separate from execution authority
  upstreamEvidence:
  - openai/codex#40787
  - openai/codex#40775
  - openai/codex#40737
  - deepseek-harness-v0.1.2-alpha.1
  runtime:
    durable: true
    multiTenant: true
    idempotencyRequired: true
    outboxRequired: true
    environmentAuthorityRequired: true
    proofObligationAware: true
    failMode: fail-closed
  security:
    llmAuthoritativeOracle: DENY
    selfCertification: DENY
    authorityWidening: DENY
    providerTypesInCore: DENY
  lifecycle:
    initial: CANDIDATE
    activationGate: DELTA_TARGET_CONFORMANCE
    immutableVersions: true

apiVersion: elmos.ai/v3delta1
kind: KernelExtensionImplementationPlan
metadata:
  skill: elmos-skill-trust-domain-provenance
  version: 3.1.0
spec:
  ports:
  - name: DurableJournal
    mode: append-only-transactional-outbox
    required: true
  - name: ArtifactStore
    mode: content-addressed
    required: true
  - name: PolicyDecisionPoint
    mode: ALLOW_DENY_REVIEW
    required: true
  - name: EnvironmentAuthority
    mode: owner-revisioned
    required: true
  - name: ProofObligationService
    mode: graph
    required: true
  - name: AdapterCapabilityNegotiator
    mode: version-isolated-fail-closed
    required: true
  components:
  - name: SkillProvenanceVerifier
    deployment: control-plane-or-execution-plane-as-declared
    state: database-or-content-addressed-artifact
  - name: CanonicalPathGuard
    deployment: control-plane-or-execution-plane-as-declared
    state: database-or-content-addressed-artifact
  - name: TrustDomainPolicy
    deployment: control-plane-or-execution-plane-as-declared
    state: database-or-content-addressed-artifact
  - name: SignatureVerifier
    deployment: control-plane-or-execution-plane-as-declared
    state: database-or-content-addressed-artifact
  - name: InvocationEvidenceRecorder
    deployment: control-plane-or-execution-plane-as-declared
    state: database-or-content-addressed-artifact
  workflow:
    compiler: Workflow IR v3
    retries: typed-idempotent
    checkpoint: before-and-after-authoritative-boundary
    compensation: required-for-side-effects
    termination: bounded-with-no-progress-detection
  data:
    tenantIsolation: RLS-plus-object-prefix
    lineage: mandatory
    retention: policy-governed
    sensitiveValues: never-in-logs-or-prompts
  rollout:
    shadow: true
    canary: true
    dualRead: true
    automaticRollbackOn:
    - authority widening
    - replay mismatch
    - stale-generation acceptance
    - result commit divergence

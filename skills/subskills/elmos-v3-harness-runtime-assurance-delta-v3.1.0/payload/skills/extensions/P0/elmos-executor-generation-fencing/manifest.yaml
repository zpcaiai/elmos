apiVersion: elmos.ai/v3delta1
kind: KernelExtensionSkill
metadata:
  id: ELMOS-V3D-007
  name: elmos-executor-generation-fencing
  version: 3.1.0
  priority: P0
  labels:
    routable: 'false'
    architecture: eight-kernel
    commercialTier: production
spec:
  summary: 区分同一 Executor 重连与计划替换；所有远程 RPC、进程、回调和 Artifact commit 携带 generation/epoch fencing。
  ownerKernels:
  - K7
  extends:
  - elmos-harness-runtime-kernel
  dependencies:
  - name: elmos-harness-runtime-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  - name: elmos-environment-attachment-authority
    version: '>=3.1.0 <4.0.0'
    kind: kernel-extension
  - name: elmos-invocation-scoped-capability-lease
    version: '>=3.1.0 <4.0.0'
    kind: kernel-extension
  components:
  - ExecutorConnectionStateMachine
  - GenerationIssuer
  - LateResultFence
  - OutstandingWorkReconciler
  - LiveProbeGate
  invariants:
  - authoritative remote commit requires matching executor_generation and connection_epoch
  - generation only increases for a logical environment
  - retired generations cannot publish state even if cancellation was lost
  - replacement preserves logical environment identity but not stale capabilities
  upstreamEvidence:
  - openai/codex#40710
  runtime:
    durable: true
    multiTenant: true
    idempotencyRequired: true
    outboxRequired: true
    environmentAuthorityRequired: true
    proofObligationAware: true
    failMode: fail-closed
  security:
    llmAuthoritativeOracle: DENY
    selfCertification: DENY
    authorityWidening: DENY
    providerTypesInCore: DENY
  lifecycle:
    initial: CANDIDATE
    activationGate: DELTA_TARGET_CONFORMANCE
    immutableVersions: true

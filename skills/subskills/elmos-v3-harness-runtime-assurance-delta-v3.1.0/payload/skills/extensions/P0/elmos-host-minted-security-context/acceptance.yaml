apiVersion: elmos.ai/v3delta1
kind: KernelExtensionAcceptance
metadata:
  skill: elmos-host-minted-security-context
  version: 3.1.0
spec:
  hardGates:
  - caller-supplied verified context is stripped before policy evaluation
  - Host minting binds plugin, tool, account, tenant, environment, invocation and policy version
  - eligibility failures and account races yield UNKNOWN or DENY, never optimistic grant
  - security-context lookup time is charged to the invocation timeout budget
  - remote, mutable, undeclared or argument-bearing privileged paths are denied unless explicitly contracted
  scenarios:
  - id: ELMOS-V3D-005-A01
    title: caller-supplied verified context is stripped before policy evaluation
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-host-minted-security-context processes a production lifecycle transition
    then:
    - caller-supplied verified context is stripped before policy evaluation is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-005-A02
    title: Host minting binds plugin, tool, account, tenant, environment, invocation and policy version
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-host-minted-security-context processes a production lifecycle transition
    then:
    - Host minting binds plugin, tool, account, tenant, environment, invocation and policy version is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-005-A03
    title: eligibility failures and account races yield UNKNOWN or DENY, never optimistic grant
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-host-minted-security-context processes a production lifecycle transition
    then:
    - eligibility failures and account races yield UNKNOWN or DENY, never optimistic grant is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-005-A04
    title: security-context lookup time is charged to the invocation timeout budget
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-host-minted-security-context processes a production lifecycle transition
    then:
    - security-context lookup time is charged to the invocation timeout budget is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-005-A05
    title: remote, mutable, undeclared or argument-bearing privileged paths are denied unless explicitly contracted
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-host-minted-security-context processes a production lifecycle transition
    then:
    - remote, mutable, undeclared or argument-bearing privileged paths are denied unless explicitly contracted is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-005-NEG-STALE
    title: Reject stale authority, generation or lease
    given:
    - stale execution context
    when: an authoritative effect or commit is attempted
    then:
    - operation is rejected
    - audit event is emitted
    - no completion evidence is accepted
    priority: P0
  - id: ELMOS-V3D-005-NEG-REPLAY
    title: Reject replay divergence
    given:
    - committed journal and artifacts
    when: the execution is replayed or resumed
    then:
    - same effective state is reconstructed
    - provider loss is explicit
    - divergence blocks certification
    priority: P0
  - id: ELMOS-V3D-005-RECOVERY
    title: Recover after worker, connection or plugin interruption
    given:
    - durable checkpoint and fencing state
    when: a replacement worker resumes
    then:
    - committed side effects are not duplicated
    - stale actors are fenced
    - lineage remains complete
    priority: P0
  releaseRequirement: all P0 scenarios pass in target environment

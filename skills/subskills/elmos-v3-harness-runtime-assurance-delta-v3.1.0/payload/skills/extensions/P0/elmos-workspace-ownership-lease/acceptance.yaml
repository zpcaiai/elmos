apiVersion: elmos.ai/v3delta1
kind: KernelExtensionAcceptance
metadata:
  skill: elmos-workspace-ownership-lease
  version: 3.1.0
spec:
  hardGates:
  - workspace ownership is acquired atomically with no-clobber semantics
  - repeat binding by the same owner is idempotent
  - conflicting owner, primary checkout, nested checkout and unmanaged checkout are rejected
  - resume validates owner and generation before write access
  - handoff and crash takeover are explicit, fenced transitions
  scenarios:
  - id: ELMOS-V3D-008-A01
    title: workspace ownership is acquired atomically with no-clobber semantics
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-workspace-ownership-lease processes a production lifecycle transition
    then:
    - workspace ownership is acquired atomically with no-clobber semantics is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-008-A02
    title: repeat binding by the same owner is idempotent
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-workspace-ownership-lease processes a production lifecycle transition
    then:
    - repeat binding by the same owner is idempotent is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-008-A03
    title: conflicting owner, primary checkout, nested checkout and unmanaged checkout are rejected
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-workspace-ownership-lease processes a production lifecycle transition
    then:
    - conflicting owner, primary checkout, nested checkout and unmanaged checkout are rejected is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-008-A04
    title: resume validates owner and generation before write access
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-workspace-ownership-lease processes a production lifecycle transition
    then:
    - resume validates owner and generation before write access is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-008-A05
    title: handoff and crash takeover are explicit, fenced transitions
    given:
    - exact v3.1 Revision Set
    - current owner authority
    - version-negotiated adapter
    when: elmos-workspace-ownership-lease processes a production lifecycle transition
    then:
    - handoff and crash takeover are explicit, fenced transitions is evaluated
    - evidence is immutable and revision-bound
    - failure cannot produce VERIFIED_COMPLETE
    priority: P0
  - id: ELMOS-V3D-008-NEG-STALE
    title: Reject stale authority, generation or lease
    given:
    - stale execution context
    when: an authoritative effect or commit is attempted
    then:
    - operation is rejected
    - audit event is emitted
    - no completion evidence is accepted
    priority: P0
  - id: ELMOS-V3D-008-NEG-REPLAY
    title: Reject replay divergence
    given:
    - committed journal and artifacts
    when: the execution is replayed or resumed
    then:
    - same effective state is reconstructed
    - provider loss is explicit
    - divergence blocks certification
    priority: P0
  - id: ELMOS-V3D-008-RECOVERY
    title: Recover after worker, connection or plugin interruption
    given:
    - durable checkpoint and fencing state
    when: a replacement worker resumes
    then:
    - committed side effects are not duplicated
    - stale actors are fenced
    - lineage remains complete
    priority: P0
  releaseRequirement: all P0 scenarios pass in target environment

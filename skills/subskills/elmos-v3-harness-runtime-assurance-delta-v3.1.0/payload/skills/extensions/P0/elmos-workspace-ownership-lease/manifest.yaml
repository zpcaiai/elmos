apiVersion: elmos.ai/v3delta1
kind: KernelExtensionSkill
metadata:
  id: ELMOS-V3D-008
  name: elmos-workspace-ownership-lease
  version: 3.1.0
  priority: P0
  labels:
    routable: 'false'
    architecture: eight-kernel
    commercialTier: production
spec:
  summary: Workspace 不再只是 cwd；它具有 owner execution、generation、repository/base revision 和可转移生命周期。
  ownerKernels:
  - K7
  - K5
  extends:
  - elmos-harness-runtime-kernel
  - elmos-transformation-kernel
  dependencies:
  - name: elmos-harness-runtime-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  - name: elmos-transformation-kernel
    version: '>=3.0.0 <4.0.0'
    kind: base-routable-owner
  - name: elmos-executor-generation-fencing
    version: '>=3.1.0 <4.0.0'
    kind: kernel-extension
  components:
  - WorkspaceOwnerRegistry
  - NoClobberBinder
  - WorkspaceLease
  - TakeoverCoordinator
  - SubagentScopeAllocator
  invariants:
  - workspace_id identifies an owned resource, not a path string
  - one writable generation has at most one authoritative owner
  - parent and subagent write scopes are disjoint unless an explicit coordination protocol is active
  - artifact lineage records workspace owner and base revision
  upstreamEvidence:
  - openai/codex#40716
  runtime:
    durable: true
    multiTenant: true
    idempotencyRequired: true
    outboxRequired: true
    environmentAuthorityRequired: true
    proofObligationAware: true
    failMode: fail-closed
  security:
    llmAuthoritativeOracle: DENY
    selfCertification: DENY
    authorityWidening: DENY
    providerTypesInCore: DENY
  lifecycle:
    initial: CANDIDATE
    activationGate: DELTA_TARGET_CONFORMANCE
    immutableVersions: true

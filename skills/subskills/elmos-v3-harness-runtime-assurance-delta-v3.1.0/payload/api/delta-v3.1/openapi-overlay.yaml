openapi: 3.1.0
info:
  title: Elmos v3.1 Harness Runtime Assurance Delta API Overlay
  version: 3.1.0
paths:
  /v3/executions/{executionId}/ingress:
    post:
      operationId: appendTypedIngress
      parameters:
        - in: path
          name: executionId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../contracts/schemas/delta-v3.1/typed-ingress.schema.json}
      responses:
        '202': {description: accepted or idempotently deduplicated}
  /v3/tool-results/{invocationId}/commit:
    post:
      operationId: commitEffectiveToolResult
      parameters:
        - in: path
          name: invocationId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../contracts/schemas/delta-v3.1/tool-result-commit.schema.json}
      responses:
        '200': {description: committed}
        '409': {description: identity or generation conflict}

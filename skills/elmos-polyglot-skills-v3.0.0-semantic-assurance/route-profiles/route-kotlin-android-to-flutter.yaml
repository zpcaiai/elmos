schemaVersion: elmos.route-profile/v1
kind: RouteProfile
metadata:
  id: route-kotlin-android-to-flutter
  version: 1.0.0
  readiness: not-run
  priority: reference
spec:
  source: kotlin
  target: flutter
  mode: mobile-recomposition
  intent: Recompose a Kotlin/Android or Compose application in Flutter with explicit
    coroutine, state, navigation, and platform-service mappings.
  requiredSkills:
  - elmos-polyglot-modernization-orchestrator
  - elmos-adapter-kotlin
  - elmos-adapter-flutter
  - elmos-differential-behavior-validator
  - elmos-unified-evidence-packager
  - elmos-production-readiness-gate
  prerequisites:
  - Android/Compose inventory
  - Flutter target profile
  - coroutine/state baselines
  preservationPriorities:
  - structured concurrency
  - state and recomposition
  - navigation
  - permissions
  - native services
  stages:
  - Map Compose/view screen graph
  - Map Flow/coroutines to approved Dart async/state model
  - Generate repositories/services
  - Implement widgets/themes
  - Wrap platform APIs
  - Run lifecycle and device tests
  requiredValidation:
  - clean source and target builds
  - contract tests
  - differential behavior tests
  - data equivalence where state exists
  - performance comparison against declared budgets
  - security and supply-chain checks
  - rollback or approved non-reversibility
  automaticBlockers:
  - missing immutable source baseline
  - unresolved critical semantic loss
  - unavailable required toolchain
  - unapproved breaking public contract
  - unverified irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

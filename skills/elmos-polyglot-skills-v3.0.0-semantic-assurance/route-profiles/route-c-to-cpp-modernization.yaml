schemaVersion: elmos.route-profile/v2
kind: RouteProfile
metadata:
  id: route-c-to-cpp-modernization
  version: 1.0.0
  readiness: not-run
  priority: P0-reference
spec:
  source: c
  target: cpp
  mode: cross-stack
  intent: C to modern C++ with ABI and ownership preservation
  requiredSkills:
  - elmos-c-to-cpp-modernization-route
  - elmos-legacy-p0-orchestrator
  - elmos-adapter-c
  - elmos-adapter-cpp
  - elmos-target-fitness-route-scorer
  - elmos-coexistence-strangler-planner
  - elmos-semantic-loss-risk-estimator
  - elmos-dual-run-shadow-reconciliation-validator
  - elmos-legacy-production-certification-gate
  preservationPriorities:
  - business rules and external contracts
  - record/data representation
  - transaction and restart semantics
  - security authority
  - operational behavior and rollback
  requiredValidation:
  - source baseline when executable
  - clean target build
  - route-specific semantic validators
  - data/transaction/security validation where applicable
  - performance comparison
  - shadow/dual-run or approved equivalent for critical workloads
  automaticBlockers:
  - missing immutable source baseline without approved characterization substitute
  - unresolved critical semantic loss
  - unavailable mandatory target toolchain
  - unapproved breaking contract or irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

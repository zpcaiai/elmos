schemaVersion: elmos.route-profile/v1
kind: RouteProfile
metadata:
  id: route-csharp-aspnet-core-to-java-spring
  version: 1.0.0
  readiness: not-run
  priority: reference
spec:
  source: csharp
  target: java
  mode: cross-stack
  intent: Convert ASP.NET Core services to Java/Spring with explicit nullable, async,
    LINQ/EF, middleware, identity, and serialization mappings.
  requiredSkills:
  - elmos-polyglot-modernization-orchestrator
  - elmos-adapter-csharp
  - elmos-adapter-java
  - elmos-differential-behavior-validator
  - elmos-unified-evidence-packager
  - elmos-production-readiness-gate
  prerequisites:
  - .NET solution and runtime inventory
  - Spring target profile
  - contract and data baselines
  preservationPriorities:
  - public contracts
  - nullable/error behavior
  - middleware order
  - EF transaction/query behavior
  - async cancellation
  stages:
  - Module-by-module conversion
  - ASP.NET middleware → Spring filters/interceptors
  - DI/options → Spring configuration
  - EF Core → JPA/jOOQ/MyBatis decision
  - Task/cancellation → Java concurrency
  - identity claims/policies → Spring Security
  requiredValidation:
  - clean source and target builds
  - contract tests
  - differential behavior tests
  - data equivalence where state exists
  - performance comparison against declared budgets
  - security and supply-chain checks
  - rollback or approved non-reversibility
  automaticBlockers:
  - missing immutable source baseline
  - unresolved critical semantic loss
  - unavailable required toolchain
  - unapproved breaking public contract
  - unverified irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

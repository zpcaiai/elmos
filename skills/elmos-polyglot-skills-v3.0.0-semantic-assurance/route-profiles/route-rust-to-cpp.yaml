schemaVersion: elmos.route-profile/v1
kind: RouteProfile
metadata:
  id: route-rust-to-cpp
  version: 1.0.0
  readiness: not-run
  priority: reference
spec:
  source: rust
  target: cpp
  mode: interop-or-conversion
  intent: Expose or convert Rust components to C++ when platform constraints require
    it, with explicit ownership and panic/error boundaries.
  requiredSkills:
  - elmos-polyglot-modernization-orchestrator
  - elmos-adapter-rust
  - elmos-adapter-cpp
  - elmos-differential-behavior-validator
  - elmos-unified-evidence-packager
  - elmos-production-readiness-gate
  prerequisites:
  - Cargo graph
  - public FFI model
  - C++ ABI/toolchain profile
  preservationPriorities:
  - ownership
  - error/panic behavior
  - thread safety
  - layout
  - performance
  stages:
  - Define stable C ABI or generated bindings
  - Wrap ownership handles
  - Map Result/Option
  - Contain panics
  - Integrate CMake/Bazel
  - Run ABI and sanitizer tests
  requiredValidation:
  - clean source and target builds
  - contract tests
  - differential behavior tests
  - data equivalence where state exists
  - performance comparison against declared budgets
  - security and supply-chain checks
  - rollback or approved non-reversibility
  automaticBlockers:
  - missing immutable source baseline
  - unresolved critical semantic loss
  - unavailable required toolchain
  - unapproved breaking public contract
  - unverified irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

schemaVersion: elmos.route-profile/v1
kind: RouteProfile
metadata:
  id: route-spring-in-place-modernization
  version: 1.0.0
  readiness: not-run
  priority: reference
spec:
  source: java
  target: java
  mode: same-stack-modernization
  intent: Upgrade a legacy Spring application in place through supported JDK, Spring,
    Jakarta, Security, persistence, build, and operations steps.
  requiredSkills:
  - elmos-polyglot-modernization-orchestrator
  - elmos-adapter-java
  - elmos-adapter-java
  - elmos-differential-behavior-validator
  - elmos-unified-evidence-packager
  - elmos-production-readiness-gate
  prerequisites:
  - immutable baseline
  - version/dependency inventory
  - target JDK/Spring profile
  preservationPriorities:
  - public behavior
  - security filter order
  - transactions/proxies
  - serialization/configuration
  - operability
  stages:
  - Upgrade build/JDK incrementally
  - Upgrade Spring/Boot in supported hops
  - Migrate javax to jakarta
  - Rewrite Security and persistence incompatibilities
  - Modernize tests/containers/telemetry
  - Differential validate and canary
  requiredValidation:
  - clean source and target builds
  - contract tests
  - differential behavior tests
  - data equivalence where state exists
  - performance comparison against declared budgets
  - security and supply-chain checks
  - rollback or approved non-reversibility
  automaticBlockers:
  - missing immutable source baseline
  - unresolved critical semantic loss
  - unavailable required toolchain
  - unapproved breaking public contract
  - unverified irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

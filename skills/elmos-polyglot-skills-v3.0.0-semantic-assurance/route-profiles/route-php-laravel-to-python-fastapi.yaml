schemaVersion: elmos.route-profile/v1
kind: RouteProfile
metadata:
  id: route-php-laravel-to-python-fastapi
  version: 1.0.0
  readiness: not-run
  priority: reference
spec:
  source: php
  target: python
  mode: cross-stack
  intent: Convert Laravel API services to FastAPI with explicit validation, authentication,
    ORM, queue, and request lifecycle behavior.
  requiredSkills:
  - elmos-polyglot-modernization-orchestrator
  - elmos-adapter-php
  - elmos-adapter-python
  - elmos-differential-behavior-validator
  - elmos-unified-evidence-packager
  - elmos-production-readiness-gate
  prerequisites:
  - Laravel contract/data baseline
  - FastAPI/Pydantic target profile
  - background-job decision
  preservationPriorities:
  - API and error contracts
  - auth/session/token behavior
  - ORM transactions
  - queues/jobs
  - serialization
  stages:
  - Recover routes/models/policies
  - Generate FastAPI routers/schemas/dependencies
  - Select SQLAlchemy/data layer
  - Map jobs/events
  - Run contract/data/security comparisons
  requiredValidation:
  - clean source and target builds
  - contract tests
  - differential behavior tests
  - data equivalence where state exists
  - performance comparison against declared budgets
  - security and supply-chain checks
  - rollback or approved non-reversibility
  automaticBlockers:
  - missing immutable source baseline
  - unresolved critical semantic loss
  - unavailable required toolchain
  - unapproved breaking public contract
  - unverified irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

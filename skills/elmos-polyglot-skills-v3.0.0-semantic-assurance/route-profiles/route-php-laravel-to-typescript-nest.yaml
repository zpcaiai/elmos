schemaVersion: elmos.route-profile/v1
kind: RouteProfile
metadata:
  id: route-php-laravel-to-typescript-nest
  version: 1.0.0
  readiness: not-run
  priority: reference
spec:
  source: php
  target: typescript
  mode: cross-stack
  intent: Convert Laravel services to NestJS while preserving routes, validation,
    auth, Eloquent data behavior, queues, and jobs.
  requiredSkills:
  - elmos-polyglot-modernization-orchestrator
  - elmos-adapter-php
  - elmos-adapter-typescript
  - elmos-differential-behavior-validator
  - elmos-unified-evidence-packager
  - elmos-production-readiness-gate
  prerequisites:
  - Laravel inventory
  - NestJS target profile
  - API/data/job baselines
  preservationPriorities:
  - route/error contracts
  - middleware/auth
  - Eloquent transactions
  - queue delivery
  - serialization
  stages:
  - Recover Laravel conventions
  - Generate Nest modules/controllers/providers
  - Map validation/auth
  - Choose ORM/query layer
  - Migrate queues/jobs/events
  - Dual-run API/data comparisons
  requiredValidation:
  - clean source and target builds
  - contract tests
  - differential behavior tests
  - data equivalence where state exists
  - performance comparison against declared budgets
  - security and supply-chain checks
  - rollback or approved non-reversibility
  automaticBlockers:
  - missing immutable source baseline
  - unresolved critical semantic loss
  - unavailable required toolchain
  - unapproved breaking public contract
  - unverified irreversible data change
  readinessPolicy:
    default: not-run
    staticProfileIsImplementation: false
    requiresExecutedEvidence: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: sla-slo-and-service-credit
  version: 2.0.0
  pack: 13-commercial-multitenant-platform
  priority: P0
  owner: TBD
spec:
  description: 把可用性、完成时间、恢复、数据丢失和质量承诺绑定补偿规则。
  kernel: Commercial Control Plane
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: tenant configuration
    required: true
  - name: contract
    required: true
  - name: usage event
    required: true
  - name: deployment profile
    required: true
  outputs:
  - name: entitlement decision
    contentAddressed: true
  - name: invoice record
    contentAddressed: true
  - name: acceptance pack
    contentAddressed: true
  - name: support bundle
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - tenant.manage
    - entitlement.check
    - wallet.reserve
    - billing.reconcile
    - support.export
    defaultDeny: true
  evidence:
    requiredGates:
    - tenant-isolated
    - usage-reconciled
    - contract-respected
    - supportable
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

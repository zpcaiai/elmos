apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: human-edit-diff-analysis
  version: 2.0.0
  pack: 04-memory-experience-flywheel
  priority: P1
  owner: TBD
spec:
  description: 区分人工对模型结果的修错、偏好调整、补需求和无关格式修改。
  kernel: K4 Memory and Experience Kernel
  riskClass: medium
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: agent trace
    required: true
  - name: tool event
    required: true
  - name: patch
    required: true
  - name: test result
    required: true
  - name: human feedback
    required: true
  outputs:
  - name: experience episode
    contentAddressed: true
  - name: memory record
    contentAddressed: true
  - name: failure signature
    contentAddressed: true
  - name: repair pattern
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - trace.capture
    - episode.write
    - memory.query
    - sandbox.replay
    - diff.analyze
    defaultDeny: true
  evidence:
    requiredGates:
    - episode-complete
    - tenant-isolated
    - outcome-verified
    - retention-policy-applied
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

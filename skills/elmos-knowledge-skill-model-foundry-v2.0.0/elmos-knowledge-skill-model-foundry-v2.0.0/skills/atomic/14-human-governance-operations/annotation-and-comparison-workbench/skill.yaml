apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: annotation-and-comparison-workbench
  version: 2.0.0
  pack: 14-human-governance-operations
  priority: P0
  owner: TBD
spec:
  description: 支持轨迹、补丁、证据、偏好对和失败类型的高效标注。
  kernel: Human Assurance Plane
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: review request
    required: true
  - name: evidence bundle
    required: true
  - name: risk decision
    required: true
  - name: human feedback
    required: true
  outputs:
  - name: approval
    contentAddressed: true
  - name: annotation
    contentAddressed: true
  - name: waiver
    contentAddressed: true
  - name: decision record
    contentAddressed: true
  - name: escalation
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - review.assign
    - approval.record
    - annotation.write
    - waiver.issue
    - incident.escalate
    defaultDeny: true
  evidence:
    requiredGates:
    - reviewer-qualified
    - conflict-disclosed
    - decision-reasoned
    - reversible
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

apiVersion: elmos.ai/v1
kind: ProofCarryingSkill
metadata:
  name: skill-signing-and-release
  version: 2.0.0
  pack: 05-skill-foundry-runtime
  priority: P0
  owner: TBD
spec:
  description: 对 Skill 内容、依赖、脚本、策略和评测结果签名后发布。
  kernel: K5 Skill Foundry and Runtime
  riskClass: high
  exposure: atomic-registry-only
  preconditions:
  - tenant.authorized == true
  - task.contract != null
  - release.versionPinned == true
  inputs:
  - name: runbook
    required: true
  - name: experience episodes
    required: true
  - name: task contract
    required: true
  - name: semantic IR
    required: true
  - name: policy context
    required: true
  outputs:
  - name: skill package
    contentAddressed: true
  - name: activation rules
    contentAddressed: true
  - name: workflow DAG
    contentAddressed: true
  - name: evidence bundle
    contentAddressed: true
  workflow:
  - authorize
  - snapshot
  - plan
  - execute
  - verify
  - emit-evidence
  - commit-or-rollback
  tools:
    allowed:
    - skill.registry
    - workflow.execute
    - sandbox.run
    - policy.evaluate
    - eval.run
    defaultDeny: true
  evidence:
    requiredGates:
    - trigger-eval-pass
    - tool-permission-bounded
    - evidence-complete
    - rollback-tested
    minimumLevel: E3
  rollback:
    required: true
    strategy: restore-checkpoint-and-compensate-side-effects
  learning:
    captureTrajectory: true
    globalTrainingEligible: false
    tenantAdapterEligible: explicit-opt-in
  telemetry:
    emitTrace: true
    emitCost: true
    emitWallClock: true

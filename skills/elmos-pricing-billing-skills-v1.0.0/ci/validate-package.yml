name: validate-elmos-pricing-billing-skills
on:
  push:
    paths:
      - 'skills/**'
      - 'schemas/**'
      - 'policies/**'
      - 'manifests/**'
      - 'tools/**'
      - 'tests/**'
      - 'CHECKSUMS.sha256'
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: ./validate.sh

asyncapi: 3.0.0
info:
  title: Elmos Billing Domain Events
  version: 1.0.0
  description: Reference event catalog for reliable, idempotent billing workflows.
channels:
  billingEvents:
    address: elmos.billing.events
    messages:
      walletTransactionPosted:
        $ref: '#/components/messages/WalletTransactionPosted'
      usageRecorded:
        $ref: '#/components/messages/UsageRecorded'
      budgetThresholdReached:
        $ref: '#/components/messages/BudgetThresholdReached'
      taskPausedBudget:
        $ref: '#/components/messages/TaskPausedBudget'
      invoiceFinalized:
        $ref: '#/components/messages/InvoiceFinalized'
      paymentCaptured:
        $ref: '#/components/messages/PaymentCaptured'
      reconciliationException:
        $ref: '#/components/messages/ReconciliationException'
operations:
  publishBillingEvents:
    action: send
    channel:
      $ref: '#/channels/billingEvents'
  consumeBillingEvents:
    action: receive
    channel:
      $ref: '#/channels/billingEvents'
components:
  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, schema_version, tenant_id, subject_id, correlation_id, occurred_at, producer, data]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        schema_version: { type: string }
        tenant_id: { type: string }
        subject_id: { type: string }
        correlation_id: { type: string }
        causation_id: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
        producer: { type: string }
        idempotency_key: { type: [string, 'null'] }
        data: { type: object }
  messages:
    WalletTransactionPosted:
      name: wallet.transaction.posted.v1
      payload: { $ref: '#/components/schemas/Envelope' }
    UsageRecorded:
      name: usage.recorded.v1
      payload: { $ref: '#/components/schemas/Envelope' }
    BudgetThresholdReached:
      name: budget.threshold.reached.v1
      payload: { $ref: '#/components/schemas/Envelope' }
    TaskPausedBudget:
      name: task.execution.paused-budget.v1
      payload: { $ref: '#/components/schemas/Envelope' }
    InvoiceFinalized:
      name: invoice.finalized.v1
      payload: { $ref: '#/components/schemas/Envelope' }
    PaymentCaptured:
      name: payment.captured.v1
      payload: { $ref: '#/components/schemas/Envelope' }
    ReconciliationException:
      name: reconciliation.exception.created.v1
      payload: { $ref: '#/components/schemas/Envelope' }

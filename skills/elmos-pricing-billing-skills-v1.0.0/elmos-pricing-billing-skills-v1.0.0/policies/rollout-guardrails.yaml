apiVersion: elmos.billing/v1
kind: RolloutGuardrails
metadata:
  version: 1
  status: draft
stages:
  - instrument_only
  - shadow_rating
  - internal_wallet_pilot
  - paid_canary
  - subscriptions_and_projects
  - enterprise_byok
  - general_availability
automatic_stop_conditions:
  duplicate_customer_charge_count: 1
  unbalanced_ledger_transaction_count: 1
  unauthorized_negative_balance_count: 1
  hard_budget_breach_count: 1
  cross_tenant_exposure_count: 1
  unexplained_shadow_difference_ratio: 0.001
  settlement_slo_breach: true
rollback:
  stop_new_authorizations: true
  preserve_financial_facts: true
  compensate_incorrect_effects: true
  require_reconciliation_before_resume: true

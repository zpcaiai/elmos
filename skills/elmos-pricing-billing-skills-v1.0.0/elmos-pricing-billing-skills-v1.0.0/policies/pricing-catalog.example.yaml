apiVersion: elmos.billing/v1
kind: PricingCatalog
metadata:
  name: starter-cny-draft
  version: 1
  status: draft
  illustrative_only: true
  activation_guard: finance_product_legal_approval_required
  valid_from: 2026-09-01T00:00:00+08:00
  currency: CNY
credit_display:
  unit: elmos-credit
  micro_credits_per_credit: 1000000
  illustrative_minor_units_per_credit: 100
  note: Display mapping is configurable and versioned; do not activate without approval.
plans:
  - key: free
    billing_period: none
    base_price_minor: 0
    included_promotional_credits: 20
    concurrency: 1
    artifact_retention_days: 7
    features: [repository-scan, basic-estimate, limited-code-qa]
  - key: pro
    billing_period: monthly
    base_price_minor: 29900
    included_promotional_credits: 100
    concurrency: 1
    artifact_retention_days: 30
    features: [managed-models, repository-integration, architecture-analysis]
  - key: builder
    billing_period: monthly
    base_price_minor: 99900
    included_promotional_credits: 500
    concurrency: 3
    artifact_retention_days: 90
    features: [long-task-recovery, advanced-model-routing, full-sandbox, auto-test-repair]
  - key: team
    billing_period: monthly
    base_price_minor: 499900
    included_promotional_credits: 2500
    included_seats: 10
    concurrency: 10
    artifact_retention_days: 180
    features: [shared-wallet, rbac, approvals, cost-centers, audit, private-skills]
  - key: enterprise
    billing_period: custom
    base_price_minor: null
    features: [postpaid, committed-spend, byok, private-deployment, sso, sla, data-residency]
quality_modes:
  economy:
    platform_multiplier_basis_points: 8500
    description: Cost-efficient routing and essential verification.
  balanced:
    platform_multiplier_basis_points: 10000
    description: Default economical execution with stronger review.
  best_quality:
    platform_multiplier_basis_points: 13500
    description: Stronger models, broader multi-agent verification, and higher assurance.
charge_codes:
  - code: managed-model-input
    unit: million_tokens
    pricing_source: managed-model-rate-card
  - code: managed-model-output
    unit: million_tokens
    pricing_source: managed-model-rate-card
  - code: cache-read
    unit: million_tokens
    pricing_source: cache-rate-card
  - code: sandbox-cpu
    unit: cpu_hour
    pricing_source: infrastructure-rate-card
  - code: sandbox-gpu
    unit: gpu_hour
    pricing_source: infrastructure-rate-card
  - code: browser
    unit: browser_hour
    pricing_source: infrastructure-rate-card
  - code: test-execution
    unit: cpu_hour
    pricing_source: infrastructure-rate-card
  - code: storage
    unit: gb_month
    pricing_source: infrastructure-rate-card
  - code: network-egress
    unit: gb
    pricing_source: infrastructure-rate-card
  - code: platform-orchestration
    unit: task
    pricing_source: platform-rate-card
activation_checks:
  - vendor-rate-coverage
  - margin-simulation
  - tax-and-invoice-review
  - customer-terms-versioned
  - canary-and-rollback-ready

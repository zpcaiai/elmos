apiVersion: elmos.billing/v1
kind: BudgetGuardPolicy
metadata:
  version: 1
  status: draft
thresholds:
  - percent: 50
    action: notify
  - percent: 80
    action: notify_and_offer_economy_replan
  - percent: 95
    action: notify_and_require_preflight_for_next_billable_node
hard_cap:
  enforcement: before_billable_side_effect
  breach_tolerance_minor_units: 0
  on_predicted_breach: pause_budget
  allowed_resume_paths:
    - explicit_top_up
    - approved_enterprise_credit_extension
    - lower_cost_replan_within_existing_authority
paused_options:
  - top_up
  - downgrade_quality_mode
  - reduce_scope
  - complete_blockers_only
  - stop_and_export
settlement:
  completion: capture_actual_and_release_unused
  cancellation: rate_completed_value_then_release
  platform_failure_no_value: release_and_refund_if_already_captured
  unresolved_usage: settlement_review

apiVersion: elmos.billing/v1
kind: RetentionAndPrivacyPolicy
metadata:
  version: 1
  status: draft
classes:
  raw_usage_events:
    default_days: 400
    minimization: exclude_source_code_and_secrets
  usage_aggregates:
    default_days: 2555
  ledger_invoices_contracts:
    retention: approved_financial_and_legal_policy
    deletion: compensating_or_anonymizing_only_where_legal
  application_logs:
    default_days: 30
    sensitive_data: prohibited
  audit_logs:
    default_days: 2555
    tamper_evident: true
  task_artifacts:
    plan_controlled: true
privacy_workflows:
  access_export: authenticated_tenant_scope
  deletion: policy_engine_with_legal_hold_exception
  correction: new_fact_not_history_rewrite
  residency: enterprise_contract_override

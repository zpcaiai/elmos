openapi: 3.1.0
info:
  title: Elmos Hybrid Billing API
  version: 1.0.0
  description: Reference contract. Adapt authentication and paths to the target repository without weakening idempotency or tenant controls.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
tags:
  - name: Estimates
  - name: Quotes
  - name: Budgets
  - name: Usage
  - name: Wallets
  - name: Projects
  - name: Invoices
  - name: Payments
  - name: Refunds
paths:
  /v1/task-estimates:
    post:
      tags: [Estimates]
      operationId: createTaskEstimate
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimateRequest'
      responses:
        '201':
          description: Estimate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEstimate'
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/task-quotes:
    post:
      tags: [Quotes]
      operationId: createTaskQuote
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Quote offered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskQuote'
  /v1/task-quotes/{quoteId}/accept:
    post:
      tags: [Quotes, Budgets]
      operationId: acceptTaskQuote
      parameters:
        - $ref: '#/components/parameters/QuoteId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope_hash, accepted_hard_cap_minor]
              properties:
                scope_hash: { type: string }
                accepted_hard_cap_minor: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Quote accepted and budget authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAuthorization'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/budget-authorizations/{authorizationId}/top-ups:
    post:
      tags: [Budgets]
      operationId: topUpBudgetAuthorization
      parameters:
        - $ref: '#/components/parameters/AuthorizationId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [additional_minor_units]
              properties:
                additional_minor_units: { type: integer, minimum: 1 }
                reason: { type: string }
      responses:
        '200':
          description: Authorization increased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAuthorization'
  /v1/usage-events:ingest:
    post:
      tags: [Usage]
      operationId: ingestUsageEvents
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: './usage-event.schema.json'
      responses:
        '202':
          description: Accepted for idempotent processing
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, rejected]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  duplicates: { type: integer, minimum: 0 }
                  rejected: { type: integer, minimum: 0 }
  /v1/wallets/{walletId}:
    get:
      tags: [Wallets]
      operationId: getWallet
      parameters:
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Wallet projection with as-of cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
  /v1/project-contracts:
    post:
      tags: [Projects]
      operationId: createProjectContract
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './project-contract.schema.json'
      responses:
        '201':
          description: Project contract created
  /v1/project-contracts/{projectContractId}/change-orders:
    post:
      tags: [Projects]
      operationId: requestChangeOrder
      parameters:
        - name: projectContractId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderRequest'
      responses:
        '201': { description: Change order requested }
  /v1/invoices/{invoiceId}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Immutable invoice snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
  /v1/payments/intents:
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
  /v1/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '202':
          description: Refund workflow started
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { type: string }
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      schema: { type: string }
    WalletId:
      name: walletId
      in: path
      required: true
      schema: { type: string }
  responses:
    Conflict:
      description: Idempotency, version, scope, or state conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Business policy rejected the command
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [currency, minor_units]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        minor_units: { type: integer }
    CreateEstimateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, task_id, scope_hash, quality_mode, repository_features]
      properties:
        tenant_id: { type: string }
        task_id: { type: string }
        scope_hash: { type: string }
        repository_commit: { type: [string, 'null'] }
        quality_mode: { type: string, enum: [economy, balanced, best_quality] }
        repository_features: { type: object }
    TaskEstimate:
      type: object
      required: [estimate_id, cost, machine_runtime, estimator_version]
      properties:
        estimate_id: { type: string }
        cost:
          type: object
          properties:
            p50: { $ref: '#/components/schemas/Money' }
            p80: { $ref: '#/components/schemas/Money' }
            p90: { $ref: '#/components/schemas/Money' }
        machine_runtime:
          type: object
          properties:
            p50_seconds: { type: integer, minimum: 0 }
            p90_seconds: { type: integer, minimum: 0 }
        human_effort_reference:
          type: object
        estimator_version: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        risk_factors:
          type: array
          items: { type: string }
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, task_id, estimate_id, scope_hash]
      properties:
        tenant_id: { type: string }
        task_id: { type: string }
        estimate_id: { type: string }
        scope_hash: { type: string }
        requested_hard_cap_minor: { type: [integer, 'null'], minimum: 0 }
    TaskQuote:
      type: object
      required: [quote_id, status, estimated_cost, hard_cap, expires_at]
      properties:
        quote_id: { type: string }
        status: { type: string, enum: [draft, offered, accepted, expired, canceled, superseded] }
        estimated_cost:
          type: object
        hard_cap: { $ref: '#/components/schemas/Money' }
        machine_runtime: { type: object }
        human_effort_reference: { type: [object, 'null'] }
        expires_at: { type: string, format: date-time }
        quote_snapshot: { type: object }
    BudgetAuthorization:
      type: object
      required: [authorization_id, status, authorized, captured, released]
      properties:
        authorization_id: { type: string }
        status: { type: string }
        authorized: { $ref: '#/components/schemas/Money' }
        captured: { $ref: '#/components/schemas/Money' }
        released: { $ref: '#/components/schemas/Money' }
        version: { type: integer }
    Wallet:
      type: object
      required: [wallet_id, as_of, available, reserved, paid, promotional]
      properties:
        wallet_id: { type: string }
        as_of: { type: string, format: date-time }
        ledger_cursor: { type: [string, 'null'] }
        available: { type: integer }
        reserved: { type: integer }
        paid: { type: integer }
        promotional: { type: integer }
        consumed: { type: integer }
        refunded: { type: integer }
    ChangeOrderRequest:
      type: object
      additionalProperties: false
      required: [reason, old_scope_hash, new_scope_hash, price_delta_minor]
      properties:
        reason: { type: string }
        old_scope_hash: { type: string }
        new_scope_hash: { type: string }
        price_delta_minor: { type: integer }
        schedule_delta_seconds: { type: integer }
    Invoice:
      type: object
      required: [invoice_id, status, currency, total_minor, amount_due_minor, snapshot]
      properties:
        invoice_id: { type: string }
        status: { type: string }
        currency: { type: string }
        total_minor: { type: integer }
        amount_paid_minor: { type: integer }
        amount_due_minor: { type: integer }
        snapshot: { type: object }
        lines:
          type: array
          items: { type: object }
    CreatePaymentIntentRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, provider, purpose, amount]
      properties:
        tenant_id: { type: string }
        provider: { type: string }
        purpose: { type: string, enum: [wallet_top_up, invoice_payment, project_payment] }
        reference_id: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
    PaymentIntent:
      type: object
      required: [payment_id, status, provider, client_action]
      properties:
        payment_id: { type: string }
        status: { type: string }
        provider: { type: string }
        client_action: { type: object }
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, reference_type, reference_id, reason_code, requested_amount_minor]
      properties:
        tenant_id: { type: string }
        reference_type: { type: string, enum: [payment, invoice, task, project] }
        reference_id: { type: string }
        reason_code: { type: string }
        requested_amount_minor: { type: integer, minimum: 0 }
        evidence: { type: object }
    Problem:
      type: object
      required: [type, title, status, correlation_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlation_id: { type: string }
        code: { type: string }

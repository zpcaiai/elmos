request_id: conv-multi-target-demo
tenant_id: tenant-example
source:
  root: ../vue3-todo/source
  revision: "fixture-vue3-todo-v1"
  framework_hint: auto
  include:
    - "src/**/*"
    - "package.json"
    - "pubspec.yaml"
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
targets:
  - wechat
  - alipay
  - douyin
  - xiaohongshu
strategy:
  priority: balanced
  webview_fallback: deny
  full_page_canvas_fallback: deny
  unsupported_policy: ask-decision
quality:
  critical_flow_pass_rate: 1.0
  visual_similarity_min: 0.95
  max_auto_repair_iterations: 3
  performance_policy_ref: plans/default-performance-policy.yaml
release:
  mode: build-only
  human_approval_required: true
  credential_refs: {}
metadata:
  owner: elmos

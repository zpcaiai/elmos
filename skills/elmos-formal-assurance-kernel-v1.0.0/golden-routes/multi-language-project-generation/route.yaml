apiVersion: elmos.ai/v2alpha1
kind: FormalAssuranceGoldenRoute
metadata:
  name: multi-language-project-generation
  title: Multi-language Project Generation Formal Golden Route
  version: 1.0.0
  domain: project-generation
spec:
  inputs:
  - requirements
  - domain glossary
  - security policy
  - target architecture/languages
  requiredSkills:
  - elmos-formal-spec-ir
  - elmos-observable-behavior-contract
  - elmos-proof-obligation-planner
  - elmos-assumption-ledger
  - elmos-proof-status-policy
  - elmos-trusted-computing-base-registry
  - elmos-verifier-portfolio-router
  - elmos-proof-cache-invalidation
  - elmos-formal-model-versioning
  - elmos-formal-assurance-orchestrator
  - elmos-requirement-to-formal-spec
  - elmos-architecture-constraint-checker
  - elmos-generated-workflow-model-checker
  - elmos-tenant-noninterference-verifier
  - elmos-verified-core-generator
  - elmos-api-contract-verifier
  - elmos-data-invariant-verifier
  - elmos-liveness-fairness-verifier
  - elmos-resource-termination-verifier
  - elmos-tla-task-runtime-model
  - elmos-credit-billing-invariant-model
  - elmos-lease-fencing-verifier
  - elmos-counterexample-to-test
  - elmos-proof-artifact-store
  - elmos-formal-release-gate
  - elmos-formal-assurance-report
  - elmos-proof-evidence-bundle
  - elmos-proof-drift-monitor
  - elmos-waiver-governance
  - elmos-formal-observability-slo
  phases:
  - id: E1_STATIC
    goal: inventory, parse, source-map and structural constraints
    blocking: true
  - id: E2_MODEL
    goal: formal models, contracts, invariants and proof obligations
    blocking: true
  - id: E3_DIFFERENTIAL
    goal: source-target differential and translation validation
    blocking: true
  - id: E4_FAILURE_INJECTION
    goal: fault, concurrency, recovery and security adversarial validation
    blocking: true
  - id: E5_CUSTOMER_GOLDEN_ROUTE
    goal: repeatable commercial certification on representative repositories
    blocking: true
  criticalProperties:
  - P0 ambiguities are resolved before code certification
  - data/API/workflow/security/resource specifications are traceable
  - architecture and tenant isolation constraints hold
  - workflow safety/liveness properties hold under explicit assumptions
  - verified core is separated from tested shell
  certificationRequirements:
  - at least three target-language stacks
  - multi-tenant threat tests
  - payment/task workflow models
  - load and failure tests
  - E1-E5 complete
  releasePolicy:
    requiredGate: P05_DEPLOYMENT_COMPLETE
    unknown: DENY
    boundedForP0: DENY_UNLESS_EXPLICIT_A1
    waiver: four-eyes-time-bound
  evidence:
  - source/target manifests
  - formal specs
  - proof plans
  - proof results
  - counterexamples
  - tests
  - coverage
  - TCB/SBOM
  - gate decisions
  - signed bundle

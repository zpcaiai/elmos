apiVersion: elmos.ai/v2alpha1
kind: FormalAssuranceGoldenRoute
metadata:
  name: repository-cross-language
  title: Repository Cross-language Formal Golden Route
  version: 1.0.0
  domain: cross-language
spec:
  inputs:
  - source repository
  - target language profile
  - conversion rules
  - build/runtime manifests
  requiredSkills:
  - elmos-formal-spec-ir
  - elmos-observable-behavior-contract
  - elmos-proof-obligation-planner
  - elmos-assumption-ledger
  - elmos-proof-status-policy
  - elmos-trusted-computing-base-registry
  - elmos-verifier-portfolio-router
  - elmos-proof-cache-invalidation
  - elmos-formal-model-versioning
  - elmos-formal-assurance-orchestrator
  - elmos-language-semantic-profile
  - elmos-semantic-ir-formal-semantics
  - elmos-rule-preservation-prover
  - elmos-cross-language-product-program
  - elmos-repository-refinement-composer
  - elmos-proof-carrying-conversion
  - elmos-semantic-gap-obligation-generator
  - elmos-concurrency-async-refinement
  - elmos-effect-exception-trace-refinement
  - elmos-reflection-ffi-boundary-verifier
  - elmos-tla-task-runtime-model
  - elmos-credit-billing-invariant-model
  - elmos-lease-fencing-verifier
  - elmos-counterexample-to-test
  - elmos-proof-artifact-store
  - elmos-formal-release-gate
  - elmos-formal-assurance-report
  - elmos-proof-evidence-bundle
  - elmos-proof-drift-monitor
  - elmos-waiver-governance
  - elmos-formal-observability-slo
  phases:
  - id: E1_STATIC
    goal: inventory, parse, source-map and structural constraints
    blocking: true
  - id: E2_MODEL
    goal: formal models, contracts, invariants and proof obligations
    blocking: true
  - id: E3_DIFFERENTIAL
    goal: source-target differential and translation validation
    blocking: true
  - id: E4_FAILURE_INJECTION
    goal: fault, concurrency, recovery and security adversarial validation
    blocking: true
  - id: E5_CUSTOMER_GOLDEN_ROUTE
    goal: repeatable commercial certification on representative repositories
    blocking: true
  criticalProperties:
  - all source features are classified by semantic profile
  - verified rules have proof certificates
  - semantic gaps generate discharged obligations or explicit boundaries
  - module guarantees satisfy dependent assumptions
  - repository entrypoints have composed refinement coverage
  certificationRequirements:
  - Java-to-C# route
  - Python-to-Rust route
  - concurrency corpus
  - reflection/FFI boundary corpus
  - E1-E5 complete
  releasePolicy:
    requiredGate: P05_DEPLOYMENT_COMPLETE
    unknown: DENY
    boundedForP0: DENY_UNLESS_EXPLICIT_A1
    waiver: four-eyes-time-bound
  evidence:
  - source/target manifests
  - formal specs
  - proof plans
  - proof results
  - counterexamples
  - tests
  - coverage
  - TCB/SBOM
  - gate decisions
  - signed bundle

apiVersion: elmos.ai/v2alpha1
kind: FormalAssuranceGoldenRoute
metadata:
  name: spring-legacy-to-boot4
  title: Struts/Servlet to Spring Boot 4 Formal Golden Route
  version: 1.0.0
  domain: spring-modernization
spec:
  inputs:
  - legacy repository
  - target Spring Boot 4 repository
  - traffic scenarios
  - database snapshot
  requiredSkills:
  - elmos-formal-spec-ir
  - elmos-observable-behavior-contract
  - elmos-proof-obligation-planner
  - elmos-assumption-ledger
  - elmos-proof-status-policy
  - elmos-trusted-computing-base-registry
  - elmos-verifier-portfolio-router
  - elmos-proof-cache-invalidation
  - elmos-formal-model-versioning
  - elmos-formal-assurance-orchestrator
  - elmos-spring-route-binding-proof
  - elmos-spring-security-chain-model
  - elmos-spring-transaction-refinement
  - elmos-java-jml-contract-verifier
  - elmos-legacy-modernization-trace-validator
  - elmos-spring-session-state-refinement
  - elmos-spring-exception-mapping-refinement
  - elmos-spring-filter-interceptor-order-proof
  - elmos-spring-data-migration-refinement
  - elmos-spring-proxy-aop-semantic-checker
  - elmos-tla-task-runtime-model
  - elmos-credit-billing-invariant-model
  - elmos-lease-fencing-verifier
  - elmos-counterexample-to-test
  - elmos-proof-artifact-store
  - elmos-formal-release-gate
  - elmos-formal-assurance-report
  - elmos-proof-evidence-bundle
  - elmos-proof-drift-monitor
  - elmos-waiver-governance
  - elmos-formal-observability-slo
  phases:
  - id: E1_STATIC
    goal: inventory, parse, source-map and structural constraints
    blocking: true
  - id: E2_MODEL
    goal: formal models, contracts, invariants and proof obligations
    blocking: true
  - id: E3_DIFFERENTIAL
    goal: source-target differential and translation validation
    blocking: true
  - id: E4_FAILURE_INJECTION
    goal: fault, concurrency, recovery and security adversarial validation
    blocking: true
  - id: E5_CUSTOMER_GOLDEN_ROUTE
    goal: repeatable commercial certification on representative repositories
    blocking: true
  criticalProperties:
  - all legacy routes are mapped, explicitly removed, or unsupported
  - authorization dominates every business side effect
  - commit/rollback and exception mappings refine legacy behavior
  - session lifecycle and filter/interceptor ordering are preserved
  - critical observable traces match after approved normalization
  certificationRequirements:
  - three repositories >500k LOC
  - at least one repository >1M LOC
  - failure injection
  - shadow traffic
  - E1-E5 complete
  releasePolicy:
    requiredGate: P05_DEPLOYMENT_COMPLETE
    unknown: DENY
    boundedForP0: DENY_UNLESS_EXPLICIT_A1
    waiver: four-eyes-time-bound
  evidence:
  - source/target manifests
  - formal specs
  - proof plans
  - proof results
  - counterexamples
  - tests
  - coverage
  - TCB/SBOM
  - gate decisions
  - signed bundle

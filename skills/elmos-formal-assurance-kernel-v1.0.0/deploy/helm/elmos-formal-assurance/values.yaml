replicaCount: 2

image:
  repository: REPLACE_WITH_RELEASE_TIME_PINNED_TAG
  digest: REPLACE_WITH_SIGNED_DIGEST
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topLevelAccountConcurrency: 3
logLevel: INFO

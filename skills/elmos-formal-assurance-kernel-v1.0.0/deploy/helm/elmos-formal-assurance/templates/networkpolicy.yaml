{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "elmos-formal-assurance.fullname" . }}-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: elmos-formal-assurance}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
{{- end }}

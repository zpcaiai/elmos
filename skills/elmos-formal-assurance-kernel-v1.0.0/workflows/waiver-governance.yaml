apiVersion: elmos.ai/v2alpha1
kind: FormalAssuranceWorkflow
metadata:
  name: waiver-governance
  title: Waiver Governance
  version: 1.0.0
  domain: platform
spec:
  durability:
    checkpointEveryStep: true
    resumePolicy: idempotent
    fencingRequired: true
  concurrency:
    topLevelPerAccount: 3
    maxParallelSteps: 8
  budget:
    etaUnit: wall-clock-seconds
    reserveBeforeStart: true
  steps:
  - id: identify
    skillRef: elmos-proof-status-policy
    dependsOn: []
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  - id: assess
    skillRef: elmos-assumption-ledger
    dependsOn:
    - identify
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  - id: approve
    skillRef: elmos-waiver-governance
    dependsOn:
    - assess
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  - id: reevaluate-gate
    skillRef: elmos-formal-release-gate
    dependsOn:
    - approve
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  terminalPolicy:
    successRequires: all required steps terminal and gate allowed
    unknownIsFailure: true
  events:
  - workflow.started
  - proof.step.started
  - proof.step.completed
  - proof.step.failed
  - workflow.completed

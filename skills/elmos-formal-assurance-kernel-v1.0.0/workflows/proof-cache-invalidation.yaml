apiVersion: elmos.ai/v2alpha1
kind: FormalAssuranceWorkflow
metadata:
  name: proof-cache-invalidation
  title: Proof Cache Invalidation and Reproof
  version: 1.0.0
  domain: core
spec:
  durability:
    checkpointEveryStep: true
    resumePolicy: idempotent
    fencingRequired: true
  concurrency:
    topLevelPerAccount: 3
    maxParallelSteps: 8
  budget:
    etaUnit: wall-clock-seconds
    reserveBeforeStart: true
  steps:
  - id: detect-drift
    skillRef: elmos-proof-drift-monitor
    dependsOn: []
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  - id: invalidate
    skillRef: elmos-proof-cache-invalidation
    dependsOn:
    - detect-drift
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  - id: version-model
    skillRef: elmos-formal-model-versioning
    dependsOn:
    - invalidate
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  - id: replan
    skillRef: elmos-proof-obligation-planner
    dependsOn:
    - version-model
    onFailure: halt-and-preserve-evidence
    retry:
      maxAttempts: 2
      retryOn:
      - INFRASTRUCTURE
      neverRetryOn:
      - REFUTED_WITH_COUNTEREXAMPLE
      - UNSUPPORTED
  terminalPolicy:
    successRequires: all required steps terminal and gate allowed
    unknownIsFailure: true
  events:
  - workflow.started
  - proof.step.started
  - proof.step.completed
  - proof.step.failed
  - workflow.completed

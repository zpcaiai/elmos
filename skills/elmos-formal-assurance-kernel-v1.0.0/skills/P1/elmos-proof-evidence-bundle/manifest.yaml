apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-proof-evidence-bundle
  title: Proof Evidence Bundle
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P1
  domain: platform
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 打包签名的离线审计材料，包括规格、义务、结果、证书、TCB、SBOM、模型、反例、报告和重放命令。
  dependencies:
  - elmos-trusted-computing-base-registry
  - elmos-proof-artifact-store
  - elmos-formal-assurance-report
  capabilities:
  - reproducible bundles
  - manifest signing
  - offline verification
  - provenance
  inputs:
  - name: proof store selection
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: release manifest
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: redaction policy
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: tar/zip bundle
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: manifest
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: checksum
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: signature request
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

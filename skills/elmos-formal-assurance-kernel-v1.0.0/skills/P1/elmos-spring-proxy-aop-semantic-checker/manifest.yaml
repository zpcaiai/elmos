apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-spring-proxy-aop-semantic-checker
  title: Spring Proxy and AOP Semantic Checker
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P1
  domain: spring-modernization
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 静态证明事务、缓存、鉴权和审计 Advice 不因 self-invocation、final/private 方法、代理类型或 pointcut 漂移而失效。
  dependencies:
  - elmos-spring-security-chain-model
  - elmos-spring-transaction-refinement
  - elmos-java-jml-contract-verifier
  capabilities:
  - call-graph dominance
  - pointcut set equivalence
  - proxy reachability
  inputs:
  - name: Spring bean graph
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: call graph
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: annotations
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: AOP config
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: advice coverage
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: bypass path
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: repair patch plan
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

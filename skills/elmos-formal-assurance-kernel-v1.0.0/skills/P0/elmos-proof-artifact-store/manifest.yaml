apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-proof-artifact-store
  title: Proof Artifact Store
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: platform
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 以不可变内容寻址方式保存公式、模型、日志、证书、反例、覆盖率、签名和重放环境。
  dependencies:
  - elmos-proof-status-policy
  - elmos-trusted-computing-base-registry
  - elmos-proof-cache-invalidation
  - elmos-formal-assurance-orchestrator
  capabilities:
  - content-addressed storage
  - append-only metadata
  - envelope encryption
  - retention policies
  inputs:
  - name: proof outputs
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: tenant policy
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: retention class
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: artifact URI
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: sha256
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: provenance envelope
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: retention record
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

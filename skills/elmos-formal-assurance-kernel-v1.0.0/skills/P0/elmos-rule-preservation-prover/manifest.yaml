apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-rule-preservation-prover
  title: Transformation Rule Preservation Prover
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: cross-language
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 对每条 Rule DSL 转换规则证明在适用前提下保持 Semantic IR 语义，并产出可独立检查证书。
  dependencies:
  - elmos-proof-obligation-planner
  - elmos-verifier-portfolio-router
  - elmos-semantic-ir-formal-semantics
  capabilities:
  - relational Hoare logic
  - induction on syntax
  - SMT discharge
  - kernel-checked lemmas
  inputs:
  - name: rule DSL
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: source/target semantics
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: preconditions
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: proof certificate
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: unresolved obligations
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: rule assurance level
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

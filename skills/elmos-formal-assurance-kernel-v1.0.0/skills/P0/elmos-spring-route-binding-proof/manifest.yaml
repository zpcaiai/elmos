apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-spring-route-binding-proof
  title: Spring Route and Binding Proof
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: spring-modernization
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 证明 Struts 1/2、Servlet 与 Spring Boot 4 之间路由语言、优先级、请求绑定、默认值和校验行为的覆盖与一致性。
  dependencies:
  - elmos-observable-behavior-contract
  - elmos-proof-obligation-planner
  - elmos-verifier-portfolio-router
  capabilities:
  - regular-language inclusion
  - SMT overlap detection
  - relational binding verification
  - Alloy structure analysis
  inputs:
  - name: web.xml
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: struts-config.xml
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: annotations
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: binding metadata
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: validation rules
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: route map
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: counterexample request
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: binding obligations
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: coverage report
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-resource-termination-verifier
  title: Resource and Termination Verifier
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: project-generation
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 验证 Agent 循环、自动修复、递归转换、图遍历、批处理和重试受终止度量与资源预算约束。
  dependencies:
  - elmos-proof-obligation-planner
  - elmos-verifier-portfolio-router
  - elmos-requirement-to-formal-spec
  capabilities:
  - ranking functions
  - abstract interpretation
  - amortized resource contracts
  - bounded loops
  inputs:
  - name: control-flow models
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: budget policy
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: recursion/loop facts
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: termination proof
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: resource bound
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: nontermination witness
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

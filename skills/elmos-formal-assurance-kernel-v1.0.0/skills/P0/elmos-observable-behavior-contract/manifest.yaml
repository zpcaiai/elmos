apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-observable-behavior-contract
  title: Observable Behavior Contract
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: core
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 定义源系统与目标系统之间真正可比较的观察面，避免只比较返回值而遗漏状态、副作用、异常、事务和安全决策。
  dependencies:
  - elmos-formal-spec-ir
  capabilities:
  - trace semantics
  - normalization functions
  - refinement relations
  - observational equivalence
  inputs:
  - name: source/target interfaces
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: business criticality
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: normalization policy
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: observation_contract.json
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: trace schema
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: forbidden normalization diagnostics
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

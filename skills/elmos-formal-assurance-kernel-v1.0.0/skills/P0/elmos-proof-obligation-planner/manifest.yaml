apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-proof-obligation-planner
  title: Proof Obligation Planner
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: core
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 按业务线、变更影响、风险等级、语言特征和证明预算，把规格分解为可执行、可缓存、可组合的证明义务 DAG。
  dependencies:
  - elmos-formal-spec-ir
  - elmos-observable-behavior-contract
  capabilities:
  - weakest-precondition planning
  - assume-guarantee decomposition
  - risk-based proof planning
  - dependency DAG
  inputs:
  - name: formal specs
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: change graph
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: risk classification
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: verifier capabilities
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: proof_plan.json
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: proof obligations
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: estimated machine wall-clock
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: coverage target
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

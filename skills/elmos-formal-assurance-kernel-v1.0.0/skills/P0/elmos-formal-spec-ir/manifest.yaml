apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-formal-spec-ir
  title: Formal Specification IR
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: core
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 把自然语言、代码、架构、工作流和数据库约束统一编译为可版本化、可寻址、可生成证明义务的形式规格中间表示。
  dependencies: []
  capabilities:
  - typed first-order logic
  - relational contracts
  - LTL/CTL property fragments
  - source-location preserving IR
  inputs:
  - name: requirements
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: AST/Semantic IR
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: OpenAPI/AsyncAPI
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: schema and policy documents
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: formal_spec.json
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: source map
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: semantic hash
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: diagnostic set
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

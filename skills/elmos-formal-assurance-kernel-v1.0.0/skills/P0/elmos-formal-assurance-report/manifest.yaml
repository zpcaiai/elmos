apiVersion: elmos.ai/v2alpha1
kind: Skill
metadata:
  name: elmos-formal-assurance-report
  title: Formal Assurance Report
  version: 1.0.0
  packageId: elmos-formal-assurance-kernel-v1.0.0
  priority: P0
  domain: platform
  owners:
  - formal-assurance-platform
  - domain-owner
  labels:
    commercial: production-contract
    failClosed: 'true'
    tenantScoped: 'true'
spec:
  summary: 生成面向工程、审计、客户和管理层的答案优先报告，准确展示证明范围、边界、假设、反例和残余风险。
  dependencies:
  - elmos-proof-status-policy
  - elmos-proof-artifact-store
  - elmos-formal-release-gate
  capabilities:
  - evidence-backed reporting
  - coverage stratification
  - machine-human consistency
  inputs:
  - name: release decision
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: proof artifacts
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: coverage
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  - name: risk register
    required: true
    schemaRef: contracts/schemas/formal-spec.schema.json
  outputs:
  - name: assurance-report.md/json
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: executive summary
    schemaRef: contracts/schemas/proof-artifact.schema.json
  - name: audit appendix
    schemaRef: contracts/schemas/proof-artifact.schema.json
  proofStatuses:
  - PROVED_CERTIFIED
  - PROVED_INDUCTIVE
  - PROVED_SOLVER_TRUSTED
  - PROVED_FOR_SUPPORTED_FRAGMENT
  - BOUNDED_NO_COUNTEREXAMPLE
  - REFUTED_WITH_COUNTEREXAMPLE
  - UNKNOWN_TIMEOUT
  - UNKNOWN_RESOURCE_LIMIT
  - UNSUPPORTED
  - ASSUMPTION_REQUIRED
  - RUNTIME_MONITORED
  - WAIVED_BY_APPROVER
  runtime:
    executionMode: durable-asynchronous
    sandbox: secretless-deny-network
    idempotencyRequired: true
    checkpointing: true
    machineEtaUnit: wall-clock-seconds
    accountConcurrencyLimit: 3
  security:
    classification: tenant-confidential
    crossTenantCache: deny-by-default
    evidenceIntegrity: sha256-content-addressed
    adapterFailureMode: fail-closed
  releaseGates:
  - P05_DEPLOYMENT_COMPLETE
  - E1_STATIC
  - E2_MODEL
  - E3_DIFFERENTIAL
  - E4_FAILURE_INJECTION
  - E5_CUSTOMER_GOLDEN_ROUTE

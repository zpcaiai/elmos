schema_version: elmos.skills.package/v1
id: elmos.java-legacy-web.repository-modernization
name: Elmos Java Legacy Web Repository Modernization
version: 1.0.0
released_at: '2026-08-26'
priority: P0
status: implementation-ready
language: zh-CN
entrypoint: skills/control-plane/00-modernization-orchestrator/SKILL.md
scope:
  sources:
  - Struts 1.x
  - Struts 2.x
  - Servlet/JSP
  - mixed legacy Java Web repositories
  target:
    framework: Spring Boot 4.x
    foundation:
    - Spring Framework 7.x
    - Jakarta EE 11
    - Servlet 6.1
    java:
      minimum: 17
      recommended: 21
      supported_policy:
      - 17
      - 21
      - 25
  default_mode: preserve-first
  goal: repository-level semantic preservation, behavioral equivalence, production certification
architecture:
  core: Repository Semantic Compiler
  layers:
  - control-plane
  - repository-forensics
  - semantic-recovery
  - semantic-model
  - planning
  - transformation
  - verification
  - repair-certification
  domain_adapters:
  - struts1
  - struts2
  - servlet
  - jsp-taglib
  - springboot4
required_artifacts:
- repository-snapshot
- repository-evidence-graph
- legacy-web-semantic-ir
- unknown-semantics-ledger
- migration-plan
- semantic-source-map
- equivalence-reports
- risk-register
- evidence-bundle
- e0-e5-certification
execution_contract:
  resumable: true
  idempotent: true
  auditable: true
  authority_scoped: true
  machine_wall_clock_eta: true
  max_auto_repair_iterations_per_root_cause: 5
  unknown_critical_blocks_e5: true

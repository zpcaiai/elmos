services:
  autonomy-kernel:
    build:
      context: ..
    image: elmos/repository-autonomy-kernel:2.0.0-dev
    command: ["serve", "--db", "/var/lib/elmos-autonomy/autonomy.sqlite", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - autonomy-data:/var/lib/elmos-autonomy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  autonomy-data:

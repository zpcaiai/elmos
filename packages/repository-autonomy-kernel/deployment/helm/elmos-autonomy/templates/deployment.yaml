{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be sha256 followed by 64 lowercase hex characters" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elmos-autonomy.fullname" . }}
  labels:
    {{- include "elmos-autonomy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "elmos-autonomy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "elmos-autonomy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: autonomy-kernel
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --db
            - /var/lib/elmos-autonomy/autonomy.sqlite
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            {{- if .Values.controlStore.postgresService }}
            - --postgres-control-service
            - {{ .Values.controlStore.postgresService | quote }}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: autonomy-data, mountPath: /var/lib/elmos-autonomy}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 30, timeoutSeconds: 3}
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: autonomy-data
          persistentVolumeClaim: {claimName: {{ include "elmos-autonomy.fullname" . }}-data}

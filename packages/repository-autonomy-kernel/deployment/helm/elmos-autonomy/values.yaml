replicaCount: 1
terminationGracePeriodSeconds: 60
image:
  repository: elmos/repository-autonomy-kernel
  # Required at render time; tags never satisfy the production deployment gate.
  digest: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
persistence:
  enabled: true
  size: 10Gi
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
networkPolicy:
  enabled: true
  ingress: []
  egress: []
controlStore:
  # A libpq service name only. Credentials remain in the external Secrets Broker.
  postgresService: ""

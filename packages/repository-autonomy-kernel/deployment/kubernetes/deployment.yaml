apiVersion: apps/v1
kind: Deployment
metadata:
  name: elmos-autonomy-kernel
  labels:
    app.kubernetes.io/name: elmos-autonomy-kernel
    app.kubernetes.io/version: "2.0.0"
spec:
  # SQLite local topology is single-replica. Production HA requires the
  # PostgreSQL profile and a digest-bound generated overlay.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elmos-autonomy-kernel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elmos-autonomy-kernel
        app.kubernetes.io/version: "2.0.0"
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: autonomy-kernel
          image: elmos/repository-autonomy-kernel:2.0.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--db", "/var/lib/elmos-autonomy/autonomy.sqlite", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: autonomy-data
              mountPath: /var/lib/elmos-autonomy
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
          startupProbe:
            httpGet: {path: /livez, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
      volumes:
        - name: autonomy-data
          persistentVolumeClaim:
            claimName: elmos-autonomy-kernel-data
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elmos-autonomy-kernel
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elmos-autonomy-kernel
---
apiVersion: v1
kind: Service
metadata:
  name: elmos-autonomy-kernel
spec:
  selector:
    app.kubernetes.io/name: elmos-autonomy-kernel
  ports:
    - name: http
      port: 8080
      targetPort: http

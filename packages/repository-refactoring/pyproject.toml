[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-repository-refactoring"
version = "1.0.0"
description = "Deterministic, resumable, auditable repository-scale refactoring runtime for the ELMOS repository-refactoring Skills"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elmos-repository-refactoring = "elmos_repository_refactoring.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elmos_repository_refactoring = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# sqlops.py *generates* migration SQL as a reviewable text artifact; it never
# executes a query. Every identifier interpolated into that text is validated
# by `require_sql_identifier` first, which is the real defence S608 is asking
# for.
"src/elmos_repository_refactoring/sqlops.py" = ["S608"]
# The security-preservation tests must contain credential-shaped literals in
# order to assert that the detector finds them and that the finding never
# echoes the value.
"tests/test_batch4.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["elmos_repository_refactoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

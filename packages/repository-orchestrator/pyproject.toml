[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-repository-orchestrator"
version = "0.2.0"
description = "Bounded local runtime for the ELMOS repository-orchestrator Skills"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agentic = [
  "langchain-core==1.6.2",
  "langgraph==1.2.11",
]
integrations = [
  "elasticsearch==9.5.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
]
all = [
  "elasticsearch==9.5.0",
  "httpx==0.28.1",
  "langchain-core==1.6.2",
  "langgraph==1.2.11",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
]

[project.scripts]
elmos-repository-orchestrator = "elmos_repository_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

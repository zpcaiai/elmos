[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elmos-repository-orchestrator"
version = "0.1.0"
description = "Bounded local runtime for the ELMOS repository-orchestrator Skills"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elmos-repository-orchestrator = "elmos_repository_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


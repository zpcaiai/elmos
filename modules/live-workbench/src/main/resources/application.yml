server:
  port: ${ELMOS_LIVE_WORKBENCH_PORT:8092}
  shutdown: graceful
spring:
  application:
    name: elmos-live-workbench
  datasource:
    url: ${ELMOS_WORKBENCH_DATABASE_URL}
    username: ${ELMOS_WORKBENCH_DATABASE_USER}
    password: ${ELMOS_WORKBENCH_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${ELMOS_WORKBENCH_DATABASE_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,liveWorkbenchProvider
elmos:
  live-workbench:
    oidc-issuer-uri: ${ELMOS_OIDC_ISSUER_URI}
    provider:
      base-uri: ${ELMOS_SANDBOX_PROVIDER_BASE_URI:}
      signing-key-file: ${ELMOS_SANDBOX_PROVIDER_SIGNING_KEY_FILE:}
      timeout-seconds: ${ELMOS_SANDBOX_PROVIDER_TIMEOUT_SECONDS:10}
      allow-loopback-http: ${ELMOS_SANDBOX_PROVIDER_ALLOW_LOOPBACK_HTTP:false}
      preview-origins: ${ELMOS_SANDBOX_PREVIEW_ORIGINS:}
